title: Ekosystem Firebase

items:
  - name: AngularFire
    desc: Oficjalna integracja Firebase z Angular — reaktywne observables z RxJS, lazy loading modułów Firebase, provideFirebaseApp(), provideFirestore(), AuthGuard.
    icon: "🔴"
  - name: ReactFire
    desc: Hooki React dla Firebase — useFirestore(), useAuth(), useStorage(). Suspense-ready, automatyczne zarządzanie subskrypcjami, obsługa stanu ładowania i błędów.
    icon: "⚛️"
  - name: VueFire
    desc: Integracja Firebase z Vue 3 — composables useCollection(), useDocument(), useCurrentUser(). Reaktywne dane z Firestore automatycznie synchronizowane z Vue ref.
    icon: "💚"
  - name: Firebase UI
    desc: Gotowe komponenty UI dla Auth — drop-in login forms dla email, Google, GitHub, Facebook, phone. Dostępne dla Web (FirebaseUI Web), Android i iOS.
    icon: "🎨"
  - name: Firestore Lite
    desc: Lekka wersja Firestore SDK — tylko operacje jednorazowe (bez real-time). Mniejszy bundle, idealne dla SSR i przypadków bez potrzeby onSnapshot.
    icon: "🪶"
  - name: Firebase Admin SDK
    desc: Server-side SDK (Node.js, Python, Java, Go) — zarządzanie użytkownikami, custom tokens, Firestore z uprawnieniami admina, wysyłanie FCM powiadomień.
    icon: "🔧"
  - name: Firebase Genkit
    desc: Framework AI od Google (open-source) — buduj AI flows, RAG pipelines, agentów. Integracja z Gemini, OpenAI, Ollama. Deploy jako Cloud Functions.
    icon: "🤖"
  - name: App Check
    desc: Ochrona przed nieautoryzowanym dostępem do Firebase — weryfikuje że requesty pochodzą z Twojej aplikacji (reCAPTCHA Enterprise, Device Check, Play Integrity).
    icon: "🛡️"
  - name: Firebase Performance Monitoring
    desc: Automatyczne mierzenie wydajności — czas startu aplikacji, sieć, custom traces. Dashboard w konsoli Firebase z percentylami i trendami.
    icon: "📊"
  - name: Remote Config
    desc: Dynamiczna konfiguracja aplikacji bez aktualizacji — feature flags, A/B testing, personalizacja. Zmieniaj zachowanie aplikacji w czasie rzeczywistym z konsoli.
    icon: "⚙️"
