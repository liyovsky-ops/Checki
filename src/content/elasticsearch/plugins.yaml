title: Ekosystem Elasticsearch

items:
  - name: Kibana
    desc: Oficjalny dashboard do ES — Discover (eksploracja danych), Visualize (wykresy), Dashboard (kompozycja), Lens (drag-and-drop vizualizacje), Alerting, Maps.
    icon: "📊"
  - name: Logstash
    desc: ETL pipeline — zbieranie danych z różnych źródeł (syslog, beats, DB, Kafka), transformacja (Grok, mutate, geoip), i wysyłanie do ES lub innych celów.
    icon: "🔧"
  - name: Filebeat / Metricbeat
    desc: Lekkie agenty (Beats) do zbierania logów z plików i metryk systemowych. Filebeat → logi, Metricbeat → CPU/RAM/disk, Packetbeat → network traffic.
    icon: "📡"
  - name: elasticsearch-dsl-py
    desc: Python library do pisania ES queries w stylu ORM. Klasy Document, Search, Q() do budowania queries. Lepszy DX niż surowe słowniki JSON.
    icon: "🐍"
  - name: Elastic APM
    desc: Application Performance Monitoring — trace każdego requesta (jak Datadog/Jaeger). Automatyczna instrumentacja dla Python/Node/Java. Wyniki w Kibanie.
    icon: "⚡"
  - name: Elastic Security (SIEM)
    desc: Security Information and Event Management na bazie ES. Zbieranie logów bezpieczeństwa, threat detection rules, machine learning anomaly detection.
    icon: "🔒"
  - name: Elasticsearch Hadoop
    desc: Konektor Elasticsearch ↔ Hadoop/Spark. Czytaj dane z ES w Spark, zapisuj wyniki analiz z powrotem. Przydatne w big data pipelines.
    icon: "🐘"
  - name: OpenSearch (AWS Fork)
    desc: Fork Elasticsearch 7.10 przez Amazon po zmianie licencji ES na SSPL. Kompatybilny API, open-source (Apache 2.0). AWS OpenSearch Service = managed OpenSearch.
    icon: "☁️"
