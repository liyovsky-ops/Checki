title: Auth i Headers

items:
  - name: Headers — nagłówki requestu
    desc: User-Agent, Accept, Authorization — ustaw raz w Session, nadpisz dla konkretnego requestu.
    icon: "📋"
    code: |
      import requests

      with requests.Session() as session:
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0",
              "Accept": "application/json",
              "Accept-Language": "pl-PL,pl;q=0.9",
              "Referer": "https://google.com",
          })

          # Nadpisz header dla konkretnego requestu
          response = session.get(
              "https://api.example.com/data",
              headers={"Authorization": "Bearer TOKEN"},
              timeout=10
          )

      # Sprawdź nagłówki odpowiedzi
      print(response.headers["Content-Type"])
      print(response.headers.get("X-Rate-Limit-Remaining", "brak"))

  - name: Autoryzacja — Basic, Bearer, API Key
    desc: "Basic auth (user/pass), Bearer token (JWT/OAuth), API Key w nagłówku lub query string."
    icon: "🔐"
    code: |
      import requests
      from requests.auth import HTTPBasicAuth

      # Basic Auth
      response = requests.get(
          "https://api.example.com/data",
          auth=("username", "password"),
          timeout=10
      )

      # Bearer Token (JWT, OAuth)
      headers = {"Authorization": "Bearer eyJhbGciOiJIUzI1NiJ9..."}
      response = requests.get(url, headers=headers, timeout=10)

      # API Key w nagłówku
      headers = {"X-API-Key": "your-api-key-here"}
      response = requests.get(url, headers=headers, timeout=10)

      # API Key w query param
      response = requests.get(url, params={"api_key": "KEY"}, timeout=10)

  - name: Proxies — routing przez proxy
    desc: Kieruj ruch przez HTTP lub SOCKS proxy. Dla scrapingu przez Tor lub własny proxy server.
    icon: "🔀"
    code: |
      import requests

      proxies = {
          "http": "http://proxy.example.com:8080",
          "https": "http://proxy.example.com:8080",
      }

      response = requests.get(
          "https://example.com",
          proxies=proxies,
          timeout=10
      )

      # SOCKS proxy (pip install requests[socks])
      proxies = {
          "http": "socks5://user:pass@proxy:1080",
          "https": "socks5://user:pass@proxy:1080",
      }

      # Tor:
      # proxies = {"https": "socks5://127.0.0.1:9050"}

  - name: SSL — weryfikacja certyfikatów
    desc: "Domyślnie SSL jest weryfikowany. verify=False tylko w dev — nigdy w produkcji!"
    icon: "🔒"
    code: |
      import requests

      # Domyślnie — weryfikacja SSL włączona
      response = requests.get("https://secure.example.com", timeout=10)

      # Wyłącz weryfikację (DEV ONLY!)
      import urllib3
      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
      response = requests.get(
          "https://self-signed.example.com",
          verify=False,
          timeout=10
      )

      # Własny certyfikat CA
      response = requests.get(
          "https://internal.company.com",
          verify="/path/to/ca-bundle.crt",
          timeout=10
      )

      # Certyfikat klienta (mTLS)
      response = requests.get(url, cert=("client.crt", "client.key"))

  - name: Timeouts — zawsze ustawiaj
    desc: "ZAWSZE ustawiaj timeout. Bez niego request może czekać w nieskończoność. timeout=(connect, read)."
    icon: "⏱️"
    code: |
      import requests

      # ❌ BEZ TIMEOUTU — może czekać w nieskończoność!
      # response = requests.get(url)

      # ✅ Zawsze podaj timeout
      response = requests.get(url, timeout=10)

      # Rozdziel timeout na connect i read
      response = requests.get(
          url,
          timeout=(5, 30)  # 5s połączenie, 30s odczyt
      )

      # Dla dużych plików — bez limitu odczytu
      response = requests.get(url, timeout=(5, None))

  - name: Redirecty — kontrola przekierowań
    desc: Domyślnie requests podąża za redirectami. Wyłącz gdy chcesz zobaczyć lokalizację przekierowania.
    icon: "↩️"
    code: |
      import requests

      # Domyślnie podąża za redirectami (max 30)
      response = requests.get("https://httpbin.org/redirect/3", timeout=10)
      print(response.url)        # finalny URL
      print(response.history)    # lista Response z redirectami

      # Wyłącz podążanie za redirectami
      response = requests.get(
          "https://httpbin.org/redirect/1",
          allow_redirects=False,
          timeout=10
      )
      print(response.status_code)           # 301 lub 302
      print(response.headers["Location"])   # dokąd redirect
