title: Rozszerzenia requests

items:
  - name: responses (mock HTTP)
    desc: Przechwytuje wywołania requests i zwraca zdefiniowane odpowiedzi. Niezbędny do testowania kodu HTTP bez sieci.
    icon: "🎭"
    code: |
      pip install responses

      import responses, requests

      @responses.activate
      def test_github_user():
          responses.add(
              responses.GET,
              "https://api.github.com/users/octocat",
              json={"login": "octocat", "public_repos": 8},
              status=200
          )
          r = requests.get("https://api.github.com/users/octocat")
          assert r.json()["login"] == "octocat"
          assert len(responses.calls) == 1

  - name: requests-mock (pytest fixture)
    desc: Alternatywne mockowanie przez pytest fixture. Bardziej minimalistyczne niż responses.
    icon: "🔧"
    code: |
      pip install requests-mock

      def test_get_user(requests_mock):
          requests_mock.get(
              "http://api.example.com/users/1",
              json={"id": 1, "name": "Jan"}
          )

          import requests
          r = requests.get("http://api.example.com/users/1")
          assert r.json()["name"] == "Jan"

  - name: requests-cache
    desc: Automatyczne cachowanie odpowiedzi HTTP na dysku. Jeden import — zero zmian w kodzie requestów.
    icon: "⚡"
    code: |
      pip install requests-cache

      import requests_cache
      import requests

      requests_cache.install_cache(
          "api_cache", expire_after=3600  # 1 godzina TTL
      )

      # Wszystkie requesty są teraz cachowane
      r = requests.get("https://api.example.com/data")
      print(r.from_cache)  # True przy kolejnym wywołaniu

      # Wyczyść cache
      requests_cache.clear()

  - name: requests-toolbelt
    desc: Oficjalne rozszerzenie maintainerów requests. Retry adapter, multipart upload z progress bar, dump do debugowania.
    icon: "🛠️"
    code: |
      pip install requests-toolbelt

      from requests.adapters import HTTPAdapter
      from urllib3.util.retry import Retry

      # Automatyczne retry na błędy połączenia
      retry_strategy = Retry(
          total=3,
          backoff_factor=0.5,
          status_forcelist=[429, 500, 502, 503, 504]
      )
      adapter = HTTPAdapter(max_retries=retry_strategy)
      session.mount("https://", adapter)

  - name: requests-oauthlib
    desc: "OAuth 1.0 i OAuth 2.0. Automatycznie dodaje i odświeża tokeny. GitHub, Google, Twitter API."
    icon: "🔐"
    code: |
      pip install requests-oauthlib

      from requests_oauthlib import OAuth2Session

      # Client Credentials Flow (API-to-API)
      oauth = OAuth2Session(client_id)
      token = oauth.fetch_token(
          token_url, client_secret=client_secret
      )

      r = oauth.get("https://api.example.com/resource")

  - name: HTTPX (nowoczesna alternatywa)
    desc: API kompatybilne z requests + async/await + HTTP/2. Konieczny dla testowania FastAPI.
    icon: "🚀"
    code: |
      pip install httpx

      import httpx

      # Sync — identyczne API jak requests
      r = httpx.get("https://api.example.com")
      print(r.json())

      # Async
      async with httpx.AsyncClient() as client:
          r = await client.get("https://api.example.com")
          print(r.json())

  - name: httpretty (socket-level mock)
    desc: Mockuje HTTP na poziomie socketu — działa z requests, httplib, urllib3 i innymi.
    icon: "🕸️"
    code: |
      pip install httpretty

      import httpretty, requests

      httpretty.enable()
      httpretty.register_uri(
          httpretty.GET,
          "https://api.example.com/data",
          body='{"status": "ok"}',
          content_type="application/json"
      )

      r = requests.get("https://api.example.com/data")
      assert r.json() == {"status": "ok"}
      httpretty.disable()
