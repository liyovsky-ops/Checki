title: Prompt Caching i Extended Thinking

items:
  - name: Prompt Caching — cache_control na system prompt
    desc: >
      Oznaczasz system prompt flagą cache_control ephemeral — API cache'uje go na 5 minut.
      Kolejne wywołania z identycznym prefixem systemu liczą tokeny jako cache_read:
      koszt 10x niższy, latencja zdecydowanie krótsza. Minimalna wielkość bloku do cache: 1024 tokeny.
      Niezastąpione przy długich system promptach, dokumentach RAG i dużych zestawach narzędzi.
    code: |
      SYSTEM_PROMPT = """Jesteś asystentem prawnym z wiedzą o polskim prawie.
      Poniżej znajdziesz pełne teksty: Kodeks Cywilny, Kodeks Pracy, RODO...
      [... kilka tysięcy tokenów dokumentów ...]"""

      # Pierwsze wywołanie — cache WRITE (drogie jak normalny input + 25%)
      response1 = client.messages.create(
          model="claude-sonnet-4-6",
          max_tokens=1024,
          system=[{
              "type": "text",
              "text": SYSTEM_PROMPT,
              "cache_control": {"type": "ephemeral"}  # oznacz do cache
          }],
          messages=[{"role": "user", "content": "Co to jest umowa zlecenia?"}]
      )
      u1 = response1.usage
      print(f"cache_write: {u1.cache_creation_input_tokens}")  # np. 3000
      print(f"cache_read:  {u1.cache_read_input_tokens}")       # 0

      # Drugie wywołanie w ciągu 5 minut — cache READ (10x taniej!)
      response2 = client.messages.create(
          model="claude-sonnet-4-6",
          max_tokens=1024,
          system=[{
              "type": "text",
              "text": SYSTEM_PROMPT,
              "cache_control": {"type": "ephemeral"}  # ten sam system prompt
          }],
          messages=[{"role": "user", "content": "Jakie prawa ma pracownik tymczasowy?"}]
      )
      u2 = response2.usage
      print(f"cache_write: {u2.cache_creation_input_tokens}")  # 0 lub 0
      print(f"cache_read:  {u2.cache_read_input_tokens}")       # 3000 — oszczędność!

  - name: Cache na wiadomościach użytkownika i dokumentach
    desc: >
      Możesz cache'ować nie tylko system prompt, ale też dowolny blok user message.
      Klasyczny wzorzec RAG: cache'ujesz długi dokument/kontekst a zmieniasz tylko
      pytanie. Każde wywołanie cache'uje prefiks do ostatniego cache_control — reszta
      konwersacji jest "ponad" cache'em.
    code: |
      LONG_DOCUMENT = "... długi artykuł naukowy z 50 stronami tekstu ..."

      # Każde pytanie o ten sam dokument jest tanie dzięki cache
      def ask_about_document(question: str) -> str:
          response = client.messages.create(
              model="claude-sonnet-4-6",
              max_tokens=1024,
              messages=[
                  {
                      "role": "user",
                      "content": [
                          {
                              "type": "text",
                              "text": f"Dokument do analizy:\n\n{LONG_DOCUMENT}",
                              "cache_control": {"type": "ephemeral"}  # cache dokument
                          },
                          {
                              "type": "text",
                              "text": question  # to się zmienia przy każdym pytaniu
                          }
                      ]
                  }
              ]
          )
          return response.content[0].text

      # Przy pierwszym pytaniu zapisuje dokument do cache
      # Każde kolejne pytanie w ciągu 5 min czyta z cache — 10x taniej
      print(ask_about_document("Jakie są główne wnioski?"))
      print(ask_about_document("Jaką metodologię zastosowali autorzy?"))

  - name: Cache na narzędziach
    desc: >
      Duże zestawy narzędzi (np. 50+ definicji API) też można cache'ować.
      Umieść cache_control w ostatnim narzędziu z listy — API cache'uje prefix
      do tego miejsca. Zmniejsza dramatycznie koszt przy agentach z wieloma narzędziami.
    code: |
      # Duży zestaw narzędzi — ostatnie narzędzie ma cache_control
      tools = [
          {"name": "tool_1", "description": "...", "input_schema": {...}},
          {"name": "tool_2", "description": "...", "input_schema": {...}},
          # ... wiele narzędzi ...
          {
              "name": "tool_50",
              "description": "Ostatnie narzędzie w zestawie",
              "input_schema": {...},
              "cache_control": {"type": "ephemeral"}  # cache'uj wszystkie narzędzia powyżej
          }
      ]

      response = client.messages.create(
          model="claude-sonnet-4-6",
          max_tokens=1024,
          tools=tools,
          messages=[{"role": "user", "content": "Wykonaj zadanie używając dostępnych narzędzi"}]
      )
      # Przy kolejnych wywołaniach z tym samym zestawem narzędzi — cache hit

  - name: Extended Thinking — Claude "myśli przed odpowiedzią"
    desc: >
      thinking: {type: "enabled", budget_tokens: N} daje Claude budżet tokenów
      na wewnętrzne rozumowanie przed sformułowaniem odpowiedzi. Widoczne jako
      ThinkingBlock w response.content. Dramatycznie poprawia wyniki na zadaniach
      matematycznych, kodowania, analizy prawnej. Wymaga minimum 1000 tokenów budżetu
      i wyłącza streaming deltów (streaming eventów działa).
    code: |
      response = client.messages.create(
          model="claude-sonnet-4-6",
          max_tokens=16000,    # musi być większy niż budget_tokens
          thinking={
              "type": "enabled",
              "budget_tokens": 10000   # ile tokenów Claude może "myśleć"
          },
          messages=[{
              "role": "user",
              "content": "Oblicz ile wynosi suma wszystkich liczb pierwszych do 1000 i wyjaśnij krok po kroku."
          }]
      )

      for block in response.content:
          if block.type == "thinking":
              print("=== THINKING ===")
              print(block.thinking[:500] + "...")  # wewnętrzne rozumowanie Claude
          elif block.type == "text":
              print("=== ODPOWIEDŹ ===")
              print(block.text)

  - name: Extended Thinking ze streamingiem
    desc: >
      Streaming z thinking zwraca ThinkingDelta chunki (wewnętrzne myśli) oraz
      TextDelta (finalna odpowiedź). Możesz pokazywać myślenie w czasie rzeczywistym
      lub je filtrować — przydatne do UI które pokazuje "Claude myśli...".
    code: |
      with client.messages.stream(
          model="claude-sonnet-4-6",
          max_tokens=16000,
          thinking={"type": "enabled", "budget_tokens": 8000},
          messages=[{"role": "user", "content": "Zaprojektuj schemat bazy danych dla systemu e-commerce"}],
      ) as stream:
          current_block_type = None

          for event in stream:
              if event.type == "content_block_start":
                  current_block_type = event.content_block.type
                  if current_block_type == "thinking":
                      print("\n💭 Claude myśli...", end="")
                  elif current_block_type == "text":
                      print("\n📝 Odpowiedź:\n")

              elif event.type == "content_block_delta":
                  if event.delta.type == "thinking_delta":
                      pass  # lub print(event.delta.thinking, end="") żeby pokazać myślenie
                  elif event.delta.type == "text_delta":
                      print(event.delta.text, end="", flush=True)

  - name: Extended Thinking z tool use
    desc: >
      Możesz łączyć thinking z tool use — Claude użyje budżetu na przemyślenie
      które narzędzie wywołać i z jakimi argumentami. Po zwróceniu tool_result
      MUSISZ zachować ThinkingBlock w historii wiadomości, inaczej API zwróci błąd.
    code: |
      response = client.messages.create(
          model="claude-sonnet-4-6",
          max_tokens=16000,
          thinking={"type": "enabled", "budget_tokens": 5000},
          tools=tools,
          messages=[{"role": "user", "content": "Jaką strategię inwestycyjną poleciłbyś dla 50k PLN?"}]
      )

      # Przy budowaniu historii dla multi-turn z thinking:
      # MUSISZ zachować ThinkingBlock w wiadomości assistant!
      messages = [{"role": "user", "content": "..."}]
      messages.append({
          "role": "assistant",
          "content": response.content  # zawiera ThinkingBlock + ToolUseBlock
          # NIE wyrzucaj ThinkingBlock — API odrzuci request z błędem validation
      })

      # Następna wiadomość z wynikami narzędzi
      messages.append({
          "role": "user",
          "content": [{"type": "tool_result", "tool_use_id": "...", "content": "..."}]
      })
