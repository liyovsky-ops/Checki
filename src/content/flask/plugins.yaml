title: Ekosystem Flask

items:
  - name: Flask-SQLAlchemy
    icon: "🗄️"
    desc: |
      Integracja SQLAlchemy ORM z Flask — zarządza connection pool i sesjami.
      Instalacja: pip install flask-sqlalchemy psycopg2-binary

      Definiujesz modele jako klasy Python. Obsługuje PostgreSQL, MySQL, SQLite.
      Standardowy wybór dla bazy danych w Flask — używany w 90% projektów Flask z ORM.
    code: |
      from flask_sqlalchemy import SQLAlchemy
      db = SQLAlchemy()

      class User(db.Model):
          id    = db.Column(db.Integer, primary_key=True)
          email = db.Column(db.String(120), unique=True, nullable=False)
          name  = db.Column(db.String(80), nullable=False)

      # CRUD
      user = User(email='jan@firma.pl', name='Jan')
      db.session.add(user)
      db.session.commit()
      found = User.query.filter_by(email='jan@firma.pl').first()

  - name: Flask-Migrate
    icon: "🔄"
    desc: |
      Migracje bazy danych przez Alembic — historia zmian schematu.
      Instalacja: pip install flask-migrate

      Zamiast ręcznego ALTER TABLE — flask db migrate generuje skrypt migracji,
      flask db upgrade go stosuje. Bezpieczne deploye bez utraty danych.
    code: |
      from flask_migrate import Migrate
      migrate = Migrate(app, db)

      # Inicjalizacja (raz):
      # flask db init

      # Workflow:
      # 1. Zmień model w Python
      # 2. flask db migrate -m "add phone to users"
      # 3. flask db upgrade

  - name: Flask-Login
    icon: "🔐"
    desc: |
      Zarządzanie sesjami użytkowników — login, logout, remember me, login required.
      Instalacja: pip install flask-login

      Dekorator @login_required blokuje dostęp dla niezalogowanych.
      Integruje z własnym modelem User — nie narzuca schematu bazy danych.
    code: |
      from flask_login import LoginManager, UserMixin, login_required, current_user

      login_manager = LoginManager(app)
      login_manager.login_view = 'auth.login'

      class User(db.Model, UserMixin):
          id       = db.Column(db.Integer, primary_key=True)
          email    = db.Column(db.String(120))
          password = db.Column(db.String(200))

      @login_manager.user_loader
      def load_user(user_id):
          return User.query.get(int(user_id))

      @app.route('/dashboard')
      @login_required
      def dashboard():
          return f'Witaj, {current_user.email}!'

  - name: Flask-JWT-Extended
    icon: "🎫"
    desc: |
      JWT tokeny dla REST API — access token, refresh token, token blacklisting.
      Instalacja: pip install flask-jwt-extended

      @jwt_required() chroni endpointy. Automatic token refresh.
      Lepszy wybór niż Flask-Login dla API (stateless, brak sesji po stronie serwera).
    code: |
      from flask_jwt_extended import JWTManager, create_access_token, jwt_required, get_jwt_identity

      app.config['JWT_SECRET_KEY'] = 'super-secret'
      jwt = JWTManager(app)

      @app.route('/login', methods=['POST'])
      def login():
          data = request.get_json()
          user = User.query.filter_by(email=data['email']).first()
          if user and check_password_hash(user.password, data['password']):
              token = create_access_token(identity=user.id)
              return jsonify({'access_token': token})
          return jsonify({'error': 'Błędne dane'}), 401

      @app.route('/profile')
      @jwt_required()
      def profile():
          user_id = get_jwt_identity()
          user = User.query.get(user_id)
          return jsonify(user.to_dict())

  - name: Flask-CORS
    icon: "🌐"
    desc: |
      Obsługa CORS (Cross-Origin Resource Sharing) dla Flask API.
      Instalacja: pip install flask-cors

      Niezbędne gdy frontend (React/Vue na innym porcie/domenie) odpytuje Flask API.
      Możesz zezwolić na wszystkie originy lub ograniczyć do konkretnych domen.
    code: |
      from flask_cors import CORS

      app = Flask(__name__)

      # Zezwól na wszystkie originy (dev):
      CORS(app)

      # Produkcja — tylko konkretne domeny:
      CORS(app, resources={
          r'/api/*': {
              'origins': ['https://app.firma.pl', 'https://admin.firma.pl'],
              'methods': ['GET', 'POST', 'PUT', 'DELETE'],
              'allow_headers': ['Authorization', 'Content-Type']
          }
      })

      # Lub per Blueprint:
      from flask_cors import cross_origin

      @app.route('/public')
      @cross_origin()
      def public_endpoint():
          return jsonify({'data': 'public'})

  - name: Marshmallow / Flask-Marshmallow
    icon: "✅"
    desc: |
      Serializacja i walidacja danych — schematy dla requestów i odpowiedzi.
      Instalacja: pip install marshmallow flask-marshmallow

      Definiujesz schemat raz — używasz do walidacji input i serializacji output.
      Alternatywa gdy nie chcesz przechodzić na FastAPI + Pydantic.
    code: |
      from marshmallow import Schema, fields, validate, ValidationError

      class UserSchema(Schema):
          id    = fields.Int(dump_only=True)
          email = fields.Email(required=True)
          name  = fields.Str(required=True, validate=validate.Length(min=2, max=50))
          age   = fields.Int(validate=validate.Range(min=0, max=150))

      user_schema  = UserSchema()
      users_schema = UserSchema(many=True)

      @app.route('/users', methods=['POST'])
      def create_user():
          try:
              data = user_schema.load(request.get_json())
          except ValidationError as err:
              return jsonify({'errors': err.messages}), 422
          user = User(**data)
          db.session.add(user)
          db.session.commit()
          return jsonify(user_schema.dump(user)), 201
