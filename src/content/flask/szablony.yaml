title: Szablony Jinja2

items:
  - name: Podstawowa składnia Jinja2
    desc: >
      Jinja2 to silnik szablonów wbudowany w Flask. Trzy typy tagów: {{ wyrażenie }} do wyświetlania,
      {% statement %} do logiki (if, for, extends), {# komentarz #}. Automatyczny
      HTML escaping chroni przed XSS. Szablony szukane w katalogu templates/.
    code: |
      {# templates/users.html #}
      <!DOCTYPE html>
      <html>
      <body>
        <h1>Lista użytkowników</h1>

        {# Wyświetl zmienną — automatyczny HTML escape #}
        <p>Witaj, {{ username }}!</p>
        <p>Łączna liczba: {{ users | length }}</p>

        {# Blok warunkowy #}
        {% if users %}
          <ul>
            {% for user in users %}
              <li>{{ user.name }} — {{ user.email }}</li>
            {% endfor %}
          </ul>
        {% else %}
          <p>Brak użytkowników.</p>
        {% endif %}

        {# Przekazanie zmiennej bez escape (np. HTML) — TYLKO dla zaufanych danych! #}
        {{ raw_html | safe }}
      </body>
      </html>

      # W route:
      from flask import render_template

      @app.route('/users')
      def users():
          user_list = [{'name': 'Jan', 'email': 'jan@firma.pl'}]
          return render_template('users.html', users=user_list, username='Admin')

  - name: Dziedziczenie szablonów — base layout
    desc: >
      {% extends "base.html" %} dziedziczy layout z base. {% block nazwa %} to punkt
      gdzie child może wstrzyknąć treść. Eliminuje powtórzenia — nawigacja, footer,
      CSS i skrypty są w jednym miejscu (base.html).
    code: |
      {# templates/base.html — layout bazowy #}
      <!DOCTYPE html>
      <html lang="pl">
      <head>
        <meta charset="UTF-8">
        <title>{% block title %}MojaApka{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
      </head>
      <body>
        <nav>
          <a href="{{ url_for('index') }}">Home</a>
          <a href="{{ url_for('users.list_users') }}">Użytkownicy</a>
        </nav>

        <main>
          {% block content %}{% endblock %}
        </main>

        <footer>Copyright 2025</footer>
        {% block scripts %}{% endblock %}
      </body>
      </html>

      {# templates/users.html — strona potomna #}
      {% extends "base.html" %}

      {% block title %}Użytkownicy — MojaApka{% endblock %}

      {% block content %}
        <h1>Lista użytkowników</h1>
        {% for user in users %}
          <div class="user-card">{{ user.name }}</div>
        {% endfor %}
      {% endblock %}

      {% block scripts %}
        <script src="{{ url_for('static', filename='users.js') }}"></script>
      {% endblock %}

  - name: Filtry i zmienne globalne
    desc: >
      Filtry Jinja2 transformują wartości ({{ text | upper }}, {{ date | strftime }}).
      Możesz rejestrować własne filtry przez @app.template_filter().
      Globalne zmienne i funkcje przez app.jinja_env.globals.
    code: |
      from flask import Flask
      from datetime import datetime

      app = Flask(__name__)

      # Własny filtr
      @app.template_filter('currency')
      def currency_filter(value):
          return f'{value:.2f} PLN'

      @app.template_filter('truncate_words')
      def truncate_words(text, length=50):
          return text[:length] + '...' if len(text) > length else text

      # Globalne zmienne dostępne we wszystkich szablonach
      @app.context_processor
      def inject_globals():
          return {
              'current_year': datetime.now().year,
              'app_name': 'MojaApka'
          }

      # W szablonie:
      # {{ 1234.5 | currency }}          → "1234.50 PLN"
      # {{ long_text | truncate_words }}  → skrócony tekst
      # {{ current_year }}               → 2025 (z context_processor)

  - name: Makra i include
    desc: >
      {% macro %} to re-używalne fragmenty HTML (jak funkcje).
      {% include %} wstawia inny plik szablonu w miejscu.
      Używaj do komponentów: przyciski, formularze, karty — bez duplikacji HTML.
    code: |
      {# templates/macros/forms.html — makra dla formularzy #}
      {% macro input_field(name, label, type='text', required=False) %}
        <div class="form-group">
          <label for="{{ name }}">{{ label }}</label>
          <input
            type="{{ type }}"
            id="{{ name }}"
            name="{{ name }}"
            {% if required %}required{% endif %}
            class="form-control"
          >
        </div>
      {% endmacro %}

      {% macro submit_button(text='Wyślij', color='primary') %}
        <button type="submit" class="btn btn-{{ color }}">{{ text }}</button>
      {% endmacro %}

      {# templates/users/create.html #}
      {% extends "base.html" %}
      {% from "macros/forms.html" import input_field, submit_button %}

      {% block content %}
        <form method="POST" action="/users">
          {{ input_field('name', 'Imię i nazwisko', required=True) }}
          {{ input_field('email', 'Email', type='email', required=True) }}
          {{ input_field('password', 'Hasło', type='password', required=True) }}
          {{ submit_button('Utwórz konto', color='success') }}
        </form>

        {# Dołącz oddzielny plik szablonu #}
        {% include "partials/social_login.html" %}
      {% endblock %}

  - name: Formularze i CSRF
    desc: >
      Flask sam nie ma walidacji formularzy — użyj Flask-WTF (WTForms + CSRF ochrona).
      Flask-WTF automatycznie dodaje CSRF token do formularzy i waliduje go przy POST.
      Definiujesz pola i walidatory jako klasy Python.
    code: |
      # pip install flask-wtf

      from flask import Flask, render_template, redirect, url_for
      from flask_wtf import FlaskForm
      from wtforms import StringField, EmailField, PasswordField
      from wtforms.validators import DataRequired, Email, Length

      app = Flask(__name__)
      app.config['SECRET_KEY'] = 'klucz-do-csrf'

      class RegisterForm(FlaskForm):
          name     = StringField('Imię', validators=[DataRequired(), Length(min=2, max=50)])
          email    = EmailField('Email', validators=[DataRequired(), Email()])
          password = PasswordField('Hasło', validators=[DataRequired(), Length(min=8)])

      @app.route('/register', methods=['GET', 'POST'])
      def register():
          form = RegisterForm()
          if form.validate_on_submit():  # POST + walidacja OK
              # form.name.data, form.email.data, form.password.data
              return redirect(url_for('login'))
          return render_template('register.html', form=form)

      # W szablonie:
      # <form method="POST">
      #   {{ form.hidden_tag() }}  ← CSRF token
      #   {{ form.name.label }} {{ form.name() }}
      #   {{ form.email.label }} {{ form.email() }}
      # </form>
