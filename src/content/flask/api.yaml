title: Request i Response

items:
  - name: Obiekt request — dane z żądania
    desc: >
      Flask udostępnia obiekt request z danymi przychodzącego żądania.
      Dostępny w każdym route handlerze bez importowania z kontekstu.
      Zawiera JSON body, parametry URL, formularze, nagłówki i pliki.
    code: |
      from flask import Flask, request, jsonify

      app = Flask(__name__)

      @app.route('/api/data', methods=['POST'])
      def handle_data():
          # JSON body (Content-Type: application/json)
          data = request.get_json()
          # Lub z force=True jeśli brakuje Content-Type:
          # data = request.get_json(force=True)

          # Parametry query string (?page=1&limit=10)
          page  = request.args.get('page', 1, type=int)
          limit = request.args.get('limit', 10, type=int)

          # Dane formularza (Content-Type: multipart/form-data)
          name = request.form.get('name', '')

          # Nagłówki
          auth_header = request.headers.get('Authorization', '')
          token = auth_header.replace('Bearer ', '')

          # Metoda HTTP i ścieżka
          method = request.method
          path   = request.path
          url    = request.url

          return jsonify({
              'received': data,
              'page': page,
              'limit': limit
          })

  - name: jsonify i kody statusu
    desc: >
      jsonify() zwraca Response z Content-Type: application/json.
      Flask automatycznie konwertuje dict na JSON od wersji 2.2 (return dict bezpośrednio).
      Kod statusu przekazujesz jako drugi element krotki (data, status_code).
    code: |
      from flask import jsonify, make_response

      # Prosty JSON response
      @app.route('/health')
      def health():
          return jsonify({'status': 'ok', 'version': '1.0.0'})

      # Z kodem statusu
      @app.route('/users', methods=['POST'])
      def create_user():
          data = request.get_json()
          return jsonify({'id': 1, **data}), 201    # Created

      # Z nagłówkami — krotka trzech elementów
      @app.route('/redirect-example')
      def with_headers():
          return jsonify({'done': True}), 200, {
              'X-Custom-Header': 'wartosc',
              'Cache-Control': 'no-cache'
          }

      # make_response dla pełnej kontroli
      @app.route('/custom')
      def custom_response():
          resp = make_response(jsonify({'data': 'ok'}), 200)
          resp.headers['X-Rate-Limit'] = '100'
          resp.set_cookie('session_id', 'abc123', httponly=True, secure=True)
          return resp

      # Flask 2.2+ — zwróć dict bezpośrednio
      @app.route('/shortcut')
      def shortcut():
          return {'users': [], 'total': 0}  # auto-jsonify

  - name: Before / After request hooks
    desc: >
      @app.before_request uruchamia funkcję przed każdym żądaniem — idealne dla
      autentykacji, logowania, connection do bazy. @app.after_request pozwala
      modyfikować response przed wysłaniem (nagłówki CORS, logowanie).
    code: |
      from flask import Flask, request, jsonify, g
      import time

      app = Flask(__name__)

      @app.before_request
      def authenticate():
          # Pomiń dla publicznych endpointów
          if request.endpoint in ('health', 'login'):
              return
          token = request.headers.get('Authorization', '').replace('Bearer ', '')
          if not token:
              return jsonify({'error': 'Brak tokenu'}), 401
          # Zapisz user do g (kontekst żądania)
          g.current_user = verify_token(token)

      @app.before_request
      def start_timer():
          g.start = time.time()

      @app.after_request
      def add_headers(response):
          # Dodaj nagłówki CORS
          response.headers['Access-Control-Allow-Origin'] = '*'
          response.headers['Access-Control-Allow-Headers'] = 'Authorization, Content-Type'
          # Dodaj czas odpowiedzi
          elapsed = (time.time() - g.start) * 1000
          response.headers['X-Response-Time'] = f'{elapsed:.2f}ms'
          return response

      @app.teardown_appcontext
      def close_db(error):
          # Zamknij połączenie z bazą po każdym żądaniu
          db = g.pop('db', None)
          if db is not None:
              db.close()

  - name: REST API — wzorzec produkcyjny
    desc: >
      Spójne REST API z Flask wymaga kilku konwencji: wspólny format odpowiedzi,
      centralna obsługa błędów, walidacja danych wejściowych.
      Poniżej wzorzec gotowy na produkcję.
    code: |
      from flask import Flask, jsonify, request, abort
      from functools import wraps

      app = Flask(__name__)

      # Spójny format odpowiedzi
      def success(data, status=200):
          return jsonify({'success': True, 'data': data}), status

      def error(message, status=400, details=None):
          resp = {'success': False, 'error': message}
          if details:
              resp['details'] = details
          return jsonify(resp), status

      # Dekorator walidacji JSON
      def require_json(f):
          @wraps(f)
          def decorated(*args, **kwargs):
              if not request.is_json:
                  return error('Wymagany Content-Type: application/json', 415)
              return f(*args, **kwargs)
          return decorated

      # Dekorator autoryzacji
      def require_auth(f):
          @wraps(f)
          def decorated(*args, **kwargs):
              token = request.headers.get('Authorization', '').replace('Bearer ', '')
              if not token:
                  return error('Brak tokenu autoryzacji', 401)
              return f(*args, **kwargs)
          return decorated

      # Endpoint produkcyjny
      @app.route('/api/v1/products', methods=['POST'])
      @require_auth
      @require_json
      def create_product():
          data = request.get_json()
          required = ['name', 'price']
          missing = [f for f in required if f not in data]
          if missing:
              return error('Brakujące pola', 422, {'missing': missing})
          product = {'id': 1, **data}
          return success(product, 201)

      # Centralna obsługa błędów
      @app.errorhandler(404)
      def not_found(e):
          return error('Nie znaleziono zasobu', 404)

      @app.errorhandler(500)
      def internal_error(e):
          return error('Błąd serwera', 500)

  - name: Pliki i uploady
    desc: >
      Flask obsługuje uploady przez request.files. Zawsze waliduj typ pliku i rozmiar
      przed zapisem. Używaj werkzeug.utils.secure_filename żeby uniknąć directory traversal.
    code: |
      import os
      from flask import Flask, request, jsonify, send_from_directory
      from werkzeug.utils import secure_filename

      app = Flask(__name__)
      app.config['MAX_CONTENT_LENGTH'] = 16 * 1024 * 1024  # max 16MB
      UPLOAD_FOLDER = '/uploads'
      ALLOWED = {'png', 'jpg', 'jpeg', 'gif', 'pdf'}

      def allowed_file(filename):
          return '.' in filename and filename.rsplit('.', 1)[1].lower() in ALLOWED

      @app.route('/upload', methods=['POST'])
      def upload():
          if 'file' not in request.files:
              return jsonify({'error': 'Brak pliku'}), 400
          file = request.files['file']
          if file.filename == '':
              return jsonify({'error': 'Nie wybrano pliku'}), 400
          if not allowed_file(file.filename):
              return jsonify({'error': 'Niedozwolony typ pliku'}), 415
          filename = secure_filename(file.filename)
          file.save(os.path.join(UPLOAD_FOLDER, filename))
          return jsonify({'filename': filename}), 201

      # Serwuj pliki
      @app.route('/files/<filename>')
      def serve_file(filename):
          return send_from_directory(UPLOAD_FOLDER, filename)
