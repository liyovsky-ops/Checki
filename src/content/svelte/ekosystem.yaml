title: Ekosystem Svelte

items:
  - name: SvelteKit
    desc: Oficjalny full-stack framework. SSR, SSG, API routes, file-based routing, form actions. Odpowiednik Next.js/Nuxt.
    icon: "🏗️"
  - name: Svelte 5 (Runes)
    desc: "Nowy system reaktywności z $state, $derived, $effect. Zastępuje stary syntax. Bardziej explicit i TypeScript-friendly."
    icon: "✨"
  - name: svelte-query (TanStack Query)
    desc: Async data fetching z cache, refetch, pagination. Port TanStack Query dla Svelte. Zarządza server state.
    icon: "🔄"
  - name: Skeleton UI
    desc: Component library dla Svelte z Tailwind CSS. Gotowe komponenty (Table, Modal, Drawer) stylizowane Tailwindem.
    icon: "🦴"
  - name: shadcn-svelte
    desc: Port shadcn/ui dla Svelte. Copy-paste komponenty z Tailwind + Bits UI. Pełna kontrola nad kodem.
    icon: "🎨"
  - name: Superforms
    desc: Form validation library dla SvelteKit. Zod/Yup schema → auto validation → progressive enhancement.
    icon: "📋"
  - name: Paraglide
    desc: i18n (internacjonalizacja) dla SvelteKit. Compile-time translations, type-safe, tree-shakeable.
    icon: "🌍"
  - name: Threlte
    desc: Three.js wrapper dla Svelte. 3D rendering z deklaratywną składnią. Odpowiednik React Three Fiber.
    icon: "🎮"
