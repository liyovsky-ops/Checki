title: Page Object Model

items:
  - name: Page Object — wzorzec organizacji testów
    desc: >
      Enkapsuluj selektory i akcje per strona w klasę. Test jest czytelny
      jak scenariusz, zmiany HTML wymagają edycji jednej klasy.
    code: |
      # pages/login_page.py
      from selenium.webdriver.common.by import By
      from selenium.webdriver.support.ui import WebDriverWait
      from selenium.webdriver.support import expected_conditions as EC

      class LoginPage:
          URL = "https://app.example.com/login"

          def __init__(self, driver):
              self.driver = driver
              self.wait = WebDriverWait(driver, 10)

          def open(self):
              self.driver.get(self.URL)
              return self

          def login(self, email, password):
              self.wait.until(EC.visibility_of_element_located((By.NAME, "email")))
              self.driver.find_element(By.NAME, "email").clear()
              self.driver.find_element(By.NAME, "email").send_keys(email)
              self.driver.find_element(By.NAME, "password").send_keys(password)
              self.driver.find_element(By.CSS_SELECTOR, "button[type='submit']").click()
              return DashboardPage(self.driver)

          def get_error_message(self):
              return self.driver.find_element(By.CSS_SELECTOR, ".error").text

  - name: Użycie Page Object w testach
    desc: >
      Test jest czytelny i nie zawiera selektorów CSS.
    code: |
      # tests/test_login.py
      import pytest
      from pages.login_page import LoginPage

      def test_successful_login(driver):
          dashboard = LoginPage(driver).open().login("jan@firma.pl", "secret123")
          assert "Dashboard" in driver.title

      def test_invalid_password(driver):
          page = LoginPage(driver).open()
          page.login("jan@firma.pl", "wrong")
          assert "Nieprawidłowe hasło" in page.get_error_message()

  - name: Fixture z driver setup/teardown
    desc: >
      pytest fixture tworzy i zamyka driver dla każdego testu.
    code: |
      # conftest.py
      import pytest
      from selenium import webdriver
      from selenium.webdriver.chrome.options import Options

      @pytest.fixture
      def driver():
          options = Options()
          options.add_argument("--headless")
          options.add_argument("--no-sandbox")
          driver = webdriver.Chrome(options=options)
          driver.implicitly_wait(5)
          yield driver
          driver.quit()
