title: Ekosystem Selenium

items:
  - name: webdriver-manager
    desc: Automatycznie pobiera i zarządza sterownikami przeglądarek (ChromeDriver, GeckoDriver). Jeden import zamiast ręcznego download i PATH management.
    icon: "📦"
  - name: selenium-wire
    desc: Rozszerzenie Selenium do przechwytywania HTTP requests/responses. Modyfikuj headery, mockuj API, analizuj network traffic — jak DevTools Network tab.
    icon: "🔌"
  - name: pytest-selenium
    desc: Plugin pytest integrujący Selenium — fixture driver, parametryzacja przeglądarek, screenshot on failure. Najprostsza integracja z pytest.
    icon: "🧪"
  - name: Selenium Grid
    desc: Rozproszone uruchamianie testów na wielu maszynach i przeglądarkach. Hub koordynuje, Nodes wykonują. Docker images ready.
    icon: "🖥️"
  - name: Allure Report
    desc: Piękne raporty testów z wykresami i historią. allure-pytest generuje HTML dashboardy ze screenshotami z Selenium.
    icon: "📊"
  - name: Selenoid
    desc: Lekka alternatywa dla Selenium Grid — przeglądarki w Docker kontenerach. Szybszy setup, mniej zasobów, UI dashboard.
    icon: "🐳"
  - name: Helium
    desc: High-level wrapper na Selenium — click("Login"), write("text"), go_to("url"). Mniej kodu, bardziej czytelne testy.
    icon: "🎈"
  - name: Undetected ChromeDriver
    desc: ChromeDriver który omija detekcję botów (Cloudflare, reCAPTCHA). Dla web scraping stron z anti-bot protection.
    icon: "🥷"
