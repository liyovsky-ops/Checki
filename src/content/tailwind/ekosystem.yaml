title: Ekosystem Tailwind CSS

items:
  - name: shadcn/ui
    desc: Komponenty UI do kopiowania — Radix UI + Tailwind. Button, Dialog, Dropdown, Toast, Table, Form. Nie biblioteka — kopiujesz kod do projektu i customizujesz. Najlepszy component library dla Tailwind.
    icon: "🎨"
  - name: Headless UI
    desc: Oficjalna biblioteka Tailwind Labs. Unstyled, accessible komponenty (Menu, Listbox, Dialog, Switch, Tabs). Ty dostajesz behavior, sam stylizujesz Tailwindem.
    icon: "🧩"
  - name: DaisyUI
    desc: Component library dla Tailwind — class="btn btn-primary" jak Bootstrap, ale na Tailwind. 50+ komponentów, themes, customizable. Szybki start bez pisania utility classes.
    icon: "🌼"
  - name: Flowbite
    desc: 450+ komponentów Tailwind (karty, navbary, modalne, tabele, charts). Wersje dla React, Vue, Svelte. Open-source core, pro wersja płatna.
    icon: "💧"
  - name: Tailwind UI
    desc: Oficjalne premium komponenty od Tailwind Labs. 500+ professionally designed components. Płatne ($299+) ale najwyższa jakość — od twórców frameworka.
    icon: "✨"
  - name: "@tailwindcss/typography"
    desc: Plugin prose — piękna typografia dla markdown/CMS content. class="prose" i gotowe — nagłówki, akapity, listy, code blocks, tabele stylowane automatycznie.
    icon: "📝"
  - name: "@tailwindcss/forms"
    desc: Plugin resetujący domyślne style formularzy. Input, select, checkbox, radio wyglądają czysto i spójnie z resztą design systemu.
    icon: "📋"
  - name: Prettier Plugin
    desc: prettier-plugin-tailwindcss — automatycznie sortuje klasy Tailwind w spójnej kolejności. Nie kłóć się z teamem o kolejność klas — Prettier robi to za Ciebie.
    icon: "✂️"
