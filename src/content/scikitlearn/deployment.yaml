  - name: "Wersjonowanie i reprodukowalność"
    icon: "📌"
    desc: "Kluczowe zasady produkcyjne — przypnij wersje, loguj metadane, monitoruj drift"
    code: |
      import sklearn, joblib

      # 1) Przypnij wersję sklearn — modele NIE są kompatybilne między wersjami
      print("Trenowano na:", sklearn.__version__)

      # 2) Zapisz schemat danych (kolejność i nazwy cech)
      metadata = {
          "feature_names": list(X_train.columns),
          "sklearn_version": sklearn.__version__,
          "metrics": {"f1_macro": 0.92},
      }
      joblib.dump({"model": pipeline, "meta": metadata}, "model.joblib")

      # 3) Wczytuj tylko zaufane pliki (joblib wykonuje kod przy load)
      # 4) Monitoruj data drift w produkcji (np. evidently, alibi-detect)
