  - name: "sklearn-pandas i SHAP"
    icon: "🔍"
    desc: "Interpretowalność i integracja z DataFrame — wyjaśnij predykcje modelu cecha po cesze"
    code: |
      # pip install shap
      import shap
      from sklearn.ensemble import RandomForestClassifier

      model = RandomForestClassifier().fit(X_train, y_train)

      # SHAP — wkład każdej cechy w pojedynczą predykcję
      explainer = shap.TreeExplainer(model)
      shap_values = explainer.shap_values(X_test)

      shap.summary_plot(shap_values, X_test)        # globalna ważność
      shap.force_plot(explainer.expected_value[1],
                      shap_values[1][0], X_test.iloc[0])  # pojedyncza predykcja

      # Wbudowana alternatywa sklearn: permutation_importance
      from sklearn.inspection import permutation_importance, PartialDependenceDisplay
      r = permutation_importance(model, X_test, y_test, n_repeats=10)
