  - name: "scikit-multilearn"
    icon: "🏷️"
    desc: "Klasyfikacja multi-label — gdy próbka może należeć do wielu klas naraz"
    code: |
      # pip install scikit-multilearn
      from skmultilearn.problem_transform import BinaryRelevance, LabelPowerset, ClassifierChain
      from sklearn.svm import SVC

      # Binary Relevance — osobny klasyfikator per etykieta
      clf = BinaryRelevance(classifier=SVC(), require_dense=[False, True])
      clf.fit(X_train, y_train)        # y: macierz (n_samples, n_labels)
      preds = clf.predict(X_test)

      # ClassifierChain — uwzględnia zależności między etykietami
      chain = ClassifierChain(classifier=SVC())
      chain.fit(X_train, y_train)

      # LabelPowerset — traktuje kombinacje etykiet jako klasy
      lp = LabelPowerset(classifier=SVC()).fit(X_train, y_train)

