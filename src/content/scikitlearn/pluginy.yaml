title: "Ekosystem scikit-learn"

items:
  - name: "imbalanced-learn"
    icon: "⚖️"
    desc: "Techniki dla niezbalansowanych klas — SMOTE, undersampling, oversampling; zgodne z Pipeline"
    code: |
      # pip install imbalanced-learn
      from imblearn.over_sampling import SMOTE, ADASYN
      from imblearn.under_sampling import RandomUnderSampler
      from imblearn.pipeline import Pipeline   # WAŻNE: imblearn Pipeline
      from sklearn.ensemble import RandomForestClassifier

      # SMOTE generuje syntetyczne próbki klasy mniejszościowej
      pipe = Pipeline([
          ("smote", SMOTE(random_state=42)),
          ("under", RandomUnderSampler(random_state=42)),
          ("clf", RandomForestClassifier(n_estimators=300)),
      ])
      pipe.fit(X_train, y_train)   # resampling TYLKO na train fold

      # BalancedRandomForestClassifier — wbudowany balans
      from imblearn.ensemble import BalancedRandomForestClassifier
      brf = BalancedRandomForestClassifier().fit(X_train, y_train)

  - name: "scikit-optimize (skopt)"
    icon: "🎯"
    desc: "Optymalizacja bayesowska hiperparametrów — mądrzejsza niż grid/random search"
    code: |
      # pip install scikit-optimize
      from skopt import BayesSearchCV
      from skopt.space import Real, Integer, Categorical
      from sklearn.svm import SVC

      # Bayesowskie przeszukiwanie — uczy się z poprzednich prób
      search = BayesSearchCV(
          SVC(),
          {
              "C": Real(1e-3, 1e3, prior="log-uniform"),
              "gamma": Real(1e-4, 1e1, prior="log-uniform"),
              "kernel": Categorical(["rbf", "poly"]),
          },
          n_iter=32,
          cv=5,
          n_jobs=-1,
      )
      search.fit(X_train, y_train)
      print(search.best_params_, search.best_score_)
      # Alternatywa: Optuna — popularniejsza, nowocześniejsza

  - name: "yellowbrick"
    icon: "📊"
    desc: "Wizualna diagnostyka modeli ML — ROC, confusion matrix, learning curves jako 'Visualizer'"
    code: |
      # pip install yellowbrick
      from yellowbrick.classifier import ROCAUC, ClassificationReport, ConfusionMatrix
      from yellowbrick.model_selection import LearningCurve, ValidationCurve
      from yellowbrick.features import Rank2D, PCA as YBPCA

      # Wizualizer ma fit/score/show jak estymator
      viz = ROCAUC(model, classes=["neg", "pos"])
      viz.fit(X_train, y_train)
      viz.score(X_test, y_test)
      viz.show()

      # Raport klasyfikacji jako heatmapa
      ClassificationReport(model, support=True).fit(X_train, y_train).show()

      # Korelacje cech
