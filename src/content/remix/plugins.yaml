title: Ekosystem Remix

items:
  - name: Vite (od Remix v2)
    desc: Remix v2 używa Vite jako bundler. HMR, native ESM, błyskawiczny dev server. Pełna kompatybilność z Vite plugins — PWA, SVG, etc.
    icon: "⚡"

  - name: Prisma + Remix
    desc: Najlepsze połączenie ORM z Remix. PrismaClient w server-only context (nie wysyłaj do klienta). Schemat w schema.prisma, type-safe queries w loaderach i actions.
    icon: "◈"

  - name: Supabase + Remix
    desc: Supabase jako backend — Auth, PostgreSQL, Storage, Realtime. @supabase/ssr dla server-side cookies. Loaders pobierają dane przez Supabase client.
    icon: "⚡"

  - name: Tailwind CSS
    desc: De facto standard stylowania w Remix. Instalacja przez Vite plugin (@tailwindcss/vite). Pełna kompatybilność z shadcn/ui i Radix UI.
    icon: "🎨"

  - name: shadcn/ui
    desc: Najlepsze komponenty UI dla Remix + Tailwind. Nie jest biblioteką — kopiujesz komponenty do projektu. Radix UI pod spodem — dostępność out of the box.
    icon: "🧱"

  - name: remix-utils
    desc: Kolekcja utilities dla Remix — promiseHash(), namedAction(), cors(), eventStream() dla SSE, redirectBack(), parseBody(). NPM install remix-utils.
    icon: "🛠️"

  - name: remix-auth
    desc: Authentication framework dla Remix wzorowany na Passport.js. Strategie FormStrategy, OAuth2, GitHub, Google, Discord. Session-based, type-safe.
    icon: "🔐"

  - name: remix-i18n / remix-i18next
    desc: Internationalization dla Remix. remix-i18next to najpopularniejsze rozwiązanie — loader per-route wykrywa język z Accept-Language header.
    icon: "🌍"

  - name: "@remix-run/cloudflare"
    desc: Adapter Cloudflare Workers i Pages. Dostęp do KV, R2, D1, Durable Objects przez context.env. Ultra-niskie latency na globalnym edge network.
    icon: "☁️"

  - name: Vercel adapter
    desc: "@remix-run/vercel — zero-config deploy na Vercel. Serverless functions per route, Edge Runtime, ISR. Rekomendowany dla projektów Vercel-first."
    icon: "▲"

  - name: Netlify adapter
    desc: "@remix-run/netlify — deploy na Netlify Edge Functions lub serverless. Netlify Forms, Identity service integracja dostępna."
    icon: "🟢"

  - name: Conform
    desc: Type-safe form library dla Remix i React — alternatywa dla ręcznego FormData. Integracja z Zod, walidacja server-side i client-side z jednym schematem.
    icon: "📋"

  - name: Drizzle ORM + Remix
    desc: Type-safe SQL ORM lżejszy od Prisma. Doskonały na edge (Cloudflare D1, Turso). Drizzle Studio — GUI. Migracje przez drizzle-kit.
    icon: "🗄️"

  - name: Lucia Auth
    desc: Lekka biblioteka auth dla Remix — session management, password hashing, OAuth. Nie opinionated o bazie danych — works with Prisma, Drizzle, MongoDB.
    icon: "🔑"
