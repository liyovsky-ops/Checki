      - code: |
          // Testowanie action z fetch — curl
          // POST do action
          // curl -X POST http://localhost:5173/blog/create \
          //   -H "Content-Type: application/x-www-form-urlencoded" \
          //   -d "title=Test&content=Hello+World"

          // GET loader jako JSON
