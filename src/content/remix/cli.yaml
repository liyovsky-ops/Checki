        detail:
          what: Fly.io uruchamia aplikacje jako Docker containers na globalnej sieci. Świetny wybór dla Remix z Epic Stack.
          how: fly launch — inicjalizacja (Dockerfile, fly.toml). fly deploy — deploy. Automatyczny TLS, global distribution.
          tips:
            - 'fly launch — interaktywna inicjalizacja projektu na Fly.io'
            - 'fly logs — podgląd logów produkcji w real-time'

      - cmd: npx wrangler dev
        desc: Lokalny dev server emulujący Cloudflare Workers
        detail:
          what: Wrangler dev emuluje środowisko Cloudflare lokalnie — KV, D1, R2, Durable Objects. Testuj Cloudflare-specific kod przed deployem.
          how: Wymaga konfiguracji w wrangler.toml. Dostęp do KV i innych bindingów przez --local flag.
          tips:
            - 'npx wrangler dev --local — lokalny KV bez połączenia z Cloudflare'
            - 'npx wrangler kv:key put --binding MY_KV key "value" — dodaj dane do KV'

      - cmd: npx wrangler deploy
        desc: Deploy aplikacji na Cloudflare Workers
        detail:
          what: Buduje i deployuje aplikację na Cloudflare Workers. Automatyczny global distribution na sieć Cloudflare (200+ lokalizacji).
          how: Wymaga konta Cloudflare i npx wrangler login. Deploy zajmuje < 30 sekund.
          tips:
            - 'npx wrangler login — autoryzacja przed pierwszym deploy'
            - 'Domena: *.workers.dev domyślnie, własna przez custom domain'
