title: Ekosystem Polars

items:
  - name: polars-plugins
    desc: Framework do pisania własnych wyrażeń Polars w Rust jako Python extension. Własne UDF-y z pełną wydajnością Rusta — bez GIL, bez narzutu Python.
    icon: "🔌"
  - name: DuckDB integracja
    desc: DuckDB natywnie rozumie Polars DataFrame przez Apache Arrow. duckdb.sql("SELECT * FROM df WHERE price > 100") gdzie df to pl.DataFrame. Zero-copy transfer.
    icon: "🦆"
  - name: Narwhals
    desc: Warstwa kompatybilności między Polars, Pandas i Modin. Pisz kod raz — działa z każdą biblioteką DataFrame. Przydatne dla autorów bibliotek.
    icon: "🐳"
  - name: polars-cloud
    desc: Zarządzane środowisko do uruchamiania Polars na klastrach chmurowych. Podobne do Databricks ale dla Polars. Dla zbiorów większych niż jeden serwer.
    icon: "☁️"
  - name: Great Tables
    desc: Biblioteka do pięknych tabel statystycznych w Python — natywna integracja z Polars. Analogia do gt w R. Tabele z formatowaniem, kolorowaniem, lateksem.
    icon: "📊"
  - name: hvplot / plotly integracja
    desc: Polars integruje z hvplot i plotly — df.plot() po import hvplot.polars. Szybka wizualizacja bez konwersji do Pandas.
    icon: "📈"
  - name: FastExcel / Calamine
    desc: Szybkie czytanie Excel/XLSX przez Polars. pl.read_excel() używa Calamine (Rust) — znacznie szybszy niż openpyxl używany przez Pandas.
    icon: "📋"
  - name: Polars dla Rust
    desc: Polars ma pełne API dla języka Rust — natywna biblioteka, zero overhead. Buduj aplikacje data processing w Rust z tą samą biblioteką co Python Polars.
    icon: "🦀"
