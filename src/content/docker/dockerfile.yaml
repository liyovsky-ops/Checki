items:
  - name: Dockerfile — podstawowa struktura
    desc: >
      Każda instrukcja tworzy nową warstwę. Kolejność ma znaczenie — zmieniające się warstwy na końcu (cache).
      Zawsze używaj konkretnych tagów wersji.
    code: |
      FROM python:3.12-slim

      # Zmienne środowiskowe
      ENV PYTHONDONTWRITEBYTECODE=1 \
          PYTHONUNBUFFERED=1

      # Folder roboczy w kontenerze
      WORKDIR /app

      # Kopiuj requirements i instaluj zależności
      # (osobna warstwa — cache gdy requirements nie zmienią się)
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt

      # Kopiuj kod aplikacji
      COPY . .

      # Port który kontener nasłuchuje (dokumentacja)
      EXPOSE 8000

      # Komenda przy uruchomieniu kontenera
      CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  - name: Multi-stage build — mały image produkcyjny
    desc: >
      Multi-stage build używa wielu FROM. Pierwsza faza buduje (z narzędziami).
      Druga faza kopiuje tylko gotowy wynik — bez narzędzi dev. Mniejszy, bezpieczniejszy image.
    code: |
      # Faza 1: builder — z narzędziami do budowania
      FROM python:3.12 AS builder

      WORKDIR /app
      COPY requirements.txt .
      RUN pip install --user --no-cache-dir -r requirements.txt

      # Faza 2: runtime — tylko to co potrzebne
      FROM python:3.12-slim

      WORKDIR /app

      # Skopiuj tylko zainstalowane paczki z buildera
      COPY --from=builder /root/.local /root/.local
      COPY . .

      # Uruchom jako non-root user (bezpieczeństwo)
      RUN adduser --disabled-password --no-create-home appuser
      USER appuser

      ENV PATH=/root/.local/bin:$PATH
      EXPOSE 8000
      CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  - name: Optymalizacja Dockerfile — cache i rozmiar
    desc: >
      Docker cache działa layer po layer — jeśli warstwa się nie zmieniła, używa cache.
      Strategie: kolejność warstw, .dockerignore, slim images, --no-cache-dir.
    code: |
      # .dockerignore — nie kopiuj zbędnych plików
      # .git
      # .venv
      # __pycache__
      # *.pyc
      # .env
      # tests/

      # Złe — zmiana kodu unieważnia warstwę pip
      COPY . .
      RUN pip install -r requirements.txt

      # Dobre — requirements osobna warstwa (cache)
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      COPY . .   # zmiana kodu nie unieważnia warstwy pip

      # Zmniejsz rozmiar — usuń cache w tej samej warstwie RUN
      RUN apt-get update && apt-get install -y \
          build-essential \
          && rm -rf /var/lib/apt/lists/*

  - name: Budowanie i tagowanie image
    desc: >
      docker build czyta Dockerfile i tworzy image. Tag to etykieta — nazwa:wersja.
      Dobre tagowanie ułatwia zarządzanie wersjami.
    code: |
      # Buduj image z tagiem
      docker build -t moja-apka:1.0.0 .
      docker build -t moja-apka:latest .

      # Buduj z konkretnego Dockerfile
      docker build -f Dockerfile.prod -t moja-apka:prod .

      # Build args — zmienne podczas budowania
      docker build --build-arg ENV=production -t moja-apka .

      # Sprawdź rozmiar i warstwy
      docker images moja-apka
      docker history moja-apka:latest

      # Usuń image
      docker rmi moja-apka:1.0.0
      docker image prune  # usuń nieużywane images
