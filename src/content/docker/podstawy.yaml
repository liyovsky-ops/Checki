labels:
  concepts: Kluczowe koncepcje
  whenToUse: Kiedy używać Docker?
  firstComponent: Pierwszy kontener
  firstComponentLang: bash

intro:
  title: Czym jest Docker?
  desc: >
    Docker to platforma do konteneryzacji — pakuje aplikację wraz z jej zależnościami w izolowane kontenery.
    Kontener działa identycznie na laptopie dewelopera, CI/CD i serwerze produkcyjnym.
    "Działa u mnie" przestaje być problemem. Standard w nowoczesnym DevOps.

concepts:
  - title: Image vs Kontener
    desc: >
      Image to szablon (przepis) — niezmienny. Kontener to uruchomiony instance image — można ich mieć wiele z jednego image.
      Jak klasa vs obiekt w OOP.
    icon: "📦"
  - title: Dockerfile
    desc: >
      Plik z instrukcjami budowania image. FROM = bazowy image, RUN = komendy podczas budowania,
      COPY = kopiowanie plików, CMD = domyślna komenda przy uruchomieniu.
    icon: "📋"
  - title: Docker Hub / Registry
    desc: >
      Publiczne repozytorium images. hub.docker.com — miliony gotowych images.
      python:3.12-slim, nginx:alpine, postgres:16 — bierzesz gotowy image i budujesz na nim.
    icon: "🗄️"
  - title: Docker Compose
    desc: >
      Uruchamia wiele kontenerów razem — np. FastAPI + PostgreSQL + Redis jedną komendą.
      Definiujesz w docker-compose.yml: serwisy, sieci, wolumeny. Standard dla local dev.
    icon: "🎼"

whenToUse:
  - Izolacja środowiska — każdy projekt ma własne zależności, bez konfliktów
  - Onboarding — nowy developer robi docker compose up i ma całe środowisko
  - CI/CD — testy i deploy w identycznym środowisku co produkcja
  - Mikrousługi — każdy serwis w osobnym kontenerze
  - Lokalny development z bazą danych — postgres/redis w kontenerze zamiast instalacji
  - Deploy na dowolny serwer który ma Docker — bez konfigurowania systemu

firstComponent: |
  # Pobierz i uruchom gotowy kontener
  docker run hello-world

  # Uruchom Pythona interaktywnie
  docker run -it python:3.12-slim bash

  # Uruchom PostgreSQL lokalnie (bez instalacji)
  docker run -d \
    --name postgres \
    -e POSTGRES_PASSWORD=secret \
    -p 5432:5432 \
    postgres:16-alpine

  # Sprawdź działające kontenery
  docker ps

  # Zatrzymaj kontener
  docker stop postgres
