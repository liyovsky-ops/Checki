title: Ekosystem Express.js

items:
  - name: cors
    desc: Middleware CORS — Cross-Origin Resource Sharing. Konfiguracja dozwolonych origins, methods, headers. Jeden liner do dodania CORS do API.
    icon: "🌐"
  - name: helmet
    desc: Security headers middleware — ustawia CSP, X-Frame-Options, HSTS, X-XSS-Protection i inne. Jedna linia = 15 headerów bezpieczeństwa.
    icon: "🛡️"
  - name: morgan
    desc: "HTTP request logger middleware. Formaty: dev, combined, tiny. Loguje method, URL, status, response time."
    icon: "📝"
  - name: express-validator
    desc: Walidacja i sanityzacja req.body/query/params. Chain API (body('email').isEmail()). Integruje się z Express middleware pipeline.
    icon: "✅"
  - name: passport
    desc: "Authentication middleware. Strategie: local, OAuth2, JWT, API key. 500+ strategii dostępnych."
    icon: "🔐"
  - name: multer
    desc: File upload middleware (multipart/form-data). Konfiguracja limitu rozmiaru, filtrowania typów, storage (disk/memory/S3).
    icon: "📁"
  - name: express-rate-limit
    desc: Rate limiting middleware. Konfiguracja max requests per window, custom responses, Redis store dla distributed. Ochrona przed brute force.
    icon: "🚦"
  - name: compression
    desc: Middleware kompresji gzip/brotli. Zmniejsza rozmiar response o 60-80%. Automatycznie kompresuje JSON, HTML, CSS, JS.
    icon: "📦"
