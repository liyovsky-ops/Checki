title: Ekosystem Playwright

items:
  - name: pytest-playwright
    desc: Oficjalny plugin pytest — fixture'y page, context, browser. Automatyczna izolacja testów, parametryzacja przeglądarek, conftest support.
    icon: "🧪"
  - name: Playwright Codegen
    desc: Wbudowany recorder — otwiera przeglądarkę i nagrywa akcje jako kod testowy. playwright codegen https://example.com generuje Python/TS/JS.
    icon: "📹"
  - name: Trace Viewer
    desc: Interaktywny debugger testów w przeglądarce. Screenshot każdego kroku, DOM snapshot, network log, console log. Lepszy niż video.
    icon: "🔍"
  - name: Playwright Inspector
    desc: GUI do debugowania testów krok po kroku. PWDEBUG=1 uruchamia inspector z breakpointami, locator picker i evaluate console.
    icon: "🛠️"
  - name: VS Code Extension
    desc: Oficjalne rozszerzenie VS Code — uruchamiaj testy z edytora, pick locator z przeglądarki, record nowe testy. Debug z breakpointami.
    icon: "💻"
  - name: Allure Report
    desc: Piękne raporty testów z wykresami, historią, timeline. allure-pytest + allure-playwright generuje HTML dashboardy ze screenshotami.
    icon: "📊"
  - name: pytest-xdist
    desc: Parallelizacja testów na wielu procesach. pytest -n auto rozprowadza testy na rdzenie CPU. Bezpieczne z Playwright dzięki izolacji BrowserContext.
    icon: "⚡"
  - name: Faker / Factory Boy
    desc: Generowanie testowych danych. Faker tworzy realistyczne imiona, adresy, emaile. Factory Boy buduje obiekty Django/SQLAlchemy z losowymi danymi.
    icon: "🎲"
