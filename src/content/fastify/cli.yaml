title: Komendy Fastify

groups:
  - name: Instalacja i setup
    icon: "📦"
    commands:
      - cmd: npm install fastify
        desc: Zainstaluj Fastify core
        detail:
          what: Instaluje Fastify — zero peer dependencies. Wszystkie pluginy oficjalne (@fastify/*) instalujesz osobno.
          how: Fastify core jest kompletny — ma routing, walidację JSON Schema, logger Pino, lifecycle hooks. Pluginy rozszerzają go opcjonalnie.
          tips:
            - 'npm install fastify@latest — zawsze pobiera najnowszą stabilną wersję (aktualnie v5)'
            - 'Fastify v5 wymaga Node.js 20+ — sprawdź node --version przed instalacją'

      - cmd: npm install fastify @sinclair/typebox @fastify/type-provider-typebox
        desc: Fastify + TypeBox dla pełnego TypeScript
        detail:
          what: TypeBox generuje JSON Schema i TypeScript types jednocześnie. Type provider łączy je z Fastify — pełna type safety bez powtarzania definicji.
          how: "withTypeProvider<TypeBoxTypeProvider>() — wszystkie trasy mają automatyczne typy z Type.Object()."
          tips:
            - 'TypeBox to preferowany sposób walidacji w TypeScript projektach Fastify'
            - 'Alternatywa: fastify-type-provider-zod jeśli preferujesz Zod API'

      - cmd: npm install fastify-cli
        desc: Zainstaluj Fastify CLI globalnie
        detail:
          what: Fastify CLI (fastify) pozwala uruchamiać aplikacje Fastify z linii komend, generować szablony i konfigurować środowisko.
          how: "fastify start src/app.js — uruchamia plik eksportujący Fastify instance. fastify generate my-app — tworzy nowy projekt."
          tips:
            - 'npm install -g fastify-cli — instalacja globalna dla komendy fastify w PATH'
            - 'npx fastify-cli generate my-app — bez globalnej instalacji'

      - cmd: npx fastify-cli generate my-app
        desc: Utwórz nowy projekt Fastify
        detail:
          what: Generator tworzy strukturę projektu z autoload, standardową organizacją plugins/ i routes/, ESM modules, config.
          how: Tworzy package.json, app.js, plugins/, routes/root.js, routes/example/index.js, test/. Gotowy do uruchomienia od razu.
          tips:
            - 'Dodaj --lang=ts dla TypeScript projektu'
            - 'Struktura z autoload jest oficjalnie zalecaną przez Fastify team'

      - cmd: npm install @fastify/autoload @fastify/sensible @fastify/env
        desc: Podstawowy zestaw pluginów Fastify
        detail:
          what: "autoload — automatyczne ładowanie pluginów, sensible — utility helpers (httpErrors, assert), env — walidacja zmiennych środowiskowych."
          how: "@fastify/sensible dodaje reply.notFound(), reply.forbidden(), reply.internalServerError() — standardowe HTTP errors."
          tips:
            - '@fastify/sensible to must-have — usuwa konieczność pisania boilerplate dla błędów HTTP'
            - '@fastify/env z JSON Schema waliduje .env przy starcie — fail fast zamiast runtime crash'

  - name: Inicjalizacja serwera
    icon: "🚀"
    commands:
      - code: |
          import Fastify from 'fastify'

          const fastify = Fastify({
            logger: {
              level: 'info',
              transport: {
                target: 'pino-pretty',  // dev only
                options: { colorize: true }
              }
            }
          })

          fastify.get('/', async (request, reply) => {
            return { hello: 'world' }
          })

          const start = async () => {
            try {
              await fastify.listen({ port: 3000, host: '0.0.0.0' })
            } catch (err) {
              fastify.log.error(err)
              process.exit(1)
            }
          }

          start()
        desc: Minimalna aplikacja Fastify z loggingiem
        detail:
          what: Fastify() tworzy instancję. logger true włącza Pino. pino-pretty formatuje logi czytelnie w dev. host 0.0.0.0 słucha na wszystkich interfejsach.
          how: await fastify.listen() jest async — czeka na gotowość serwera. Pino logger jest wbudowany — nie potrzebujesz Winston/Morgan.
          tips:
            - 'npm install pino-pretty --save-dev — tylko dla developmentu'
            - 'W produkcji: logger true lub logger z level: "warn" — pino-pretty spowalnia'

      - code: |
          import Fastify from 'fastify'
          import { TypeBoxTypeProvider } from '@fastify/type-provider-typebox'

          const fastify = Fastify({
            logger: true,
            disableRequestLogging: false,
            requestIdHeader: 'x-request-id',
            requestIdLogLabel: 'reqId',
            genReqId: () => crypto.randomUUID()
          })
            .withTypeProvider<TypeBoxTypeProvider>()

          export type FastifyApp = typeof fastify

          export default fastify
        desc: "Fastify z TypeBox TypeProvider — production setup"
        detail:
          what: withTypeProvider daje type safety dla TypeBox. genReqId generuje UUID per request. requestIdHeader odczytuje/przekazuje X-Request-Id do downstream services.
          how: Export type FastifyApp = typeof fastify umożliwia przekazanie instancji do pluginów z pełnymi typami.
          tips:
            - 'FastifyApp type importuj w pluginach zamiast any — pełna type safety'
            - 'disableRequestLogging: true jeśli masz własny hook logowania requestów'

      - code: |
          import Fastify from 'fastify'

          const fastify = Fastify({
            logger: true,
            bodyLimit: 1_048_576,  // 1 MB limit body
            connectionTimeout: 0,  // bez limitu (nginx zarządza)
            keepAliveTimeout: 72_000,  // 72s — ponad ALB timeout (60s)
            maxParamLength: 100,
            caseSensitive: true,
            ignoreTrailingSlash: true,
            ignoreDuplicateSlashes: true
          })

          // Graceful shutdown
          const shutdown = async (signal: string) => {
            fastify.log.info({ signal }, 'Shutting down')
            await fastify.close()
            process.exit(0)
          }

          process.on('SIGTERM', () => shutdown('SIGTERM'))
          process.on('SIGINT', () => shutdown('SIGINT'))
        desc: Konfiguracja produkcyjna — limity i graceful shutdown
        detail:
          what: bodyLimit chroni przed dużymi payloadami. keepAliveTimeout musi być wyższy niż timeout load balancera. graceful shutdown czeka na zakończenie aktywnych requestów.
          how: fastify.close() zamyka serwer i wywołuje onClose hooks (zamknięcie DB, cache flush). SIGTERM wysyła Kubernetes podczas skalowania.
          tips:
            - 'keepAliveTimeout: 72000 — powyżej AWS ALB default 60s aby uniknąć 502'
            - 'fastify.close() wywołuje wszystkie onClose hooks — zarejestruj czyszczenie tam'

  - name: Routes i HTTP
    icon: "🛣️"
    commands:
      - code: |
          // Pełne API CRUD dla zasobu
          fastify.get('/api/items', async (req, reply) => {
            const { page = 1, limit = 20 } = req.query as { page?: number; limit?: number }
            return { items: [], page, limit, total: 0 }
          })

          fastify.get('/api/items/:id', async (req, reply) => {
            const { id } = req.params as { id: string }
            return { id, name: 'Item' }
          })

          fastify.post('/api/items', async (req, reply) => {
            reply.code(201)
            return { id: crypto.randomUUID(), ...req.body as object }
          })

          fastify.put('/api/items/:id', async (req, reply) => {
            const { id } = req.params as { id: string }
            return { id, ...req.body as object, updatedAt: new Date().toISOString() }
          })

          fastify.patch('/api/items/:id', async (req, reply) => {
            const { id } = req.params as { id: string }
            return { id, patched: true }
          })

          fastify.delete('/api/items/:id', async (req, reply) => {
            reply.code(204).send()
          })
        desc: CRUD — pełny zestaw metod HTTP
        detail:
          what: "Shorthand methods: get, post, put, patch, delete, head, options. Każdy przyjmuje (path, options?, handler) lub (path, handler)."
          how: "reply.code(201).send() — jawne wysłanie. return value — implicit send. Oba działają, ale nie mieszaj w jednym handlerze."
          tips:
            - 'DELETE z 204 i pustym body — reply.code(204).send() bez żadnego payload'
            - 'HEAD = jak GET ale bez body — Fastify obsługuje automatycznie gdy masz GET'

      - code: |
          // Trasa z pełnymi opcjami
          fastify.route({
            method: 'POST',
            url: '/api/users',
            schema: {
              body: {
                type: 'object',
                required: ['name', 'email'],
                properties: {
                  name: { type: 'string' },
                  email: { type: 'string', format: 'email' }
                }
              },
              response: { 201: { type: 'object', properties: { id: { type: 'string' } } } }
            },
            preHandler: [fastify.authenticate],
            config: { requiresAuth: true },
            handler: async (request, reply) => {
              reply.code(201)
              return { id: crypto.randomUUID() }
            }
          })
        desc: "fastify.route() — pełna deklaracja trasy"
        detail:
          what: fastify.route() jako alternatywa dla shorthand. Przyjmuje jeden obiekt z method, url, schema, preHandler, config, handler.
          how: method może być stringiem lub tablicą ['GET', 'POST']. Przydatne gdy potrzebujesz jasnej, jawnej deklaracji zamiast shorthand.
          tips:
            - 'config — dowolny obiekt dostępny przez request.routeOptions.config — metadata dla hooków'
            - 'Tablicowe preHandler — wiele middleware per route w kolejności'

      - code: |
          // Trasy zarejestrowane przez plugin z prefiksem
          async function v1Routes(fastify: any, opts: any) {
            fastify.get('/users', async () => ({ version: 'v1', users: [] }))
            fastify.get('/products', async () => ({ version: 'v1', products: [] }))
          }

          async function v2Routes(fastify: any, opts: any) {
            fastify.get('/users', async () => ({ version: 'v2', users: [], meta: {} }))
            fastify.get('/products', async () => ({ version: 'v2', products: [], filters: [] }))
          }

          fastify.register(v1Routes, { prefix: '/api/v1' })
          fastify.register(v2Routes, { prefix: '/api/v2' })

          // GET /api/v1/users → v1
          // GET /api/v2/users → v2
        desc: Wersjonowanie API — prefix per plugin
        detail:
          what: Każda wersja API to osobny plugin z prefiksem. Trasy /users w v1 i v2 są w pełni niezależne — mogą mieć inne schematy, logikę, middleware.
          how: prefix jest dodawany do wszystkich tras pluginu. /users wewnątrz pluginu z prefix /api/v1 = /api/v1/users.
          tips:
            - 'Wersjonowanie przez plugin — niezależna ewolucja v1 i v2 bez konfliktów'
            - 'Deprecated wersje usuń z rejestru — nie zostawiaj jako martwego kodu'

  - name: JSON Schema — walidacja
    icon: "✅"
    commands:
      - code: |
          fastify.post('/users', {
            schema: {
              body: {
                type: 'object',
                required: ['name', 'email', 'age'],
                additionalProperties: false,
                properties: {
                  name: { type: 'string', minLength: 2, maxLength: 50 },
                  email: { type: 'string', format: 'email' },
                  age: { type: 'integer', minimum: 18, maximum: 120 },
                  role: {
                    type: 'string',
                    enum: ['user', 'admin', 'moderator'],
                    default: 'user'
                  },
                  tags: {
                    type: 'array',
                    items: { type: 'string', maxLength: 20 },
                    maxItems: 5,
                    uniqueItems: true
                  }
                }
              }
            }
          }, async (req, reply) => {
            const body = req.body as {
              name: string; email: string; age: number
              role: string; tags?: string[]
            }
            reply.code(201)
            return { id: crypto.randomUUID(), ...body }
          })
        desc: JSON Schema body — pełna walidacja
        detail:
          what: additionalProperties false odrzuca nieznane pola. default w schema — Fastify wypełnia je automatycznie jeśli nie podane. uniqueItems dla tablic.
          how: Fastify zwraca 400 z detalami błędów walidacji. Wszystkie pola required muszą być obecne — inaczej błąd przed dotarciem do handlera.
          tips:
            - 'additionalProperties: false — ważna ochrona przed nadmiarowymi danymi'
            - 'default — wypełniane przez Ajv useDefaults: true (domyślnie w Fastify)'

      - code: |
          // Ponowne użycie schematów przez addSchema
          fastify.addSchema({
            $id: 'UserBody',
            type: 'object',
            required: ['name', 'email'],
            properties: {
              name: { type: 'string', minLength: 2 },
              email: { type: 'string', format: 'email' }
            }
          })

          fastify.addSchema({
            $id: 'UserResponse',
            type: 'object',
            properties: {
              id: { type: 'string' },
              name: { type: 'string' },
              email: { type: 'string' },
              createdAt: { type: 'string', format: 'date-time' }
            }
          })

          // Użyj przez $ref
          fastify.post('/users', {
            schema: {
              body: { $ref: 'UserBody#' },
              response: { 201: { $ref: 'UserResponse#' } }
            }
          }, async (req, reply) => {
            reply.code(201)
            return { id: '1', ...req.body as object, createdAt: new Date().toISOString() }
          })

          // Ten sam schemat w innej trasie
          fastify.put('/users/:id', {
            schema: {
              body: { $ref: 'UserBody#' },
              response: { 200: { $ref: 'UserResponse#' } }
            }
          }, async (req, reply) => {
            return { id: (req.params as any).id, ...req.body as object, createdAt: new Date().toISOString() }
          })
        desc: "addSchema() + $ref — wielokrotne użycie schematów"
        detail:
          what: addSchema() rejestruje schemat globalnie z identyfikatorem $id. Inne schematy mogą go referencjonować przez $ref. Eliminuje duplikowanie schematów.
          how: "$ref: 'UserBody#' — referencja do całego schematu. $ref: 'UserBody#/properties/name' — referencja do konkretnej właściwości."
          tips:
            - 'Trzymaj schematy w osobnych plikach schemas/user.schema.ts i importuj'
            - '$ref działa zarówno dla walidacji jak i dla serializacji response'

  - name: TypeBox
    icon: "🔷"
    commands:
      - code: |
          import { Type, Static } from '@sinclair/typebox'
          import { TypeBoxTypeProvider } from '@fastify/type-provider-typebox'
          import Fastify from 'fastify'

          // Schema = JSON Schema + TypeScript type w jednym
          const CreateUser = Type.Object({
            name: Type.String({ minLength: 2, maxLength: 50 }),
            email: Type.String({ format: 'email' }),
            age: Type.Integer({ minimum: 18 }),
            role: Type.Optional(Type.Union([
              Type.Literal('user'),
              Type.Literal('admin')
            ]))
          })

          type CreateUserType = Static<typeof CreateUser>

          const UserResponse = Type.Object({
            id: Type.String({ format: 'uuid' }),
            name: Type.String(),
            email: Type.String(),
            createdAt: Type.String({ format: 'date-time' })
          })

          const fastify = Fastify().withTypeProvider<TypeBoxTypeProvider>()

          fastify.post('/users', {
            schema: {
              body: CreateUser,
              response: { 201: UserResponse }
            }
          }, async (request, reply) => {
            // request.body jest w pełni typowany!
            const { name, email, age, role } = request.body
            reply.code(201)
            return {
              id: crypto.randomUUID(),
              name,
              email,
              createdAt: new Date().toISOString()
            }
          })
        desc: TypeBox — schema i typy z jednego źródła
        detail:
          what: Type.Object() generuje JSON Schema (do walidacji) i TypeScript type (do IDE). Static<> wyciąga TypeScript interface. Jedno źródło prawdy zamiast dwóch.
          how: withTypeProvider<TypeBoxTypeProvider>() łączy TypeBox z Fastify type system. Bez tego request.body jest unknown.
          tips:
            - 'Type.Optional() zamiast ? — TypeBox wymaga Optional() dla opcjonalnych pól'
            - 'Type.Partial(Schema) — wszystkie pola Optional naraz — idealne dla PATCH'

      - code: |
          import { Type, Static } from '@sinclair/typebox'
          import { TypeBoxTypeProvider } from '@fastify/type-provider-typebox'
          import Fastify from 'fastify'

          // Współdzielone typy między schematami
          const PaginationQuery = Type.Object({
            page: Type.Optional(Type.Integer({ minimum: 1, default: 1 })),
            limit: Type.Optional(Type.Integer({ minimum: 1, maximum: 100, default: 20 })),
            sort: Type.Optional(Type.Union([Type.Literal('asc'), Type.Literal('desc')]))
          })

          const ItemSchema = Type.Object({
            id: Type.String(),
            name: Type.String(),
            price: Type.Number()
          })

          const ItemsListResponse = Type.Object({
            items: Type.Array(ItemSchema),
            total: Type.Integer(),
            page: Type.Integer(),
            limit: Type.Integer()
          })

          const fastify = Fastify().withTypeProvider<TypeBoxTypeProvider>()

          fastify.get('/items', {
            schema: {
              querystring: PaginationQuery,
              response: { 200: ItemsListResponse }
            }
          }, async (request) => {
            const { page = 1, limit = 20, sort = 'asc' } = request.query
            // page i limit są Integer — TypeBox zadbał o typy
            return {
              items: [],
              total: 0,
              page,
              limit
            }
          })
        desc: TypeBox — paginacja i kompozycja schematów
        detail:
          what: Type.Array(ItemSchema) — tablica obiektów. Type.Partial(Schema) — wszystkie pola Optional. Schematy można komponować jak TypeScript types.
          how: PaginationQuery jako współdzielony schemat querystring — użyj go w wielu trasach bez duplikowania.
          tips:
            - 'Type.Intersect([A, B]) — połącz dwa schematy (TypeScript intersection type)'
            - 'Type.Pick(Schema, ["id", "name"]) — wyciągnij pola jak TypeScript Pick'

  - name: Hooks i Lifecycle
    icon: "🔗"
    commands:
      - code: |
          // Globalny hook logowania requestów
          fastify.addHook('onRequest', async (request, reply) => {
            request.log.info({
              method: request.method,
              url: request.url,
              ip: request.ip,
              userAgent: request.headers['user-agent']
            }, 'incoming request')
          })

          // Hook auth — sprawdzenie tokenu
          fastify.addHook('preHandler', async (request, reply) => {
            const publicPaths = ['/', '/health', '/api/login']
            if (publicPaths.includes(request.routerPath)) return

            const auth = request.headers.authorization
            if (!auth?.startsWith('Bearer ')) {
              return reply.code(401).send({ error: 'Unauthorized' })
            }
          })

          // Hook po odpowiedzi — metryki
          fastify.addHook('onResponse', async (request, reply) => {
            request.log.info({
              url: request.url,
              statusCode: reply.statusCode,
              responseTime: reply.elapsedTime
            }, 'request completed')
          })
        desc: addHook() — globalne hooki lifecycle
        detail:
          what: addHook(hookName, handler) rejestruje funkcję dla danego punktu lifecycle. Hooki globalne działają dla wszystkich tras. request.routerPath = wzorzec trasy z :param.
          how: "Dostępne hooki: onRequest, preParsing, preValidation, preHandler, preSerialization, onSend, onResponse, onTimeout, onError, onClose."
          tips:
            - 'request.routerPath vs request.url — routerPath to wzorzec /users/:id, url to /users/123'
            - 'Hooki są async — możesz używać await bez next() callbacku'

      - code: |
          // onSend — modyfikacja payload
          fastify.addHook('onSend', async (request, reply, payload) => {
            // Dodaj X-Request-Id do każdej odpowiedzi
            reply.header('X-Request-Id', request.id)
            reply.header('X-Response-Time', `${reply.elapsedTime.toFixed(2)}ms`)

            // Możesz modyfikować payload
            if (typeof payload === 'string' && reply.statusCode === 200) {
              try {
                const data = JSON.parse(payload)
                return JSON.stringify({
                  ...data,
                  _meta: { requestId: request.id, version: '1.0' }
                })
              } catch {
                // nie JSON — zwróć niezmieniony
              }
            }

            return payload  // zawsze zwróć payload!
          })
        desc: onSend — modyfikacja response przed wysłaniem
        detail:
          what: onSend wykonuje się po serializacji ale przed wysłaniem. Musi zwracać payload (może być zmieniony lub oryginalny). reply.elapsedTime w tym miejscu zawiera czas do serializacji.
          how: payload to string lub Buffer lub Stream. Przy modyfikacji JSON — parse → zmień → stringify. Zwróć null aby anulować payload.
          tips:
            - 'Zawsze return payload — bez return Fastify wyśle undefined'
            - 'Nie używaj onSend do dużych transformacji — to hot path dla każdego requestu'

  - name: Pluginy
    icon: "🔌"
    commands:
      - code: |
          import fp from 'fastify-plugin'
          import Fastify from 'fastify'

          // Plugin jako plik src/plugins/db.ts
          const dbPlugin = fp(async (fastify) => {
            // Przykład — inicjalizacja klienta bazy danych
            const pool = {
              query: async (sql: string, params?: any[]) => ({ rows: [], rowCount: 0 }),
              connect: async () => ({ release: () => {} }),
              end: async () => {}
            }

            fastify.decorate('db', pool)

            // Cleanup przy zamknięciu
            fastify.addHook('onClose', async () => {
              await pool.end()
              fastify.log.info('Database pool closed')
            })
          }, {
            name: 'db',
            dependencies: ['config'],   // musi być załadowany po 'config'
            fastify: '>=4.0.0'
          })

          export default dbPlugin
        desc: "fp() plugin z onClose cleanup"
        detail:
          what: fp() (fastify-plugin) znosi enkapsulację — fastify.db jest widoczne poza pluginem. dependencies deklaruje co musi być załadowane przed tym pluginem.
          how: onClose hook zwalnia zasoby przy fastify.close() — ważne dla graceful shutdown i testów (każdy test tworzy/zamyka instancję).
          tips:
            - 'name w options fp() — Fastify sprawdza duplikaty i wyświetla w diagnostyce'
            - 'fastify version constraint — chroni przed użyciem pluginu z niekompatybilną wersją'

      - code: |
          import fp from 'fastify-plugin'

          // Plugin autentykacji JWT
          const jwtPlugin = fp(async (fastify) => {
            await fastify.register(import('@fastify/jwt'), {
              secret: (fastify as any).config?.jwtSecret ?? process.env.JWT_SECRET ?? 'dev'
            })

            // Dekorator — helper dla tras wymagających auth
            fastify.decorate('authenticate', async (request: any, reply: any) => {
              try {
                await request.jwtVerify()
              } catch (err) {
                reply.code(401).send({ error: 'Unauthorized', details: (err as Error).message })
              }
            })
          }, { name: 'jwt-auth', dependencies: ['config'] })

          export default jwtPlugin

          // Użycie w trasie:
          // fastify.get('/profile', {
          //   preHandler: [fastify.authenticate]
          // }, async (req) => {
          //   return req.user
          // })
        desc: Plugin JWT z dekoratorem authenticate
        detail:
          what: "@fastify/jwt dodaje request.jwtVerify(), request.jwtSign(). Dekorator authenticate jako preHandler — clean pattern zamiast powtarzania kodu auth w każdej trasie."
          how: preHandler jako tablica — można stackować middleware. [fastify.authenticate, fastify.authorize('admin')] = chain.
          tips:
            - 'await fastify.register(import("@fastify/jwt")) — dynamiczny import dla CJS/ESM compatibility'
            - 'request.user po jwtVerify() zawiera payload JWT — dostępny w handlerach'

  - name: TypeScript — zaawansowane typy
    icon: "🔷"
    commands:
      - code: |
          // Declaration merging — rozszerzanie typów Fastify
          import 'fastify'

          declare module 'fastify' {
            interface FastifyInstance {
              config: {
                jwtSecret: string
                dbUrl: string
                redisUrl: string
                appEnv: 'development' | 'staging' | 'production'
              }
              authenticate: (req: FastifyRequest, reply: FastifyReply) => Promise<void>
            }

            interface FastifyRequest {
              user: {
                id: string
                email: string
                role: 'user' | 'admin' | 'moderator'
              } | null
              ctx: {
                requestId: string
                startTime: number
              }
            }
          }
        desc: Declaration merging — TypeScript types dla Fastify
        detail:
          what: "declare module 'fastify' { interface FastifyInstance {} } rozszerza typ instancji bez type assertion. IDE autocomplete i type safety dla dekoratorów."
          how: Umieść w src/types/fastify.d.ts — importowany automatycznie przez TypeScript. Import typów z osobnych modułów przez import() w declare.
          tips:
            - 'Jeden plik types/fastify.d.ts — centralny punkt dla wszystkich rozszerzeń'
            - 'Bez declaration merging potrzebujesz (fastify as any).db — brzydkie i niebezpieczne'

      - code: |
          // tsconfig.json dla projektu Fastify
          // {
          //   "compilerOptions": {
          //     "target": "ES2022",
          //     "module": "NodeNext",
          //     "moduleResolution": "NodeNext",
          //     "lib": ["ES2022"],
          //     "outDir": "./dist",
          //     "rootDir": "./src",
          //     "strict": true,
          //     "esModuleInterop": true,
          //     "skipLibCheck": true,
          //     "resolveJsonModule": true,
          //     "declaration": true,
          //     "sourceMap": true,
          //     "paths": { "@/*": ["./src/*"] }
          //   },
          //   "include": ["src/**/*"],
          //   "exclude": ["node_modules", "dist", "**/*.test.ts"]
          // }

          // Kompilacja i uruchamianie:
          // npx tsc             -- kompiluj do dist/
          // npx tsx src/server  -- uruchamiaj TS bez kompilacji (dev)
          // node dist/server.js -- uruchamiaj skompilowany JS (prod)
          export {}  // placeholder — powyżej konfiguracja w komentarzu
        desc: "tsconfig.json — konfiguracja TypeScript dla Fastify"
        detail:
          what: "NodeNext module/moduleResolution — dla ESM i CJS compatibility. strict: true — pełna type safety. paths — aliasy importów zamiast ../../.."
          how: "Fastify v5 jest ESM-first. NodeNext moduleResolution obsługuje .js extension w importach nawet pisząc .ts."
          tips:
            - 'NodeNext wymaga rozszerzenia .js w importach: import "./routes.js" (nie .ts)'
            - 'npm install --save-dev typescript tsx — tsx do uruchamiania TS bez kompilacji w dev'

      - code: |
          // Typowany plugin z Generic FastifyInstance
          import {
            FastifyInstance,
            FastifyPluginAsync,
            FastifyPluginOptions
          } from 'fastify'
          import fp from 'fastify-plugin'

          interface CachePluginOptions extends FastifyPluginOptions {
            ttl: number
            maxItems?: number
          }

          // FastifyPluginAsync<Options> = typed plugin factory
          const cachePlugin: FastifyPluginAsync<CachePluginOptions> = async (
            fastify: FastifyInstance,
            opts: CachePluginOptions
          ) => {
            const cache = new Map<string, { value: unknown; expires: number }>()

            fastify.decorate('cache', {
              get: (key: string) => {
                const entry = cache.get(key)
                if (!entry || Date.now() > entry.expires) return null
                return entry.value
              },
              set: (key: string, value: unknown) => {
                cache.set(key, { value, expires: Date.now() + opts.ttl * 1000 })
              }
            })
          }

          export default fp(cachePlugin, {
            name: 'cache-plugin',
            fastify: '>=4.0.0'
          })

          // Użycie:
          // await fastify.register(cachePlugin, { ttl: 300, maxItems: 1000 })
        desc: FastifyPluginAsync — typowany plugin z opcjami
        detail:
          what: FastifyPluginAsync<Options> nadaje typ opcjom pluginu. TypeScript sprawdzi czy register() dostał wymagane opcje. fp() owijanie dla eksponowania dekoratorów.
          how: "extends FastifyPluginOptions — baza dla własnych opcji. FastifyInstance w argumencie — pełny typ z declaration merging."
          tips:
            - 'FastifyPluginAsync vs FastifyPluginCallback — użyj Async dla pluginów z await'
            - 'opts.ttl w pluginie — Fastify przekazuje je automatycznie z register(plugin, opts)'

  - name: "Pino Logger"
    icon: "📋"
    commands:
      - code: |
          import Fastify from 'fastify'

          const fastify = Fastify({
            logger: {
              level: process.env.LOG_LEVEL ?? 'info',
              // Produkcja — JSON logi
              // transport: undefined (domyślnie JSON)

              // Development — czytelny format
              transport: process.env.NODE_ENV === 'development'
                ? { target: 'pino-pretty', options: { colorize: true, translateTime: 'SYS:HH:MM:ss' } }
                : undefined,

              // Redaktuj wrażliwe pola
              redact: {
                paths: ['req.headers.authorization', 'req.body.password', '*.creditCard'],
                censor: '[REDACTED]'
              }
            }
          })

          // Logowanie w handlerach
          fastify.get('/users/:id', async (request, reply) => {
            request.log.info({ userId: (request.params as any).id }, 'Fetching user')
            request.log.warn('User not in cache')
            request.log.error({ err: new Error('DB timeout') }, 'Database error')
            return { id: 1 }
          })
        desc: Konfiguracja Pino loggera
        detail:
          what: Fastify ma wbudowany Pino — najszybszy Node.js logger. redact ukrywa wrażliwe dane z logów. request.log jest bound loggingiem z reqId — śledź request przez wszystkie logi.
          how: "Pino poziomy: trace, debug, info, warn, error, fatal. request.log vs fastify.log — request.log ma reqId, fastify.log to global logger."
