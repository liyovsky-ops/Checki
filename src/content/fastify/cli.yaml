  - name: Testowanie
    icon: "🧪"
    commands:
      - cmd: npm install --save-dev vitest @vitest/coverage-v8
        desc: Zainstaluj Vitest do testowania
        detail:
          what: Vitest to najszybszy framework testowy dla Node.js — kompatybilny z Jest API. Idealny z Fastify bo wspiera ESM natywnie.
          how: "vitest run — jednorazowo. vitest watch — tryb watch. vitest --coverage — coverage report."
          tips:
            - 'npm run test — dodaj "test": "vitest run" do package.json scripts'
            - '@vitest/coverage-v8 — szybszy coverage przez V8 zamiast Babel'

      - code: |
          import { describe, it, expect, beforeAll, afterAll } from 'vitest'
          import Fastify from 'fastify'

          // Tworzy nową instancję Fastify per test suite
          function buildApp() {
            const app = Fastify({ logger: false })

            app.get('/health', async () => ({ status: 'ok' }))
            app.post('/users', async (req, reply) => {
              reply.code(201)
              return { id: '1', ...req.body as object }
            })

            return app
          }

          describe('API Tests', () => {
            let app: ReturnType<typeof buildApp>

            beforeAll(async () => {
              app = buildApp()
              await app.ready()
            })

            afterAll(async () => {
              await app.close()
            })

            it('GET /health returns ok', async () => {
              const response = await app.inject({
                method: 'GET',
                url: '/health'
              })
              expect(response.statusCode).toBe(200)
              expect(response.json()).toEqual({ status: 'ok' })
            })

            it('POST /users creates user', async () => {
              const response = await app.inject({
                method: 'POST',
                url: '/users',
                payload: { name: 'Jan', email: 'jan@test.com' }
              })
              expect(response.statusCode).toBe(201)
              const body = response.json()
              expect(body.name).toBe('Jan')
            })
          })
        desc: "app.inject() — testy bez uruchamiania serwera"
        detail:
          what: app.inject() to wbudowany test client Fastify — wysyła request bezpośrednio do handlera bez TCP. Szybkie, izolowane testy bez portu. response.json() parsuje JSON body.
          how: "inject({ method, url, payload, headers, query }) — pełna kontrola. response.statusCode, response.json(), response.headers — wyniki."
          tips:
            - 'logger: false w testach — bez zaśmiecania output testów logami'
            - 'await app.ready() — czeka na załadowanie wszystkich pluginów przed testami'
            - 'Nowa instancja per test file — izolacja, bez shared state'

  - name: "Oficjalne pluginy — instalacja"
