      - code: |
          import Fastify from 'fastify'

          const fastify = Fastify({ logger: true })

          // Cache w pamięci — proste i szybkie
          const cache = new Map<string, { data: unknown; expires: number }>()

          function getCached<T>(key: string): T | null {
            const entry = cache.get(key)
            if (!entry || Date.now() > entry.expires) {
              cache.delete(key)
              return null
            }
            return entry.data as T
          }

          function setCached(key: string, data: unknown, ttlMs = 60_000) {
            cache.set(key, { data, expires: Date.now() + ttlMs })
          }

          // Route z cache
          fastify.get('/api/products', {
            schema: {
              response: {
                200: {
                  type: 'array',
                  items: {
                    type: 'object',
                    properties: {
                      id: { type: 'string' },
                      name: { type: 'string' },
                      price: { type: 'number' }
                    }
                  }
                }
              }
            }
          }, async (request, reply) => {
            const cacheKey = 'products:all'
            const cached = getCached<unknown[]>(cacheKey)

            if (cached) {
              reply.header('X-Cache', 'HIT')
              return cached
            }

            // Symulacja DB query
            const products = [{ id: '1', name: 'Widget', price: 9.99 }]
            setCached(cacheKey, products, 60_000)  // 1 minuta

            reply.header('X-Cache', 'MISS')
            return products
          })

          await fastify.listen({ port: 3000 })
        desc: "In-memory cache — Map z TTL"
        detail:
          what: Prosty cache w Map z TTL (time-to-live). X-Cache header informuje klienta czy trafił w cache. Dla wielu instancji użyj @fastify/redis zamiast Map.
          how: setCached z ttlMs w milisekundach. getCached usuwa wygasłe wpisy przy odczycie (lazy eviction). Brak periodicowego cleanup — dla małych cache.
          tips:
            - 'Dla produkcji z wieloma instancjami: Redis (fastify.redis.get/setex) — współdzielony cache'
            - '@fastify/rate-limit ma wbudowany Redis store — ten sam klient dla rate limit i cache'

      - code: |
          // Streaming dużych danych bez bufferowania w pamięci
          import Fastify from 'fastify'
          import { pipeline } from 'stream/promises'
          import { createReadStream } from 'fs'
          import { createGzip } from 'zlib'

          const fastify = Fastify()

          // Streaming pliku z kompresją gzip
          fastify.get('/export/data.json.gz', async (request, reply) => {
            const filePath = './data/large-export.json'

            reply
              .header('Content-Type', 'application/gzip')
              .header('Content-Disposition', 'attachment; filename="data.json.gz"')

            // Pipe: plik → gzip → response
            const fileStream = createReadStream(filePath)
            const gzipStream = createGzip()

            reply.send(fileStream.pipe(gzipStream))
          })

          // Streaming z generatorem — brak bufferowania wyniku
          fastify.get('/stream/events', async (request, reply) => {
            reply.header('Content-Type', 'text/event-stream')
            reply.header('Cache-Control', 'no-cache')
            reply.header('Connection', 'keep-alive')

            const { Readable } = await import('stream')

            const stream = new Readable({ read() {} })
            reply.send(stream)

            let i = 0
            const interval = setInterval(() => {
              stream.push(`data: ${JSON.stringify({ event: i++, time: Date.now() })}\n\n`)
              if (i > 10) {
                clearInterval(interval)
                stream.push(null)  // koniec streamu
              }
            }, 1000)
          })

          await fastify.listen({ port: 3000 })
        desc: Streaming — pliki i SSE bez bufferowania
        detail:
          what: reply.send(stream) streamuje bez buforowania w pamięci. Pipe przez gzip kompresuje w locie. SSE przez Readable stream — klient dostaje eventy w czasie rzeczywistym.
          how: "Readable stream: push(data) wysyła chunk. push(null) = koniec. Fastify automatycznie obsługuje backpressure."
          tips:
            - 'Streaming niezbędny dla plików >50MB — bufferowanie = crash z OOM'
            - 'text/event-stream + Cache-Control: no-cache = standardowe SSE headers'

