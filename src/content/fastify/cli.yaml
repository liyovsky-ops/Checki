  - name: "@fastify/swagger — OpenAPI docs"
    icon: "📄"
    commands:
      - code: |
          import Fastify from 'fastify'
          import swagger from '@fastify/swagger'
          import swaggerUI from '@fastify/swagger-ui'

          const fastify = Fastify({ logger: true })

          // Rejestruj PRZED trasami
          await fastify.register(swagger, {
            openapi: {
              info: {
                title: 'My API',
                description: 'Dokumentacja API',
                version: '1.0.0'
              },
              servers: [
                { url: 'http://localhost:3000', description: 'Development' },
                { url: 'https://api.myapp.com', description: 'Production' }
              ],
              components: {
                securitySchemes: {
                  Bearer: {
                    type: 'http',
                    scheme: 'bearer',
                    bearerFormat: 'JWT'
                  }
                }
              }
            }
          })

          await fastify.register(swaggerUI, {
            routePrefix: '/documentation',
            uiConfig: { docExpansion: 'list', deepLinking: true }
          })

          // Trasa z tagami i security w schema
          fastify.post('/users', {
            schema: {
              tags: ['Users'],
              summary: 'Utwórz nowego użytkownika',
              security: [{ Bearer: [] }],
              body: {
                type: 'object',
                required: ['name', 'email'],
                properties: {
                  name: { type: 'string' },
                  email: { type: 'string', format: 'email' }
                }
              },
              response: {
                201: {
                  description: 'Użytkownik utworzony',
                  type: 'object',
                  properties: { id: { type: 'string' }, name: { type: 'string' } }
                }
              }
            }
          }, async (req, reply) => {
            reply.code(201)
            return { id: crypto.randomUUID(), ...(req.body as object) }
          })

          await fastify.listen({ port: 3000 })
          // Dokumentacja pod: http://localhost:3000/documentation
        desc: "@fastify/swagger + swagger-ui — automatyczna dokumentacja"
        detail:
          what: "@fastify/swagger generuje /documentation/json i /documentation/yaml (OpenAPI spec). @fastify/swagger-ui renderuje interaktywny UI. Schematy tras = automatyczna dokumentacja."
          how: "tags w schema groupują endpointy. security deklaruje wymagania auth per endpoint. summary i description pojawiają się w UI."
          tips:
            - 'Dokumentacja jest automatyczna — zero ręcznego pisania YAML jeśli masz JSON Schema'
            - 'hideUntagged: true w swagger-ui config — ukryj nieoznakowane endpointy'

  - name: "@fastify/cors i @fastify/rate-limit"
    icon: "🌐"
    commands:
      - code: |
          import Fastify from 'fastify'
          import cors from '@fastify/cors'
          import rateLimit from '@fastify/rate-limit'

          const fastify = Fastify()

          // CORS — konfiguracja produkcyjna
          await fastify.register(cors, {
            origin: (origin, cb) => {
              const allowed = ['https://myapp.com', 'https://admin.myapp.com']
              if (!origin || allowed.includes(origin)) {
                cb(null, true)
              } else {
                cb(new Error('Not allowed by CORS'), false)
              }
            },
            methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS'],
            allowedHeaders: ['Content-Type', 'Authorization', 'X-Request-Id'],
            exposedHeaders: ['X-Request-Id', 'X-Response-Time'],
            credentials: true,
            maxAge: 600
          })

          // Rate limiting globalne
          await fastify.register(rateLimit, {
            max: 100,
            timeWindow: '1 minute',
            keyGenerator: (request) => {
              return request.headers['x-real-ip'] as string
                ?? request.headers['x-forwarded-for'] as string
                ?? request.ip
            },
            errorResponseBuilder: (request, context) => ({
              code: 429,
              error: 'Too Many Requests',
              message: `Rate limit exceeded. Retry after ${context.after}`,
              retryAfter: context.after
            })
          })

          // Osobny limit dla auth endpoints
          fastify.post('/auth/login', {
            config: {
              rateLimit: { max: 5, timeWindow: '15 minutes' }  // surowiej dla loginu
            }
          }, async (req, reply) => {
            return { token: 'jwt-here' }
          })
        desc: "CORS + Rate Limiting — konfiguracja produkcyjna"
        detail:
          what: "cors z funkcją origin — dynamiczne sprawdzanie na białej liście. rateLimit z keyGenerator — właściwy IP za proxy/load balancer. Per-route config przez config.rateLimit."
          how: "maxAge: 600 — przeglądarka cachuje preflight 10 minut. credentials: true wymagane dla cookies cross-origin. keyGenerator używa X-Real-IP za nginx."
          tips:
            - 'credentials: true + origin: "*" — nie działa — musisz podać konkretne originy'
            - 'Per-route rate limit: config: { rateLimit: { max: 5 } } — nadpisuje globalny limit'

  - name: Middleware i autoryzacja
    icon: "🛡️"
    commands:
      - code: |
          import Fastify from 'fastify'
          import fp from 'fastify-plugin'

          const fastify = Fastify()

          // Role-based access control
          const authPlugin = fp(async (fastify) => {
            fastify.decorate('authenticate', async (req: any, reply: any) => {
              const token = req.headers.authorization?.slice(7)
              if (!token) return reply.code(401).send({ error: 'No token' })
              // verify token...
              req.user = { id: '1', role: 'user' }
            })

            fastify.decorate('requireRole', (role: string) => async (req: any, reply: any) => {
              await fastify.authenticate(req, reply)
              if (req.user?.role !== role) {
                return reply.code(403).send({ error: `Requires ${role} role` })
              }
            })
          })

          await fastify.register(authPlugin)

          // Użycie
          fastify.get('/profile', {
            preHandler: [fastify.authenticate]
          } as any, async (req: any) => ({ user: req.user }))

          fastify.get('/admin/stats', {
            preHandler: [fastify.requireRole('admin')]
          } as any, async () => ({ stats: {} }))
        desc: Role-based authorization — decorate pattern
        detail:
          what: requireRole factory zwraca middleware z zamkniętą rolą. fastify.requireRole('admin') = async funkcja preHandler. Czyste i wielokrotnego użytku.
          how: preHandler jako tablica — [fastify.authenticate, checkPermission] — oba wykonają się sekwencyjnie. Pierwszy błąd zatrzymuje chain.
          tips:
            - 'Dekorator z parametrem (factory): decorate("requireRole", (role) => async (req, reply) => {})'
            - 'Dla bardziej złożonego RBAC: fastify-acl-auth lub własna implementacja z role hierarchy'

      - code: |
          import Fastify from 'fastify'

          const fastify = Fastify()

          // Middleware — request timing
          fastify.addHook('onRequest', async (request, reply) => {
            (request as any).startTime = process.hrtime.bigint()
          })

          fastify.addHook('onResponse', async (request, reply) => {
            const start = (request as any).startTime as bigint
            const durationNs = process.hrtime.bigint() - start
            const durationMs = Number(durationNs) / 1_000_000

            request.log.info({
              method: request.method,
              url: request.url,
              statusCode: reply.statusCode,
              durationMs: durationMs.toFixed(3)
            }, 'Request finished')
          })

          // Context propagation — request-scoped data
          fastify.decorateRequest('ctx', null)

          fastify.addHook('preHandler', async (request) => {
            (request as any).ctx = {
              requestId: request.id,
              userId: null,
              startTime: Date.now()
            }
          })
        desc: Timing middleware + context propagation
        detail:
          what: process.hrtime.bigint() = nanosecond precision timing. Context object na request — przekazuj dane (userId, requestId) przez cały lifecycle bez globals.
          how: decorateRequest('ctx', null) deklaruje właściwość. preHandler wypełnia. Handler czyta. Izolowany per-request — bezpieczny w concurrent środowisku.
          tips:
            - 'process.hrtime.bigint() dokładniejszy od Date.now() — BigInt, nie float'
            - 'request.ctx jako typed interface — declare module "fastify" {} dla type safety'

  - name: Error handling
    icon: "⚠️"
    commands:
      - code: |
          import Fastify, { FastifyError } from 'fastify'

          const fastify = Fastify()

          // Własne klasy błędów
          class NotFoundError extends Error {
            statusCode = 404
            constructor(resource: string, id: string) {
              super(`${resource} with id ${id} not found`)
              this.name = 'NotFoundError'
            }
          }

          class ValidationError extends Error {
            statusCode = 422
            constructor(
              message: string,
              public fields: Record<string, string>
            ) {
              super(message)
              this.name = 'ValidationError'
            }
          }

          // Globalny handler błędów
          fastify.setErrorHandler(async (error: FastifyError & { fields?: Record<string, string> }, request, reply) => {
            // Błędy walidacji Fastify (JSON Schema)
            if (error.validation) {
              return reply.code(400).send({
                error: 'Validation Failed',
                details: error.validation.map(v => ({
                  field: v.instancePath.slice(1),
                  message: v.message
                }))
              })
            }

            // Własne błędy z statusCode
            if (error.statusCode && error.statusCode < 500) {
              return reply.code(error.statusCode).send({
                error: error.name,
                message: error.message,
                ...(error.fields && { fields: error.fields })
              })
            }

            // 500 — nie ujawniaj detali
            request.log.error({ err: error }, 'Unhandled error')
            return reply.code(500).send({ error: 'Internal Server Error' })
          })

          fastify.get('/users/:id', async (req, reply) => {
            const { id } = req.params as { id: string }
            const user = null  // symulacja braku w DB
            if (!user) throw new NotFoundError('User', id)
            return user
          })
        desc: Customowe klasy błędów + globalny handler
        detail:
          what: Klasy błędów z statusCode — jeden throw, setErrorHandler formatuje odpowiedź. error.validation — błędy JSON Schema od Fastify. Czytelny format dla klienta.
          how: "throw new NotFoundError(...) w handlerze → setErrorHandler → reply.code(404). Nie potrzebujesz try/catch w każdym handlerze."
          tips:
            - 'statusCode na klasie błędu — konwencja Fastify, nie standard Node.js Error'
            - 'Loguj error.stack tylko dla 5xx — nie loguj 4xx jako błędy (to normalny flow)'

  - name: Deployment i produkcja
    icon: "🚢"
    commands:
      - cmd: node --max-old-space-size=512 dist/server.js
        desc: Uruchom Fastify z limitem pamięci
        detail:
          what: --max-old-space-size ustawia limit heap Node.js w MB. Bez limitu Node.js może zużyć całą dostępną RAM i zostać zabity przez OOM killer.
          how: Dla kontenera 512MB RAM ustaw --max-old-space-size=400 (80%) — zostaw margines dla OS i innych procesów.
          tips:
            - 'Ustaw limit na 75-80% dostępnej RAM kontenera'
            - 'NODE_OPTIONS="--max-old-space-size=512" — przez zmienną środowiskową'

      - cmd: "fastify start --options -- src/app.js"
        desc: Uruchom przez fastify-cli
        detail:
          what: fastify-cli startuje aplikację eksportującą Fastify instance lub factory. Zarządza procesem, logowaniem i graceful shutdown.
          how: "src/app.js musi eksportować: async function (fastify, opts) {} lub Fastify instance. fastify-cli wstrzykuje dodatkowe pluginy."
          tips:
            - '"start": "fastify start src/app.js" — w package.json scripts'
            - '--port 8080 --address 0.0.0.0 --log-level info — opcje CLI'

      - code: |
          # Dockerfile dla Fastify
          FROM node:22-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --only=production

          FROM node:22-alpine AS runtime
          WORKDIR /app
          COPY --from=builder /app/node_modules ./node_modules
          COPY dist/ ./dist/
          COPY package.json ./

          ENV NODE_ENV=production
          ENV LOG_LEVEL=info

          EXPOSE 3000

          USER node

          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s \
            CMD wget -qO- http://localhost:3000/health || exit 1

          CMD ["node", "--max-old-space-size=400", "dist/server.js"]
        desc: Dockerfile dla Fastify (production)
        detail:
          what: Multi-stage build — builder instaluje zależności, runtime kopiuje tylko production node_modules. USER node — nie root. HEALTHCHECK — K8s/Docker sprawdza /health.
          how: npm ci --only=production pomija devDependencies. Alpine image jest minimalne. dist/ zawiera skompilowany TypeScript.
          tips:
            - 'Dodaj /health endpoint przed rejestracją pluginów — dostępny zawsze, bez auth'
            - 'USER node — nigdy nie uruchamiaj Node.js jako root w kontenerze'

      - code: |
          // Cluster mode — wykorzystaj wszystkie CPU cores
          import cluster from 'cluster'
          import os from 'os'

          if (cluster.isPrimary) {
            const numCPUs = os.cpus().length
            console.log(`Master ${process.pid} — forking ${numCPUs} workers`)

            for (let i = 0; i < numCPUs; i++) {
              cluster.fork()
            }

            cluster.on('exit', (worker, code) => {
              console.log(`Worker ${worker.process.pid} died (${code}) — restarting`)
              cluster.fork()  // auto-restart
            })
          } else {
            // Worker — uruchom serwer Fastify
            const { default: fastify } = await import('./app.js')
            await fastify.listen({ port: 3000, host: '0.0.0.0' })
            console.log(`Worker ${process.pid} started`)
          }
        desc: Cluster mode — wiele CPU cores
        detail:
          what: Node.js jest single-threaded — cluster fork() uruchamia wiele procesów Worker, każdy na swoim CPU. Na 4-core maszynie masz 4x throughput.
          how: Procesy Worker współdzielą port TCP (OS load balancuje). Auto-restart martwych workerów. Alternatywa — PM2 cluster mode bez pisania cluster kodu.
          tips:
            - 'pm2 start dist/server.js -i max — PM2 zarządza clusterem automatycznie'
            - 'W K8s/Docker nie potrzebujesz cluster — skaluj przez replicas zamiast'

  - name: Testowanie — zaawansowane
    icon: "🧪"
    commands:
      - code: |
          import { describe, it, expect, beforeEach, afterEach } from 'vitest'
          import fp from 'fastify-plugin'
          import Fastify from 'fastify'

          // Mock DB plugin dla testów
          const mockDb = fp(async (fastify) => {
            const users = [
              { id: '1', name: 'Jan', email: 'jan@test.com' },
              { id: '2', name: 'Anna', email: 'anna@test.com' }
            ]

            fastify.decorate('db', {
              users: {
                findAll: async () => users,
                findById: async (id: string) => users.find(u => u.id === id) ?? null,
                create: async (data: { name: string; email: string }) => ({
                  id: crypto.randomUUID(),
                  ...data
                })
              }
            })
          })

          // Buduje aplikację z mock dependencies
          async function buildTestApp() {
            const app = Fastify({ logger: false })
            await app.register(mockDb)
            // Zarejestruj trasy
            app.get('/users', async (req) => {
              return await (app as any).db.users.findAll()
            })
            await app.ready()
            return app
          }

          describe('Users API', () => {
            let app: Awaited<ReturnType<typeof buildTestApp>>

            beforeEach(async () => { app = await buildTestApp() })
            afterEach(async () => { await app.close() })

            it('GET /users returns all users', async () => {
              const res = await app.inject({ method: 'GET', url: '/users' })
              expect(res.statusCode).toBe(200)
              const body = res.json()
              expect(body).toHaveLength(2)
              expect(body[0]).toHaveProperty('name', 'Jan')
            })
          })
        desc: Testy z mock plugin — izolacja zależności
        detail:
          what: Mock plugin zastępuje prawdziwą bazę danych w testach. buildTestApp() tworzy izolowaną instancję per test. beforeEach/afterEach — świeży stan dla każdego testu.
          how: fp() mock plugin rejestruje dane testowe zamiast prawdziwego DB. app.close() w afterEach czyści zasoby i onClose hooks.
          tips:
            - 'Nowa instancja Fastify per test — izolacja stanu (nie globalny serwer)'
            - 'Mock data jako stałe — deterministyczne testy, nie zależne od kolejności'

      - code: |
          import { describe, it, expect } from 'vitest'
          import Fastify from 'fastify'

          // Testowanie walidacji JSON Schema
          async function buildApp() {
            const app = Fastify({ logger: false })

            app.post('/users', {
              schema: {
                body: {
                  type: 'object',
                  required: ['name', 'email'],
                  properties: {
                    name: { type: 'string', minLength: 2 },
                    email: { type: 'string', format: 'email' },
                    age: { type: 'integer', minimum: 18 }
                  },
                  additionalProperties: false
                }
              }
            }, async (req, reply) => {
              reply.code(201)
              return { id: '1', ...req.body as object }
            })

            await app.ready()
            return app
          }

          describe('Validation', () => {
            it('rejects missing required fields', async () => {
              const app = await buildApp()
              const res = await app.inject({
                method: 'POST', url: '/users',
                payload: { name: 'Jan' }  // brak email
              })
              expect(res.statusCode).toBe(400)
              await app.close()
            })

            it('rejects invalid email format', async () => {
              const app = await buildApp()
              const res = await app.inject({
                method: 'POST', url: '/users',
                payload: { name: 'Jan', email: 'not-email' }
              })
              expect(res.statusCode).toBe(400)
              await app.close()
            })

            it('rejects underage users', async () => {
              const app = await buildApp()
              const res = await app.inject({
                method: 'POST', url: '/users',
                payload: { name: 'Jan', email: 'jan@test.com', age: 16 }
              })
              expect(res.statusCode).toBe(400)
              await app.close()
            })
          })
        desc: Testowanie walidacji — edge cases
        detail:
          what: Testuj nie tylko happy path — sprawdź że walidacja działa dla każdego wymagania. Osobny test per reguła — czytelny output gdy coś się psuje.
          how: app.inject() z nieprawidłowymi payloadami. expect(res.statusCode).toBe(400) — Fastify zwraca 400 dla błędów walidacji JSON Schema.
          tips:
            - 'Testuj additionalProperties: false — wyślij dodatkowe pole i sprawdź czy odrzucone'
            - 'Testuj każdy format (email, uuid, date) — to regresja przed zmianami schematu'

