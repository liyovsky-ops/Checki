  - name: Wzorce architektoniczne
    icon: "🏗️"
    commands:
      - code: |
          // Struktura projektu Fastify — Clean Architecture
          // src/
          //   app.ts              — Fastify instance + register plugins
          //   server.ts           — listen() + graceful shutdown
          //   plugins/
          //     config.ts         — @fastify/env — zmienne środowiskowe
          //     db.ts             — połączenie z bazą + fastify.db
          //     jwt.ts            — @fastify/jwt + fastify.authenticate
          //     swagger.ts        — @fastify/swagger + @fastify/swagger-ui
          //     sensible.ts       — @fastify/sensible
          //   routes/
          //     v1/
          //       users/
          //         index.ts      — GET /api/v1/users, POST /api/v1/users
          //         schema.ts     — JSON Schema / TypeBox schemas
          //         handler.ts    — logika handlerów
          //       products/
          //         index.ts
          //   schemas/            — współdzielone addSchema() definicje
          //     user.schema.ts
          //     pagination.schema.ts
          //   types/
          //     fastify.d.ts      — declaration merging
          //   test/
          //     unit/
          //     integration/

          // src/app.ts
          import Fastify from 'fastify'
          import autoload from '@fastify/autoload'
          import { join } from 'path'

          export function buildApp() {
            const app = Fastify({ logger: true })

            // Pluginy ładują się z plugins/ — fp() dekoratory widoczne globalnie
            app.register(autoload, { dir: join(__dirname, 'plugins') })

            // Trasy ładują się po pluginach
            app.register(autoload, {
              dir: join(__dirname, 'routes'),
              options: { prefix: '/api' }
            })

            return app
          }
        desc: Struktura projektu Fastify — Clean Architecture
        detail:
          what: "Oficjalna zalecana struktura: plugins/ = współdzielone serwisy (fp()), routes/ = trasy z autoload. Separacja concerns — schema, handler, route registration."
          how: autoload ładuje plugins/ PRZED routes/ — pluginy muszą być gotowe zanim trasy ich użyją. Zrób buildApp() jako factory — łatwe testowanie.
          tips:
            - 'buildApp() zamiast globalnego fastify — możesz tworzyć wiele instancji w testach'
            - 'Eksportuj app z buildApp() bez listen() — serwer startuje w server.ts'

      - code: |
          // Repository pattern z Fastify
          import { FastifyInstance } from 'fastify'
          import fp from 'fastify-plugin'

          // Interface repozytorium
          interface UserRepository {
            findAll(opts: { page: number; limit: number }): Promise<User[]>
            findById(id: string): Promise<User | null>
            create(data: CreateUser): Promise<User>
            update(id: string, data: Partial<User>): Promise<User | null>
            delete(id: string): Promise<boolean>
          }

          interface User { id: string; name: string; email: string; createdAt: Date }
          interface CreateUser { name: string; email: string }

          // Implementacja repozytorium
          function createUserRepository(db: any): UserRepository {
            return {
              findAll: async ({ page, limit }) => {
                const offset = (page - 1) * limit
                const result = await db.query(
                  'SELECT * FROM users ORDER BY created_at DESC LIMIT $1 OFFSET $2',
                  [limit, offset]
                )
                return result.rows
              },
              findById: async (id) => {
                const result = await db.query('SELECT * FROM users WHERE id = $1', [id])
                return result.rows[0] ?? null
              },
              create: async (data) => {
                const result = await db.query(
                  'INSERT INTO users (name, email) VALUES ($1, $2) RETURNING *',
                  [data.name, data.email]
                )
                return result.rows[0]
              },
              update: async (id, data) => {
                const fields = Object.keys(data).map((k, i) => `${k} = $${i + 2}`).join(', ')
                const result = await db.query(
                  `UPDATE users SET ${fields} WHERE id = $1 RETURNING *`,
                  [id, ...Object.values(data)]
                )
                return result.rows[0] ?? null
              },
              delete: async (id) => {
                const result = await db.query('DELETE FROM users WHERE id = $1', [id])
                return (result.rowCount ?? 0) > 0
              }
            }
          }

          // Plugin rejestrujący repository
          export default fp(async (fastify: FastifyInstance) => {
            fastify.decorate('userRepo', createUserRepository((fastify as any).db))
          })
        desc: Repository pattern z Fastify decorate
        detail:
          what: Repository interface + implementacja + plugin rejestrujący. fastify.userRepo dostępne w trasach. Łatwe mockowanie w testach — podmień implementację.
          how: "createUserRepository(db) — dependency injection przez parametr (nie global). Plugin fp() = fastify.userRepo widoczne globalnie."
          tips:
            - 'Interface UserRepository — mock implementacja w testach to stub z prostymi tablicami'
            - 'Oddziel interface od implementacji — łatwa migracja ORM lub zmiana bazy'

      - cmd: npm run build && npm run start
        desc: Kompilacja TypeScript i uruchomienie produkcji
        detail:
          what: '"build": "tsc" kompiluje TypeScript do dist/. "start": "node dist/server.js" uruchamia skompilowany JavaScript. Bez tsx/ts-node na produkcji.'
          how: tsc używa tsconfig.json. Wyjście w dist/ z .js, .d.ts i .map. node dist/server.js — czysty JavaScript bez runtime TypeScript overhead.
          tips:
            - 'Dodaj "clean": "rm -rf dist" przed build — uniknij starych plików w dist/'
            - 'scripts: { "build": "tsc", "start": "node dist/server.js", "dev": "tsx watch src/server.ts" }'

  - name: Wydajność i optymalizacja
    icon: "⚡"
    commands:
      - code: |
          import Fastify from 'fastify'

          // Fastify z wyłączonym parsowaniem body gdy niepotrzebne
          const fastify = Fastify({
            logger: false,  // wyłącz w benchmarkach
            trustProxy: true  // gdy za reverse proxy
          })

          // content-type-parser tylko dla JSON — pomiń inne
          fastify.addContentTypeParser('*', (request, payload, done) => {
            done(null, null)  // ignoruj inne content-type
          })

          // Fastify serializuje response przez JSON Schema (Ajv) — 2x szybsze niż JSON.stringify
          fastify.get('/data', {
            schema: {
              response: {
                200: {
                  type: 'object',
                  properties: {
                    id: { type: 'integer' },
                    name: { type: 'string' },
                    timestamp: { type: 'integer' }
                  }
                }
              }
            }
          }, async () => {
            return { id: 1, name: 'test', timestamp: Date.now() }
          })
        desc: Optymalizacja wydajności — serializer i parser
        detail:
          what: "Schema w response aktywuje szybki serializer Ajv — do 2x szybszy niż JSON.stringify. addContentTypeParser('*') odfiltrowuje nieznane content-type zamiast parsowania."
          how: Pino logger ma ~20% overhead w benchmarkach — wyłącz w testach wydajności. Na produkcji logger jest niezbędny.
          tips:
            - 'Schema response = obowiązkowe dla hot paths — wpływ na każdy request'
            - 'trustProxy: true — gdy za nginx/ALB — poprawia request.ip i protokół'

