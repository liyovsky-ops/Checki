title: Ekosystem Fastify

items:
  - name: "@fastify/jwt"
    desc: "JWT autentykacja dla Fastify. fastify.jwt.sign(), fastify.jwt.verify(), request.jwtVerify(). Obsługuje HS256, RS256, ES256. Integruje się z reply.jwtSign() i preHandler."
    icon: "🔑"
  - name: "@fastify/cors"
    desc: "CORS middleware dla Fastify. Konfiguracja origin, methods, headers, credentials, maxAge. Wsparcie dla funkcji origin z dynamicznym sprawdzaniem. Zastąpienie dla cors npm z Express."
    icon: "🌐"
  - name: "@fastify/multipart"
    desc: "Upload plików przez multipart/form-data. Streaming upload — pliki nie lądują w pamięci. request.file() dla jednego pliku, request.files() dla wielu. Integracja z busboy."
    icon: "📁"
  - name: "@fastify/static"
    desc: "Serwowanie plików statycznych (HTML, CSS, JS, obrazy). fastify.register(fastifyStatic, { root, prefix }). Automatyczny index.html, etag, cache-control. Dla SPA — wildcard catch-all."
    icon: "📂"
  - name: "@fastify/swagger"
    desc: "Automatyczna dokumentacja OpenAPI/Swagger z JSON Schema tras. Generuje spec bez ręcznego pisania YAML. Integruje z @fastify/swagger-ui dla interaktywnej dokumentacji w przeglądarce."
    icon: "📄"
  - name: "@fastify/swagger-ui"
    desc: "Interaktywny UI dla Swagger dokumentacji. Montuje Swagger UI pod /documentation. Działa z @fastify/swagger — razem dają pełne auto-generated API docs."
    icon: "🖥️"
  - name: "@fastify/rate-limit"
    desc: "Rate limiting per IP lub per użytkownik. Konfiguracja max requestów i timeWindow. Redis store dla wielu instancji. Nagłówki X-RateLimit-Limit, X-RateLimit-Remaining, Retry-After."
    icon: "🚦"
  - name: "@fastify/session"
    desc: "Session management przez cookie. Współpracuje z session stores (Redis, Memcached, PostgreSQL). httpOnly, secure, sameSite cookies. Alternatywa dla JWT gdy potrzebujesz server-side sessions."
    icon: "🍪"
  - name: "@fastify/autoload"
    desc: "Automatyczne ładowanie pluginów i tras z katalogów. Eliminuje ręczne register() dla każdego pliku. Konwencja: plugins/ = pluginy, routes/ = trasy z automatycznym prefixingiem."
    icon: "⚙️"
  - name: "@fastify/helmet"
    desc: "Security headers dla Fastify (odpowiednik Express helmet). Content-Security-Policy, HSTS, X-Frame-Options, X-XSS-Protection i inne. Jedna linia — 11 nagłówków bezpieczeństwa."
    icon: "🛡️"
  - name: "@fastify/compress"
    desc: "Kompresja gzip/deflate/brotli dla response. Automatyczna negocjacja przez Accept-Encoding. Threshold — minimalny rozmiar do kompresji. Streaming kompresja bez bufferowania w pamięci."
    icon: "📦"
  - name: "@fastify/env"
    desc: "Walidacja zmiennych środowiskowych przez JSON Schema. Dekoruje fastify.config z typowanymi zmiennymi. Rzuca błąd przy starcie jeśli wymagane ENV brakuje — fail fast pattern."
    icon: "🔧"
  - name: "@fastify/redis"
    desc: "Klient Redis (ioredis) jako dekorator fastify.redis. Automatyczne zamknięcie połączenia przy shutdown (onClose hook). Wsparcie dla Redis Cluster i Sentinel."
    icon: "🔴"
  - name: "@fastify/postgres"
    desc: "Klient PostgreSQL (pg) jako dekorator fastify.pg. Pool connections automatycznie. fastify.pg.query() i fastify.pg.connect() dla transakcji. Zamknięcie poola przy shutdown."
    icon: "🐘"
  - name: "@fastify/websocket"
    desc: "WebSocket support dla Fastify przez ws library. Trasy WebSocket rejestrujesz przez { websocket: true } w opcjach. connection.socket — natywny WebSocket. Działa obok normalnych tras HTTP."
    icon: "🔌"
  - name: "fastify-type-provider-zod"
    desc: "Type provider integrujący Zod z Fastify. validatorCompiler i serializerCompiler. withTypeProvider<ZodTypeProvider>() daje pełną type safety bez zodToJsonSchema."
    icon: "✅"
  - name: "@fastify/type-provider-typebox"
    desc: "TypeBox type provider dla Fastify. withTypeProvider<TypeBoxTypeProvider>() — JSON Schema i TypeScript types z jednego Type.Object(). Najszybsza walidacja (Ajv + TypeBox precompiled)."
    icon: "🔷"
  - name: "@sinclair/typebox"
    desc: "Biblioteka do tworzenia JSON Schema z TypeScript types. Type.Object(), Type.String(), Type.Number(). Static<typeof Schema> = TypeScript interface. Preferowane w projektach TypeScript z Fastify."
    icon: "📝"
