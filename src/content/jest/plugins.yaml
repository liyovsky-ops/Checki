title: Ekosystem Jest

items:
  - name: "@testing-library/react"
    desc: Testuj komponenty React z perspektywy użytkownika. render, screen, fireEvent, waitFor. Standard w React testing.
    icon: "⚛️"
  - name: "@testing-library/jest-dom"
    desc: Custom matchery DOM dla Jest — toBeVisible, toBeDisabled, toHaveTextContent, toHaveAttribute. Czytelniejsze asercje.
    icon: "🎯"
  - name: ts-jest
    desc: Transformer TypeScript dla Jest. Kompiluje .ts/.tsx bezpośrednio w testach. Alternatywa dla babel-jest z @babel/preset-typescript.
    icon: "🔷"
  - name: jest-extended
    desc: Dodatkowe matchery — toBeArray, toBeString, toBeWithin, toContainKey, toSatisfy. Rozszerza wbudowane asercje.
    icon: "➕"
  - name: jest-mock-extended
    desc: Type-safe mocking dla TypeScript — mock<Interface>() tworzy mock z auto-complete. DeepMock dla zagnieżdżonych obiektów.
    icon: "🎭"
  - name: msw (Mock Service Worker)
    desc: Interceptuje HTTP requesty na poziomie network. rest.get('/api/users', ...) — mockuje API bez modyfikacji kodu. Działa w testach i w przeglądarce.
    icon: "🌐"
  - name: jest-when
    desc: Conditional mock returns — when(fn).calledWith(1).mockReturn('one'). Czytelniejsze niż mockImplementation z if/switch.
    icon: "🔀"
  - name: jest-image-snapshot
    desc: Visual regression testing — porównuje screenshoty pixel-by-pixel. toMatchImageSnapshot() z konfigurowanym threshold.
    icon: "📸"
