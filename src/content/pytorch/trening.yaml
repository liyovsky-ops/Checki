title: "Trening"

items:
  - name: "Dataset i DataLoader"
    icon: "📦"
    desc: "Własna klasa Dataset + DataLoader z batchowaniem, shufflem i wielowątkowym ładowaniem danych"
    code: |
      import torch
      from torch.utils.data import Dataset, DataLoader
      import numpy as np

      class CustomDataset(Dataset):
          def __init__(self, data, labels, transform=None):
              self.data = torch.FloatTensor(data)
              self.labels = torch.LongTensor(labels)
              self.transform = transform

          def __len__(self):
              return len(self.data)

          def __getitem__(self, idx):
              sample = self.data[idx]
              label = self.labels[idx]
              if self.transform:
                  sample = self.transform(sample)
              return sample, label

      # Tworzenie DataLoader
      X = np.random.randn(1000, 784).astype(np.float32)
      y = np.random.randint(0, 10, 1000)

      dataset = CustomDataset(X, y)
      train_size = int(0.8 * len(dataset))
      val_size = len(dataset) - train_size
      train_ds, val_ds = torch.utils.data.random_split(dataset, [train_size, val_size])

      train_loader = DataLoader(train_ds, batch_size=32, shuffle=True,
                                num_workers=4, pin_memory=True)
      val_loader   = DataLoader(val_ds, batch_size=64, shuffle=False, num_workers=4)

      # Iteracja
      for batch_X, batch_y in train_loader:
          print(batch_X.shape, batch_y.shape)  # (32, 784), (32,)
          break

  - name: "Optymalizatory"
    icon: "⚙️"
    desc: "SGD, Adam, AdamW — optymalizatory aktualizujące wagi na podstawie gradientów"
    code: |
      import torch.optim as optim

      model = ... # Twój model

      # SGD z momentum i weight decay
      sgd = optim.SGD(
          model.parameters(),
          lr=0.01,
          momentum=0.9,
          weight_decay=1e-4,
          nesterov=True
      )

      # Adam — adaptacyjny learning rate
      adam = optim.Adam(
          model.parameters(),
          lr=1e-3,
          betas=(0.9, 0.999),
          eps=1e-8,
          weight_decay=1e-5
      )

      # AdamW — Adam z poprawnym weight decay (zalecany dla Transformerów)
      adamw = optim.AdamW(
          model.parameters(),
          lr=2e-4,
          weight_decay=0.01
      )

      # Różne LR dla różnych warstw (fine-tuning)
      optimizer = optim.Adam([
          {'params': model.backbone.parameters(), 'lr': 1e-5},  # mniejszy LR dla pre-trained
          {'params': model.head.parameters(), 'lr': 1e-3},      # większy LR dla nowej warstwy
      ])

      # Learning Rate Scheduler
      scheduler = optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=100)
      scheduler = optim.lr_scheduler.ReduceLROnPlateau(optimizer, mode='min', patience=5)
      scheduler = optim.lr_scheduler.OneCycleLR(optimizer, max_lr=1e-3, steps_per_epoch=len(train_loader), epochs=10)

  - name: "Loss Functions"
    icon: "📉"
    desc: "CrossEntropyLoss, MSELoss, BCELoss — funkcje straty dla klasyfikacji, regresji i binarnych problemów"
    code: |
      import torch
      import torch.nn as nn

      # Klasyfikacja wieloklasowa (logity → klasy)
      criterion = nn.CrossEntropyLoss()
      logits = torch.randn(32, 10)        # batch 32, 10 klas
      labels = torch.randint(0, 10, (32,))
      loss = criterion(logits, labels)

      # Klasyfikacja wieloetykietowa (sigmoid + BCE)
      bce = nn.BCEWithLogitsLoss()
      logits_multi = torch.randn(32, 5)
      labels_multi = torch.randint(0, 2, (32, 5)).float()
      loss_bce = bce(logits_multi, labels_multi)

      # Regresja
      mse = nn.MSELoss()
      mae = nn.L1Loss()
      preds = torch.randn(32, 1)
      targets = torch.randn(32, 1)
      loss_mse = mse(preds, targets)

      # Huber Loss (odporna na outliery)
      huber = nn.HuberLoss(delta=1.0)

      # Wagi klas (imbalanced data)
      weights = torch.tensor([1.0, 5.0, 3.0])  # klasa 1 waży 5x więcej
