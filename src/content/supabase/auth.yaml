labels:
  main: Autentykacja użytkowników
  mainLang: typescript

intro:
  title: Auth — gotowe uwierzytelnianie bez serwera
  desc: >
    Supabase Auth to kompletny system autentykacji oparty na JWT.
    Obsługuje email+hasło, magic link, OAuth (Google, GitHub, Apple itd.),
    SMS OTP, SSO/SAML. Tokeny JWT są automatycznie odświeżane przez klienta.
    Kluczowa integracja z RLS — auth.uid() w politykach SQL to ID zalogowanego użytkownika,
    co pozwala izolować dane bez pisania logiki w kodzie aplikacji.

items:
  - name: signUp — rejestracja
    desc: >
      Rejestracja nowego użytkownika emailem i hasłem. Domyślnie Supabase wysyła
      email weryfikacyjny — do developmentu możesz wyłączyć weryfikację w dashboardzie
      (Authentication > Email > Confirm email = off).
    icon: "📝"
    code: |
      const { data, error } = await supabase.auth.signUp({
        email: 'jan@example.com',
        password: 'bezpieczne-haslo-123',
        options: {
          // Dodatkowe dane profilu (trafiają do auth.users metadata)
          data: {
            full_name: 'Jan Kowalski',
            username: 'jankowalski',
          },
        },
      });

      if (error) {
        console.error('Błąd rejestracji:', error.message);
        return;
      }

      // data.user — nowy użytkownik
      // data.session — aktywna sesja (jeśli email nie wymaga potwierdzenia)
      console.log('Zarejestrowano:', data.user?.email);

  - name: signInWithPassword — logowanie
    desc: >
      Logowanie emailem i hasłem. Zwraca sesję (access_token + refresh_token).
      Supabase JS automatycznie zapisuje sesję w localStorage i odświeża tokeny.
    icon: "🔑"
    code: |
      const { data, error } = await supabase.auth.signInWithPassword({
        email: 'jan@example.com',
        password: 'bezpieczne-haslo-123',
      });

      if (error) {
        // Niepoprawne dane, konto nie istnieje itp.
        console.error('Błąd logowania:', error.message);
        return;
      }

      const { user, session } = data;
      console.log('Zalogowano jako:', user.email);
      console.log('Token wygasa:', new Date(session.expires_at! * 1000));

  - name: signInWithOAuth — logowanie społecznościowe
    desc: >
      OAuth z Google, GitHub, Apple, Facebook, Discord i wieloma innymi.
      Przekierowuje na stronę providera, po autoryzacji wraca z sesją.
      Skonfiguruj redirect URL i credentials providera w dashboardzie Supabase.
    icon: "🌐"
    code: |
      // Logowanie przez Google
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: `${window.location.origin}/auth/callback`,
          scopes: 'email profile',
        },
      });

      // Logowanie przez GitHub
      await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: {
          redirectTo: `${window.location.origin}/auth/callback`,
        },
      });

      // Callback w Next.js (app/auth/callback/route.ts)
      import { createClient } from '@/lib/supabase/server';
      import { NextResponse } from 'next/server';

      export async function GET(request: Request) {
        const { searchParams } = new URL(request.url);
        const code = searchParams.get('code');
        const supabase = createClient();

        if (code) {
          await supabase.auth.exchangeCodeForSession(code);
        }

        return NextResponse.redirect(new URL('/dashboard', request.url));
      }

  - name: signInWithOtp — magic link / OTP
    desc: >
      Logowanie bez hasła przez jednorazowy link w mailu (magic link)
      lub kod SMS. Bezpieczniejsze niż hasła — użytkownik nie musi pamiętać hasła.
    icon: "✉️"
    code: |
      // Magic link na email
      const { error } = await supabase.auth.signInWithOtp({
        email: 'jan@example.com',
        options: {
          emailRedirectTo: `${window.location.origin}/auth/callback`,
        },
      });

      // OTP na telefon (SMS) — wymaga konfiguracji providera SMS w dashboardzie
      const { error } = await supabase.auth.signInWithOtp({
        phone: '+48500123456',
      });

      // Weryfikacja kodu SMS
      const { data, error } = await supabase.auth.verifyOtp({
        phone: '+48500123456',
        token: '123456', // 6-cyfrowy kod z SMS
        type: 'sms',
      });

  - name: getUser i getSession — aktualny użytkownik
    desc: >
      getUser() weryfikuje token z serwerem Supabase — bezpieczne do użycia po stronie serwera.
      getSession() czyta z localStorage/cookies — szybsze, ale nie weryfikuje sygnatury JWT.
      Do ochrony tras serwera zawsze używaj getUser().
    icon: "👤"
    code: |
      // getUser() — weryfikuje token z serwerem (bezpieczne)
      const { data: { user }, error } = await supabase.auth.getUser();

      if (!user) {
        // Niezalogowany
        redirect('/login');
      }

      console.log('ID:', user.id);
      console.log('Email:', user.email);
      console.log('Metadata:', user.user_metadata);
      console.log('Provider:', user.app_metadata.provider);

      // getSession() — z lokalnego cache (szybkie, dla UI)
      const { data: { session } } = await supabase.auth.getSession();
      const accessToken = session?.access_token;

  - name: onAuthStateChange — nasłuchiwanie zmian
    desc: >
      Subskrypcja na zmiany stanu uwierzytelnienia — logowanie, wylogowanie, odświeżenie tokenu.
      Idealne do aktualizacji UI w React. Pamiętaj o unsubscribe w cleanup funkcji.
    icon: "🔔"
    code: |
      import { useEffect, useState } from 'react';
      import type { User } from '@supabase/supabase-js';

      function useUser() {
        const [user, setUser] = useState<User | null>(null);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          // Pobierz aktualny stan
          supabase.auth.getUser().then(({ data: { user } }) => {
            setUser(user);
            setLoading(false);
          });

          // Nasłuchuj zmian
          const { data: { subscription } } = supabase.auth.onAuthStateChange(
            (event, session) => {
              setUser(session?.user ?? null);
              // event: SIGNED_IN | SIGNED_OUT | TOKEN_REFRESHED | USER_UPDATED
            }
          );

          // Cleanup — odsubskrybuj przy unmount
          return () => subscription.unsubscribe();
        }, []);

        return { user, loading };
      }

  - name: signOut — wylogowanie
    desc: >
      Wylogowanie usuwa sesję lokalnie i unieważnia token na serwerze.
      Scope 'global' wylogowuje ze wszystkich urządzeń, 'local' tylko z bieżącego.
    icon: "🚪"
    code: |
      // Wylogowanie z bieżącego urządzenia
      const { error } = await supabase.auth.signOut();

      // Wylogowanie ze wszystkich urządzeń (unieważnia wszystkie tokeny)
      const { error } = await supabase.auth.signOut({ scope: 'global' });

      // W Next.js — wylogowanie z Server Action
      'use server';
      import { createClient } from '@/lib/supabase/server';
      import { redirect } from 'next/navigation';

      export async function logout() {
        const supabase = createClient();
        await supabase.auth.signOut();
        redirect('/login');
      }

  - name: RLS z auth.uid() — ochrona danych
    desc: >
      Najważniejsza integracja Auth z bazą danych. auth.uid() w politykach SQL
      zwraca UUID zalogowanego użytkownika. Pozwala pisać polityki izolujące dane
      bez żadnej logiki w kodzie aplikacji.
    icon: "🛡️"
    code: |
      -- Tabela profili połączona z auth.users
      CREATE TABLE profiles (
        id UUID REFERENCES auth.users(id) ON DELETE CASCADE PRIMARY KEY,
        username TEXT UNIQUE,
        bio TEXT,
        updated_at TIMESTAMPTZ DEFAULT NOW()
      );

      ALTER TABLE profiles ENABLE ROW LEVEL SECURITY;

      -- Każdy widzi profile (publiczne)
      CREATE POLICY "Profile są publiczne"
        ON profiles FOR SELECT USING (true);

      -- Tylko właściciel edytuje swój profil
      CREATE POLICY "Właściciel edytuje profil"
        ON profiles FOR UPDATE
        USING (auth.uid() = id);

      -- Automatyczne tworzenie profilu po rejestracji (trigger)
      CREATE FUNCTION public.handle_new_user()
      RETURNS TRIGGER AS $$
      BEGIN
        INSERT INTO public.profiles (id, username)
        VALUES (NEW.id, NEW.raw_user_meta_data->>'username');
        RETURN NEW;
      END;
      $$ LANGUAGE plpgsql SECURITY DEFINER;

      CREATE TRIGGER on_auth_user_created
        AFTER INSERT ON auth.users
        FOR EACH ROW EXECUTE FUNCTION public.handle_new_user();
