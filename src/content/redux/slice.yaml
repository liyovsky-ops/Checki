labels:
  main: createSlice i createAsyncThunk
  mainLang: typescript

intro:
  title: Slice — serce Redux Toolkit
  desc: >
    createSlice() łączy w jednym miejscu to co w klasycznym Redux wymagało 3 osobnych plików:
    typy akcji, action creators i reducer. Podaj nazwę, initialState i reducery —
    RTK generuje wszystko. createAsyncThunk() obsługuje operacje asynchroniczne,
    automatycznie emitując akcje pending/fulfilled/rejected. Razem pokrywają 90%
    potrzeb zarządzania stanem bez pisania boilerplate.

items:
  - title: createSlice — podstawy
    desc: >
      Minimalna konfiguracja slice — name identyfikuje slice w DevTools,
      initialState to wartość startowa, reducers to funkcje modyfikujące stan.
      RTK automatycznie generuje action creators o tych samych nazwach co reducery.
    code: |
      import { createSlice, PayloadAction } from '@reduxjs/toolkit'

      interface UserState {
        name: string
        age:  number
        isAdmin: boolean
      }

      const initialState: UserState = {
        name:    '',
        age:     0,
        isAdmin: false,
      }

      const userSlice = createSlice({
        name: 'user',
        initialState,
        reducers: {
          setName: (state, action: PayloadAction<string>) => {
            state.name = action.payload  // Immer — bezpośrednia "mutacja"
          },
          setAge: (state, action: PayloadAction<number>) => {
            state.age = action.payload
          },
          toggleAdmin: (state) => {
            state.isAdmin = !state.isAdmin
          },
          resetUser: () => initialState,  // zwróć nowy stan zamiast mutować
        },
      })

      // Eksportuj action creators (auto-generowane)
      export const { setName, setAge, toggleAdmin, resetUser } = userSlice.actions
      // Eksportuj reducer do store
      export default userSlice.reducer
    lang: typescript

  - title: createSlice — zagnieżdżone struktury z Immer
    desc: >
      Immer umożliwia naturalne aktualizacje głęboko zagnieżdżonych obiektów.
      Zamiast spreadu na każdym poziomie, piszesz bezpośrednio na właściwościach.
      Immer tworzy nowy obiekt strukturalnie — oryginał jest nienaruszony.
    code: |
      interface CartState {
        items: Array<{ id: string; name: string; qty: number; price: number }>
        coupon: string | null
        total:  number
      }

      const cartSlice = createSlice({
        name: 'cart',
        initialState: { items: [], coupon: null, total: 0 } as CartState,
        reducers: {
          addItem: (state, action: PayloadAction<CartState['items'][0]>) => {
            const existing = state.items.find(i => i.id === action.payload.id)
            if (existing) {
              existing.qty++  // Immer: bezpośrednia mutacja zagnieżdżonego obiektu
            } else {
              state.items.push(action.payload)
            }
            state.total = state.items.reduce((s, i) => s + i.price * i.qty, 0)
          },
          removeItem: (state, action: PayloadAction<string>) => {
            state.items = state.items.filter(i => i.id !== action.payload)
            state.total = state.items.reduce((s, i) => s + i.price * i.qty, 0)
          },
          applyCoupon: (state, action: PayloadAction<string>) => {
            state.coupon = action.payload
          },
          clearCart: (state) => {
            state.items   = []
            state.coupon  = null
            state.total   = 0
          },
        },
      })

      export const { addItem, removeItem, applyCoupon, clearCart } = cartSlice.actions
      export default cartSlice.reducer
    lang: typescript

  - title: createAsyncThunk — async operacje
    desc: >
      createAsyncThunk() tworzy thunk który dispatchuje pending → fulfilled/rejected
      automatycznie. Pierwszym argumentem jest nazwa akcji (string), drugim
      funkcja async zwracająca dane. Obsługujesz je w extraReducers przez builder.addCase().
    code: |
      import { createSlice, createAsyncThunk, PayloadAction } from '@reduxjs/toolkit'

      interface Post {
        id:    number
        title: string
        body:  string
      }

      interface PostsState {
        items:   Post[]
        loading: boolean
        error:   string | null
      }

      // createAsyncThunk<ReturnType, ArgType>
      export const fetchPosts = createAsyncThunk<Post[], void>(
        'posts/fetchAll',  // nazwa akcji — widoczna w DevTools
        async (_, { rejectWithValue }) => {
          try {
            const res = await fetch('https://jsonplaceholder.typicode.com/posts')
            if (!res.ok) throw new Error('Błąd sieci')
            return await res.json() as Post[]
          } catch (err) {
            return rejectWithValue((err as Error).message)
          }
        }
      )

      const postsSlice = createSlice({
        name: 'posts',
        initialState: { items: [], loading: false, error: null } as PostsState,
        reducers: {},
        // extraReducers obsługuje akcje spoza tego slice (np. z createAsyncThunk)
        extraReducers: (builder) => {
          builder
            .addCase(fetchPosts.pending, (state) => {
              state.loading = true
              state.error   = null
            })
            .addCase(fetchPosts.fulfilled, (state, action: PayloadAction<Post[]>) => {
              state.loading = false
              state.items   = action.payload
            })
            .addCase(fetchPosts.rejected, (state, action) => {
              state.loading = false
              state.error   = action.payload as string ?? 'Nieznany błąd'
            })
        },
      })

      export default postsSlice.reducer
    lang: typescript

  - title: createAsyncThunk — z argumentem i RootState
    desc: >
      Thunk może przyjmować argument (np. ID) i czytać aktualny stan przez getState.
      ThunkAPI daje dostęp do dispatch, getState, rejectWithValue i extra (np. API klient).
      Typowanie ThunkApiConfig pozwala na pełne type safety.
    code: |
      import { createAsyncThunk } from '@reduxjs/toolkit'
      import type { RootState, AppDispatch } from '../store'

      interface ThunkApiConfig {
        state:   RootState
        dispatch: AppDispatch
        rejectValue: string
      }

      // Thunk z argumentem (userId) i dostępem do store
      export const fetchUserById = createAsyncThunk<User, number, ThunkApiConfig>(
        'users/fetchById',
        async (userId, { getState, rejectWithValue }) => {
          // Sprawdź cache zanim pójdziesz do API
          const cached = getState().users.entities[userId]
          if (cached) return cached

          try {
            const res = await fetch(`/api/users/${userId}`)
            if (!res.ok) return rejectWithValue('Użytkownik nie znaleziony')
            return await res.json()
          } catch {
            return rejectWithValue('Błąd połączenia')
          }
        }
      )

      // Wywołanie z komponentu:
      // dispatch(fetchUserById(42))
    lang: typescript

  - title: Slice z createEntityAdapter — kolekcje
    desc: >
      createEntityAdapter() generuje reducer i selektory dla kolekcji (tablice obiektów z ID).
      Przechowuje dane w postaci { ids: [], entities: {} } — wydajne operacje CRUD
      bez ręcznego zarządzania tablicami. Idealne dla list użytkowników, postów, produktów.
    code: |
      import {
        createSlice,
        createEntityAdapter,
        createAsyncThunk,
        type PayloadAction,
      } from '@reduxjs/toolkit'
      import type { RootState } from '../store'

      interface Todo {
        id:        number
        title:     string
        completed: boolean
      }

      // Adapter generuje addOne, addMany, upsertOne, removeOne, updateOne...
      const todosAdapter = createEntityAdapter<Todo>()

      export const fetchTodos = createAsyncThunk('todos/fetch', async () => {
        const res = await fetch('/api/todos')
        return await res.json() as Todo[]
      })

      const todosSlice = createSlice({
        name: 'todos',
        initialState: todosAdapter.getInitialState({ loading: false }),
        reducers: {
          todoAdded:   todosAdapter.addOne,
          todoRemoved: todosAdapter.removeOne,
          todoToggled: (state, action: PayloadAction<number>) => {
            const todo = state.entities[action.payload]
            if (todo) todo.completed = !todo.completed
          },
        },
        extraReducers: (builder) => {
          builder
            .addCase(fetchTodos.pending,   (state) => { state.loading = true })
            .addCase(fetchTodos.fulfilled, (state, action) => {
              state.loading = false
              todosAdapter.setAll(state, action.payload)  // zastąp wszystkie
            })
        },
      })

      export const { todoAdded, todoRemoved, todoToggled } = todosSlice.actions

      // Gotowe selektory z adaptera
      export const { selectAll: selectAllTodos, selectById: selectTodoById } =
        todosAdapter.getSelectors((state: RootState) => state.todos)

      export default todosSlice.reducer
    lang: typescript
