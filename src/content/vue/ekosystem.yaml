title: Ekosystem Vue.js

items:
  - name: Nuxt 3
    desc: Full-stack meta-framework dla Vue. SSR, SSG, ISR, API routes, auto-imports, file-based routing. Odpowiednik Next.js dla Vue.
    icon: "💚"
  - name: Pinia
    desc: Oficjalny state management. Prostszy niż Vuex — defineStore z state/getters/actions. Type-safe, DevTools support, persist plugin.
    icon: "🍍"
  - name: Vue Router
    desc: Oficjalny router. Nested routes, lazy loading, navigation guards, history/hash mode. Głęboka integracja z Vue DevTools.
    icon: "🛣️"
  - name: VueUse
    desc: Kolekcja 200+ composables — useFetch, useLocalStorage, useDark, useIntersectionObserver. Odpowiednik react-use/ahooks.
    icon: "🧰"
  - name: Vite
    desc: Domyślny build tool dla Vue 3. HMR w <50ms, ESM dev server, Rollup production builds. Stworzony przez autora Vue.
    icon: "⚡"
  - name: Vitest
    desc: Test runner natywny dla Vite. Compatible z Jest API, ESM, TypeScript, watch mode. Idealny do testów Vue komponentów.
    icon: "🧪"
  - name: PrimeVue / Vuetify
    desc: Biblioteki komponentów UI. PrimeVue (80+ komponentów), Vuetify (Material Design). Shadcn-vue dla headless.
    icon: "🎨"
  - name: Vue DevTools
    desc: Oficjalne rozszerzenie przeglądarki. Inspekcja komponentów, Pinia state, router, timeline events, performance profiling.
    icon: "🔧"
