title: Ekosystem NestJS

items:
  - name: "@nestjs/typeorm"
    desc: Integracja z TypeORM — dekoratory Entity, Repository pattern, migracje. Najpopularniejszy ORM w NestJS.
    icon: "🗄️"
  - name: "@nestjs/prisma (prisma-nestjs)"
    desc: Integracja Prisma z NestJS — PrismaService jako global provider, type-safe queries, schema-first.
    icon: "◈"
  - name: "@nestjs/graphql"
    desc: GraphQL z code-first lub schema-first approach. Resolvers jako dekoratory, automatyczna schema generation.
    icon: "⬡"
  - name: "@nestjs/swagger"
    desc: Automatyczna dokumentacja OpenAPI/Swagger z dekoratorów DTO i kontrolerów. Zero ręcznego pisania spec.
    icon: "📄"
  - name: "@nestjs/passport"
    desc: Integracja Passport.js — strategie JWT, Local, OAuth2, Google, GitHub. AuthGuard wbudowany.
    icon: "🔐"
  - name: "@nestjs/jwt"
    desc: JWT signing i verification. Używany z Passport JWT strategy do token-based auth.
    icon: "🔑"
  - name: "@nestjs/config"
    desc: Konfiguracja z .env i validation. ConfigService wstrzykiwany przez DI. Schema validation z Joi.
    icon: "⚙️"
  - name: "@nestjs/cache-manager"
    desc: Cache z Redis lub in-memory. @CacheInterceptor na endpointach. TTL, invalidation.
    icon: "⚡"
  - name: "@nestjs/bull"
    desc: Kolejki zadań z Bull/BullMQ (Redis). @Process, @OnQueueEvent. Background jobs, scheduled tasks.
    icon: "📨"
  - name: "@nestjs/throttler"
    desc: Rate limiting wbudowany. @Throttle(10, 60) = max 10 requestów na 60 sekund per IP.
    icon: "🚦"
