title: Kontrolery i Routing

items:
  - name: Podstawowy kontroler z CRUD
    desc: >
      @Controller('prefix') definiuje bazowy URL. Metody dekorowane @Get, @Post, @Put, @Delete
      obsługują odpowiednie HTTP methods. @Param, @Body, @Query wyciągają dane z requestu.
    code: |
      import { Controller, Get, Post, Put, Delete, Body, Param, Query, HttpCode } from '@nestjs/common';

      @Controller('products')
      export class ProductsController {
        constructor(private readonly productsService: ProductsService) {}

        @Get()
        findAll(@Query('page') page?: number) {
          return this.productsService.findAll(page);
        }

        @Get(':id')
        findOne(@Param('id') id: string) {
          return this.productsService.findOne(+id);
        }

        @Post()
        @HttpCode(201)
        create(@Body() dto: CreateProductDto) {
          return this.productsService.create(dto);
        }

        @Put(':id')
        update(@Param('id') id: string, @Body() dto: UpdateProductDto) {
          return this.productsService.update(+id, dto);
        }

        @Delete(':id')
        @HttpCode(204)
        remove(@Param('id') id: string) {
          return this.productsService.remove(+id);
        }
      }

  - name: DTO z class-validator
    desc: >
      Data Transfer Object definiuje kształt danych wejściowych. class-validator
      automatycznie waliduje pola. ValidationPipe w main.ts włącza globalną walidację.
    code: |
      import { IsString, IsNumber, IsOptional, Min, MaxLength } from 'class-validator';

      export class CreateProductDto {
        @IsString()
        @MaxLength(100)
        name: string;

        @IsNumber()
        @Min(0)
        price: number;

        @IsString()
        @IsOptional()
        description?: string;
      }

      // main.ts — włącz globalną walidację
      import { ValidationPipe } from '@nestjs/common';

      async function bootstrap() {
        const app = await NestFactory.create(AppModule);
        app.useGlobalPipes(new ValidationPipe({
          whitelist: true,        // usuń pola spoza DTO
          forbidNonWhitelisted: true,  // 400 jeśli nieznane pole
          transform: true,        // auto-cast stringów na typy
        }));
        await app.listen(3000);
      }

  - name: Zagnieżdżone routes i wersjonowanie
    desc: >
      NestJS obsługuje wersjonowanie API (URL, header, media type). Zagnieżdżone
      kontrolery grupują logicznie powiązane endpointy.
    code: |
      // Wersjonowanie w main.ts
      app.enableVersioning({ type: VersioningType.URI });

      // Kontroler z wersją
      @Controller({ path: 'users', version: '2' })
      export class UsersV2Controller {
        @Get()
        findAll() {
          return 'API v2 users';
        }
      }
      // Endpoint: GET /v2/users

  - name: Exception filters i error handling
    desc: >
      NestJS rzuca HttpException dla błędów HTTP. Wbudowane wyjątki: NotFoundException,
      BadRequestException, UnauthorizedException, ForbiddenException. Custom exception
      filters przechwytują i formatują błędy.
    code: |
      import { NotFoundException, BadRequestException } from '@nestjs/common';

      @Get(':id')
      findOne(@Param('id') id: string) {
        const user = this.usersService.findOne(+id);
        if (!user) throw new NotFoundException(`User ${id} not found`);
        return user;
      }

      // Custom exception filter
      @Catch(HttpException)
      export class HttpExceptionFilter implements ExceptionFilter {
        catch(exception: HttpException, host: ArgumentsHost) {
          const ctx = host.switchToHttp();
          const response = ctx.getResponse();
          const status = exception.getStatus();

          response.status(status).json({
            statusCode: status,
            message: exception.message,
            timestamp: new Date().toISOString(),
          });
        }
      }
