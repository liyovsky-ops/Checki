title: Ekosystem Zod

items:
  - name: "@hookform/resolvers"
    desc: Oficjalny resolver dla React Hook Form. zodResolver(schema) przekazuje Zod do RHF. Błędy walidacji automatycznie mapowane na errors per pole formularza.
    icon: "📋"
  - name: zod-to-json-schema
    desc: Konwertuje Zod schema na JSON Schema (standard). Przydatne do generowania dokumentacji OpenAPI, walidacji w zewnętrznych systemach, Swagger UI.
    icon: "📄"
  - name: zod-openapi
    desc: Generuje OpenAPI/Swagger spec z Zod schemas. Zdefiniuj schemat raz — auto-generuj dokumentację API. Używane z Hono, Fastify, Express.
    icon: "📖"
  - name: trpc — Zod input validation
    desc: tRPC używa Zod do walidacji input procedur. .input(z.object({...})) definiuje typ wejścia i waliduje automatycznie. Jeden schemat = typ + walidacja + dokumentacja.
    icon: "🔗"
  - name: Prisma + Zod
    desc: zod-prisma-types generuje Zod schemas z Prisma schema. Auto-generowane schemas dla każdego modelu Prisma. Zawsze zsynchronizowane z bazą danych.
    icon: "🗄️"
  - name: zodenv / @t3-oss/env-nextjs
    desc: Biblioteki do type-safe zmiennych środowiskowych z Zod. @t3-oss/env-nextjs dla Next.js — oddziela zmienne server-side od client-side (NEXT_PUBLIC_*).
    icon: "🔑"
  - name: zod-fetch
    desc: Fetch wrapper z Zod schema walidacją odpowiedzi. zodFetch(url, schema) — automatyczna walidacja i typowanie JSON response z zewnętrznych API.
    icon: "🌐"
  - name: Zod 4 (nowa wersja)
    desc: Zod 4 przynosi znacznie lepszą wydajność (2-7x szybszy), mniejszy bundle (2x), nowe typy (z.interface()), z.template() dla template literals. W momencie pisania w beta.
    icon: "🆕"
