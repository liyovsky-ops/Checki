title: Integracje — tRPC, API, env

items:
  - name: Walidacja zmiennych środowiskowych
    desc: Użyj Zod do walidacji process.env przy starcie. Aplikacja nie uruchomi się z brakującą zmienną — szybkie wykrycie błędu konfiguracji.
    code: |
      import { z } from 'zod'

      const EnvSchema = z.object({
        DATABASE_URL:      z.string().url(),
        REDIS_URL:         z.string().url().optional(),
        JWT_SECRET:        z.string().min(32),
        PORT:              z.string().transform(Number).default("3000"),
        NODE_ENV:          z.enum(["development", "test", "production"]),
        ALLOWED_ORIGINS:   z.string().transform(s => s.split(",")),
      })

      // Parsuj przy starcie — rzuć błąd jeśli brak
      const env = EnvSchema.parse(process.env)

      // Teraz env jest w pełni typowany:
      // env.DATABASE_URL: string
      // env.PORT: number (zTransformowane!)
      // env.NODE_ENV: "development" | "test" | "production"

      export { env }
      // Importuj env zamiast process.env — type safety wszędzie

  - name: Walidacja API response
    desc: Parsuj odpowiedzi zewnętrznych API — nie ufaj nieznanych danych. Zod safeParse dla graceful error handling gdy API zwróci nieoczekiwany format.
    code: |
      import { z } from 'zod'

      const GitHubRepoSchema = z.object({
        id:          z.number(),
        name:        z.string(),
        full_name:   z.string(),
        stargazers_count: z.number(),
        description: z.string().nullable(),
        html_url:    z.string().url(),
        language:    z.string().nullable(),
      })

      const GitHubSearchSchema = z.object({
        total_count: z.number(),
        items:       z.array(GitHubRepoSchema),
      })

      type GitHubRepo = z.infer<typeof GitHubRepoSchema>

      async function searchRepos(query: string): Promise<GitHubRepo[]> {
        const response = await fetch(
          `https://api.github.com/search/repositories?q=${query}`
        )
        const data = await response.json()

        const result = GitHubSearchSchema.safeParse(data)
        if (!result.success) {
          console.error('Nieoczekiwana odpowiedź GitHub API:', result.error)
          return []
        }

        return result.data.items
      }
