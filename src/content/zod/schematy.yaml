title: Typy i schematy Zod

items:
  - name: Podstawowe typy i modyfikatory
    desc: Zod ma typy dla każdej wartości JavaScript. Każdy typ ma łańcuch metod — .min(), .max(), .email(), .url(), .optional(), .nullable(), .default().
    code: |
      import { z } from 'zod'

      // Prymitywy
      z.string()
      z.number()
      z.boolean()
      z.date()
      z.bigint()
      z.undefined()
      z.null()
      z.any()
      z.unknown()

      // String modyfikatory
      const emailSchema = z.string()
        .email()
        .min(5)
        .max(255)
        .toLowerCase()     // transform (kolejność w łańcuchu)
        .trim()

      // Number modyfikatory
      const priceSchema = z.number()
        .positive()
        .multipleOf(0.01)  // Cena z dokładnością do grosza
        .max(999999)

      // Nullable i Optional
      const maybeString = z.string().nullable()   // string | null
      const optionalNum = z.number().optional()   // number | undefined

      // Enum
      const RoleSchema = z.enum(["admin", "user", "guest"])
      type Role = z.infer<typeof RoleSchema>   // "admin" | "user" | "guest"

      // Union
      const IdSchema = z.union([z.string(), z.number()])
      // Lub krócej:
      const IdSchema2 = z.string().or(z.number())

  - name: Obiekty i tablice
    desc: z.object() dla struktury JSON. z.array() dla list. Zagnieżdżone obiekty, opcjonalne pola, dodatkowe klucze (strip/strict/passthrough).
    code: |
      import { z } from 'zod'

      // Obiekt z zagnieżdżeniem
      const AddressSchema = z.object({
        street: z.string(),
        city:   z.string(),
        zip:    z.string().regex(/^\d{2}-\d{3}$/, "Format: XX-XXX"),
      })

      const UserSchema = z.object({
        id:       z.number(),
        name:     z.string(),
        email:    z.string().email(),
        address:  AddressSchema.optional(),
        tags:     z.array(z.string()).max(10),
        metadata: z.record(z.string()),  // { [key: string]: string }
      })

      // Modyfikacje schematu
      const UpdateUserSchema = UserSchema
        .omit({ id: true })        // Usuń id
        .partial()                 // Wszystkie pola opcjonalne
      // type UpdateUser = { name?: string; email?: string; ... }

      const LoginSchema = UserSchema.pick({ email: true })
        .extend({ password: z.string().min(8) })

      // Dodatkowe klucze
      const StrictUser = UserSchema.strict()      // Błąd gdy nieznane klucze
      const PassUser   = UserSchema.passthrough() // Przepuść nieznane klucze

  - name: Discriminated unions
    desc: z.discriminatedUnion() dla unii obiektów rozróżnianych po jednym polu (np. type/status). Szybsze i z lepszymi błędami niż z.union — Zod od razu wie którą gałąź sprawdzić zamiast próbować wszystkich.
    code: |
      import { z } from 'zod'

      // Unia rozróżniana po polu "status"
      const ResponseSchema = z.discriminatedUnion("status", [
        z.object({
          status: z.literal("success"),
          data:   z.object({ id: z.number(), name: z.string() }),
        }),
        z.object({
          status: z.literal("error"),
          code:   z.number(),
          message: z.string(),
        }),
      ])

      type ApiResponse = z.infer<typeof ResponseSchema>
      // { status: "success"; data: {...} } | { status: "error"; code: number; message: string }

      const res = ResponseSchema.parse({ status: "error", code: 404, message: "Not found" })
      if (res.status === "error") {
        console.log(res.code)   // TypeScript zawęża typ — res.code dostępne
      }

      // z.union próbuje WSZYSTKICH gałęzi i zwraca mylące błędy.
      // discriminatedUnion czyta pole "status" i sprawdza tylko właściwą gałąź.

  - name: z.coerce — automatyczna konwersja typów
    desc: z.coerce.* konwertuje wejście na docelowy typ przed walidacją (przez String(), Number(), Boolean(), new Date()). Idealne dla danych z formularzy, query params i process.env, gdzie wszystko jest stringiem.
    code: |
      import { z } from 'zod'

      // Coerce: cokolwiek → number (przez Number(input))
      const ageSchema = z.coerce.number().int().min(0)
      ageSchema.parse("42")     // 42 (number, nie string)
      ageSchema.parse("3.5")    // ZodError — nie int

      // Coerce dla query params / FormData (zawsze stringi)
      const QuerySchema = z.object({
        page:    z.coerce.number().default(1),
        limit:   z.coerce.number().max(100).default(20),
        active:  z.coerce.boolean(),        // "true" string → uwaga: Boolean("false") === true!
        from:    z.coerce.date(),           // "2024-01-15" → Date
      })

      QuerySchema.parse({ page: "2", limit: "50", active: "1", from: "2024-01-15" })
      // { page: 2, limit: 50, active: true, from: Date(...) }

      // UWAGA: z.coerce.boolean() używa Boolean() — każdy niepusty string to true.
      // Dla "true"/"false" użyj: z.enum(["true","false"]).transform(v => v === "true")
