title: Ekosystem Storybook

items:
  - name: "@storybook/addon-essentials"
    desc: Zestaw domyślnych addonów — Controls (zmieniaj props), Actions (loguj eventy), Viewport (testuj responsywność), Backgrounds (tła), Toolbars. Domyślnie przy init.
    icon: "🎛️"
  - name: Chromatic
    desc: Visual regression testing i UI review platforma. Przechwytuje screenshoty każdej story i porównuje. Zmiany wizualne wymagają zatwierdzenia. Integracja z GitHub/GitLab.
    icon: "📸"
  - name: "@storybook/addon-a11y"
    desc: Accessibility testing z axe-core w każdej story. Panel A11y pokazuje naruszenia WCAG, ostrzeżenia i elementy wymagające manualnej weryfikacji. Zero-config.
    icon: "♿"
  - name: "@storybook/addon-interactions"
    desc: Wsparcie dla play() functions — krok po kroku interakcje, panel debugowania, timeline. Uruchom, pauzuj i sprawdzaj każdy krok interakcji komponentu.
    icon: "▶️"
  - name: MSW (Mock Service Worker)
    desc: msw-storybook-addon do mockowania HTTP requests w Stories. Każda story może mieć własne mock API responses — testuj stany loading, error, empty bez backendu.
    icon: "🌐"
  - name: Storybook Test Runner
    desc: "@storybook/test-runner uruchamia play() stories jako Playwright testy. Działa w CI — headless, z raportami, integracja z Jest. Wszystkie stories = testy."
    icon: "🧪"
  - name: "@storybook/react-vite"
    desc: Vite framework dla Storybook — znacznie szybszy od webpack. HMR (hot reload) poniżej 50ms. Domyślny framework dla nowych projektów React.
    icon: "⚡"
  - name: Storybook Connect (Figma)
    desc: Plugin Figma łączący design z Stories. Designerzy widzą live stories w Figma, deweloperzy widzą Figma frames obok Story. Sync design ↔ implementacja.
    icon: "🎨"
