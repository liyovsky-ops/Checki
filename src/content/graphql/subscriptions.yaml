title: Subscriptions i real-time GraphQL

items:
  - name: Subscriptions — real-time przez WebSocket
    desc: >
      Subscriptions utrzymują połączenie WebSocket i wysyłają dane gdy nastąpi zdarzenie.
      Serwer emituje event przez PubSub — klient otrzymuje aktualizację.
      Idealne do chat, live feed, powiadomień, dashboardów.
    code: |
      // Schema
      type Subscription {
        messageAdded(roomId: ID!): Message!
        userStatusChanged(userId: ID!): UserStatus!
        orderUpdated(orderId: ID!): Order!
      }

      // Resolver z PubSub
      // UWAGA: in-memory PubSub działa tylko na JEDNEJ instancji serwera.
      // W produkcji (kilka instancji za load balancerem) użyj
      // graphql-redis-subscriptions — wtedy event dociera do subskrybentów
      // podłączonych do innej instancji.
      import { PubSub } from 'graphql-subscriptions';
      const pubsub = new PubSub();

      const resolvers = {
        Mutation: {
          sendMessage: async (_: any, { roomId, content }: any, { user }: any) => {
            const message = await db.messages.create({
              data: { roomId, content, authorId: user.id }
            });

            // Emit zdarzenie — wszyscy subskrybenci pokoju je dostaną
            await pubsub.publish(`MESSAGE_ADDED_${roomId}`, {
              messageAdded: message
            });

            return message;
          }
        },

        Subscription: {
          messageAdded: {
            // subscribe zwraca AsyncIterator
            // graphql-subscriptions v2+: metoda nazywa się asyncIterableIterator
            // (asyncIterator jest deprecated, ale wciąż działa)
            subscribe: (_: any, { roomId }: { roomId: string }) =>
              pubsub.asyncIterableIterator(`MESSAGE_ADDED_${roomId}`),
          }
        }
      };

      // Transport: Apollo Server 4 używa biblioteki graphql-ws
      // (stary subscriptions-transport-ws jest porzucony i niebezpieczny).
      // npm install graphql-ws ws
      // Serwer WebSocket podpinasz przez useServer() obok HTTP serwera.

      // Klient React
      const MESSAGE_SUBSCRIPTION = gql`
        subscription OnMessageAdded($roomId: ID!) {
          messageAdded(roomId: $roomId) {
            id content author { name }
          }
        }
      `;

      function ChatRoom({ roomId }: { roomId: string }) {
        const { data } = useSubscription(MESSAGE_SUBSCRIPTION, {
          variables: { roomId }
        });
        // data.messageAdded — nowa wiadomość w czasie rzeczywistym
      }
