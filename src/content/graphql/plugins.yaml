title: Ekosystem GraphQL

items:
  - name: Apollo Server
    desc: Najpopularniejszy serwer GraphQL dla Node.js. Obsługuje Express, Fastify, Lambda, standalone. Apollo Sandbox — wbudowany playground do testowania API. Pluginy do caching, tracing, auth.
    icon: "🚀"
  - name: Apollo Client
    desc: Klient GraphQL dla React/Vue/Angular z inteligentnym cache. useQuery, useMutation, useSubscription hooki. Automatic cache normalization — update jednego miejsca aktualizuje cały UI.
    icon: "🌐"
  - name: Pothos GraphQL
    desc: Code-first schema builder dla TypeScript — piszesz resolver i typ jednocześnie, zero SDL. TypeScript inference zamiast generowania kodu. Plugins do auth, relay, prisma integration.
    icon: "⚡"
  - name: GraphQL Yoga
    desc: Prosty, szybki serwer GraphQL od The Guild. Zero konfiguracji, działa na Fetch API (Cloudflare Workers, Deno, Bun). Dobra alternatywa dla Apollo Server w edge computing.
    icon: "🧘"
  - name: DataLoader
    desc: Biblioteka Facebooka do batching i caching requestów. Rozwiązuje N+1 problem — zbiera wiele load() i wykonuje jeden request do bazy. Per-request caching i deduplication.
    icon: "📦"
  - name: graphql-codegen
    desc: Generator kodu z GraphQL schema. Generuje TypeScript typy, React hooks (useQuery/useMutation z typami), klientów dla różnych języków. Niezbędne w profesjonalnych projektach.
    icon: "🔨"
  - name: Nexus GraphQL
    desc: Code-first schema builder z automatyczną generacją typów TypeScript. Nexus.objectType(), nexus.queryType() — definiujesz resolver i schemat w jednym miejscu.
    icon: "🔷"
  - name: GraphQL Shield
    desc: Middleware do autoryzacji w GraphQL. Definiujesz reguły (rule(), shield()) i przypisujesz do pól lub typów. Declarative authorization zamiast if/else w każdym resolverze.
    icon: "🛡️"
