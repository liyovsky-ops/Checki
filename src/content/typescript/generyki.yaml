title: Generyki i zaawansowane wzorce

items:
  - name: Generyki funkcji
    desc: >
      Generyki pozwalają pisać funkcje działające z dowolnymi typami zachowując bezpieczeństwo.
      Parametr typowy T jest jak zmienna dla typów — TypeScript wywnioskuje go z argumentów.
      Constraints (extends) ograniczają co T może być — np. T extends object.
    code: |
      // Podstawowy generyk
      function identity<T>(value: T): T {
        return value;
      }
      const n = identity(42);       // T = number
      const s = identity('hello');  // T = string

      // Constraint — T musi mieć .length
      function longest<T extends { length: number }>(a: T, b: T): T {
        return a.length >= b.length ? a : b;
      }

      // Wiele parametrów typowych
      function map<T, U>(arr: T[], fn: (item: T) => U): U[] {
        return arr.map(fn);
      }

      // Generyk z domyślnym typem
      function createState<T = string>(initial: T) {
        let state = initial;
        return {
          get: () => state,
          set: (val: T) => { state = val; },
        };
      }

  - name: Generyczne interfejsy i klasy
    desc: >
      Interfejsy i klasy mogą mieć parametry typowe — tworzy reużywalne struktury
      działające z różnymi typami danych. Repository<T>, EventEmitter<T>, Result<T>.
    code: |
      // Generyczny interfejs
      interface Repository<T> {
        findById(id: number): Promise<T | null>;
        findAll(): Promise<T[]>;
        save(entity: T): Promise<T>;
        delete(id: number): Promise<void>;
      }

      // Generyczna klasa
      class Stack<T> {
        private items: T[] = [];

        push(item: T): void { this.items.push(item); }
        pop(): T | undefined { return this.items.pop(); }
        peek(): T | undefined { return this.items[this.items.length - 1]; }
        isEmpty(): boolean { return this.items.length === 0; }
      }

      // Generyczny Result type
      class Result<T, E extends Error = Error> {
        private constructor(
          private readonly _value: T | null,
          private readonly _error: E | null
        ) {}

        static ok<T>(value: T): Result<T, never> {
          return new Result(value, null);
        }
        static err<E extends Error>(error: E): Result<never, E> {
          return new Result(null, error);
        }

        map<U>(fn: (val: T) => U): Result<U, E> {
          if (this._value !== null) return Result.ok(fn(this._value));
          return Result.err(this._error!);
        }
      }

  - name: Mapped types i transformacje
    desc: >
      Mapped types tworzą nowy typ przez iterowanie po kluczach istniejącego.
      Modyfikatory +readonly, -readonly, +?, -? dodają lub usuwają readonly i opcjonalność.
      Podstawa utility types: Partial, Required, Readonly, Record.
    code: |
      // Własny Partial
      type MyPartial<T> = {
        [K in keyof T]?: T[K];
      };

      // Deep Partial (rekurencyjny)
      type DeepPartial<T> = {
        [K in keyof T]?: T[K] extends object ? DeepPartial<T[K]> : T[K];
      };

      // Rename keys
      type Prefixed<T, P extends string> = {
        [K in keyof T as `${P}${Capitalize<string & K>}`]: T[K];
      };
      type PrefixedUser = Prefixed<User, 'get'>;
      // { getId: number, getName: string, ... }

      // Filter keys by value type
      type PickByType<T, V> = {
        [K in keyof T as T[K] extends V ? K : never]: T[K];
      };
      type StringFields = PickByType<User, string>;
      // tylko pola typu string

  - name: Wzorzec Builder z generykami
    desc: >
      Builder pattern w TypeScript z generykami — każda metoda zwraca this z zaktualizowanym typem.
      Kompilator śledzi które pola zostały ustawione — wymagane pola przed build() sprawdzane typowo.
    code: |
      // Type-safe Builder
      type BuilderState = {
        name?: string;
        age?: number;
        email?: string;
      };

      class UserBuilder<State extends BuilderState = {}> {
        private state: State = {} as State;

        setName<S extends string>(name: S): UserBuilder<State & { name: S }> {
          return Object.assign(new UserBuilder(), { ...this.state, name }) as any;
        }

        setEmail<S extends string>(email: S): UserBuilder<State & { email: S }> {
          return Object.assign(new UserBuilder(), { ...this.state, email }) as any;
        }

        setAge(age: number): UserBuilder<State & { age: number }> {
          return Object.assign(new UserBuilder(), { ...this.state, age }) as any;
        }

        // build() dostępne tylko gdy name i email są ustawione
        build(this: UserBuilder<{ name: string; email: string } & Record<string, any>>) {
          return this.state as Required<BuilderState>;
        }
      }

      const user = new UserBuilder()
        .setName('Alice')
        .setEmail('a@b.com')
        .setAge(30)
        .build(); // ✅ OK — name i email ustawione

      // new UserBuilder().setName('Bob').build();
      // ❌ błąd kompilacji — brak email, build() niedostępne

  - name: const type parameters (TS 5.0)
    desc: >
      Modyfikator const przy parametrze typowym sprawia, że argumenty są wnioskowane
      tak, jakby miały as const — bez ręcznego dopisywania go przy wywołaniu.
      Idealne do funkcji przyjmujących literały: trasy, eventy, konfiguracje.
    code: |
      // Bez const — typ zostaje "rozszerzony"
      function first1<T>(arr: readonly T[]): T { return arr[0]; }
      const a = first1(['a', 'b', 'c']); // a: string

      // Z const — literały zachowane bez 'as const' u wywołującego
      function first2<const T>(arr: readonly T[]): T { return arr[0]; }
      const b = first2(['a', 'b', 'c']); // b: 'a' | 'b' | 'c'

      // Praktyczne: type-safe router
      function route<const T extends string>(path: T): { path: T } {
        return { path };
      }
      const r = route('/users/:id'); // r.path: '/users/:id'

  - name: Standardowe dekoratory (TS 5.0)
    desc: >
      TS 5.0 wprowadził dekoratory zgodne ze standardem ECMAScript (Stage 3) — bez
      flagi experimentalDecorators. Dekorator to funkcja owijająca klasę/metodę/pole.
      Drugi argument (context) opisuje, co jest dekorowane. Uwaga: dekoratory parametrów
      i metadane (reflect-metadata, NestJS, TypeORM) wciąż wymagają trybu legacy.
    code: |
      // Dekorator metody — logowanie wywołań (standard ES, TS 5.0+)
      function logged<This, Args extends any[], Return>(
        target: (this: This, ...args: Args) => Return,
        context: ClassMethodDecoratorContext<This>
      ) {
        const name = String(context.name);
        return function (this: This, ...args: Args): Return {
          console.log(`→ ${name}(${args.join(', ')})`);
          const result = target.call(this, ...args);
          console.log(`← ${name} =>`, result);
          return result;
        };
      }

      class Calculator {
        @logged
        add(a: number, b: number) { return a + b; }
      }

      new Calculator().add(2, 3); // loguje wejście i wynik

  - name: Explicit resource management (using, TS 5.2)
    desc: >
      using i await using (TS 5.2+) automatycznie zwalniają zasób na końcu bloku —
      odpowiednik try/finally. Obiekt musi implementować Symbol.dispose
      (lub Symbol.asyncDispose). Wymaga target/lib z ES2022+ i obsługi w runtime.
    code: |
      class FileHandle implements Disposable {
        constructor(private path: string) {
          console.log(`open ${path}`);
        }
        read() { return 'data'; }
        [Symbol.dispose]() {
          console.log(`close ${this.path}`);
        }
      }

      function process() {
        using file = new FileHandle('/tmp/data.txt');
        console.log(file.read());
        // [Symbol.dispose]() wywoła się automatycznie na końcu bloku
      }

      // Asynchroniczny wariant
      class Connection implements AsyncDisposable {
        async [Symbol.asyncDispose]() { /* await pool.release() */ }
      }
      async function query() {
        await using conn = new Connection();
        // zwolnione po wyjściu z bloku
      }
