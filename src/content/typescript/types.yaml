title: System typów TypeScript

items:
  - name: Typy prymitywne i literalne
    desc: >
      Podstawowe typy: string, number, boolean, null, undefined, symbol, bigint.
      Typy literalne — konkretna wartość jako typ: 'left' | 'right', 42, true.
      Świetne do discriminated unions i type-safe API.
    code: |
      // Prymitywne
      const name: string = 'Alice';
      const age: number = 30;
      const active: boolean = true;

      // Literalne
      type Direction = 'left' | 'right' | 'up' | 'down';
      type StatusCode = 200 | 201 | 400 | 404 | 500;

      // Discriminated union
      type Shape =
        | { kind: 'circle';    radius: number }
        | { kind: 'rectangle'; width: number; height: number }
        | { kind: 'triangle';  base: number;  height: number };

      function area(shape: Shape): number {
        switch (shape.kind) {
          case 'circle':    return Math.PI * shape.radius ** 2;
          case 'rectangle': return shape.width * shape.height;
          case 'triangle':  return 0.5 * shape.base * shape.height;
        }
      }

  - name: Interface i type alias
    desc: >
      Interface — kształt obiektu, można rozszerzać i mergować deklaracje.
      Type alias — alias na dowolny typ, obsługuje union, intersection, mapped types.
      Preferuj interface dla obiektów publicznych API, type dla złożonych operacji.
    code: |
      // Interface — rozszerzalne
      interface Animal {
        name: string;
        sound(): string;
      }

      interface Dog extends Animal {
        breed: string;
        fetch(item: string): void;
      }

      // Type alias — dla złożonych typów
      type ID = string | number;
      type Nullable<T> = T | null;
      type Callback<T> = (value: T) => void;

      // Intersection
      type AdminUser = User & {
        permissions: string[];
        lastLogin: Date;
      };

      // Mapped type
      type ReadOnly<T> = {
        readonly [K in keyof T]: T[K];
      };

  - name: Utility types
    desc: >
      TypeScript wbudował dziesiątki utility types do transformacji istniejących typów.
      Partial, Required, Readonly, Record, Pick, Omit, Exclude, Extract, NonNullable,
      ReturnType, Parameters, InstanceType — codziennie używane w praktyce.
    code: |
      interface User {
        id: number;
        name: string;
        email: string;
        age: number;
      }

      // Partial — wszystkie pola opcjonalne
      type UserUpdate = Partial<User>;

      // Pick — wybierz pola
      type UserPreview = Pick<User, 'id' | 'name'>;

      // Omit — usuń pola
      type UserWithoutId = Omit<User, 'id'>;

      // Record — słownik o znanych kluczach
      type UserMap = Record<string, User>;

      // ReturnType — typ zwracanej wartości funkcji
      async function fetchUser() { return {} as User; }
      type FetchedUser = Awaited<ReturnType<typeof fetchUser>>;

      // NonNullable — usuń null i undefined
      type SafeString = NonNullable<string | null | undefined>; // string

  - name: Template literal types
    desc: >
      Template literal types pozwalają budować typy przez konkatenację stringów.
      Przydatne do event names, CSS klasy, endpoint paths — type-safe bez ręcznego wyliczania.
    code: |
      type EventName = 'click' | 'focus' | 'blur';
      type Handler = `on${Capitalize<EventName>}`;
      // 'onClick' | 'onFocus' | 'onBlur'

      type HttpMethod = 'get' | 'post' | 'put' | 'delete';
      type Endpoint = `/api/${string}`;

      // Kombinacja z mapped types
      type EventMap = {
        [K in EventName as `on${Capitalize<K>}`]: (e: Event) => void;
      };
      // { onClick: ..., onFocus: ..., onBlur: ... }

  - name: Conditional types i infer
    desc: >
      Conditional types: T extends U ? X : Y — typ warunkowy.
      infer — wyciągnij typ z warunku. Razem budują potężne transformacje typów.
      Używane w utility types i bibliotekach do ekstrakcji zagnieżdżonych typów.
    code: |
      // Conditional type
      type IsArray<T> = T extends any[] ? true : false;
      type A = IsArray<number[]>; // true
      type B = IsArray<string>;   // false

      // infer — wyciągnij typ elementu tablicy
      type ArrayElement<T> = T extends (infer E)[] ? E : never;
      type NumEl = ArrayElement<number[]>; // number

      // Unwrap Promise (własny — wbudowany Awaited istnieje od TS 4.5)
      type MyAwaited<T> = T extends Promise<infer U> ? MyAwaited<U> : T;

      // Funkcja → parametry → pierwszy parametr
      type FirstParam<T extends (...args: any) => any> =
        T extends (first: infer F, ...rest: any[]) => any ? F : never;

  - name: const assertions (as const)
    desc: >
      as const zamraża wartość na najwęższy możliwy typ literalny i robi ją readonly.
      Tablice stają się readonly tuple, obiekty mają literalne typy pól zamiast szerokich.
      Kluczowe do wyprowadzania union types z danych i do niezmiennych konfiguracji.
    code: |
      // Bez as const — typy są "szerokie"
      const a = { method: 'GET', retries: 3 };
      // { method: string; retries: number }

      // Z as const — literalne i readonly
      const b = { method: 'GET', retries: 3 } as const;
      // { readonly method: 'GET'; readonly retries: 3 }

      // Tablica → readonly tuple, świetne do wyprowadzania union
      const ROLES = ['admin', 'user', 'guest'] as const;
      type Role = typeof ROLES[number]; // 'admin' | 'user' | 'guest'

      // Const w pojedynczym polu (TS 5.0+) zamiast całego obiektu
      function config<const T>(value: T): T { return value; }

  - name: Operator satisfies
    desc: >
      satisfies (TS 4.9+) sprawdza, czy wyrażenie pasuje do typu, NIE zmieniając
      przy tym wywnioskowanego typu wartości. W odróżnieniu od adnotacji ": T"
      zachowuje wąski typ literalny, dając walidację i precyzyjny autocomplete naraz.
    code: |
      type Config = Record<string, string | number>;

      // Z adnotacją — tracisz konkretne klucze i typy wartości
      const a: Config = { host: 'localhost', port: 8080 };
      a.port.toFixed(); // ❌ port to string | number

      // Z satisfies — walidacja + zachowany wąski typ
      const b = { host: 'localhost', port: 8080 } satisfies Config;
      b.port.toFixed();   // ✅ port to number
      b.host.toUpperCase(); // ✅ host to string
      b.missing;          // ❌ błąd — klucz nie istnieje

      // Częsty wzorzec: paleta kolorów / mapa tras
      const palette = {
        primary: '#3178c6',
        danger: [255, 0, 0],
      } satisfies Record<string, string | number[]>;

  - name: Type guards i assertion functions
    desc: >
      Type predicate (arg is Type) tworzy własny type guard zawężający typ w if/switch.
      Assertion function (asserts arg is Type) rzuca wyjątek gdy warunek nie zachodzi,
      a po wywołaniu TypeScript wie, że typ jest zawężony. Podstawa walidacji unknown.
    code: |
      interface Cat { meow(): void }
      interface Dog { bark(): void }

      // User-defined type guard
      function isCat(animal: Cat | Dog): animal is Cat {
        return 'meow' in animal;
      }

      function speak(animal: Cat | Dog) {
        if (isCat(animal)) animal.meow(); // zawężone do Cat
        else animal.bark();               // zawężone do Dog
      }

      // Assertion function — zawęża po wywołaniu
      function assertString(val: unknown): asserts val is string {
        if (typeof val !== 'string') throw new Error('Not a string');
      }

      function shout(input: unknown) {
        assertString(input);
        return input.toUpperCase(); // input to string
      }
