title: Ekosystem TypeScript

items:
  - name: "@types/* — DefinitelyTyped"
    desc: Typy dla bibliotek JavaScript bez wbudowanych typów. @types/node, @types/express, @types/lodash — instalujesz jako devDependency. Największe repozytorium definicji typów na świecie (10k+ bibliotek).
    icon: "📦"
  - name: Zod
    desc: Schema validation + TypeScript types z jednego źródła. Parsuj i waliduj dane w runtime (API responses, forms, env) i automatycznie miej pasujący typ TS. Najpopularniejsza biblioteka walidacyjna w TS.
    icon: "🛡️"
  - name: ts-reset
    desc: Biblioteka od Matt Pocock poprawiająca domyślne zachowania TypeScript — JSON.parse() zwraca unknown zamiast any, Array.filter(Boolean) poprawnie zawęża typ, fetch response.json() zwraca unknown.
    icon: "🔧"
  - name: type-fest
    desc: Ogromna kolekcja utility types uzupełniająca wbudowane. Merge, Simplify, SetOptional, Get (deep path), Jsonify, Promisable i setki innych. Instalujesz i importujesz co potrzebujesz.
    icon: "🎁"
  - name: TypeScript ESLint
    desc: Parser i reguły ESLint dla TypeScript. Type-aware rules wykrywają problemy korzystając z informacji o typach — no-floating-promises, no-misused-promises, prefer-nullish-coalescing.
    icon: "🔍"
  - name: tsup
    desc: Zero-config bundler dla bibliotek TypeScript (oparty na esbuild). Buduje ESM + CJS + .d.ts w jednej komendzie. Standard do budowania npm packages w TypeScript.
    icon: "📦"
  - name: Vitest
    desc: Test runner zintegrowany z Vite — natywne wsparcie TypeScript bez konfiguracji. Identyczne API jak Jest, ale 10× szybszy (esbuild transform). Standard do testowania projektów TS/Vite.
    icon: "🧪"
  - name: tRPC
    desc: Type-safe API między frontendem a backendem bez generowania kodu. Definiujesz procedury na serwerze, klient ma automatycznie poprawne typy. Idealne dla monorepo TypeScript.
    icon: "🔗"
