title: Git vs alternatywy VCS

items:
  - name: Mercurial (Hg)
    icon: "🔵"
    color: "#4675bc"
    tagline: Rozproszony VCS stworzony równolegle z Git — prostsze komendy
    pros:
      - Prostsze i bardziej konsekwentne komendy niż Git
      - Lepsza obsługa dużych repozytoriów binarnych
      - Immutable commits domyślnie
      - Używany przez Facebook (wewnętrznie) i Bitbucket (do 2020)
    cons:
      - Znacznie mniejsza popularność niż Git
      - GitHub/GitLab nie obsługują Mercurial
      - Mniejsza społeczność i mniej zasobów
      - Praktycznie brak nowych projektów
    vs: Git wygrał — jest wszędzie (GitHub, GitLab, każdy open source). Mercurial był lepszy technicznie ale ekosystem zdecydował. Nowe projekty — zawsze Git.

  - name: SVN (Subversion)
    icon: "📁"
    color: "#809cc9"
    tagline: Scentralizowany VCS — nadal w legacy enterprise
    pros:
      - Kontrola dostępu per folder (nie per repo jak Git)
      - Dobre dla dużych plików binarnych (grafiki, modele 3D)
      - Prosta, liniowa historia bez branchy
      - Nadal używany w embedded, game dev, bankach
    cons:
      - Wymaga centralnego serwera — brak offline work
      - Wolne branchowanie i mergowanie
      - Zdecentralizowany backup niemożliwy
      - Relikt — nowe projekty go nie używają
    vs: SVN nadal żyje w legacy enterprise. Dla nowych projektów — Git jest oczywistym wyborem. Git ma offline work, szybkie branche i lepszy merge.

  - name: GitHub vs GitLab vs Bitbucket
    icon: "🌐"
    color: "#333333"
    tagline: Hosting Git — nie rywal, a platforma dla repozytoriów
    pros:
      - GitHub — największy ekosystem, Copilot, portfolio dla rekruterów
      - GitLab — self-hosted, wbudowany CI/CD, compliance enterprise
      - Bitbucket — integracja z Jira/Confluence (Atlassian stack)
    cons:
      - GitHub — vendor lock-in (Microsoft)
      - GitLab — CI/CD bardziej skomplikowany w konfiguracji
      - Bitbucket — mały ekosystem open source
    vs: Portfolio i open source → GitHub. Firma z compliance lub self-hosting → GitLab. Atlassian stack (Jira, Confluence) → Bitbucket. Nie są rywalami Git — to hosty dla repozytoriów Git.

  - name: Git Flow vs Trunk-Based Dev
    icon: "🌳"
    color: "#f05032"
    tagline: Strategie pracy z branchami — nie rywal, a filozofia użycia Git
    pros:
      - Git Flow — jasna struktura (main, develop, feature/*, release/*, hotfix/*)
      - Git Flow — dobre dla wersjonowanych produktów i długich release cycles
      - Trunk-Based — jeden main branch, wszyscy commitują bezpośrednio
      - Trunk-Based — wymagany przez CI/CD i continuous deployment
    cons:
      - Git Flow — dużo branchy, skomplikowane merge przy długich feature branchach
      - Trunk-Based — wymaga dobrego CI/CD i feature flags
    vs: Git Flow dla wersjonowanych produktów (mobile app, SDK). Trunk-Based dla SaaS z continuous deployment. GitHub Flow (main + feature branch + PR) działa dla większości projektów.
