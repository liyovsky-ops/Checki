title: Ekosystem CrewAI

items:
  - name: crewai-tools
    desc: Oficjalny pakiet narzędzi — SerperDevTool (Google search), ScrapeWebsiteTool, FileReadTool, PDFSearchTool, CodeInterpreterTool, YoutubeVideoSearchTool. pip install crewai-tools.
    icon: "🔧"
  - name: LangChain Integration
    desc: CrewAI działa z narzędziami LangChain — 1000+ integracji. Każde narzędzie LangChain można użyć jako tool agenta CrewAI.
    icon: "🔗"
  - name: LiteLLM
    desc: Wbudowana obsługa 100+ modeli LLM przez LiteLLM — OpenAI, Anthropic, Google, Ollama, Azure, AWS Bedrock. Zmień model jednym parametrem.
    icon: "🤖"
  - name: CrewAI Flows
    desc: System workflow do łączenia wielu crews w pipeline. Flow → Crew A → condition → Crew B. Programmatic control nad multi-crew orchestration.
    icon: "🔄"
  - name: Embedchain (Mem0)
    desc: Integracja z Mem0 (dawniej Embedchain) dla zaawansowanej pamięci agentów — personalized memory, user-specific context, cross-session learning.
    icon: "🧠"
  - name: CrewAI Enterprise
    desc: Platforma SaaS do deploymentu crews w produkcji — monitoring, scheduling, API, team collaboration. Wersja hosted.
    icon: "☁️"
  - name: Composio
    desc: 150+ gotowych integracji z SaaS tools (Gmail, Slack, GitHub, Jira, Notion). Agent może wysyłać maile, tworzyć PR-y, zarządzać taskami.
    icon: "🔌"
  - name: Browserbase
    desc: Narzędzie do web browsing — agent może otwierać strony, klikać, wypełniać formularze. Headless browser jako tool agenta.
    icon: "🌐"
