title: Ekosystem Prisma

items:
  - name: Prisma Studio
    desc: GUI do bazy danych w przeglądarce. CRUD na tabelach, filtrowanie, edycja relacji. npx prisma studio → localhost:5555.
    icon: "🖥️"
  - name: Prisma Accelerate
    desc: Global database cache + connection pooling as a service. Edge-ready — queries blisko użytkownika. Zmniejsza latency i load na bazę.
    icon: "⚡"
  - name: Prisma Pulse
    desc: Real-time database event streaming. CDC (Change Data Capture) przez Prisma — reaguj na INSERT/UPDATE/DELETE w kodzie TypeScript.
    icon: "💓"
  - name: prisma-dbml-generator
    desc: Generuje DBML (Database Markup Language) z Prisma schema. Wizualizacja ERD w dbdiagram.io automatycznie.
    icon: "📊"
  - name: prisma-docs-generator
    desc: Generuje dokumentację API z Prisma schema. Markdown/HTML reference wszystkich modeli i relacji.
    icon: "📝"
  - name: "@casl/prisma"
    desc: Integracja CASL (authorization library) z Prisma. Type-safe permissions na query level. prisma.user.findMany() z automatycznym filtrem uprawnień.
    icon: "🔐"
  - name: prisma-json-types-generator
    desc: Generuje TypeScript typy dla Json pól w Prisma schema. Zamiast any na Json column — pełne typy.
    icon: "🏷️"
  - name: zenstack
    desc: Toolkit na bazie Prisma — access control, auto-generated API, hooks. Schema-level authorization rules.
    icon: "🛡️"
