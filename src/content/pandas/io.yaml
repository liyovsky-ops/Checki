  - name: Kompresja — gzip / zip / bz2
    desc: Pandas transparentnie obsługuje skompresowane pliki — read_csv działa na .csv.gz bez dodatkowego kodu.
    icon: "🗜️"
    code: |
      # Wczytaj skompresowany CSV
      df = pd.read_csv('dane.csv.gz')           # gzip
      df = pd.read_csv('dane.csv.bz2')          # bzip2
      df = pd.read_csv('dane.csv.zip')          # zip
      df = pd.read_csv('dane.csv.xz')           # lzma

      # Zapisz skompresowany CSV
      df.to_csv('wynik.csv.gz', index=False, compression='gzip')
      df.to_csv('wynik.csv.bz2', index=False, compression='bz2')

      # Zaawansowane opcje kompresji
      df.to_csv('wynik.csv.gz', compression={
          'method': 'gzip',
          'compresslevel': 9   # 1-9, wyżej = lepsza kompresja ale wolniej
      })

      # Porównanie rozmiarów:
      # dane.csv       → 100 MB
      # dane.csv.gz    → 15 MB (gzip)
      # dane.parquet   → 8 MB (parquet+snappy)

  - name: to_csv — eksport z opcjami
    desc: Eksport DataFrame do CSV z pełną kontrolą nad formatem — separator, kodowanie, daty, indeks.
    icon: "💾"
    code: |
      # Podstawowy eksport
      df.to_csv('wynik.csv', index=False)

      # Pełna kontrola
      df.to_csv(
          'wynik.csv',
          sep=';',                      # separator (Excel PL używa ;)
          decimal=',',                  # separator dziesiętny
          encoding='utf-8-sig',         # BOM dla Excel/Windows
          index=False,                  # bez kolumny indeksu
          float_format='%.2f',          # format liczb zmiennoprzecinkowych
          date_format='%d.%m.%Y',       # format dat
          na_rep='',                    # reprezentacja NaN (domyślnie pusty string)
          columns=['id', 'data', 'kwota']  # tylko wybrane kolumny
      )

      # Zapis do StringIO (np. do wysłania przez HTTP)
      from io import StringIO
      buffer = StringIO()
      df.to_csv(buffer, index=False)
      csv_string = buffer.getvalue()
