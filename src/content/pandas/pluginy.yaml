title: Ekosystem Pandas

items:
  - name: NumPy — fundament Pandas
    desc: NumPy jest wewnętrznym silnikiem Pandas. Bezpośredni dostęp do array przydaje się dla operacji numerycznych.
    icon: "🔢"
    code: |
      import pandas as pd
      import numpy as np

      # Konwersja DataFrame → numpy array
      arr = df[['cena', 'kwota']].to_numpy()    # (n, 2) numpy array
      arr = df['cena'].values                    # 1D array (Series.values)

      # Numpy w kolumnach Pandas
      df['log_cena'] = np.log(df['cena'])
      df['sqrt_kwota'] = np.sqrt(df['kwota'])
      df['clip'] = np.clip(df['cena'], 0, 1000)  # przytnie do [0, 1000]

      # np.where — warunkowa wartość (szybsze niż apply)
      df['kategoria'] = np.where(df['kwota'] > 1000, 'premium', 'standard')

      # np.select — wiele warunków
      conditions = [df['kwota'] < 100, df['kwota'] < 500, df['kwota'] >= 500]
      choices = ['niski', 'sredni', 'wysoki']
      df['tier'] = np.select(conditions, choices, default='unknown')

  - name: Matplotlib / Seaborn — wizualizacja
    desc: Pandas ma wbudowaną integrację z Matplotlib przez .plot(). Seaborn rozszerza o statystyczne wykresy.
    icon: "📈"
    code: |
      import pandas as pd
      import matplotlib.pyplot as plt
      import seaborn as sns

      # Pandas .plot() — szybkie wykresy
      df['kwota'].plot(title='Kwoty')
      df.plot(x='data', y='kwota', kind='line')
      df['kategoria'].value_counts().plot(kind='bar')
      df[['Q1', 'Q2', 'Q3']].plot(kind='box')

      # Histogram
      df['wiek'].plot(kind='hist', bins=20, figsize=(10, 6))
      plt.show()

      # Seaborn — czytelne wykresy statystyczne
      sns.heatmap(df.corr(numeric_only=True), annot=True, cmap='coolwarm')
      sns.boxplot(data=df, x='kategoria', y='kwota')
      sns.scatterplot(data=df, x='wiek', y='wynagrodzenie', hue='miasto')
      sns.histplot(data=df, x='kwota', kde=True)  # histogram + KDE

      plt.tight_layout()
      plt.savefig('wykres.png', dpi=150, bbox_inches='tight')

  - name: SQLAlchemy — read_sql i to_sql
    desc: SQLAlchemy to most między Pandas a relacyjnymi bazami — wczytuj i zapisuj DataFrame przez SQL.
    icon: "🗄️"
    code: |
      import pandas as pd
      from sqlalchemy import create_engine, text

      # Połączenia z różnymi bazami
      engine_pg   = create_engine('postgresql+psycopg2://user:pass@host/db')
      engine_mysql = create_engine('mysql+pymysql://user:pass@host/db')
      engine_sqlite = create_engine('sqlite:///local.db')

      # Wczytaj całą tabelę
      df = pd.read_sql_table('orders', con=engine_pg)

      # Wczytaj wynik SQL
      df = pd.read_sql("SELECT * FROM orders WHERE year = 2024", con=engine_pg)

      # Parametryzowane zapytanie
      with engine_pg.connect() as con:
          df = pd.read_sql(
              text("SELECT * FROM orders WHERE region = :r"),
              con=con,
              params={'r': 'Kraków'}
          )

      # Zapisz DataFrame do bazy
