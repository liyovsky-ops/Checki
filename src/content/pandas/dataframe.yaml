title: DataFrame & Series

items:
  - name: Tworzenie DataFrame z dict
    desc: Najprostszy sposób — słownik, gdzie klucze to nazwy kolumn, wartości to listy danych tej samej długości.
    icon: "📋"
    code: |
      import pandas as pd

      df = pd.DataFrame({
          'imie': ['Anna', 'Bartek', 'Celina'],
          'wiek': [25, 30, 28],
          'miasto': ['Kraków', 'Warszawa', 'Gdańsk'],
          'wynagrodzenie': [5000.0, 7500.0, 6200.0]
      })
      print(df)
      #      imie  wiek    miasto  wynagrodzenie
      # 0    Anna    25    Kraków         5000.0
      # 1  Bartek    30  Warszawa         7500.0
      # 2  Celina    28    Gdańsk         6200.0

  - name: Tworzenie DataFrame z CSV / JSON / NumPy
    desc: Wczytywanie danych z zewnętrznych źródeł — najczęstszy przypadek w pracy z danymi.
    icon: "📂"
    code: |
      import pandas as pd
      import numpy as np

      # Z CSV
      df_csv = pd.read_csv('dane.csv', sep=';', encoding='utf-8')

      # Z JSON
      df_json = pd.read_json('dane.json', orient='records')

      # Z numpy array
      arr = np.random.randn(100, 3)
      df_np = pd.DataFrame(arr, columns=['x', 'y', 'z'])

      # Z listy dict (np. z API)
      records = [{'id': 1, 'val': 10}, {'id': 2, 'val': 20}]
      df_rec = pd.DataFrame(records)

      # Sprawdź
      print(df_np.shape)   # (100, 3)
      print(df_np.head(3))

  - name: Indeksowanie .loc i .iloc
    desc: ".loc — etykiety (nazwy), .iloc — pozycje (numery). Kluczowa różnica do zapamiętania."
    icon: "🎯"
    code: |
      df = pd.DataFrame({'a': [10, 20, 30], 'b': [1.1, 2.2, 3.3]},
                        index=['x', 'y', 'z'])

      # .loc — etykiety wierszy i kolumn
      print(df.loc['x'])           # wiersz 'x'
      print(df.loc['x', 'a'])      # wartość: 10
      print(df.loc['x':'y', 'a'])  # wiersze x,y, kolumna a

      # .iloc — pozycje (0-based)
      print(df.iloc[0])            # pierwszy wiersz
      print(df.iloc[0, 0])         # wartość: 10
      print(df.iloc[0:2, :])       # pierwsze 2 wiersze, wszystkie kolumny

      # .at — pojedyncza wartość (szybsze niż .loc dla skalara)
      df.at['x', 'a'] = 99
      print(df.at['x', 'a'])       # 99

  - name: Filtrowanie wierszy (boolean indexing)
    desc: Wybieranie wierszy spełniających warunki. Podstawowa operacja analizy danych.
    icon: "🔍"
    code: |
      df = pd.read_csv('pracownicy.csv')

      # Prosty warunek
      senior = df[df['wiek'] > 40]

      # Kilka warunków (& = AND, | = OR, ~ = NOT)
      wynik = df[(df['wiek'] > 30) & (df['wynagrodzenie'] > 6000)]

      # Filtrowanie po liście wartości
      wybrane = df[df['miasto'].isin(['Kraków', 'Gdańsk'])]

      # Wykluczenie
      nie_kraków = df[~df['miasto'].isin(['Kraków'])]

      # Filtrowanie stringów
      anna = df[df['imie'].str.startswith('A')]

      # query() — czytelna alternatywa
      wynik2 = df.query("wiek > 30 and wynagrodzenie > 6000")

  - name: Zarządzanie kolumnami (add / drop / rename)
    desc: Dodawanie nowych kolumn, usuwanie niepotrzebnych, zmiana nazw — podstawa transformacji danych.
    icon: "✏️"
    code: |
      # Nowa kolumna — obliczona
      df['pensja_netto'] = df['wynagrodzenie'] * 0.82

      # Nowa kolumna z warunkiem
      df['senior'] = df['wiek'] >= 40

      # Nowa kolumna z assign (chainable, nie mutuje oryginału)
      df = df.assign(
          bonus=df['wynagrodzenie'] * 0.1,
          pełne_imie=df['imie'] + ' ' + df['nazwisko']
      )

      # Usuń kolumny
      df = df.drop(columns=['zbedna1', 'zbedna2'])
      df.drop(columns=['col'], inplace=True)  # w miejscu

      # Zmień nazwy kolumn
      df = df.rename(columns={
          'imie': 'first_name',
          'wiek': 'age'
      })

      # Zmień wszystkie nazwy na lowercase
      df.columns = df.columns.str.lower().str.replace(' ', '_')

  - name: Typy danych i konwersja (dtypes / astype)
    desc: Kontrola typów danych ma ogromny wpływ na wydajność i poprawność obliczeń.
    icon: "🏷️"
    code: |
      # Sprawdź typy
      print(df.dtypes)
      print(df['wiek'].dtype)   # dtype('int64')

      # Konwersja typów
      df['wiek'] = df['wiek'].astype('int32')          # mniej pamięci
      df['cena'] = df['cena'].astype('float32')
      df['kategoria'] = df['kategoria'].astype('category')  # oszczędność pamięci dla stringów

      # Konwersja z obsługą błędów
      df['kwota'] = pd.to_numeric(df['kwota'], errors='coerce')  # NaN dla błędów

      # Daty
      df['data'] = pd.to_datetime(df['data'], format='%Y-%m-%d')

      # Sprawdź użycie pamięci
      print(df.memory_usage(deep=True).sum() / 1024**2, 'MB')

  - name: Widoki vs kopie (SettingWithCopyWarning)
    desc: Jeden z najczęstszych problemów w Pandas — modyfikacja kopii zamiast oryginału.
    icon: "⚠️"
    code: |
      # PROBLEM — chained indexing tworzy kopię
      df_sub = df[df['wiek'] > 30]
      df_sub['bonus'] = 1000  # SettingWithCopyWarning! Nie modyfikuje df

      # ROZWIĄZANIE 1 — explicit copy
      df_sub = df[df['wiek'] > 30].copy()
      df_sub['bonus'] = 1000  # OK — modyfikujesz kopię świadomie

      # ROZWIĄZANIE 2 — .loc na oryginale
      df.loc[df['wiek'] > 30, 'bonus'] = 1000  # OK — modyfikuje oryginał

      # Pandas 2.0+ — Copy-on-Write (CoW) domyślnie w Pandas 3.0
      pd.options.mode.copy_on_write = True  # włącz ręcznie w 2.x

  - name: Informacje o DataFrame
    desc: Podstawowe metody do inspekcji struktury i zawartości danych.
    icon: "🔬"
    code: |
      # Kształt i rozmiar
      print(df.shape)        # (wiersze, kolumny)
      print(len(df))         # liczba wierszy
      print(df.size)         # wiersze × kolumny

      # Podgląd
      df.head(10)            # pierwsze 10 wierszy
      df.tail(5)             # ostatnie 5
      df.sample(5)           # losowe 5

      # Informacje o strukturze
      df.info()              # dtypes, non-null count, pamięć
      df.describe()          # statystyki liczbowe (count, mean, std...)
      df.describe(include='all')  # też kolumny object/category

      # Wartości unikalne
      df['miasto'].unique()         # array unikalnych wartości
      df['miasto'].nunique()        # liczba unikalnych
      df['miasto'].value_counts()   # ile razy każda wartość
