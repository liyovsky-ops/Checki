title: Ekosystem Shadcn/ui

items:
  - name: next-themes
    desc: "Dark mode dla Next.js. Przechowuje preferencję w localStorage, synchronizuje z systemem OS, dodaje klasę 'dark' na html. Wymaga darkMode: 'class' w tailwind.config."
    icon: "🌙"
  - name: react-hook-form
    desc: "Performant formularze bez zbędnych re-renderów. Shadcn/ui Form components są zaprojektowane specjalnie pod react-hook-form. useForm() + Controller + FormField = kompletna obsługa."
    icon: "📝"
  - name: zod
    desc: "Schema validation dla TypeScript. Definiujesz schemat raz — walidacja runtime i typy TypeScript w jednym. zodResolver() łączy zod z react-hook-form."
    icon: "🛡️"
  - name: "@tanstack/react-table"
    desc: "Headless table library (React Table v8). DataTable shadcn jest zbudowany na TanStack Table. Sorting, filtering, pagination, row selection, wirtualizacja — wszystko oparte na hooks."
    icon: "📊"
  - name: recharts
    desc: "Biblioteka wykresów oparta na SVG i D3. Shadcn/ui Charts to wrapper na recharts z design tokenami CSS variables. AreaChart, BarChart, LineChart, PieChart, RadarChart."
    icon: "📈"
  - name: sonner
    desc: "Nowoczesne toasty — następca react-hot-toast. Piękne animacje, pozycjonowanie, promise toast, action buttons. Shadcn dostarcza wrapper <Sonner /> zintegrowany z design system."
    icon: "🔔"
  - name: cmdk
    desc: "Command palette library. Shadcn/ui Command component to oparty na cmdk. Command, CommandInput, CommandList, CommandItem — fuzzy search, keyboard navigation."
    icon: "⌘"
  - name: vaul
    desc: "Drawer library od autora shadcn. Animowany slide-up panel z Radix Dialog. Idealny do mobile — drag-to-close, snap points. Shadcn Drawer component używa vaul."
    icon: "↑"
  - name: lucide-react
    desc: "Domyślna biblioteka ikon w shadcn/ui — ponad 1500 ikon SVG jako React components. Konsistentny styl, 24x24 grid, stroke-based. Import: import { IconName } from 'lucide-react'."
    icon: "✨"
  - name: "@radix-ui/react-icons"
    desc: "Oficjalne ikony Radix — mniejszy zestaw (230 ikon), doskonale pasujące do shadcn designu. Alternatywa dla lucide. Import: import { StarIcon } from '@radix-ui/react-icons'."
    icon: "◉"
  - name: tailwindcss-animate
    desc: "Plugin Tailwind z gotowymi animacjami — animate-in, animate-out, fade-in, slide-in-from-bottom, zoom-in. Shadcn używa go do animacji komponentów (Dialog, Dropdown, Tooltip)."
    icon: "🎬"
  - name: "shadcn/ui Blocks"
    desc: "Gotowe sekcje stron od shadcn — dashboard layouts, landing pages, auth pages, settings. Pełny kod do skopiowania. blocks.shadcn.com — katalog z podglądem i kodem."
    icon: "🧱"
