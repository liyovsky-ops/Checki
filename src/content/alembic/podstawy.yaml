labels:
  concepts: Kluczowe koncepcje
  whenToUse: Kiedy używać Alembic?
  firstComponent: Konfiguracja projektu
  firstComponentLang: Python

intro:
  title: Czym jest Alembic?
  desc: >
    Alembic to narzędzie do migracji baz danych dla SQLAlchemy — wersjonuje schemat bazy
    tak jak git wersjonuje kod. Każda zmiana schematu (dodanie tabeli, kolumny, indeksu) to
    osobna migracja z unikalnym ID, którą można aplikować i cofać. Tworzony przez Mike Bayera,
    autora SQLAlchemy.

concepts:
  - title: Revision (wersja)
    desc: >
      Każda migracja to plik revision z unikalnym ID heksadecymalnym (np. a1b2c3d4e5f6).
      Plik zawiera funkcje upgrade() i downgrade() — jak zaaplikować zmianę i jak ją cofnąć.
      Migracje tworzą łańcuch przez down_revision wskazujący na poprzednią.
    icon: "📄"
  - title: Head
    desc: >
      Head to najnowsza wersja migracji — "tip" łańcucha historii. alembic upgrade head
      aplikuje wszystkie migracje od aktualnej wersji do najnowszej. Możesz mieć wiele
      aktywnych heads (multiple heads) przy branchingu.
    icon: "🎯"
  - title: alembic.ini + env.py
    desc: >
      alembic.ini to główny plik konfiguracji — URL bazy, ścieżka do katalogu migracji,
      format logowania. env.py to skrypt który uruchamia migracje i łączy Alembic z modelami
      SQLAlchemy przez target_metadata = Base.metadata.
    icon: "⚙️"
  - title: Autogenerate
    desc: >
      alembic revision --autogenerate porównuje modele SQLAlchemy ze stanem bazy danych
      i generuje migrację z potrzebnymi zmianami. Wykrywa nowe/usunięte tabele, kolumny,
      indeksy i klucze obce — ogromna oszczędność czasu przy dużych modelach.
    icon: "⚡"

whenToUse:
  - Zarządzanie schematem bazy danych w projektach SQLAlchemy (FastAPI, Flask, Django z SQLAlchemy)
  - CI/CD — automatyczne aplikowanie migracji przy każdym deploymencie
  - Praca zespołowa — każdy developer commituje swoje migracje do repozytorium
  - Możliwość bezpiecznego cofnięcia zmian schematu (downgrade) przy problemach produkcyjnych
  - Śledzenie historii zmian struktury bazy jako część historii gita
  - "NIE DO: baz bez SQLAlchemy (MongoDB, czyste SQL) — użyj Flyway lub Liquibase"

firstComponent: |
  # 1. Instalacja
  pip install alembic sqlalchemy

  # 2. Inicjalizuj Alembic w projekcie
  alembic init migrations

  # Tworzy strukturę:
  # alembic.ini              — konfiguracja globalna
  # migrations/
  #   env.py                 — konfiguracja środowiska migracji
  #   script.py.mako         — szablon nowych migracji
  #   versions/              — pliki migracji (revision files)

  # 3. alembic.ini — wskaż URL bazy danych:
  # sqlalchemy.url = postgresql+psycopg2://user:pass@localhost/mydb

  # 4. migrations/env.py — podepnij modele SQLAlchemy:
  from myapp.database import Base  # Twoja klasa Base

  target_metadata = Base.metadata  # Alembic czyta stąd schematy

  # 5. Skonfiguruj URL dynamicznie przez zmienną środowiskową:
  import os
  config.set_main_option("sqlalchemy.url", os.environ["DATABASE_URL"])
