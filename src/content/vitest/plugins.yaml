title: Ekosystem Vitest

items:
  - name: "@vitest/ui"
    desc: Przeglądarkowy dashboard do przeglądania testów — drzewo, statusy, re-run, coverage view, module graph. npx vitest --ui.
    icon: "🖥️"
  - name: "@vitest/coverage-v8"
    desc: Coverage provider oparty na V8 — szybszy niż Istanbul. Native code coverage bez instrumentacji. Raport HTML, text, lcov.
    icon: "📊"
  - name: "@vitest/coverage-istanbul"
    desc: Coverage provider Istanbul — tradycyjny, dokładniejszy niż V8 dla edge cases. Kompatybilny z existing Istanbul tooling.
    icon: "📈"
  - name: "@testing-library/react"
    desc: React Testing Library dla Vitest — render, screen, fireEvent, waitFor. Testuj React komponenty jak użytkownik, nie jak developer.
    icon: "⚛️"
  - name: "@testing-library/vue"
    desc: Vue Testing Library — analogicznie do React Testing Library. mount, screen, fireEvent dla Vue 3 components.
    icon: "💚"
  - name: msw (Mock Service Worker)
    desc: Interceptuje HTTP na poziomie network — mockuj API bez zmian w kodzie. rest.get, graphql.query handlers. Działa w testach i w przeglądarce.
    icon: "🌐"
  - name: happy-dom
    desc: Szybsza alternatywa dla jsdom — DOM implementation w czystym JS. 2-3× szybszy niż jsdom. Mniej features ale wystarczający dla większości testów.
    icon: "😊"
  - name: vitest-fetch-mock
    desc: Mock dla global fetch() — automatyczne mockowanie HTTP w testach. fetchMock.mockResponseOnce(JSON.stringify(data)).
    icon: "📡"
