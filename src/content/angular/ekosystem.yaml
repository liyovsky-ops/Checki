title: Ekosystem Angular

items:
  - name: Angular Material
    desc: Oficjalna biblioteka komponentów UI od Google — Material Design. Buttons, dialogs, tables, forms, navigation, autocomplete. Doskonała dostępność (a11y).
    icon: "🎨"
  - name: Angular CDK (Component Dev Kit)
    desc: Niskopoziomowe prymitywy do budowania własnych komponentów — drag & drop, virtual scroll, overlays, accessibility. Bazą dla Angular Material.
    icon: "🧱"
  - name: NgRx
    desc: Redux-like state management dla Angular. Actions, reducers, effects, selectors. Standard w enterprise Angular apps. Entity adapter dla CRUD.
    icon: "📦"
  - name: RxJS
    desc: Reactive Extensions — biblioteka reactive programming wbudowana w Angular. Observables, operators (map, filter, switchMap). Fundament Angular HTTP i form handling.
    icon: "🔄"
  - name: Angular Universal
    desc: Server-Side Rendering (SSR) dla Angular. Pre-renderuje strony na serwerze — lepsze SEO, szybszy First Contentful Paint. Zintegrowane z Angular CLI.
    icon: "🌐"
  - name: Nx
    desc: Build system i monorepo manager. Inteligentny cache, affected commands, code generators, dependency graph visualization. Standard dla enterprise Angular monorepos.
    icon: "🏗️"
  - name: Compodoc
    desc: Automatyczna dokumentacja projektu Angular — generuje HTML docs z dekoratorów, typów, komentarzy. Dependency graphs, coverage report.
    icon: "📚"
  - name: Transloco / ngx-translate
    desc: Internationalization (i18n) dla Angular. Transloco (nowszy, reactive) vs ngx-translate (dojrzały). Lazy loading tłumaczeń, pluralizacja, ICU format.
    icon: "🌍"
