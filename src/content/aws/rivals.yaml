title: AWS vs inne platformy cloud

items:
  - name: Microsoft Azure
    icon: "🔷"
    color: "#0078d4"
    tagline: Drugi największy cloud — mocny w enterprise Microsoft stack
    pros:
      - Natywna integracja z Active Directory, Office 365, .NET, SQL Server
      - Azure DevOps — jeden z najlepszych CI/CD pipeline w branży
      - Compliance w Europie — świetne certyfikacje dla sektora publicznego
      - Hybrid cloud z on-premises Windows (Azure Arc, Azure Stack)
    cons:
      - Mniejsza liczba serwisów niż AWS (100 vs 200+)
      - ML/AI dojrzalszy w AWS (SageMaker vs Azure ML)
      - Lambda dojrzalsza niż Azure Functions
      - Mniejszy ekosystem partnerów
    vs: Azure gdy firma używa Microsoft stack (Windows, .NET, AD, SQL Server). AWS dla reszty — większy ekosystem, więcej serwisów, lider rynku.

  - name: Google Cloud Platform (GCP)
    icon: "🟡"
    color: "#4285f4"
    tagline: Najlepsza sieć globalna — AI/ML i Big Data
    pros:
      - Vertex AI i TPU — najlepszy dostęp do modeli Google (Gemini)
      - BigQuery — serverless data warehouse (petabajty w sekundy)
      - GKE — najdojrzalszy managed Kubernetes (Google stworzył K8s)
      - Sieć Google — najniższa latencja między regionami
    cons:
      - Mniejsze enterprise adoption niż AWS/Azure
      - Mniejsza liczba serwisów niż AWS
      - Historycznie słabszy support
      - Mniejsza liczba regionów
    vs: GCP dla AI/ML (Vertex AI, TPU), Big Data (BigQuery), Kubernetes. AWS dla ogólnych workloadów i enterprise z pełnym ekosystemem.

  - name: DigitalOcean
    icon: "🌊"
    color: "#0080ff"
    tagline: Developer-friendly cloud — proste ceny dla startupów
    pros:
      - Prosta UI i przewidywalne flat-rate ceny
      - Droplet gotowy w 55 sekund
      - Świetna dokumentacja — jedne z najlepszych tutoriali w branży
      - App Platform (Heroku-like) — push git → deploy
    cons:
      - Brak managed ML, advanced security, enterprise serwisów
      - Nie obsłuży enterprise scale
      - Ograniczone compliance certyfikacje
      - ~15 datacenter vs AWS 30+ regionów
    vs: DigitalOcean dla startupów, indie devs i małych firm gdzie flat-rate $6-200/mies wystarczy. AWS dla enterprise i gdy potrzebujesz zaawansowanych managed serwisów.

  - name: Hetzner Cloud
    icon: "🟠"
    color: "#d50c2d"
    tagline: Najtańszy cloud EU — bootstrapowe projekty i self-hosting
    pros:
      - Najtańszy w przeliczeniu na wydajność — CX22 €3.79/mies (vs AWS ~$18)
      - 20TB/mies traffic wliczone — zero niespodzianek na rachunku
      - Object Storage S3-compatible za ułamek ceny S3
      - Lokalizacje EU (DE, FI) i US
    cons:
      - Zero managed serwisów (brak RDS, Lambda, ML)
      - Brak Marketplace i partnerów
      - Ograniczony support
      - Brak HIPAA, SOC 2 i enterprise compliance
    vs: Hetzner dla self-hostingu (Postgres, Redis, MinIO, Gitea) i projektów gdzie liczy się cena. AWS gdy potrzebujesz managed serwisów lub enterprise compliance.

  - name: Vercel & Netlify
    icon: "▲"
    color: "#000000"
    tagline: Serverless hosting dla frontend — zero DevOps
    pros:
      - Git push → automatyczny deploy (zero konfiguracji CI/CD)
      - Globalny CDN out of the box
      - Darmowy tier wystarczający dla indie projektów
      - Vercel — pierwszoklasowy support Next.js (ISR, Server Actions)
    cons:
      - Tylko dla frontend/statycznych stron i serverless functions
      - Vendor lock-in (zwłaszcza Vercel + Next.js)
      - Kosztowne przy dużym ruchu vs DIY na AWS/Hetzner
      - Brak pełnego backendu (bazy, kolejki)
    vs: Vercel/Netlify dla frontend bez DevOps (Next.js, React, Vue). AWS gdy potrzebujesz pełnego backendu, baz danych, ML. Można łączyć — frontend na Vercel, backend na AWS Lambda.
