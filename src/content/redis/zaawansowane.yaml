  - name: Cache patterns — wzorce cache
    icon: "⚡"
    desc: Cache-aside, write-through, cache invalidation — sprawdzone wzorce używania Redis jako cache przed bazą danych.
    code: |
      # Cache-Aside (lazy loading) — najczęstszy wzorzec
      # 1. Sprawdź cache → 2. Jeśli miss — pobierz z DB → 3. Zapisz do cache

      # Pseudo-kod (Python)
      # def get_product(product_id):
      #     cache_key = f"product:{product_id}"
      #     cached = r.get(cache_key)
      #     if cached:
      #         return json.loads(cached)     # cache HIT
      #     product = db.get_product(product_id)  # cache MISS
      #     r.setex(cache_key, 3600, json.dumps(product))  # cache na 1h
      #     return product

      # Write-Through — zapisz do cache i DB jednocześnie
      # def update_product(product_id, data):
      #     db.update_product(product_id, data)   # najpierw DB
      #     r.setex(f"product:{product_id}", 3600, json.dumps(data))

      # Cache invalidation — usuń cache po zmianie
      # def update_product(product_id, data):
      #     db.update_product(product_id, data)
      #     r.delete(f"product:{product_id}")     # usuń stary cache
      #     r.delete("products:list:*")           # usuń listy (pattern delete)

      # Wzorzec: Cache ze stemplem czasu (stale-while-revalidate)
      SET product:42 '{"name":"Laptop","price":2999}' EX 3600

      # Batch cache (wiele produktów naraz)
      MSET product:1 "{...}" product:2 "{...}" product:3 "{...}"
      MGET product:1 product:2 product:3

      # Rate limiting z Redis
      INCR  rate:192.168.1.1
      EXPIRE rate:192.168.1.1 60   # reset co minutę
      # Jeśli INCR > 100 → odrzuć request

      # Lepsza atomowość rate limiting (SET jeśli nie istnieje):
      SET rate:192.168.1.1 1 NX EX 60
      # Jeśli OK → pierwszy request, ustaw TTL
      INCR rate:192.168.1.1
      # Sprawdź wynik → jeśli > limit → reject

  - name: Keyspace Notifications — reagowanie na zdarzenia
    icon: "🔔"
    desc: Subskrybuj zdarzenia Redis — wygasanie kluczy (TTL=0), zapis, usunięcie. Używane do automatycznych akcji po zdarzeniach w cache.
    code: |
      # Włącz powiadomienia w redis.conf lub przez CONFIG SET
      CONFIG SET notify-keyspace-events KEA
      # K = Keyspace events (klucze)
      # E = Keyevent events (komendy)
      # A = alias dla g$lzxetd (wszystkie)
      # x = tylko expired events
      # g = generic (DEL, EXPIRE, RENAME)
      # l = list commands

      # Subskrybuj wygasające klucze
      SUBSCRIBE __keyevent@0__:expired
      # Teraz gdy jakikolwiek klucz wygaśnie w DB 0 → dostaniesz powiadomienie

      # Subskrybuj operacje na konkretnym kluczu
      SUBSCRIBE __keyspace@0__:session:abc123
      # Dostaniesz powiadomienie przy każdej operacji na tym kluczu

