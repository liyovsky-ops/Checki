title: Zaawansowane funkcje Redis

items:
  - name: Pub/Sub — wiadomości w czasie rzeczywistym
    icon: "📡"
    desc: Publisher/Subscriber — kanały wiadomości. Używane do powiadomień, live chat, WebSocket broadcasting, invalidacji cache.
    code: |
      # SUBSCRIBER — subskrybuj kanał (terminal 1)
      SUBSCRIBE notifications
      SUBSCRIBE chat:room:42
      # Czeka na wiadomości...

      # Subskrypcja wzorcowa
      PSUBSCRIBE user:*:events     # wszystkie zdarzenia dowolnego usera
      PSUBSCRIBE chat:*            # wszystkie kanały chat

      # PUBLISHER — wyślij wiadomość (terminal 2)
      PUBLISH notifications "Nowe zamówienie #1234"
      PUBLISH chat:room:42 '{"user":"Jan","msg":"Cześć!"}'
      PUBLISH user:42:events "login"

      # Sprawdź aktywne kanały
      PUBSUB CHANNELS *            # wszystkie aktywne kanały
      PUBSUB CHANNELS user:*       # kanały pasujące do wzorca
      PUBSUB NUMSUB notifications  # ile subskrybentów na kanale

      # Python — redis-py pub/sub
      # import redis
      # r = redis.Redis()
      # pubsub = r.pubsub()
      # pubsub.subscribe('notifications')
      # for message in pubsub.listen():
      #     if message['type'] == 'message':
      #         print(message['data'])

      # Uwaga: Pub/Sub NIE ma persistencji.
      # Jeśli subscriber jest offline — wiadomość przepada.
      # Dla niezawodnych kolejek użyj Streams (XADD/XREADGROUP).

  - name: Transakcje — MULTI/EXEC
    icon: "🔄"
    desc: Grupowanie komend w atomową transakcję. WATCH do optimistic locking — wykrywanie zmian przed wykonaniem.
    code: |
      # Podstawowa transakcja
      MULTI                        # zacznij transakcję
      SET counter 100
      INCR counter
      LPUSH log "zmiana"
      EXEC                         # wykonaj wszystkie atomowo

      # DISCARD — anuluj transakcję
      MULTI
      SET counter 0
      DISCARD                      # anuluj — nic nie zmienione

      # WATCH — optimistic locking
      # Scenariusz: pobierz saldo, dodaj 100, zapisz
      # Ale ktoś inny może zmienić saldo w międzyczasie!

      WATCH account:42:balance
      # Pobierz aktualną wartość
      GET account:42:balance       # "500"

      MULTI
      SET account:42:balance 600   # 500 + 100
      EXEC
      # Jeśli ktoś zmienił account:42:balance po WATCH:
      # EXEC zwróci nil — transakcja anulowana → spróbuj ponownie

      # Pipelining — wyślij wiele komend bez czekania na odpowiedź
      # (nie jest transakcją, ale redukuje round-trips sieciowe)
      # W redis-py:
      # pipe = r.pipeline()
      # pipe.set("a", 1)
      # pipe.set("b", 2)
      # pipe.incr("a")
      # results = pipe.execute()  # wyślij wszystko naraz

  - name: Lua Scripting — atomowe skrypty
    icon: "🌙"
    desc: Wykonaj dowolny skrypt Lua atomowo po stronie serwera. Zero race conditions. EVALSHA dla powtarzalnych skryptów.
    code: |
      # EVAL — wykonaj skrypt Lua
      # EVAL skrypt liczba_kluczy klucz1 ... arg1 ...
      EVAL "return redis.call('GET', KEYS[1])" 1 mykey

      # Rate limiting w Lua (atomowy!)
      EVAL "
          local key = KEYS[1]
          local limit = tonumber(ARGV[1])
          local ttl = tonumber(ARGV[2])
          local current = redis.call('INCR', key)
          if current == 1 then
              redis.call('EXPIRE', key, ttl)
          end
          if current > limit then
              return 0
          end
          return 1
      " 1 rate:192.168.1.1 100 3600
      # 1 = ok, 0 = przekroczono limit

      # CAS (Compare-And-Swap) atomowo
      EVAL "
          local current = redis.call('GET', KEYS[1])
          if current == ARGV[1] then
              redis.call('SET', KEYS[1], ARGV[2])
              return 1
          end
          return 0
      " 1 status "pending" "processing"

      # Załaduj skrypt i pobierz SHA (dla wydajności)
      SCRIPT LOAD "return redis.call('GET', KEYS[1])"
      # "e0e1f9fabfa9d353e4a66282db91b21847b3ef4e"

      # Wywołaj przez SHA (bez przesyłania kodu)
      EVALSHA e0e1f9fabfa9d353e4a66282db91b21847b3ef4e 1 mykey

      # Wyczyść cache skryptów
      SCRIPT FLUSH

  - name: Distributed Lock — mutex
    icon: "🔐"
    desc: Redlock — rozproszony lock. Jeden proces na raz wykonuje krytyczną sekcję. Używany przy płatnościach, wysyłce emaili, cron-jobach.
    code: |
      # Prosty lock przez SET NX EX
      SET lock:payment:42 "worker-1" NX EX 30
      # NX = tylko gdy nie istnieje
      # EX 30 = wygaśnie za 30s (dead-lock prevention)
      # Zwraca OK = lock zdobyty, nil = ktoś inny ma lock

      # Zwolnij lock TYLKO jeśli to twój (atomowy Lua!)
      EVAL "
          if redis.call('GET', KEYS[1]) == ARGV[1] then
              return redis.call('DEL', KEYS[1])
          else
              return 0
          end
      " 1 lock:payment:42 "worker-1"

      # Przedłuż lock jeśli potrzebujesz więcej czasu
      EVAL "
          if redis.call('GET', KEYS[1]) == ARGV[1] then
              return redis.call('EXPIRE', KEYS[1], ARGV[2])
          else
              return 0
          end
      " 1 lock:payment:42 "worker-1" 30

      # Biblioteka Redlock (Python)
      # pip install redis redlock-py
      # from redlock import Redlock
      # dlm = Redlock([{"host": "localhost", "port": 6379}])
      # lock = dlm.lock("payment:42", 10000)  # 10s
