title: "Komendy Hugging Face"

groups:
  - name: "Hub CLI"
    icon: "🌐"
    commands:
      - cmd: "huggingface-cli login"
        desc: "Zaloguj się do Hugging Face Hub"
        detail:
          what: "Interaktywny login — pyta o token dostępu z Hub Settings -> Access Tokens."
          how: "Token zapisywany lokalnie w ~/.huggingface/token. Wymagany do push_to_hub i prywatnych modeli."
          tips:
            - "huggingface-cli login --token hf_... — nieinteraktywny (dla CI/CD)"
            - "Alternatywa: export HF_TOKEN=hf_... w .env"
      - cmd: "huggingface-cli whoami"
        desc: "Sprawdź zalogowanego użytkownika"
        detail:
          what: "Wyświetla nazwę użytkownika i informacje o tokenie dostępu."
          how: "Przydatne do weryfikacji że jesteś zalogowany przed push_to_hub."
          tips:
            - "Zwraca 'Not logged in' jeśli brak tokenu"
            - "huggingface-cli env — wyświetla zmienne środowiskowe HF"
      - cmd: "huggingface-cli download bert-base-uncased"
        desc: "Pobierz model z Hub do lokalnego cache"
        detail:
          what: "Pobiera wszystkie pliki modelu (wagi, config, tokenizer) do ~/.cache/huggingface/hub/."
          how: "Przydatne do pobierania modeli z wyprzedzeniem przed inferecją offline."
          tips:
            - "huggingface-cli download bert-base-uncased --local-dir ./bert — do konkretnego katalogu"
            - "huggingface-cli download owner/repo filename.bin — konkretny plik"
      - cmd: "huggingface-cli upload moj-model ./model-dir"
        desc: "Wgraj katalog z modelem na Hub"
        detail:
          what: "Uploaduje wszystkie pliki z katalogu do repozytorium na Hub."
          how: "Wymaga zalogowania. Automatycznie tworzy repozytorium jeśli nie istnieje."
          tips:
            - "huggingface-cli upload --repo-type dataset moj-dataset ./data-dir — upload datasetu"
            - "Automatyczny LFS dla plików > 10MB"
      - cmd: "huggingface-cli scan-cache"
        desc: "Skanuj lokalny cache Hub — pokaż pobrane modele i rozmiary"
        detail:
          what: "Wyświetla wszystkie modele i datasety w ~/.cache/huggingface/hub/ z rozmiarami."
          how: "Pomaga zarządzać miejscem na dysku — modele LLM zajmują gigabajty."
          tips:
            - "huggingface-cli delete-cache — interaktywne usuwanie niepotrzebnych modeli"
            - "Cache może rosnąć do setek GB jeśli testujesz wiele modeli"
      - cmd: "huggingface-cli repo create my-model --type model"
        desc: "Utwórz nowe repozytorium na Hub"
        detail:
          what: "Tworzy puste repo na Hub — model, dataset lub Space."
          how: "Typy: model, dataset, space. Repo można też tworzyć przez push_to_hub automatycznie."
          tips:
            - "--private — prywatne repozytorium"
            - "huggingface-cli repo delete owner/repo — usuń repozytorium"
      - cmd: "from huggingface_hub import HfApi; api = HfApi(); api.model_info('bert-base-uncased')"
        desc: "Pobierz metadane modelu przez Python API"
        detail:
          what: "HfApi to klient Python do zarządzania Hub — modele, datasety, Spaces."
          how: "model_info zwraca ModelInfo z tagami, rozmiarem, autorami, licencją."
          tips:
            - "api.list_models(search='bert', sort='downloads') — szukaj modeli"
            - "api.list_datasets(author='huggingface') — datasety konkretnego autora"
      - cmd: "from huggingface_hub import hf_hub_download; hf_hub_download('bert-base-uncased', 'config.json')"
        desc: "Pobierz pojedynczy plik z Hub"
        detail:
          what: "Pobiera konkretny plik z repozytorium i zwraca lokalną ścieżkę."
          how: "Przydatne gdy potrzebujesz tylko config.json lub tokenizer.json bez wag."
          tips:
            - "revision='main' — konkretna gałąź, tag lub commit hash"
            - "local_dir='./files' — docelowy katalog zamiast cache"

  - name: "Ładowanie modeli"
    icon: "📥"
    commands:
      - cmd: "from transformers import AutoModelForSequenceClassification, AutoTokenizer"
        desc: "Import Auto klas — automatyczny wybór architektury"
        detail:
          what: "Auto klasy wykrywają architekturę z config.json modelu bez konieczności znajomości nazwy klasy."
          how: "AutoModel, AutoTokenizer, AutoModelForSequenceClassification, AutoModelForCausalLM i wiele innych."
          tips:
            - "Preferuj Auto klasy nad konkretnymi (BertForSequenceClassification) — przenośne dla różnych modeli"
            - "AutoModel.from_pretrained zwraca właściwy model dla podanego checkpoint"
      - cmd: "model = AutoModel.from_pretrained('bert-base-uncased', cache_dir='/my/cache')"
        desc: "Załaduj model z niestandardowego cache"
        detail:
          what: "cache_dir wskazuje gdzie zapisać/szukać modelu. Domyślnie ~/.cache/huggingface/hub/."
          how: "Przydatne w środowiskach współdzielonych lub gdy dysk systemowy ma mało miejsca."
          tips:
            - "Ustaw HF_HOME=/path/to/cache jako zmienną środowiskową — zmienia domyślny cache"
            - "local_files_only=True — tylko lokalny cache, bez internet"
      - cmd: "model = AutoModel.from_pretrained('model', device_map='auto', torch_dtype=torch.float16)"
        desc: "Załaduj duży model z automatycznym podziałem na GPU/CPU"
        detail:
          what: "device_map='auto' automatycznie rozdziela warstwy na dostępne urządzenia (multi-GPU, CPU offload)."
          how: "torch_dtype=float16 zmniejsza VRAM 2x. load_in_4bit=True zmniejsza jeszcze bardziej (QLoRA)."
          tips:
            - "device_map='balanced' — równomierne rozdzielenie na GPU"
            - "max_memory={0: '20GiB', 'cpu': '30GiB'} — limit pamięci per urządzenie"
      - cmd: "tokenizer = AutoTokenizer.from_pretrained('bert-base-uncased', use_fast=True)"
        desc: "Szybki tokenizer (Rust backend) — 10-100x szybszy od tokenizera Python"
        detail:
          what: "use_fast=True (domyślnie) używa tokenizera napisanego w Rust przez bibliotekę tokenizers."
          how: "Fast tokenizers obsługują batch processing równolegle — niezbędne przy dużych datasetach."
          tips:
            - "tokenizer.is_fast — sprawdź czy używasz szybkiego tokenizera"
            - "Przy problemach z fast tokenizer: use_fast=False — fallback do Python"
      - cmd: |
          from transformers import BitsAndBytesConfig
          bnb_config = BitsAndBytesConfig(load_in_4bit=True, bnb_4bit_compute_dtype=torch.float16)
          model = AutoModelForCausalLM.from_pretrained("mistralai/Mistral-7B-v0.1", quantization_config=bnb_config)
        desc: "Załaduj model skwantyzowany do 4-bit (QLoRA)"
        detail:
          what: "BitsAndBytesConfig konfiguruje kwantyzację 4-bit NF4 — model 7B w ~4GB VRAM."
          how: "Wymaga bitsandbytes i GPU CUDA. bnb_4bit_compute_dtype — precyzja obliczeń."
          tips:
            - "load_in_8bit=True — mniej agresywna kwantyzacja, lepsza jakość"
            - "bnb_4bit_use_double_quant=True — podwójna kwantyzacja, jeszcze mniej VRAM"
      - cmd: "model = AutoModel.from_pretrained('model', revision='v1.0', token='hf_...')"
        desc: "Załaduj konkretną wersję modelu z tokenem dostępu"
        detail:
          what: "revision pozwala załadować konkretny commit, branch lub tag z Hub."
          how: "token wymagany dla prywatnych modeli (gated models jak Llama, Gemma)."
          tips:
            - "revision='abc123' — konkretny commit hash dla pełnej reprodukowalności"
            - "trust_remote_code=True — dla modeli z własnym kodem (np. Falcon, Mistral)"

  - name: "Tokenizer ops"
    icon: "🔤"
    commands:
      - cmd: "tokens = tokenizer(text, return_tensors='pt', padding=True, truncation=True, max_length=512)"
        desc: "Tokenizuj tekst z paddingiem i obcięciem"
        detail:
          what: "Kompletna tokenizacja — dodaje padding do tej samej długości, obcina do max_length."
          how: "return_tensors='pt' zwraca tensory PyTorch. Użyj 'tf' dla TensorFlow, 'np' dla NumPy."
          tips:
            - "padding='max_length' — padding do max_length zamiast do najdłuższego w batchu"
            - "return_attention_mask=True (domyślnie) — maska paddingu"
      - cmd: "text = tokenizer.decode(token_ids, skip_special_tokens=True)"
        desc: "Dekoduj tokeny z powrotem do tekstu"
        detail:
          what: "Zamienia listę token ID na ciąg znaków. skip_special_tokens usuwa [CLS], [SEP] itp."
          how: "Używane po generowaniu tekstu żeby uzyskać czytelny output."
          tips:
            - "tokenizer.batch_decode(sequences) — dekoduj cały batch naraz"
            - "clean_up_tokenization_spaces=True — usuń artefakty tokenizacji"
      - cmd: "print(tokenizer.vocab_size, tokenizer.all_special_tokens, tokenizer.model_max_length)"
        desc: "Sprawdź właściwości tokenizera"
        detail:
          what: "vocab_size — ile tokenów w słowniku. all_special_tokens — specjalne tokeny modelu."
          how: "model_max_length — maksymalna długość sekwencji jaką tokenizer/model obsługuje."
          tips:
            - "tokenizer.convert_tokens_to_ids(['[CLS]', '[SEP]']) — ID specjalnych tokenów"
            - "tokenizer.eos_token, tokenizer.pad_token — ważne dla LLM"
      - cmd: "encoded = tokenizer.encode('Hello world', add_special_tokens=True)"
        desc: "Zakoduj tekst do listy token ID"
        detail:
          what: "encode zwraca płaską listę int (token IDs). Różni się od __call__ który zwraca dict."
          how: "add_special_tokens=True dodaje [CLS], [SEP] lub <s>, </s> w zależności od modelu."
          tips:
            - "tokenizer.tokenize('Hello world') — lista stringów tokenów (bez zamiany na ID)"
            - "len(tokenizer.encode(text)) — licz tokeny w tekście"
      - cmd: |
          batch = tokenizer(
              texts,
              padding='longest',
              truncation=True,
              max_length=256,
              return_tensors='pt'
          )
        desc: "Batch tokenizacja listy tekstów"
        detail:
          what: "Tokenizuje listę tekstów jednocześnie z padding do najdłuższego w batchu."
          how: "padding='longest' efektywniejszy niż 'max_length' gdy teksty są krótkie."
          tips:
            - "Szybsze niż tokenizacja w pętli dla każdego tekstu"
            - "batch['input_ids'].shape — (batch_size, seq_len)"
      - cmd: "tokenizer.add_tokens(['[DOMAIN]', '[ENTITY]']); model.resize_token_embeddings(len(tokenizer))"
        desc: "Dodaj nowe tokeny i rozszerz embeddingi modelu"
        detail:
          what: "add_tokens dodaje własne tokeny do słownika. resize_token_embeddings dopasowuje warstwę embeddingów."
          how: "Używane przy fine-tuningu na specjalistycznym języku (medycyna, prawo, kod)."
          tips:
            - "add_special_tokens({'additional_special_tokens': ['[BIO]']}) — dodaj specjalny token"
            - "Po dodaniu tokenów musisz trenować model — nowe embeddingi są losowe"

  - name: "Pipeline inference"
    icon: "🔧"
    commands:
      - cmd: "pipe = pipeline('text-classification', model='...')"
        desc: "Utwórz pipeline dla klasyfikacji tekstu"
        detail:
          what: "Pipeline łączy tokenizer + model + post-processing. Obsługuje batch inference automatycznie."
          how: "Zadania: text-classification, token-classification, question-answering, summarization, translation, text-generation."
          tips:
            - "pipe = pipeline(..., device=0) — uruchom na GPU 0"
            - "pipe(texts, batch_size=32) — batch inference (szybsze)"
      - cmd: "results = pipe(texts, batch_size=32, truncation=True)"
        desc: "Batch inference przez pipeline"
        detail:
          what: "Przetwarza listę tekstów batchami — wydajniejsze niż jeden po drugim."
          how: "batch_size kontroluje ile przykładów GPU przetwarza naraz. Dostosuj do dostępnej VRAM."
          tips:
            - "Dla dużych datasetów użyj pipe(dataset, batch_size=32) — streaming z Dataset"
            - "return_all_scores=True — zwróć prawdopodobieństwa dla wszystkich klas"
      - cmd: "generator = pipeline('text-generation', model='gpt2', max_new_tokens=100)"
        desc: "Pipeline do generowania tekstu"
        detail:
          what: "Generuje tekst na podstawie promptu. max_new_tokens kontroluje długość wyjścia."
          how: "Domyślnie greedy search. Dodaj do_sample=True, temperature, top_p dla kreatywności."
          tips:
            - "num_return_sequences=3 — generuj kilka wariantów"
            - "pad_token_id=tokenizer.eos_token_id — zapobiega ostrzeżeniu o braku pad tokenu"
      - cmd: "classifier = pipeline('zero-shot-classification', model='facebook/bart-large-mnli')"
        desc: "Zero-shot klasyfikacja bez fine-tuningu"
        detail:
          what: "Klasyfikuje tekst do dowolnych kategorii bez trenowania na tych kategorii."
          how: "Używa modelu NLI (Natural Language Inference) do oceny czy tekst pasuje do etykiet."
          tips:
            - "result = classifier('I love Python', candidate_labels=['tech', 'sport', 'cooking'])"
            - "multi_label=True — wiele etykiet naraz (nie sumują się do 1)"
      - cmd: "qa = pipeline('question-answering'); result = qa(question='Who?', context='Text...')"
        desc: "Question Answering — znajdź odpowiedź w tekście"
        detail:
          what: "Extractive QA — wyodrębnia fragment tekstu który jest odpowiedzią na pytanie."
          how: "Zwraca answer (string), score (pewność), start/end (pozycja w tekście)."
          tips:
            - "Model extractive — nie generuje, szuka fragmentu w context"
            - "Użyj model='deepset/roberta-base-squad2' dla lepszej dokładności"
      - cmd: "summarizer = pipeline('summarization', model='facebook/bart-large-cnn')"
        desc: "Streszczanie tekstu przez pipeline"
        detail:
          what: "Abstractive summarization — generuje nowe zdania, nie kopiuje z oryginału."
          how: "min_length, max_length kontrolują długość streszczenia."
          tips:
            - "result = summarizer(text, max_length=130, min_length=30, do_sample=False)"
            - "Dla długich tekstów podziel na chunki — BART obsługuje max ~1024 tokeny"
      - cmd: "translator = pipeline('translation_en_to_fr', model='Helsinki-NLP/opus-mt-en-fr')"
        desc: "Tłumaczenie tekstu przez pipeline"
        detail:
          what: "Pipeline tłumaczeń dla konkretnych par językowych z modeli Helsinki-NLP."
          how: "Helsinki-NLP/opus-mt-XX-YY — tłumaczenie z XX do YY. Ponad 1000 par językowych."
          tips:
            - "result = translator('Hello world', max_length=400)"
            - "Dla wielu języków: Helsinki-NLP/opus-mt-mul-en — multi-lingual do angielskiego"
      - cmd: "ner = pipeline('token-classification', model='dslim/bert-base-NER', aggregation_strategy='simple')"
        desc: "Named Entity Recognition — wykrywaj nazwy własne"
        detail:
          what: "Token classification — każdemu tokenowi przypisuje etykietę (PER, ORG, LOC, MISC)."
          how: "aggregation_strategy='simple' łączy sąsiednie tokeny tej samej encji."
          tips:
            - "grouped_entities=True — starszy alias dla aggregation_strategy"
            - "Wynik: [{entity_group: 'PER', word: 'Jan Kowalski', score: 0.99, start: 0, end: 11}]"
      - cmd: |
          asr = pipeline('automatic-speech-recognition', model='openai/whisper-base')
          result = asr('audio.wav')
        desc: "Transkrypcja mowy na tekst (Whisper)"
        detail:
          what: "ASR pipeline przyjmuje ścieżkę do pliku audio lub numpy array i zwraca transkrypcję."
          how: "Whisper obsługuje wiele języków. chunk_length_s=30 dla długich nagrań."
          tips:
            - "return_timestamps=True — timestamps per słowo lub chunk"
            - "language='pl' — wymuś język (szybsze, dokładniejsze)"

  - name: "Dataset ops"
    icon: "📊"
    commands:
      - cmd: "ds = load_dataset('imdb', split='train')"
        desc: "Załaduj dataset z Hub"
        detail:
          what: "load_dataset pobiera i cache'uje dataset lokalnie. Obsługuje arrow format dla szybkiego dostępu."
          how: "Dostępne datasety: huggingface.co/datasets — ponad 100k zestawów."
          tips:
            - "split='train[:10%]' — załaduj tylko 10% danych"
            - "download_mode='force_redownload' — wymuś ponowne pobranie"
      - cmd: "ds = load_dataset('json', data_files='data.jsonl', split='train')"
        desc: "Załaduj własny dataset z lokalnego pliku"
        detail:
          what: "load_dataset obsługuje lokalne pliki: json, csv, parquet, text, arrow."
          how: "data_files może być glob pattern: 'data/*.jsonl' — wiele plików naraz."
          tips:
            - "load_dataset('csv', data_files={'train': 'train.csv', 'test': 'test.csv'})"
            - "column_names=['text', 'label'] — nadaj nazwy kolumnom"
      - cmd: "ds = ds.map(tokenize_fn, batched=True, num_proc=4)"
        desc: "Tokenizuj dataset wielowątkowo z cache'owaniem"
        detail:
          what: "map() przetwarza każdy przykład i cache'uje wynik — ponowne uruchomienie używa cache."
          how: "batched=True przetwarza batchami (szybsze tokenizatory obsługują batch). num_proc=4 to 4 procesy."
          tips:
            - "remove_columns=['text'] — usuń niepotrzebne kolumny po tokenizacji"
            - "Cache zapisywany w ~/.cache/huggingface/datasets/"
      - cmd: "ds_filtered = ds.filter(lambda x: len(x['text']) > 50)"
        desc: "Filtruj dataset według warunku"
        detail:
          what: "filter() usuwa przykłady które nie spełniają predykatu. Zachowuje resztę niezmienioną."
          how: "batched=True i num_proc=4 działają tak samo jak w map() — szybsze na dużych datasetach."
          tips:
            - "ds.filter(lambda x: x['label'] == 1) — tylko pozytywne przykłady"
            - "Wynik filter jest cache'owany tak samo jak map"
      - cmd: "split = ds.train_test_split(test_size=0.2, seed=42)"
        desc: "Podziel dataset na train/test"
        detail:
          what: "Zwraca DatasetDict z kluczami 'train' i 'test' w podanych proporcjach."
          how: "seed=42 zapewnia reprodukowalność. stratify_by_column='label' dla stratified split."
          tips:
            - "split['train'], split['test'] — dostęp do obu części"
            - "ds.select(range(1000)) — wybierz pierwsze 1000 przykładów"
      - cmd: "ds.push_to_hub('username/dataset-name')"
        desc: "Opublikuj dataset na Hub"
        detail:
          what: "Pushuje dataset do publicznego lub prywatnego repozytorium na Hub."
          how: "Wymaga zalogowania przez huggingface-cli login lub HF_TOKEN env."
          tips:
            - "private=True — prywatne repozytorium"
            - "DatasetDict({'train': train, 'test': test}).push_to_hub(...) — push wielu splitów"
      - cmd: "ds = load_dataset('bigdata/dataset', streaming=True)"
        desc: "Streaming dataset — nie pobieraj wszystkiego na raz"
        detail:
          what: "streaming=True zwraca IterableDataset — dane pobierane na żądanie, bez cache."
          how: "Niezbędne dla datasets > RAM. Obsługuje map/filter ale nie shuffle całości."
          tips:
            - "ds = ds.take(1000) — pierwsze 1000 przykładów ze streamu"
            - "ds.shuffle(buffer_size=10000) — lokalne przetasowanie bufora"
      - cmd: "ds.save_to_disk('./dataset_arrow') && ds = load_from_disk('./dataset_arrow')"
        desc: "Zapisz i załaduj dataset lokalnie (Arrow format)"
        detail:
          what: "save_to_disk zapisuje w wydajnym Arrow format. load_from_disk ładuje bez pobierania z Hub."
          how: "Arrow format szybszy niż CSV/JSON — idealny dla dużych datasetów używanych wielokrotnie."
          tips:
            - "Dużo szybszy niż to_pandas().to_csv() i z powrotem"
            - "Zachowuje schemę danych (dtypes, feature names)"

  - name: "Trainer i fine-tuning"
    icon: "🏋️"
    commands:
      - cmd: "trainer = Trainer(model=model, args=training_args, train_dataset=train_ds)"
        desc: "Inicjalizuj Trainer"
        detail:
          what: "Trainer zarządza pełną pętlą trenowania z ewaluacją, checkpointami, logowaniem."
          how: "training_args zawiera konfigurację (batch_size, lr, epochs, fp16, ewaluacja)."
          tips:
            - "eval_dataset=eval_ds, compute_metrics=fn — dodaj ewaluację"
            - "callbacks=[EarlyStoppingCallback()] — early stopping"
      - cmd: |
          args = TrainingArguments(
              output_dir='./results',
              num_train_epochs=3,
              per_device_train_batch_size=16,
              learning_rate=2e-5,
              fp16=True,
              evaluation_strategy='epoch'
          )
        desc: "Skonfiguruj TrainingArguments"
        detail:
          what: "TrainingArguments centralizuje wszystkie hiperparametry treningu."
          how: "fp16=True automatyczne mixed precision — szybsze i mniej VRAM. evaluation_strategy — kiedy ewaluować."
          tips:
            - "gradient_accumulation_steps=4 — symuluj 4x większy batch size"
            - "warmup_ratio=0.1 — 10% kroków rozgrzewki dla LR schedulera"
      - cmd: "trainer.train(resume_from_checkpoint=True)"
        desc: "Wznów trening od ostatniego checkpointu"
        detail:
          what: "resume_from_checkpoint=True szuka ostatniego checkpointu w output_dir."
          how: "Przydatne po przerwaniu treningu (crash, timeout). Wczytuje stan optimizera."
          tips:
            - "resume_from_checkpoint='./results/checkpoint-500' — konkretny checkpoint"
            - "save_steps=100, save_total_limit=3 — oszczędzaj miejsce (max 3 checkpointy)"
      - cmd: |
          from peft import LoraConfig, get_peft_model, TaskType
          config = LoraConfig(
              r=8,
              lora_alpha=32,
              target_modules=['q_proj', 'v_proj'],
              lora_dropout=0.05,
              task_type=TaskType.CAUSAL_LM
          )
          model = get_peft_model(model, config)
        desc: "LoRA fine-tuning — trenuj ułamek parametrów"
        detail:
          what: "LoRA dodaje niski-rankowy adapter — trenujesz tylko ~1% parametrów zamiast całego modelu."
          how: "r=8 — rank adapterów. lora_alpha=32 — skalowanie. target_modules — które warstwy adaptować."
          tips:
            - "model.print_trainable_parameters() — sprawdź ile % parametrów jest trenowanych"
            - "r=16 lub r=32 — wyższy rank, więcej parametrów, lepsza jakość"
      - cmd: |
          from peft import PeftModel
          model = PeftModel.from_pretrained(base_model, 'path/to/adapter')
          merged = model.merge_and_unload()
        desc: "Załaduj i scal adapter LoRA z bazowym modelem"
        detail:
          what: "merge_and_unload scala wagi adaptera z wagami bazowego modelu — jeden plik wag."
          how: "Scalony model można używać bez PEFT biblioteki — prostszy deploy."
          tips:
            - "merged.save_pretrained('./merged-model') — zapisz scalony model"
            - "Scalenie nieodwracalne — zachowaj osobno bazowy model i adapter"
      - cmd: "trainer.evaluate()"
        desc: "Ewaluacja na zbiorze walidacyjnym"
        detail:
          what: "Uruchamia pętlę ewaluacyjną i zwraca metryki zdefiniowane w compute_metrics."
          how: "Można wywołać ręcznie w dowolnym momencie lub automatycznie przez eval_strategy."
          tips:
            - "trainer.predict(test_dataset) — predykcje + metryki na zbiorze testowym"
            - "trainer.save_model('./final') — zapisz model po treningu"

  - name: "Ewaluacja i metryki"
    icon: "📈"
    commands:
      - cmd: "import evaluate; bleu = evaluate.load('bleu')"
        desc: "Załaduj metrykę z biblioteki evaluate"
        detail:
          what: "Biblioteka evaluate zawiera wszystkie standardowe metryki NLP — BLEU, ROUGE, accuracy, F1."
          how: "Metryki są automatycznie pobierane z Hub i cache'owane lokalnie."
          tips:
            - "evaluate.list_evaluation_modules() — lista dostępnych metryk"
            - "evaluate.load('glue', 'mrpc') — metryki dla benchmarków"
      - cmd: "results = bleu.compute(predictions=['Hello world'], references=[['Hello world']])"
        desc: "Oblicz BLEU score"
        detail:
          what: "BLEU mierzy podobieństwo wygenerowanego tekstu do referencji. Używany dla NMT i summarization."
          how: "references to lista list — każdy przykład może mieć wiele referencji."
          tips:
            - "results['bleu'] — główny wynik (0-1)"
            - "sacrebleu — lepsza implementacja BLEU dla porównań między systemami"
      - cmd: |
          rouge = evaluate.load('rouge')
          results = rouge.compute(predictions=preds, references=refs)
        desc: "Oblicz ROUGE score dla streszczania"
        detail:
          what: "ROUGE-1, ROUGE-2, ROUGE-L — metryki pokrycia n-gramów dla streszczania tekstu."
          how: "Zwraca dict z rouge1, rouge2, rougeL, rougeLsum jako wyniki F1."
          tips:
            - "use_stemmer=True — stemming przed porównaniem (lepsza dla angielskiego)"
            - "ROUGE-L mierzy najdłuższy wspólny podciąg — ważny dla spójności"
      - cmd: |
          accuracy = evaluate.load('accuracy')
          results = accuracy.compute(predictions=preds, references=labels)
        desc: "Oblicz accuracy klasyfikacji"
        detail:
          what: "Porównuje predykcje z prawdziwymi etykietami — zwraca odsetek poprawnych."
          how: "Używaj w compute_metrics w Trainer jako callback po każdej ewaluacji."
          tips:
            - "evaluate.load('f1') — F1 score (lepszy dla niezbalansowanych klas)"
            - "evaluate.load('precision'), evaluate.load('recall') — osobno"
      - cmd: |
          def compute_metrics(eval_pred):
              logits, labels = eval_pred
              predictions = np.argmax(logits, axis=-1)
              return metric.compute(predictions=predictions, references=labels)
        desc: "Funkcja compute_metrics dla Trainera"
        detail:
          what: "Trainer wywołuje tę funkcję po każdej ewaluacji. eval_pred to (logits, labels)."
          how: "np.argmax zamienia logity na indeksy klas. metric.compute oblicza wynik."
          tips:
            - "Trainer przekazuje EvalPrediction(predictions, label_ids) — oba numpy arrays"
            - "Możesz zwrócić wiele metryk — {'accuracy': 0.9, 'f1': 0.88}"

  - name: "Zarządzanie modelami"
    icon: "📦"
    commands:
      - cmd: "model.save_pretrained('./my-model') && tokenizer.save_pretrained('./my-model')"
        desc: "Zapisz model i tokenizer lokalnie"
        detail:
          what: "Zapisuje wagi (safetensors), config.json i pliki tokenizatora do katalogu."
          how: "Kompletny snapshot potrzebny do odtworzenia modelu bez połączenia z Hub."
          tips:
            - "safe_serialization=True (domyślnie) — format safetensors zamiast pkl"
            - "Nie zapomnij save tokenizera! Model bez tokenizera to połowa obrazu"
      - cmd: "model.push_to_hub('username/my-model')"
        desc: "Wypchnij model na Hugging Face Hub"
        detail:
          what: "Pushuje wagi, config i tokenizer do repozytorium na Hub."
          how: "Automatycznie tworzy repo jeśli nie istnieje. Obsługuje LFS dla dużych plików."
          tips:
            - "private=True — prywatne repo"
            - "commit_message='Training complete, epoch 3' — opisz push"
      - cmd: "from huggingface_hub import snapshot_download; snapshot_download('bert-base-uncased', local_dir='./bert')"
        desc: "Pobierz cały snapshot modelu do katalogu"
        detail:
          what: "snapshot_download pobiera wszystkie pliki modelu (wagi, config, tokenizer, README)."
          how: "Lepsza alternatywa dla huggingface-cli download gdy potrzebujesz pełnego katalogu modelu."
          tips:
            - "ignore_patterns=['*.safetensors'] — pomiń pewne pliki"
            - "revision='main' — konkretna gałąź/commit/tag"
      - cmd: |
          from huggingface_hub import ModelCard
          card = ModelCard.load('bert-base-uncased')
          print(card.content)
        desc: "Przeczytaj model card z Hub"
        detail:
          what: "Model card zawiera opis modelu, przypadki użycia, ograniczenia, wyniki benchmarków."
          how: "ModelCard to obiekt z content (markdown string) i metadata (YAML frontmatter)."
          tips:
            - "card.data — metadata jako dict (language, license, tags, datasets)"
            - "ModelCard.push_to_hub('username/model') — opublikuj własną model card"

  - name: "Inference snippets"
    icon: "⚡"
    commands:
      - cmd: "with torch.inference_mode(): outputs = model(**inputs)"
        desc: "Inference mode — szybszy i mniejszy niż no_grad"
        detail:
          what: "torch.inference_mode() wyłącza śledzenie gradientów. Szybszy od no_grad i zapobiega accidental autograd."
          how: "Zawsze używaj podczas inferecji — zmniejsza zużycie pamięci i przyspiesza obliczenia."
          tips:
            - "@torch.inference_mode() jako dekorator funkcji inferecji"
            - "Nie mylić z model.eval() — oba potrzebne: eval() wyłącza dropout, inference_mode wyłącza autograd"
      - cmd: "model = torch.compile(model)"
        desc: "Skompiluj model PyTorch 2.0+ (do 2x szybciej)"
        detail:
          what: "torch.compile() kompiluje model przez TorchDynamo/Inductor — eliminuje overhead Python."
          how: "Pierwsze wywołanie wolne (kompilacja). Kolejne 30-200% szybsze."
          tips:
            - "mode='reduce-overhead' — dla małych batch sizes"
            - "mode='max-autotune' — maksymalna optymalizacja (najdłuższa kompilacja)"
      - cmd: "inputs = tokenizer(text, return_tensors='pt').to(device)"
        desc: "Tokenizuj i przenieś na GPU"
        detail:
          what: "Tokenizuje tekst i konwertuje do tensorów PyTorch, następnie przenosi na urządzenie modelu."
          how: "Model i dane muszą być na tym samym urządzeniu. Brak .to(device) powoduje błąd."
          tips:
            - "device = 'cuda' if torch.cuda.is_available() else 'cpu'"
            - "inputs = {k: v.to(device) for k, v in inputs.items()} — alternatywna składnia"
      - cmd: |
          outputs = model.generate(
              input_ids,
              max_new_tokens=200,
              do_sample=True,
              temperature=0.7,
              top_p=0.9,
              repetition_penalty=1.1
          )
        desc: "Generowanie tekstu z parametrami próbkowania"
        detail:
          what: "model.generate() uruchamia dekoder z konfigurowalnymi strategiami próbkowania."
          how: "do_sample=True + temperature < 1 — bardziej deterministycznie. top_p — nucleus sampling."
          tips:
            - "num_beams=4 — beam search (wolniejsze, bardziej spójne)"
            - "repetition_penalty=1.1 — penalizuje powtarzające się tokeny"
      - cmd: |
          from transformers import TextStreamer
          streamer = TextStreamer(tokenizer, skip_special_tokens=True)
          model.generate(input_ids, streamer=streamer, max_new_tokens=200)
        desc: "Streaming generowania — drukuj tokeny na bieżąco"
        detail:
          what: "TextStreamer drukuje tokeny do stdout w miarę ich generowania — jak ChatGPT."
          how: "Przydatne dla długich odpowiedzi żeby nie czekać na cały output."
          tips:
            - "TextIteratorStreamer — streamer do własnej pętli (zwraca kolejkę tokenów)"
            - "skip_special_tokens=True — nie drukuj [EOS] i innych specjalnych tokenów"
