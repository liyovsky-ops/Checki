title: "Transformers"

items:
  - name: "AutoTokenizer"
    icon: "📝"
    desc: "Automatyczny tokenizer — ładuje właściwy tokenizer dla dowolnego modelu z Hub bez znajomości architektury"
    code: |
      from transformers import AutoTokenizer

      tokenizer = AutoTokenizer.from_pretrained("bert-base-uncased")

      # Tokenizacja pojedynczego tekstu
      encoded = tokenizer("Hello, how are you?", return_tensors="pt")
      print(encoded.input_ids)        # tensor([[101, 7592, ...]])
      print(encoded.attention_mask)   # tensor([[1, 1, ...]])

      # Batch z paddingiem i truncation
      texts = ["Short text.", "This is a much longer sentence that needs padding."]
      batch = tokenizer(
          texts,
          padding=True,
          truncation=True,
          max_length=128,
          return_tensors="pt"
      )
      print(batch.input_ids.shape)  # (2, 128)

      # Dekodowanie tokenów z powrotem do tekstu
      decoded = tokenizer.decode(encoded.input_ids[0])
      print(decoded)  # "[CLS] hello, how are you? [SEP]"

  - name: "AutoModel"
    icon: "🤖"
    desc: "Bazowy model bez głowicy — używaj do feature extraction i embeddings; daje ukryte stany warstw"
    code: |
      import torch
      from transformers import AutoTokenizer, AutoModel

      model_name = "bert-base-uncased"
      tokenizer = AutoTokenizer.from_pretrained(model_name)
      model = AutoModel.from_pretrained(model_name)
      model.eval()

      text = "Hugging Face is revolutionizing NLP."
      inputs = tokenizer(text, return_tensors="pt")

      with torch.no_grad():
          outputs = model(**inputs)

      # Ostatnia warstwa ukrytych stanów
      last_hidden = outputs.last_hidden_state  # (1, seq_len, 768)
      print(f"Shape: {last_hidden.shape}")

      # CLS token jako embedding zdania
      cls_embedding = last_hidden[:, 0, :]  # (1, 768)
      print(f"CLS embedding shape: {cls_embedding.shape}")

  - name: "pipeline()"
    icon: "🔧"
    desc: "Wysokopoziomowe API dla popularnych zadań NLP — jeden obiekt obsługuje tokenizację, model i dekodowanie"
    code: |
      from transformers import pipeline

      # Klasyfikacja tekstu
      classifier = pipeline("text-classification",
                            model="distilbert-base-uncased-finetuned-sst-2-english")
      print(classifier("This movie is great!"))

      # Named Entity Recognition
      ner = pipeline("ner", grouped_entities=True)
      result = ner("My name is John and I work at Microsoft in Seattle.")
      for entity in result:
          print(f"{entity['word']}: {entity['entity_group']} ({entity['score']:.2f})")

      # Question Answering
      qa = pipeline("question-answering")
      context = "Hugging Face was founded in 2016 in New York City."
      question = "Where was Hugging Face founded?"
      print(qa(question=question, context=context))

      # Summarization
      summarizer = pipeline("summarization", model="facebook/bart-large-cnn")
      text = "..." * 5  # długi tekst
      summary = summarizer(text, max_length=130, min_length=30)
      print(summary[0]['summary_text'])

  - name: "BertForSequenceClassification"
    icon: "🏷️"
    desc: "BERT z głowicą klasyfikacji — fine-tuning dla analizy sentymentu, klasyfikacji tematów, wykrywania intencji"
    code: |
      from transformers import AutoTokenizer, AutoModelForSequenceClassification
      import torch

      model_name = "distilbert-base-uncased-finetuned-sst-2-english"
      tokenizer = AutoTokenizer.from_pretrained(model_name)
      model = AutoModelForSequenceClassification.from_pretrained(model_name)
      model.eval()

      texts = ["I absolutely loved this film!", "The service was terrible."]
      inputs = tokenizer(texts, padding=True, truncation=True, return_tensors="pt")

      with torch.no_grad():
          logits = model(**inputs).logits

      predictions = torch.softmax(logits, dim=-1)
      labels = model.config.id2label

      for text, pred in zip(texts, predictions):
          label_id = pred.argmax().item()
          print(f"'{text}' => {labels[label_id]} ({pred[label_id]:.2f})")

  - name: "GPT2LMHeadModel"
    icon: "✍️"
    desc: "GPT-2 z głowicą language modeling — generowanie tekstu, completions, causal language modeling"
    code: |
      from transformers import GPT2LMHeadModel, GPT2Tokenizer
      import torch

      tokenizer = GPT2Tokenizer.from_pretrained("gpt2")
      model = GPT2LMHeadModel.from_pretrained("gpt2")
      model.eval()

      # Generowanie z różnymi strategiami
      prompt = "The future of artificial intelligence is"
      inputs = tokenizer(prompt, return_tensors="pt")

      # Greedy search
      with torch.no_grad():
          greedy = model.generate(**inputs, max_new_tokens=50)

      # Beam search
      with torch.no_grad():
          beam = model.generate(
              **inputs,
              max_new_tokens=50,
              num_beams=5,
              no_repeat_ngram_size=2
          )

      # Sampling z temperature
      with torch.no_grad():
          sample = model.generate(
              **inputs,
              max_new_tokens=50,
              do_sample=True,
              temperature=0.7,
              top_p=0.92
          )

      print(tokenizer.decode(sample[0], skip_special_tokens=True))

  - name: "T5ForConditionalGeneration"
    icon: "🔄"
    desc: "T5 — model encoder-decoder do zadań seq2seq: tłumaczenie, summarization, QA, classification jako generacja"
    code: |
      from transformers import T5ForConditionalGeneration, T5Tokenizer

      model_name = "t5-small"
      tokenizer = T5Tokenizer.from_pretrained(model_name)
      model = T5ForConditionalGeneration.from_pretrained(model_name)

      # Summarization (T5 używa prefiksów zadań)
      text = "summarize: The Eiffel Tower is a famous landmark in Paris, France. " \
             "It was built by Gustave Eiffel and completed in 1889."

      inputs = tokenizer(text, return_tensors="pt", max_length=512, truncation=True)

      with __import__('torch').no_grad():
          outputs = model.generate(
              inputs.input_ids,
              max_length=150,
              num_beams=4,
              early_stopping=True
          )

      summary = tokenizer.decode(outputs[0], skip_special_tokens=True)
      print("Summary:", summary)

      # Tłumaczenie (dla t5-base)
      translation_input = tokenizer("translate English to French: Hello, how are you?",
                                    return_tensors="pt")

  - name: "ViTForImageClassification"
    icon: "🖼️"
    desc: "Vision Transformer — klasyfikacja obrazów za pomocą transformera; obsługa obrazów z PIL lub torchvision"
    code: |
      from transformers import ViTForImageClassification, ViTImageProcessor
      from PIL import Image
      import requests
      import torch

      model_name = "google/vit-base-patch16-224"
      processor = ViTImageProcessor.from_pretrained(model_name)
      model = ViTForImageClassification.from_pretrained(model_name)
      model.eval()

      # Załaduj obraz
      url = "https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Cute_dog.jpg/320px-Cute_dog.jpg"
      image = Image.open(requests.get(url, stream=True).raw)

      # Przetwórz obraz
      inputs = processor(images=image, return_tensors="pt")

      with torch.no_grad():
          outputs = model(**inputs)
          logits = outputs.logits

      predicted_class_idx = logits.argmax(-1).item()
      print("Predicted class:", model.config.id2label[predicted_class_idx])

  - name: "WhisperForConditionalGeneration"
    icon: "🎙️"
    desc: "Whisper od OpenAI na HF — speech-to-text z obsługą 99 języków i automatyczną detekcją języka"
    code: |
      import torch
      from transformers import WhisperForConditionalGeneration, WhisperProcessor

      model_name = "openai/whisper-small"
      processor = WhisperProcessor.from_pretrained(model_name)
      model = WhisperForConditionalGeneration.from_pretrained(model_name)

      # Załaduj audio (numpy array, 16kHz)
      import librosa
      audio, sr = librosa.load("audio.mp3", sr=16000)

      # Przetwórz audio
      inputs = processor(audio, sampling_rate=16000, return_tensors="pt")

      # Transkrypcja
      with torch.no_grad():
          predicted_ids = model.generate(inputs.input_features)

      transcription = processor.batch_decode(predicted_ids, skip_special_tokens=True)
      print(transcription[0])
