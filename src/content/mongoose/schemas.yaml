title: "Schemas & Models"

items:
  - name: Typy SchemaType — podstawowe
    desc: >
      Mongoose obsługuje wbudowane typy JavaScript i typy specyficzne dla MongoDB.
      Każde pole Schema ma typ i opcje walidacji. Typy można deklarować skrótowo
      (String) lub przez obiekt ({ type: String, required: true }).
    code: |
      import { Schema } from 'mongoose';

      const ProductSchema = new Schema({
        name:        String,                    // skrótowo
        price:       { type: Number, min: 0 }, // z opcjami
        inStock:     { type: Boolean, default: true },
        createdAt:   { type: Date, default: Date.now },
        tags:        [String],                  // tablica stringów
        metadata:    Schema.Types.Mixed,        // dowolny obiekt
        userId:      Schema.Types.ObjectId,     // referencja
        uuid:        Schema.Types.UUID,         // UUID v4
        binary:      Buffer,
        stats: {                                // zagnieżdżony obiekt
          views:     { type: Number, default: 0 },
          likes:     { type: Number, default: 0 },
        },
        settings: {                             // Map — klucze dynamiczne
          type: Map,
          of: String,
        },
      });

  - name: SchemaType options — walidacja i indeksy
    desc: >
      Każde pole Schema może mieć opcje walidacji, wartości domyślne i indeksy.
      required, unique, index, enum, min/max, match (regex), minlength/maxlength.
      Walidacja uruchamia się przy save() i create() — rzuca ValidationError przy błędzie.
    code: |
      import { Schema } from 'mongoose';

      const UserSchema = new Schema({
        email: {
          type:      String,
          required:  [true, 'Email jest wymagany'],
          unique:    true,
          lowercase: true,
          trim:      true,
          match:     [/^\S+@\S+\.\S+$/, 'Nieprawidłowy email'],
        },
        role: {
          type:    String,
          enum:    ['user', 'admin', 'moderator'],
          default: 'user',
        },
        age: {
          type: Number,
          min:  [0, 'Wiek nie może być ujemny'],
          max:  [120, 'Wiek nie może przekraczać 120'],
        },
        username: {
          type:      String,
          minlength: 3,
          maxlength: 30,
          index:     true,  // indeks w MongoDB
        },
        bio: {
          type:    String,
          default: '',
          select:  false,  // pole nie wraca w query domyślnie
        },
      });

  - name: Virtual fields
    desc: >
      Wirtualne pola obliczane z innych pól — nie są zapisywane w MongoDB.
      get() definiuje wartość, set() pozwala przypisywać. toJSON/toObject muszą
      mieć virtuals: true żeby virtual pojawił się w wynikach JSON.
    code: |
      import { Schema } from 'mongoose';

      const PersonSchema = new Schema({
        firstName: String,
        lastName:  String,
        birthYear: Number,
      }, {
        toJSON:   { virtuals: true },
        toObject: { virtuals: true },
      });

      // Getter — fullName obliczany z firstName + lastName
      PersonSchema.virtual('fullName').get(function () {
        return `${this.firstName} ${this.lastName}`;
      });

      // Setter — parsuje "Jan Kowalski" na firstName i lastName
      PersonSchema.virtual('fullName').set(function (v: string) {
        const parts = v.split(' ');
        this.firstName = parts[0];
        this.lastName  = parts[1];
      });

      // Virtual populate — referencje bez zapisywania ObjectId
      PersonSchema.virtual('posts', {
        ref:         'Post',
        localField:  '_id',
        foreignField: 'authorId',
      });

  - name: Instance methods i statics
    desc: >
      Methods to metody instancji dokumentu (this = dokument).
      Statics to metody klasy Model (this = Model).
      Query helpers to metody chainowane do query buildera.
    code: |
      import { Schema, Model, Document } from 'mongoose';
      import bcrypt from 'bcrypt';

      interface IUser extends Document {
        email: string;
        password: string;
        comparePassword(candidate: string): Promise<boolean>;
      }

      interface IUserModel extends Model<IUser> {
        findByEmail(email: string): Promise<IUser | null>;
      }

      const UserSchema = new Schema<IUser, IUserModel>({
        email:    String,
        password: String,
      });

      // Instance method — dostępny na każdym dokumencie
      UserSchema.methods.comparePassword = async function (candidate: string) {
        return bcrypt.compare(candidate, this.password);
      };

      // Static method — dostępny na Modelu
      UserSchema.statics.findByEmail = function (email: string) {
        return this.findOne({ email: email.toLowerCase() });
      };

      // Użycie
      const user = await User.findByEmail('jan@firma.pl');
      const isValid = await user!.comparePassword('secret123');

  - name: Timestamps i opcje Schema
    desc: >
      timestamps: true automatycznie dodaje createdAt i updatedAt.
      versionKey: false usuwa pole __v (version key).
      toJSON i toObject kontrolują serializację. collection pozwala wybrać nazwę kolekcji.
    code: |
      import { Schema } from 'mongoose';

      const OrderSchema = new Schema({
        total:  Number,
        status: String,
      }, {
        timestamps:  true,            // createdAt i updatedAt automatycznie
        versionKey:  false,           // usuń __v
        collection:  'orders',        // jawna nazwa kolekcji
        toJSON: {
          virtuals: true,             // uwzględnij virtuale w JSON
          transform: (_doc, ret) => {
            delete ret.__v;
            ret.id = ret._id;
            delete ret._id;
            return ret;
          },
        },
      });

      // timestamps z custom polami
      const PostSchema = new Schema({ title: String }, {
        timestamps: {
          createdAt: 'created_at',
          updatedAt: 'updated_at',
        },
      });

  - name: Discriminators — dziedziczenie Schema
    desc: >
      Discriminator pozwala przechowywać różne typy dokumentów w jednej kolekcji
      z różnymi polami. Mongoose dodaje pole __t (discriminatorKey) do dokumentu.
      Przydatne do event sourcing, polimorfizmu, różnych typów produktów.
    code: |
      import mongoose, { Schema } from 'mongoose';

      // Base schema
      const EventSchema = new Schema({
        timestamp: { type: Date, default: Date.now },
        userId:    Schema.Types.ObjectId,
      }, { discriminatorKey: 'kind' });

      const Event = mongoose.model('Event', EventSchema);

      // Podtyp — Click event
      const ClickEvent = Event.discriminator('ClickEvent', new Schema({
        x: Number,
        y: Number,
        target: String,
      }));

      // Podtyp — Purchase event
      const PurchaseEvent = Event.discriminator('PurchaseEvent', new Schema({
        amount:    Number,
        productId: Schema.Types.ObjectId,
      }));

      // Zapis — kind jest ustawiany automatycznie
      await ClickEvent.create({ userId: id, x: 100, y: 200, target: '#btn' });
      await PurchaseEvent.create({ userId: id, amount: 49.99, productId: pid });

      // Query na bazie — zwraca wszystkie eventy
      const all = await Event.find({ userId: id });
