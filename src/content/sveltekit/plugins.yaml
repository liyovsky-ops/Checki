title: Ekosystem SvelteKit

items:
  - name: Superforms
    desc: "Kompleksowe zarządzanie formularzami dla SvelteKit. Schema Zod/Yup/Valibot → auto-walidacja → reactive stores (form, errors, message, submitting). Progressive enhancement, nested objects, file upload, tainted check. Eliminuje 90% boilerplate form handling."
    icon: "📋"

  - name: Lucia Auth
    desc: "Autentykacja dla SvelteKit — session management, OAuth (GitHub, Google, Discord), email+password. Framework-agnostic core, adapter dla każdej DB (Prisma, Drizzle, MongoDB). Zastępuje next-auth. Pełna kontrola bez magii."
    icon: "🔐"

  - name: Drizzle ORM + SvelteKit
    desc: "Type-safe ORM idealny do SvelteKit — lekki, SQL-like API, zero abstrakcji. Działa z PostgreSQL, MySQL, SQLite (w tym Cloudflare D1). Import w $lib/server/db.ts i użyj w +page.server.ts i +server.ts. Migracje przez drizzle-kit."
    icon: "🗄️"

  - name: Paraglide JS
    desc: "i18n (internacjonalizacja) zbudowana dla SvelteKit przez inlang team. Compile-time translations — tłumaczenia inline w bundle, zero runtime overhead. Type-safe, tree-shakeable (tylko używane języki w bundle), routing per locale. Lepsza alternatywa dla rosetta/i18next."
    icon: "🌍"

  - name: TanStack Query (svelte-query)
    desc: "Async data fetching z cache, background refetch, pagination, infinite scroll. Port TanStack Query dla Svelte 5. Zarządza server state obok SvelteKit load functions — przydatny dla real-time data i skomplikowanego cache invalidation."
    icon: "🔄"

  - name: Bits UI
    desc: "Headless component primitives dla Svelte — Dialog, Dropdown, Tooltip, Combobox, DatePicker i inne. Zero styling, pełna a11y, composable API. Baza dla shadcn-svelte. Odpowiednik Radix UI dla React. Używaj gdy budujesz własny design system."
    icon: "🧩"
