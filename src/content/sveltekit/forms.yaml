title: SvelteKit — Form Actions i formularze

labels:
  section: Form Actions
  example: Przykład

intro: >
  Form Actions to mechanizm SvelteKit do obsługi formularzy po stronie serwera.
  Eksportujesz actions z +page.server.ts — SvelteKit routuje POST request do właściwej
  funkcji. Progressive enhancement — formularz działa bez JavaScript (native HTML form POST),
  ale z use:enhance działa jak SPA (bez pełnego reload, loading state, instant feedback).
  fail() zwraca błędy z danymi do ponownego wypełnienia, redirect() przekierowuje po sukcesie.
  Walidacja przez Zod, lub Superforms dla kompleksowych formularzy.

items:
  - name: Podstawowy form action — struktura
    desc: >
      actions.default obsługuje domyślny POST. request.formData() parsuje dane.
      fail() zwraca błąd, redirect() po sukcesie. Dane wracają przez export let form.
    code: |
      // src/routes/contact/+page.server.ts
      import type { Actions, PageServerLoad } from './$types';
      import { fail, redirect } from '@sveltejs/kit';

      export const load: PageServerLoad = async () => {
        return {};  // opcjonalnie initial data
      };

      export const actions: Actions = {
        default: async ({ request }) => {
          const data = await request.formData();

          const name = data.get('name') as string;
          const email = data.get('email') as string;
          const message = data.get('message') as string;

          // Walidacja
          if (!name || !email || !message) {
            return fail(400, {
              name, email, message,  // zwróć dane by nie tracić wpisanego
              error: 'Wszystkie pola są wymagane'
            });
          }

          if (!email.includes('@')) {
            return fail(400, { name, email, message, error: 'Nieprawidłowy email' });
          }

          // Logika biznesowa
          await sendContactEmail({ name, email, message });

          // Sukces — redirect lub return data
          throw redirect(303, '/contact/success');
        }
      };

  - name: Formularz w +page.svelte — obsługa wyników
    desc: >
      export let form odbiera wynik z action — błędy lub dane sukcesu.
      Formularz działa bez JS przez natywny HTML POST.
    code: |
      <!-- src/routes/contact/+page.svelte -->
      <script lang="ts">
        import type { ActionData } from './$types';
        export let form: ActionData;
      </script>

      <h1>Kontakt</h1>

      {#if form?.error}
        <div class="error-banner">{form.error}</div>
      {/if}

      <form method="POST">
        <div class="field">
          <label for="name">Imię</label>
          <input
            id="name"
            name="name"
            value={form?.name ?? ''}
            required
          />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            value={form?.email ?? ''}
            required
          />
        </div>

        <div class="field">
          <label for="message">Wiadomość</label>
          <textarea id="message" name="message" required>
            {form?.message ?? ''}
          </textarea>
        </div>

        <button type="submit">Wyślij</button>
      </form>

  - name: use:enhance — progressive enhancement
    desc: >
      use:enhance zamienia zwykły formularz w SPA-style submit — brak full page reload.
      Callback daje kontrolę nad loading state, animacjami i obsługą różnych wyników.
    code: |
      <!-- +page.svelte z use:enhance -->
      <script lang="ts">
        import { enhance } from '$app/forms';
        import type { ActionData } from './$types';

        export let form: ActionData;

        let loading = false;
        let successMessage = '';
      </script>

      <form
        method="POST"
        use:enhance={({ formData, cancel }) => {
          // Przed submittem — można anulować cancel()
          loading = true;
          successMessage = '';

          return async ({ result, update }) => {
            loading = false;

            if (result.type === 'success') {
              successMessage = 'Wiadomość wysłana!';
              // Opcjonalnie: resetuj formularz
              // formElement.reset();
            }

            if (result.type === 'redirect') {
              // SvelteKit automatycznie nawiguje
            }

            // update() — odśwież $page.form i $page.data
            await update({ reset: result.type === 'success' });
          };
        }}
      >
        <input name="email" type="email" required />
        <button disabled={loading}>
          {loading ? 'Wysyłanie...' : 'Wyślij'}
        </button>

        {#if successMessage}
          <p class="success">{successMessage}</p>
        {/if}
      </form>

  - name: Named actions — kilka formularzy na stronie
    desc: >
      Named actions obsługują różne formularze na tej samej stronie.
      action="?/nazwaAkcji" routuje do właściwej funkcji.
    code: |
      // src/routes/profile/+page.server.ts
      import type { Actions } from './$types';
      import { fail, redirect } from '@sveltejs/kit';

      export const actions: Actions = {
        // UWAGA: nie można mieć "default" razem z named actions

        updateProfile: async ({ request, locals }) => {
          const data = await request.formData();
          const name = data.get('name') as string;

          if (name.length < 2) {
            return fail(400, { field: 'name', error: 'Min 2 znaki' });
          }

          await updateUser(locals.user.id, { name });
          return { updated: 'profile' };
        },

        changePassword: async ({ request, locals }) => {
          const data = await request.formData();
          const currentPassword = data.get('current') as string;
          const newPassword = data.get('new') as string;

          const valid = await verifyPassword(locals.user.id, currentPassword);
          if (!valid) return fail(401, { error: 'Nieprawidłowe aktualne hasło' });
          if (newPassword.length < 8) return fail(400, { error: 'Min 8 znaków' });

          await updatePassword(locals.user.id, newPassword);
          return { updated: 'password' };
        },

        deleteAccount: async ({ locals, cookies }) => {
          await deleteUser(locals.user.id);
          cookies.delete('session', { path: '/' });
          // redirect po delete
          throw redirect(303, '/');
        }
      };

      <!-- +page.svelte — kilka formularzy -->
      <!-- <form method="POST" action="?/updateProfile" use:enhance> -->
      <!-- <form method="POST" action="?/changePassword" use:enhance> -->
      <!-- <form method="POST" action="?/deleteAccount" use:enhance> -->

  - name: Walidacja z Zod — serwer + klient
    desc: >
      Zod schema do walidacji po stronie serwera. Fail() zwraca błędy per pole.
      Wartości wracają do formularza — user nie traci wpisanego tekstu.
    code: |
      // src/routes/register/+page.server.ts
      import { z } from 'zod';
      import { fail, redirect } from '@sveltejs/kit';
      import { db } from '$lib/server/db';

      const registerSchema = z.object({
        name: z.string().min(2, 'Imię musi mieć min 2 znaki'),
        email: z.string().email('Nieprawidłowy adres email'),
        password: z.string()
          .min(8, 'Hasło musi mieć min 8 znaków')
          .regex(/[A-Z]/, 'Hasło musi zawierać wielką literę')
          .regex(/[0-9]/, 'Hasło musi zawierać cyfrę'),
        confirmPassword: z.string(),
      }).refine(data => data.password === data.confirmPassword, {
        message: 'Hasła nie są identyczne',
        path: ['confirmPassword'],
      });

      export const actions = {
        default: async ({ request }) => {
          const raw = Object.fromEntries(await request.formData());
          const result = registerSchema.safeParse(raw);

          if (!result.success) {
            const errors = result.error.flatten().fieldErrors;
            return fail(400, {
              data: { name: raw.name, email: raw.email },  // BEZ hasła!
              errors: {
                name: errors.name?.[0],
                email: errors.email?.[0],
                password: errors.password?.[0],
                confirmPassword: errors.confirmPassword?.[0],
              }
            });
          }

          const exists = await db.users.findUnique({ where: { email: result.data.email } });
          if (exists) return fail(409, { data: raw, errors: { email: 'Email już zajęty' } });

          await db.users.create({ data: result.data });
          throw redirect(303, '/login?registered=true');
        }
      };

  - name: File upload w form action
    desc: >
      Formularze z enctype="multipart/form-data" obsługują upload plików.
      request.formData() parsuje zarówno pola tekstowe jak i pliki (Blob/File).
    code: |
      <!-- +page.svelte — formularz z plikiem -->
      <form method="POST" action="?/upload" enctype="multipart/form-data" use:enhance>
        <input name="title" type="text" required />
        <input name="file" type="file" accept="image/*" required />
        <button type="submit">Prześlij zdjęcie</button>
      </form>

      // +page.server.ts
      import { fail } from '@sveltejs/kit';
      import { writeFile } from 'node:fs/promises';
      import { join } from 'node:path';

      export const actions = {
        upload: async ({ request, locals }) => {
          if (!locals.user) return fail(401, { error: 'Zaloguj się' });

          const data = await request.formData();
          const title = data.get('title') as string;
          const file = data.get('file') as File;

          if (!file || file.size === 0) {
            return fail(400, { error: 'Wybierz plik' });
          }

          if (file.size > 5 * 1024 * 1024) {  // 5MB limit
            return fail(400, { error: 'Plik za duży (max 5MB)' });
          }

          if (!file.type.startsWith('image/')) {
            return fail(400, { error: 'Tylko obrazy (JPG, PNG, WebP)' });
          }

          // Zapisz plik
          const buffer = Buffer.from(await file.arrayBuffer());
          const filename = `${Date.now()}-${file.name}`;
          await writeFile(join('static/uploads', filename), buffer);

          // Zapisz do DB
          await db.photos.create({
            data: { title, url: `/uploads/${filename}`, userId: locals.user.id }
          });

          return { success: true, filename };
        }
      };

  - name: Superforms — kompletne zarządzanie formularzami
    desc: >
      sveltekit-superforms eliminuje boilerplate — schema → auto-validation → binding.
      Obsługuje Zod, Yup, Valibot. Auto-reset, messages, loading state, nested fields.
    code: |
      // npm install sveltekit-superforms zod
      // src/routes/settings/+page.server.ts
      import { superValidate, message, setError } from 'sveltekit-superforms';
      import { zod } from 'sveltekit-superforms/adapters';
      import { z } from 'zod';
      import { fail } from '@sveltejs/kit';

      const settingsSchema = z.object({
        username: z.string().min(3).max(20),
        bio: z.string().max(200).optional(),
        notifications: z.boolean().default(true),
        theme: z.enum(['light', 'dark', 'system']).default('system'),
      });

      export const load = async ({ locals }) => {
        const form = await superValidate(
          locals.user,  // initial data z obiektu user
          zod(settingsSchema)
        );
        return { form };
      };

      export const actions = {
        default: async ({ request, locals }) => {
          const form = await superValidate(request, zod(settingsSchema));

          if (!form.valid) return fail(400, { form });

          // Sprawdź unikalność username
          const taken = await db.users.findFirst({
            where: { username: form.data.username, NOT: { id: locals.user.id } }
          });
          if (taken) return setError(form, 'username', 'Ta nazwa jest zajęta');

          await updateUser(locals.user.id, form.data);
          return message(form, 'Ustawienia zapisane!');
        }
      };

  - name: Superforms — komponent z reactive stores
    desc: >
      superForm() zwraca reactive stores dla form data, errors, message, submitting.
      Auto-binding przez bind:value, auto-enhance przez use:enhance.
    code: |
      <!-- src/routes/settings/+page.svelte -->
      <script lang="ts">
        import { superForm } from 'sveltekit-superforms';
        import type { PageData } from './$types';

        export let data: PageData;

        const {
          form,        // store z wartościami pól
          errors,      // store z błędami per pole
          message,     // store z wiadomością sukces/error
          enhance,     // use:enhance dla formularza
          submitting,  // store boolean — trwa submit
          delayed,     // true po 500ms (dla skeleton)
          timeout,     // true po 8s (stuck indicator)
        } = superForm(data.form, {
          resetForm: true,         // reset po success
          scrollToError: 'smooth', // scroll do pierwszego błędu
          taintedMessage: 'Masz niezapisane zmiany. Opuścić stronę?',
        });
      </script>

      {#if $message}
        <div class="toast" class:success={$message}>
          {$message}
        </div>
      {/if}

      <form method="POST" use:enhance>
        <div class="field">
          <label>Nazwa użytkownika</label>
          <input name="username" bind:value={$form.username} />
          {#if $errors.username}
            <span class="error">{$errors.username}</span>
          {/if}
        </div>

        <div class="field">
          <label>Bio</label>
          <textarea name="bio" bind:value={$form.bio}></textarea>
          {#if $errors.bio}<span class="error">{$errors.bio}</span>{/if}
        </div>

        <label>
          <input name="notifications" type="checkbox" bind:checked={$form.notifications} />
          Powiadomienia email
        </label>

        <select name="theme" bind:value={$form.theme}>
          <option value="light">Jasny</option>
          <option value="dark">Ciemny</option>
          <option value="system">Systemowy</option>
        </select>

        <button disabled={$submitting}>
          {$delayed ? 'Zapisywanie...' : 'Zapisz ustawienia'}
        </button>
      </form>

  - name: Form action + invalidateAll — odśwież dane po submit
    desc: >
      Po form action dane na stronie aktualizują się automatycznie.
      invalidateAll() ręcznie wymusza re-run wszystkich load functions.
    code: |
      <!-- Lista z formularzem — dane odświeżają się po dodaniu -->
      <script lang="ts">
        import { enhance, applyAction } from '$app/forms';
        import { invalidateAll } from '$app/navigation';
        import type { PageData } from './$types';

        export let data: PageData;
      </script>

      <!-- Lista zadań z danymi z load() — auto-refresh po action -->
      <ul>
        {#each data.tasks as task (task.id)}
          <li>
            <form method="POST" action="?/toggleTask" use:enhance>
              <input type="hidden" name="id" value={task.id} />
              <button type="submit">
                {task.done ? '✅' : '⬜'} {task.title}
              </button>
            </form>
          </li>
        {/each}
      </ul>

      <!-- Formularz dodania — use:enhance auto-odświeża listę -->
      <form
        method="POST"
        action="?/addTask"
        use:enhance={({ formElement }) => {
          return async ({ update }) => {
            await update({ reset: true });  // reset formularza + refresh data
            // lub: await invalidateAll();   // pełny refresh
          };
        }}
      >
        <input name="title" placeholder="Nowe zadanie" required />
        <button type="submit">Dodaj</button>
      </form>

      // +page.server.ts
      export const actions = {
        addTask: async ({ request, locals }) => {
          const data = await request.formData();
          await db.tasks.create({ data: {
            title: data.get('title') as string,
            userId: locals.user.id,
            done: false,
          }});
          // return {} — use:enhance automatycznie invaliduje $page.data
        },
        toggleTask: async ({ request, locals }) => {
          const data = await request.formData();
          const id = data.get('id') as string;
          const task = await db.tasks.findUnique({ where: { id } });
          await db.tasks.update({ where: { id }, data: { done: !task?.done } });
        },
      };
