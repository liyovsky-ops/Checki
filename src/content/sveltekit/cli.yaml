title: Komendy SvelteKit

groups:
  - name: Inicjalizacja i CLI
    icon: "🚀"
    commands:
      - cmd: npm create svelte@latest my-app
        desc: Utwórz nowy projekt SvelteKit
        detail:
          what: Kreator projektu SvelteKit — pyta o TypeScript, ESLint, Prettier, Playwright, Vitest. Tworzy gotową strukturę katalogów.
          how: Używa pakietu create-svelte. Po tym cd my-app && npm install && npm run dev.
          tips:
            - 'npm create svelte@latest . — w istniejącym katalogu'
            - 'Wybierz "Skeleton project" dla czystego startu bez demo kodu'

      - cmd: npx sv create my-app
        desc: Nowe CLI sv (Svelte 5+) — alternatywa create-svelte
        detail:
          what: Nowy oficjalny CLI od Svelte team, zastępuje create-svelte. Obsługuje Svelte 5 i SvelteKit.
          how: npx sv create my-app — interaktywny wizard jak poprzedni, ale nowszy pakiet.
          tips:
            - 'npx sv add drizzle — dodaj integrację Drizzle po stworzeniu projektu'
            - 'npx sv add lucia — dodaj auth Lucia'

      - cmd: npm run dev
        desc: Uruchom dev server z HMR
        detail:
          what: Startuje Vite dev server z Hot Module Replacement. Zmiany w .svelte plikach = instant update bez reloadu.
          how: Domyślnie http://localhost:5173. Wspiera TypeScript, SCSS, PostCSS natywnie przez Vite.
          tips:
            - 'npm run dev -- --open — otwórz przeglądarkę automatycznie'
            - 'npm run dev -- --port 3000 --host — inny port + udostępnij w sieci'

      - cmd: npm run build
        desc: Zbuduj produkcyjną wersję
        detail:
          what: Kompiluje Svelte do zoptymalizowanego JS i uruchamia adapter (node, static, vercel). Wynik w katalogu build/.
          how: Adapter jest skonfigurowany w svelte.config.js. Każdy adapter generuje inny output.
          tips:
            - 'npm run preview — podgląd production build lokalnie przed deployem'
            - 'npx svelte-kit sync — regeneruj typy po buildzie gdy się rozjadą'

      - cmd: npm run preview
        desc: Lokalny podgląd production build
        detail:
          what: Uruchamia production build lokalnie na http://localhost:4173. Sprawdź SSR, routing, API przed deployem.
          how: Wymaga wcześniejszego npm run build. Emuluje produkcyjny serwer.
          tips:
            - 'Zawsze sprawdź preview przed pushem na hosting'
            - 'Detect różnice między dev a prod — SSR edge cases, missing env vars'

      - cmd: npx svelte-kit sync
        desc: Synchronizuj typy SvelteKit
        detail:
          what: Generuje TypeScript types dla routes, load functions, form actions w .svelte-kit/types/. Odpalany automatycznie przez dev/build.
          how: Ręcznie uruchom gdy types się rozjadą lub po dodaniu nowych tras.
          tips:
            - 'Uruchamia się automatycznie przy dev i build — ręcznie tylko przy problemach'
            - 'Dodaj do postinstall w package.json dla CI'

  - name: Struktura plików i routing
    icon: "🗂️"
    commands:
      - code: |
          src/routes/
            +page.svelte              → /
            +layout.svelte            → root layout (navbar, footer)
            +error.svelte             → globalna strona błędu
            about/
              +page.svelte            → /about
            blog/
              +page.svelte            → /blog
              [slug]/
                +page.svelte          → /blog/my-post
                +page.server.ts       → load z DB dla /blog/:slug
            (auth)/
              login/+page.svelte      → /login (group bez URL prefix)
              register/+page.svelte   → /register
            api/
              users/+server.ts        → /api/users REST endpoint
        desc: Kompletna struktura katalogów SvelteKit
        detail:
          what: File-based routing — każdy plik w routes/ odpowiada ścieżce URL. + prefix = plik specjalny SvelteKit.
          how: Katalogi tworzą ścieżki, [slug] = dynamiczny param, (group) = grupowanie bez wpływu na URL.
          tips:
            - 'Tylko pliki z + prefixem są plikami specjalnymi SvelteKit'
            - 'Każdy katalog może mieć własny +layout.svelte i +error.svelte'

      - code: |
          <!-- src/routes/+page.svelte — strona główna -->
          <script lang="ts">
            import type { PageData } from './$types';

            export let data: PageData;
          </script>

          <svelte:head>
            <title>{data.title}</title>
          </svelte:head>

          <h1>{data.title}</h1>
          <p>{data.description}</p>
        desc: Podstawowa strona +page.svelte z danymi z load()
        detail:
          what: +page.svelte to komponent Svelte dla danej trasy. data pochodzi z load() w +page.ts lub +page.server.ts.
          how: export let data — odbiera dane z load(). $types generuje typy automatycznie przez svelte-kit sync.
          tips:
            - 'Używaj PageData z ./$types dla pełnego type safety'
            - '<svelte:head> — dodaj meta tagi, title per strona'

      - code: |
          <!-- src/routes/blog/[slug]/+page.svelte -->
          <script lang="ts">
            import type { PageData } from './$types';
            export let data: PageData;
          </script>

          <article>
            <h1>{data.post.title}</h1>
            <time>{data.post.date}</time>
            {@html data.post.content}
          </article>

          <!-- URL: /blog/hello-world → params.slug = "hello-world" -->
        desc: Dynamiczne trasy z parametrem [slug]
        detail:
          what: Katalog [slug] tworzy dynamiczny segment. params.slug dostępny w load() i page store.
          how: Nazwa w nawiasach = nazwa parametru. Dowolna nazwa np. [id], [username], [category].
          tips:
            - '[[slug]] — opcjonalny parametr (trafia na / i /anything)'
            - '[...rest] — catch-all (trafia na /a/b/c → rest = ["a","b","c"])'

      - code: |
          <!-- src/routes/+layout.svelte — root layout -->
          <script lang="ts">
            import Nav from '$lib/components/Nav.svelte';
            import Footer from '$lib/components/Footer.svelte';
          </script>

          <Nav />

          <main>
            <slot />  <!-- tutaj renderuje się strona -->
          </main>

          <Footer />

          <style>
            main {
              max-width: 1200px;
              margin: 0 auto;
              padding: 2rem;
            }
          </style>
        desc: Root layout opakowujący wszystkie strony
        detail:
          what: +layout.svelte opakowuje wszystkie strony w danym katalogu i podkatalogach. <slot /> renderuje aktualną stronę.
          how: Nested layouts — każdy katalog może mieć swój +layout.svelte nakładający się na parent layout.
          tips:
            - '+layout.reset.svelte — resetuje layout do domyślnego (usuwa parent layout)'
            - 'Nested layouts stackują się: root → dashboard → settings'

      - code: |
          <!-- src/routes/+error.svelte -->
          <script lang="ts">
            import { page } from '$app/stores';
          </script>

          <div class="error-page">
            <h1>{$page.status}</h1>
            <p>{$page.error?.message}</p>
            <a href="/">Wróć do strony głównej</a>
          </div>
        desc: Strona błędu +error.svelte
        detail:
          what: Wyświetla się gdy load() rzuci error() lub strona nie istnieje (404). Dostęp do status i message przez $page store.
          how: Każdy katalog może mieć własny +error.svelte dla granularnych stron błędów.
          tips:
            - 'error() z @sveltejs/kit — rzucaj błędy z load()/actions'
            - 'Osobny +error.svelte w src/routes/dashboard/ dla custom 404 w dashboardzie'

      - code: |
          // Route groups — (auth)/login/+page.svelte
          // URL: /login (bez (auth) w URL)
          // Pozwala na wspólny layout dla grupy tras bez prefix w URL

          // src/routes/(auth)/+layout.svelte
          // Tylko dla stron w grupie (auth)
          <script>
            import { redirect } from '@sveltejs/kit';
            import { browser } from '$app/environment';
          </script>

          <div class="auth-wrapper">
            <slot />
          </div>

          // Struktura:
          // (auth)/login/+page.svelte   → /login
          // (auth)/register/+page.svelte → /register
          // (app)/dashboard/+page.svelte → /dashboard (inny layout)
        desc: Route groups — (group) bez wpływu na URL
        detail:
          what: Nawiasy okrągłe tworzą grupy tras z własnym layoutem bez dodawania do URL. Idealne do oddzielenia auth/app/marketing layouts.
          how: (auth), (app), (marketing) — nazwy grup dowolne, nie wpływają na URL.
          tips:
            - 'Każda grupa może mieć swój +layout.svelte'
            - 'Użyj do oddzielenia stron z nawigacją od stron bez nawigacji (np. pełnoekranowy login)'

      - code: |
          // [[optional]] — opcjonalny parametr
          // src/routes/[[lang]]/about/+page.svelte
          // Trafia na: /about i /pl/about i /en/about

          // [...rest] — catch-all
          // src/routes/docs/[...path]/+page.svelte
          // Trafia na: /docs/getting-started/installation

          import type { PageServerLoad } from './$types';

          export const load: PageServerLoad = async ({ params }) => {
            // params.lang = undefined | "pl" | "en"
            // params.path = "getting-started/installation"
            const lang = params.lang ?? 'pl';
            const pathParts = params.path?.split('/') ?? [];
            return { lang, pathParts };
          };
        desc: "Opcjonalne parametry [[optional]] i catch-all [...rest]"
        detail:
          what: Zaawansowane wzorce routingu — opcjonalne segmenty i catch-all dla wielopoziomowych ścieżek.
          how: "[[lang]] pasuje do /about i /pl/about. [...path] pasuje do dowolnej głębokości."
          tips:
            - 'Przydatne dla i18n routing (język jako opcjonalny prefiks)'
            - '[...rest] dla dokumentacji z zagnieżdżonymi sekcjami'

      - code: |
          // Preloading — $app/navigation
          import { preloadData, preloadCode } from '$app/navigation';

          // Preload dane dla trasy (uruchamia load function)
          async function onMouseEnter() {
            await preloadData('/blog/hello-world');
          }

          // Preload tylko JS kod bez danych
          async function prefetchRoute() {
            await preloadCode('/dashboard');
          }
        desc: Preloading tras — preloadData i preloadCode
        detail:
          what: preloadData uruchamia load function trasy z wyprzedzeniem (cache'uje dane). preloadCode ładuje tylko JS bundle.
          how: Użyj na hover linku dla instant navigation feel. SvelteKit robi to automatycznie dla <a data-sveltekit-preload-data>.
          tips:
            - '<a href="/blog" data-sveltekit-preload-data="hover"> — automatyczny preload'
            - 'data-sveltekit-preload-code — tylko kod, bez danych'

  - name: Load Functions
    icon: "📡"
    commands:
      - code: |
          // src/routes/blog/[slug]/+page.server.ts
          // Działa TYLKO na serwerze — dostęp do DB, sekretów, cookies
          import type { PageServerLoad } from './$types';
          import { error } from '@sveltejs/kit';
          import { db } from '$lib/server/db';

          export const load: PageServerLoad = async ({ params, cookies, locals }) => {
            const post = await db.posts.findUnique({
              where: { slug: params.slug }
            });

            if (!post) {
              throw error(404, 'Post nie znaleziony');
            }

            return {
              post,
              user: locals.user  // z hooks.server.ts
            };
          };
        desc: +page.server.ts — load tylko na serwerze (DB, sekrety)
        detail:
          what: +page.server.ts load function działa wyłącznie na serwerze. Dostęp do DB, API keys, cookies, locals (z hooks).
          how: Zwrócone dane są serializable (JSON). Dostęp w +page.svelte przez export let data.
          tips:
            - 'Sekrety nigdy nie trafiają do klienta — bezpieczne do env vars'
            - 'locals — dane z hooks.server.ts (np. zalogowany user)'

      - code: |
          // src/routes/products/+page.ts
          // Universal load — działa na serwerze (SSR) i kliencie (nawigacja)
          import type { PageLoad } from './$types';

          export const load: PageLoad = async ({ fetch, params, url }) => {
            // fetch = enhanced fetch z SvelteKit (relative URLs, credentials)
            const res = await fetch(`/api/products?category=${url.searchParams.get('cat')}`);

            if (!res.ok) {
              throw new Error('Błąd pobierania produktów');
            }

            return {
              products: await res.json(),
              category: url.searchParams.get('cat') ?? 'all'
            };
          };
        desc: +page.ts — universal load (SSR + client)
        detail:
          what: +page.ts load działa zarówno na serwerze (pierwszy render) jak i na kliencie (nawigacja SPA). Używa enhanced fetch.
          how: Nie ma dostępu do DB ani sekretów bezpośrednio — używaj API routes lub +page.server.ts.
          tips:
            - 'Enhanced fetch — automatycznie przekazuje cookies, obsługuje relative URLs'
            - 'Używaj gdy chcesz SPA navigation bez round-trip do serwera'

      - code: |
          // src/routes/dashboard/+layout.server.ts
          // Parent layout load — dane dostępne dla WSZYSTKICH podstron
          import type { LayoutServerLoad } from './$types';
          import { redirect } from '@sveltejs/kit';

          export const load: LayoutServerLoad = async ({ locals, url }) => {
            if (!locals.user) {
              throw redirect(303, `/login?redirectTo=${url.pathname}`);
            }

            return {
              user: locals.user,
              notifications: await getNotifications(locals.user.id)
            };
          };

          // src/routes/dashboard/settings/+page.server.ts
          import type { PageServerLoad } from './$types';

          export const load: PageServerLoad = async ({ parent }) => {
            const { user } = await parent();  // dane z layout load
            return { settings: await getUserSettings(user.id) };
          };
        desc: Layout load + parent() — dane dla podstron
        detail:
          what: +layout.server.ts load daje dane wszystkim stronom w katalogu. await parent() w page load pobiera dane z nadrzędnego layout load.
          how: Idealny do sprawdzania auth w jednym miejscu dla całego dashboardu.
          tips:
            - 'parent() czeka na zakończenie parent load — uwaga na waterfalle'
            - 'Użyj Promise.all dla równoległego fetching'

      - code: |
          // src/routes/blog/[slug]/+page.server.ts
          import { error, redirect } from '@sveltejs/kit';

          export const load = async ({ params, locals }) => {
            // Redirect
            if (params.slug === 'old-post') {
              throw redirect(301, '/blog/new-post');  // 301 permanent, 303 see other
            }

            // Error — pojawi się +error.svelte
            const post = await getPost(params.slug);
            if (!post) throw error(404, { message: 'Post nie znaleziony' });
            if (post.draft && !locals.user?.admin) throw error(403, 'Brak dostępu');

            return { post };
          };
        desc: error() i redirect() w load function
        detail:
          what: error() wyświetla +error.svelte z kodem HTTP. redirect() przekierowuje z kodem 3xx.
          how: Oba rzucają specjalne obiekty które SvelteKit przechwytuje — nie zwykłe Error.
          tips:
            - '301 = permanent redirect (SEO), 303 = see other (po POST), 307 = temporary'
            - 'error() przyjmuje status + obiekt z message lub string'

      - code: |
          // Streaming danych z promises (SvelteKit 1.8+)
          // src/routes/dashboard/+page.server.ts
          export const load = async ({ locals }) => {
            // Zwróć promise — SvelteKit stream-uje dane do klienta
            return {
              user: locals.user,  // natychmiastowe
              stats: getHeavyStats(locals.user.id),  // promise — streamed
              recommendations: getRecommendations(),   // promise — streamed
            };
          };

          <!-- +page.svelte -->
          <script lang="ts">
            export let data;
          </script>

          <!-- Natychmiastowe dane -->
          <h1>Witaj {data.user.name}</h1>

          <!-- Streamed promise -->
          {#await data.stats}
            <p>Ładowanie statystyk...</p>
          {:then stats}
            <Stats {stats} />
          {:catch error}
            <p>Błąd: {error.message}</p>
          {/await}
        desc: Streaming promises — skeleton UI bez blokowania
        detail:
          what: Zwróć promise z load() — SvelteKit stream-uje dane do klienta bez blokowania renderowania strony. Natywny skeleton loading.
          how: Szybkie dane renderują się natychmiast, wolne (AI, ciężkie DB) doganiają przez stream.
          tips:
            - 'Idealne dla dashboardów z różnymi prędkościami danych'
            - 'Działa tylko z adapter-node i adapter-vercel (nie static)'

      - code: |
          // depends() — manualna invalidacja
          // src/routes/cart/+page.ts
          export const load = async ({ fetch, depends }) => {
            depends('app:cart');  // zarejestruj dependency

            const cart = await fetch('/api/cart').then(r => r.json());
            return { cart };
          };

          // Gdziekolwiek w komponencie:
          import { invalidate, invalidateAll } from '$app/navigation';

          async function addToCart(productId: string) {
            await fetch('/api/cart', { method: 'POST', body: JSON.stringify({ productId }) });
            await invalidate('app:cart');  // re-run load z depends('app:cart')
          }

          // invalidateAll() — re-run wszystkich load functions
        desc: depends() i invalidate() — reaktywne odświeżanie danych
        detail:
          what: depends() rejestruje dependency — invalidate() powoduje ponowne uruchomienie load functions które ją mają.
          how: Alternatywa dla pełnego reload strony. Odśwież tylko potrzebne dane po mutacji.
          tips:
            - 'invalidateAll() — nuclear option, odświeża wszystko'
            - 'Używaj URL dependency: depends(url.href) — odświeża przy zmianie URL'

      - code: |
          // Load function z url, setHeaders, cookies
          import type { PageServerLoad } from './$types';

          export const load: PageServerLoad = async ({
            params,
            url,
            request,
            cookies,
            setHeaders,
            getClientAddress,
          }) => {
            // Cache control
            setHeaders({ 'cache-control': 'max-age=60' });

            // Cookies
            const sessionId = cookies.get('session');
            cookies.set('lastVisit', new Date().toISOString(), { path: '/' });

            // URL params
            const page = Number(url.searchParams.get('page') ?? '1');
            const sort = url.searchParams.get('sort') ?? 'date';

            return { sessionId, page, sort };
          };
        desc: Pełne API load function — url, cookies, setHeaders
        detail:
          what: "Load function ma dostęp do wielu narzędzi: params, url, request, cookies, setHeaders, locals, getClientAddress."
          how: setHeaders ustawia HTTP headers response. cookies — read/write HTTP cookies.
          tips:
            - 'setHeaders({ "cache-control": "max-age=3600" }) — cache dla stron statycznych'
            - 'cookies.set() — HttpOnly cookies bezpiecznie z serwera'

      - code: |
          // Równoległe fetching — unikaj waterfallów
          export const load = async ({ fetch, params }) => {
            // ZLE — sekwencyjnie (waterfall)
            const user = await fetch('/api/user').then(r => r.json());
            const posts = await fetch('/api/posts').then(r => r.json());  // czeka na user

            // DOBRZE — równoległe
            const [user, posts, comments] = await Promise.all([
              fetch('/api/user').then(r => r.json()),
              fetch('/api/posts').then(r => r.json()),
              fetch(`/api/comments/${params.id}`).then(r => r.json()),
            ]);

            return { user, posts, comments };
          };
        desc: Promise.all — równoległe fetching bez waterfallów
        detail:
          what: await Promise.all() uruchamia wszystkie fetche jednocześnie zamiast sekwencyjnie. Krytyczne dla wydajności.
          how: Jeśli nie ma zależności między danymi — zawsze fetchuj równolegle.
          tips:
            - 'Waterfall = każdy request czeka na poprzedni — zły pattern w load()'
            - 'Zwróć Promise bez await dla streaming (nie blokuje renderowania)'

  - name: Form Actions
    icon: "📬"
    commands:
      - code: |
          // src/routes/login/+page.server.ts
          import type { Actions } from './$types';
          import { fail, redirect } from '@sveltejs/kit';

          export const actions: Actions = {
            default: async ({ request, cookies }) => {
              const data = await request.formData();
              const email = data.get('email') as string;
              const password = data.get('password') as string;

              if (!email || !password) {
                return fail(400, { email, error: 'Email i hasło są wymagane' });
              }

              const user = await authenticate(email, password);
              if (!user) {
                return fail(401, { email, error: 'Nieprawidłowe dane logowania' });
              }

              cookies.set('session', user.token, {
                path: '/',
                httpOnly: true,
                secure: true,
                sameSite: 'strict',
                maxAge: 60 * 60 * 24 * 7  // 7 dni
              });

              throw redirect(303, '/dashboard');
            }
          };
        desc: Podstawowy form action — login z cookies
        detail:
          what: actions.default obsługuje POST z formularza. fail() zwraca błąd z danymi (bez redirect). redirect() przekierowuje po sukcesie.
          how: Progressive enhancement — działa bez JS, z JS brak pełnego page reload. Dane z request.formData().
          tips:
            - 'fail() wraca do strony z danymi form i błędem — nie redirect'
            - 'cookies.set() z httpOnly: true — bezpieczne session cookie'

      - code: |
          // Named actions — kilka akcji na jednej stronie
          // src/routes/profile/+page.server.ts
          import type { Actions } from './$types';
          import { fail } from '@sveltejs/kit';

          export const actions: Actions = {
            updateName: async ({ request, locals }) => {
              const data = await request.formData();
              const name = data.get('name') as string;
              if (name.length < 2) return fail(400, { error: 'Za krótkie imię' });
              await updateUser(locals.user.id, { name });
              return { success: true, action: 'name' };
            },

            updateEmail: async ({ request, locals }) => {
              const data = await request.formData();
              const email = data.get('email') as string;
              await updateUser(locals.user.id, { email });
              return { success: true, action: 'email' };
            },

            deleteAccount: async ({ locals, cookies }) => {
              await deleteUser(locals.user.id);
              cookies.delete('session', { path: '/' });
            }
          };

          <!-- +page.svelte — named actions -->
          <!-- <form method="POST" action="?/updateName"> -->
          <!-- <form method="POST" action="?/deleteAccount"> -->
        desc: Named actions — kilka formularzy na jednej stronie
        detail:
          what: "Każda named action ma własny URL: action=\"?/updateName\". Można mieć wiele niezależnych formularzy na stronie."
          how: Konwencja ?/nazwaAkcji — SvelteKit routuje do właściwej funkcji w actions.
          tips:
            - 'Nie można mieć "default" razem z named actions (jedno albo drugie)'
            - 'action="?/delete" — URL-safe, działa bez JS'

      - code: |
          <!-- src/routes/login/+page.svelte — use:enhance -->
          <script lang="ts">
            import { enhance } from '$app/forms';
            import type { ActionData } from './$types';

            export let form: ActionData;
            let loading = false;
          </script>

          <form
            method="POST"
            use:enhance={() => {
              loading = true;
              return async ({ result, update }) => {
                loading = false;
                if (result.type === 'redirect') {
                  // SvelteKit automatycznie robi redirect
                }
                await update();  // odśwież dane strony
              };
            }}
          >
