            - '$message — sukces/error message po submit'

  - name: Hooks — server i client
    icon: "🪝"
    commands:
      - code: |
          // src/hooks.server.ts — główny plik server hooks
          import type { Handle } from '@sveltejs/kit';
          import { db } from '$lib/server/db';

          export const handle: Handle = async ({ event, resolve }) => {
            // Uruchamia się przy KAŻDYM request
            const sessionId = event.cookies.get('session');

            if (sessionId) {
              const session = await db.sessions.findUnique({
                where: { id: sessionId },
                include: { user: true }
              });
              if (session) {
                event.locals.user = session.user;
              }
            }

            const response = await resolve(event);

            // Modyfikuj response headers
            response.headers.set('X-Frame-Options', 'DENY');
            response.headers.set('X-Content-Type-Options', 'nosniff');

            return response;
          };
        desc: hooks.server.ts — middleware dla każdego requestu
        detail:
          what: handle() uruchamia się przy każdym request — auth, logging, headers. event.locals = dane przekazane do load functions.
          how: resolve(event) renderuje stronę/endpoint. Możesz modyfikować request przed i response po resolve.
          tips:
            - 'event.locals — dane per-request, dostępne w load() i actions'
            - 'Dodaj security headers tu — działają dla całej aplikacji'

      - code: |
          // sequence() — kilka handle hooks
          import { sequence } from '@sveltejs/kit/hooks';
          import type { Handle } from '@sveltejs/kit';

          const auth: Handle = async ({ event, resolve }) => {
            const token = event.cookies.get('token');
            event.locals.user = token ? await verifyToken(token) : null;
            return resolve(event);
          };

          const logging: Handle = async ({ event, resolve }) => {
            const start = Date.now();
            const response = await resolve(event);
            console.log(`${event.request.method} ${event.url.pathname} — ${Date.now() - start}ms`);
            return response;
          };

          const rateLimit: Handle = async ({ event, resolve }) => {
            const ip = event.getClientAddress();
            if (await isRateLimited(ip)) {
              return new Response('Too Many Requests', { status: 429 });
            }
            return resolve(event);
          };

          export const handle = sequence(auth, logging, rateLimit);
        desc: sequence() — kilka niezależnych middleware
        detail:
          what: sequence() komponuje wiele handle functions w łańcuch. Uruchamiają się po kolei w podanej kolejności.
          how: Każdy hook może zakończyć request wcześniej (np. rate limiting) lub przepuścić go dalej.
          tips:
            - 'Kolejność ważna — auth przed logging, rate limit na początku'
            - 'Każdy handler jest niezależny — łatwy do testowania i wymiany'

      - code: |
          // hooks.server.ts — handleFetch i handleError
          import type { HandleFetch, HandleError } from '@sveltejs/kit';

          // Modyfikuj fetch w load functions po stronie serwera
          export const handleFetch: HandleFetch = async ({ request, fetch, event }) => {
            // Dodaj auth header do internal API calls
            if (request.url.startsWith('http://localhost')) {
              request = new Request(request, {
                headers: {
                  ...Object.fromEntries(request.headers),
                  'x-internal-token': process.env.INTERNAL_TOKEN ?? '',
                }
              });
            }
            return fetch(request);
          };

          // Obsługa nieobsłużonych błędów
          export const handleError: HandleError = async ({ error, event, status, message }) => {
            console.error('Nieobsłużony błąd:', { error, url: event.url.pathname, status });
            // Wyślij do Sentry, etc.
            await reportToSentry(error, event);
            // Zwróć bezpieczny komunikat (nie szczegóły błędu)
            return { message: 'Wystąpił nieoczekiwany błąd' };
          };
        desc: handleFetch i handleError — zaawansowane hooks
        detail:
          what: handleFetch modyfikuje fetch w load functions (dodaj headers do internal API). handleError obsługuje nieoczekiwane błędy.
          how: handleError otrzymuje error, event, status — loguj, raportuj, zwróć bezpieczny message.
          tips:
            - 'handleFetch — idealny do proxy internal services z auth'
            - 'handleError — integracja z Sentry, DataDog, custom error tracking'

      - code: |
          // Protected routes — auth w hooks
          import type { Handle } from '@sveltejs/kit';
          import { redirect } from '@sveltejs/kit';

          const PROTECTED_ROUTES = ['/dashboard', '/profile', '/settings', '/admin'];

          export const handle: Handle = async ({ event, resolve }) => {
            // Sprawdź auth
            const session = event.cookies.get('session');
            event.locals.user = session ? await getUser(session) : null;

            // Ochrona tras
            const isProtected = PROTECTED_ROUTES.some(route =>
              event.url.pathname.startsWith(route)
            );

            if (isProtected && !event.locals.user) {
              throw redirect(303, `/login?redirectTo=${event.url.pathname}`);
            }

            // Admin-only
            if (event.url.pathname.startsWith('/admin') && !event.locals.user?.admin) {
              throw redirect(303, '/403');
            }

            return resolve(event);
          };
        desc: Protected routes — auth middleware w hooks
        detail:
          what: Centralny auth check w hooks.server.ts chroni całe sekcje aplikacji bez duplikowania kodu w każdej load function.
          how: redirect w hooks działa identycznie jak w load() — SvelteKit obsługuje oba przypadki.
          tips:
            - 'event.locals.user — raz sprawdzone, dostępne wszędzie'
            - 'redirectTo param — wróć user na żądaną stronę po logowaniu'

      - code: |
          // src/hooks.client.ts — client-side hooks
          import type { HandleClientError, HandleNavigate } from '@sveltejs/kit';

          // Obsługa błędów po stronie klienta
          export const handleError: HandleClientError = ({ error, event, status, message }) => {
            console.error('Client error:', error);
            // analytics.trackError(error);
            return { message: 'Coś poszło nie tak' };
          };
        desc: hooks.client.ts — client-side error handling
        detail:
          what: hooks.client.ts działa w przeglądarce. handleError obsługuje błędy client-side (JavaScript runtime errors).
          how: Oddzielny plik od hooks.server.ts — server i client hooks są osobne.
          tips:
            - 'Integracja z Google Analytics, Sentry Browser SDK'
            - 'Nie ma dostępu do DB ani sekretów — to jest klient'

  - name: API Routes (+server.ts)
    icon: "🔌"
    commands:
      - code: |
          // src/routes/api/users/+server.ts
          import { json, error } from '@sveltejs/kit';
          import type { RequestHandler } from './$types';
          import { db } from '$lib/server/db';

          export const GET: RequestHandler = async ({ url, locals }) => {
            // Auth check
            if (!locals.user) throw error(401, 'Unauthorized');

            const page = Number(url.searchParams.get('page') ?? '1');
            const limit = Number(url.searchParams.get('limit') ?? '20');

            const users = await db.users.findMany({
              skip: (page - 1) * limit,
              take: limit,
              select: { id: true, name: true, email: true, createdAt: true }
            });

            const total = await db.users.count();

            return json({ users, total, page, limit });
          };
        desc: GET endpoint — lista użytkowników z paginacją
        detail:
          what: +server.ts eksportuje GET, POST, PUT, PATCH, DELETE — pełne REST API. json() helper tworzy Response z JSON.
          how: RequestHandler z ./$types zapewnia type safety. url.searchParams dla query params.
          tips:
            - 'Wszystkie endpointy mają dostęp do locals (user z hooks)'
            - 'json() automatycznie ustawia Content-Type: application/json'

      - code: |
          // POST endpoint — tworzenie zasobu
          import { json, error } from '@sveltejs/kit';
          import type { RequestHandler } from './$types';
          import { z } from 'zod';

          const createUserSchema = z.object({
            name: z.string().min(2),
            email: z.string().email(),
          });

          export const POST: RequestHandler = async ({ request, locals }) => {
            if (!locals.user?.admin) throw error(403, 'Forbidden');

            const body = await request.json();
            const result = createUserSchema.safeParse(body);

            if (!result.success) {
              throw error(400, result.error.flatten().fieldErrors.toString());
            }

            const user = await db.users.create({ data: result.data });
            return json(user, { status: 201 });
          };

          export const DELETE: RequestHandler = async ({ params, locals }) => {
            if (!locals.user?.admin) throw error(403, 'Forbidden');
            await db.users.delete({ where: { id: params.id } });
            return new Response(null, { status: 204 });
          };
        desc: POST i DELETE — tworzenie i usuwanie zasobu
        detail:
          what: request.json() parsuje body. Walidacja Zod. Zwróć 201 dla create, 204 dla delete (bez body).
          how: error() z @sveltejs/kit zwraca HTTP error response. Zod waliduje input.
          tips:
            - 'new Response(null, { status: 204 }) — brak body dla DELETE'
            - 'Zawsze waliduj input w API endpoints'

      - code: |
          // CORS headers dla API
          import type { RequestHandler } from './$types';
          import { json } from '@sveltejs/kit';

          const CORS_HEADERS = {
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',
            'Access-Control-Allow-Headers': 'Content-Type, Authorization',
          };

          // Obsługa preflight
          export const OPTIONS: RequestHandler = async () => {
            return new Response(null, { headers: CORS_HEADERS });
          };

          export const GET: RequestHandler = async ({ url }) => {
            const data = await fetchPublicData();
            return json(data, { headers: CORS_HEADERS });
          };
        desc: CORS headers w API endpoints
        detail:
          what: CORS pozwala na cross-origin requests. OPTIONS handler obsługuje preflight request (przeglądarka wysyła przed właściwym request).
          how: Dodaj CORS_HEADERS do każdej Response lub użyj globalnych headers w hooks.server.ts.
          tips:
            - 'W hooks.server.ts możesz dodać CORS raz dla wszystkich /api/ tras'
            - 'Access-Control-Allow-Origin: "*" — otwarte API publiczne'

      - code: |
          // Webhook handler — weryfikacja sygnatury
          import type { RequestHandler } from './$types';
          import { error } from '@sveltejs/kit';
          import { STRIPE_WEBHOOK_SECRET } from '$env/static/private';

          export const POST: RequestHandler = async ({ request }) => {
            const body = await request.text();
            const signature = request.headers.get('stripe-signature') ?? '';

            try {
              const event = stripe.webhooks.constructEvent(body, signature, STRIPE_WEBHOOK_SECRET);

              switch (event.type) {
                case 'payment_intent.succeeded':
                  await handlePayment(event.data.object);
                  break;
                case 'customer.subscription.deleted':
                  await handleCancellation(event.data.object);
                  break;
              }

              return new Response(JSON.stringify({ received: true }));
            } catch (err) {
              throw error(400, `Webhook error: ${err.message}`);
            }
          };
        desc: Webhook handler — Stripe z weryfikacją sygnatury
        detail:
          what: Endpointy API służą jako webhook receivers. $env/static/private — bezpieczne env vars tylko na serwerze.
          how: request.text() zamiast request.json() — surowy body do weryfikacji sygnatury.
          tips:
            - '$env/static/private — build-time env vars (SEKRETY)'
            - '$env/dynamic/private — runtime env vars'

      - code: |
          // Server-Sent Events (SSE) — real-time streaming
          import type { RequestHandler } from './$types';

          export const GET: RequestHandler = async ({ request }) => {
            const stream = new ReadableStream({
              start(controller) {
                const encoder = new TextEncoder();
                let count = 0;

                const interval = setInterval(() => {
                  const data = JSON.stringify({ count: count++, time: new Date() });
                  controller.enqueue(encoder.encode(`data: ${data}\n\n`));

                  if (count > 10) {
                    clearInterval(interval);
                    controller.close();
                  }
                }, 1000);

                request.signal.addEventListener('abort', () => {
                  clearInterval(interval);
                  controller.close();
                });
              }
            });

            return new Response(stream, {
              headers: {
                'Content-Type': 'text/event-stream',
                'Cache-Control': 'no-cache',
                'Connection': 'keep-alive',
              }
            });
          };
        desc: Server-Sent Events — real-time streaming z API
        detail:
          what: SSE umożliwia serwer→klient streaming (live data, AI responses, progress). Działa przez zwykły HTTP GET.
          how: "ReadableStream + Content-Type: text/event-stream. Klient łączy się przez EventSource API lub fetch."
          tips:
            - 'Prostsze niż WebSockets dla one-way streaming'
            - 'Idealne dla AI chat streaming (LLM token-by-token response)'

