              <p class="error">{form.error}</p>
            {/if}

            <button disabled={loading}>
              {loading ? 'Logowanie...' : 'Zaloguj'}
            </button>
          </form>
        desc: use:enhance — progressive enhancement formularza
        detail:
          what: use:enhance zamienia zwykły formularz w SPA-style — brak pełnego page reload, loading state, obsługa result.
          how: Import z $app/forms. Callback pozwala na custom logikę po submit (loading state, toast notifications).
          tips:
            - 'use:enhance bez argumentu = domyślne zachowanie (update strony po success)'
            - 'result.type: "success" | "failure" | "redirect" | "error"'

      - code: |
          // Walidacja po stronie serwera z Zod
          // src/routes/register/+page.server.ts
          import { z } from 'zod';
          import { fail } from '@sveltejs/kit';

          const schema = z.object({
            email: z.string().email('Nieprawidłowy email'),
            password: z.string().min(8, 'Min 8 znaków'),
            name: z.string().min(2, 'Min 2 znaki'),
          });

          export const actions = {
            default: async ({ request }) => {
              const raw = Object.fromEntries(await request.formData());
              const result = schema.safeParse(raw);

              if (!result.success) {
                const errors = result.error.flatten().fieldErrors;
                return fail(400, {
                  data: raw,
                  errors: {
                    email: errors.email?.[0],
                    password: errors.password?.[0],
                    name: errors.name?.[0],
                  }
                });
              }

              await createUser(result.data);
              return { success: true };
            }
          };
        desc: Walidacja formularza z Zod w action
        detail:
          what: z.safeParse() waliduje dane po stronie serwera. Błędy wracają przez fail() do formularza bez JS reload.
          how: flatten().fieldErrors zwraca błędy per pole. raw data wraca do formularza żeby user nie tracił wpisanych danych.
          tips:
            - 'Zawsze waliduj PO STRONIE SERWERA — klient-side walidacja jest tylko UX'
            - 'Przywróć wartości pól: value={form?.data?.email ?? ""}'

      - code: |
          // Superforms — kompleksowe zarządzanie formularzami
          // npm install sveltekit-superforms zod
          // src/routes/contact/+page.server.ts
          import { superValidate, message } from 'sveltekit-superforms';
          import { zod } from 'sveltekit-superforms/adapters';
          import { fail } from '@sveltejs/kit';
          import { z } from 'zod';

          const schema = z.object({
            name: z.string().min(2),
            email: z.string().email(),
            message: z.string().min(10),
          });

          export const load = async () => {
            const form = await superValidate(zod(schema));
            return { form };
          };

          export const actions = {
            default: async ({ request }) => {
              const form = await superValidate(request, zod(schema));
              if (!form.valid) return fail(400, { form });
              await sendEmail(form.data);
              return message(form, 'Wiadomość wysłana!');
            }
          };
        desc: Superforms — walidacja formularzy z auto-binding
        detail:
          what: sveltekit-superforms automatycznie binduje schemat Zod do formularza, zarządza błędami, loading state i messages.
          how: superValidate() w load() inicjalizuje formularz. W action waliduje i zwraca wynik.
          tips:
            - 'npm install sveltekit-superforms zod — dwie paczki'
            - 'Zod, Yup, Valibot — wszystkie obsługiwane przez adaptery'

      - code: |
          <!-- Superforms w komponencie +page.svelte -->
          <script lang="ts">
            import { superForm } from 'sveltekit-superforms';
            import type { PageData } from './$types';

            export let data: PageData;

            const { form, errors, enhance, message, submitting } = superForm(data.form);
          </script>

          {#if $message}
            <p class="success">{$message}</p>
          {/if}

          <form method="POST" use:enhance>
            <div>
              <label>Imię</label>
              <input name="name" bind:value={$form.name} />
              {#if $errors.name}<span class="error">{$errors.name}</span>{/if}
            </div>

            <div>
              <label>Email</label>
              <input name="email" type="email" bind:value={$form.email} />
              {#if $errors.email}<span class="error">{$errors.email}</span>{/if}
            </div>

            <button disabled={$submitting}>
              {$submitting ? 'Wysyłanie...' : 'Wyślij'}
            </button>
          </form>
        desc: Superforms — komponent z auto-binding i błędami
        detail:
          what: superForm() zwraca reactive stores dla danych formularza, błędów, stanu submit i wiadomości.
          how: bind:value={$form.name} — dwustronne bindowanie. $errors.name — błędy per pole. $submitting — loading state.
          tips:
