          {#if $page.status === 404}
            <p>Strona nie znaleziona</p>
          {/if}

          <!-- Form result -->
          {#if $page.form?.error}
            <p class="error">{$page.form.error}</p>
          {/if}

          <!-- Active link -->
          <a
            href="/about"
            class:active={$page.url.pathname === '/about'}
          >
            O nas
          </a>
        desc: $page store — URL, params, dane, status
        detail:
          what: $page to reaktywny store z informacjami o aktualnej stronie. Dostępny w każdym komponencie Svelte.
          how: Import z $app/stores. Aktualizuje się przy każdej nawigacji.
          tips:
            - '$page.url.pathname — aktualny URL'
            - '$page.data — dane z load(), reaktywne'

      - code: |
          // navigating store — loading state podczas nawigacji
          <script lang="ts">
            import { navigating } from '$app/stores';
          </script>

          {#if $navigating}
            <div class="loading-bar" />
          {/if}

          <!-- navigating.from / navigating.to -->
          {#if $navigating}
            <p>Ładowanie {$navigating.to?.url.pathname}...</p>
          {/if}

          // updated store — nowa wersja aplikacji dostępna
          <script>
            import { updated } from '$app/stores';

            // Sprawdź co 30 minut (domyślnie)
            $: if ($updated) {
              // Nowa wersja deploymentu
              console.log('Nowa wersja aplikacji!');
            }
          </script>

          {#if $updated}
            <button on:click={() => location.reload()}>
              Dostępna aktualizacja — kliknij aby odświeżyć
            </button>
          {/if}
        desc: navigating i updated — loading state i aktualizacje
        detail:
          what: navigating = null gdy brak nawigacji, obiekt z from/to podczas. updated = true gdy nowy deployment jest dostępny.
          how: navigating do globalnego loading bar/spinner. updated do "new version" baneru.
          tips:
            - 'navigating.from i navigating.to — poprzedni i następny URL'
            - 'updated sprawdza /[hash].json — serwer musi być żywy'

      - code: |
          // goto() — programatyczna nawigacja
          import { goto, invalidate, invalidateAll } from '$app/navigation';

          // Podstawowa nawigacja
          await goto('/dashboard');

          // Z opcjami
          await goto('/search?q=svelte', {
            replaceState: false,    // czy replace w history
            noScroll: false,        // czy scrolluj na górę
            keepFocus: false,       // czy zachowaj focus elementu
            invalidateAll: true,    // odśwież wszystkie load functions
            state: { source: 'button' }  // history state
          });

          // Użycie w komponencie
          <script lang="ts">
            import { goto } from '$app/navigation';

            async function handleSubmit() {
              await saveData();
              await goto('/success', { replaceState: true });
            }
          </script>
        desc: goto() — programatyczna nawigacja
        detail:
          what: goto() nawiguje do URL programatycznie — po submit formularza, po akcji, warunkowy redirect.
          how: Zwraca Promise — await jeśli chcesz poczekać na zakończenie nawigacji.
          tips:
            - 'replaceState: true — nie dodaje do history (nie możesz "cofnąć")'
            - 'goto() tylko w przeglądarce — guard: if (browser) await goto(...)'

      - code: |
          // beforeNavigate i afterNavigate — lifecycle nawigacji
          import { beforeNavigate, afterNavigate } from '$app/navigation';
          import { onDestroy } from 'svelte';

          // Pytanie o potwierdzenie przed opuszczeniem strony
          beforeNavigate(({ cancel, from, to, type }) => {
            if (hasUnsavedChanges) {
              const confirmed = confirm('Masz niezapisane zmiany. Opuścić stronę?');
              if (!confirmed) cancel();  // anuluj nawigację
            }
          });

          // Analityka po nawigacji
          afterNavigate(({ from, to, type }) => {
            console.log(`Nawigacja z ${from?.url.pathname} do ${to?.url.pathname} (${type})`);
            analytics.trackPageView(to?.url.pathname);
          });
        desc: beforeNavigate i afterNavigate — lifecycle nawigacji
        detail:
          what: beforeNavigate uruchamia się przed zmianą trasy. afterNavigate po. Oba działają reaktywnie przez całe życie komponentu.
          how: 'cancel() w beforeNavigate anuluje nawigację (np. niezapisane zmiany). type: "link" | "goto" | "popstate".'
          tips:
            - 'Automatycznie cleanup przy destroy komponentu'
            - 'type "popstate" = user kliknął back/forward w przeglądarce'

      - code: |
          // browser i dev — env detection
          import { browser, dev, building, version } from '$app/environment';

          // Kod tylko w przeglądarce
          if (browser) {
            const token = localStorage.getItem('token');
            window.addEventListener('resize', handleResize);
          }

          // Kod tylko w development
          if (dev) {
            console.log('DEBUG mode');
          }

          // Wersja deploymentu (z kit.version.name)
          console.log('App version:', version);

          // W komponencie Svelte:
          <script>
            import { browser } from '$app/environment';

            let isClient = false;
            $: if (browser) isClient = true;  // reactive po hydration
          </script>

          {#if browser}
            <ClientOnlyWidget />
          {/if}
        desc: $app/environment — browser, dev, building, version
        detail:
          what: "browser = true tylko w przeglądarce. dev = true w development mode. building = true podczas npm run build."
          how: "Użyj do code-splitting: biblioteki SSR-incompatible tylko gdy browser === true."
          tips:
            - 'import dynamiczny: if (browser) { const lib = await import("client-lib") }'
            - 'building — usuń heavy debugowanie w trakcie build'

  - name: TypeScript i narzędzia
    icon: "📘"
    commands:
      - code: |
          // tsconfig.json — SvelteKit auto-generuje rozszerzenie
          // .svelte-kit/tsconfig.json — NIE EDYTUJ
          // tsconfig.json — Twoje zmiany (extends .svelte-kit)
          {
            "extends": "./.svelte-kit/tsconfig.json",
            "compilerOptions": {
              "strict": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true
            }
          }

          // Generowane typy per-route (.svelte-kit/types/):
          // ./$types → PageData, PageServerLoad, Actions, LayoutData

          import type { PageServerLoad, Actions, PageData } from './$types';

          export const load: PageServerLoad = async ({ params }) => {
            return { slug: params.slug };
          };

          export const actions: Actions = {
            default: async ({ request }) => { /* ... */ }
          };
        desc: TypeScript konfiguracja i ./$types
        detail:
          what: SvelteKit generuje typy per-route w .svelte-kit/types/. Import ./$types dla pełnego type safety bez ręcznego pisania typów.
          how: npx svelte-kit sync regeneruje typy. Działa automatycznie przy dev i build.
          tips:
            - 'Nigdy nie edytuj .svelte-kit/ — generowane automatycznie'
            - 'PageServerLoad vs PageLoad — server vs universal load function'

      - cmd: npx svelte-check
        desc: Sprawdź typy i błędy Svelte w całym projekcie
        detail:
          what: svelte-check sprawdza TypeScript types, a11y errors, i Svelte-specific problemy we wszystkich .svelte plikach.
          how: Odpowiednik tsc --noEmit ale rozumie składnię .svelte.
          tips:
            - 'npm run check — skrót w package.json'
            - 'npx svelte-check --watch — watch mode w osobnym terminalu'

      - code: |
          // vite.config.ts — konfiguracja Vite w SvelteKit
          import { sveltekit } from '@sveltejs/kit/vite';
          import { defineConfig } from 'vite';

          export default defineConfig({
            plugins: [sveltekit()],
            server: {
              proxy: {
                '/external-api': {
                  target: 'https://api.external.com',
                  changeOrigin: true,
                  rewrite: (path) => path.replace(/^\/external-api/, '')
                }
              }
            },
            test: {
              // Vitest config
              include: ['src/**/*.{test,spec}.{js,ts}'],
              environment: 'jsdom',
              globals: true,
              setupFiles: ['src/setupTests.ts'],
            }
          });
        desc: vite.config.ts — Vite konfiguracja z proxy i Vitest
        detail:
          what: vite.config.ts konfiguruje Vite (dev proxy, aliases, optymalizacje) i Vitest (testy jednostkowe) w jednym miejscu.
          how: sveltekit() plugin to wszystko co potrzeba. Proxy przydatny do zewnętrznych API bez CORS w dev.
          tips:
            - 'server.proxy — proxy do zewnętrznych API w development'
            - 'test.environment: "jsdom" — testuj komponenty Svelte z DOM'
