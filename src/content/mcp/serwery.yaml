title: Tworzenie serwerów MCP
items:
  - name: FastMCP — szybki start z dekoratorami
    desc: >
      Wysokopoziomowe API — @mcp.tool() zamiast boilerplate.
      Automatycznie generuje JSON schema z type hints. Zalecany dla większości projektów.
    code: |
      from mcp.server.fastmcp import FastMCP
      import httpx

      mcp = FastMCP("WeatherServer")

      @mcp.tool()
      async def get_weather(city: str) -> str:
          """Pobierz aktualną pogodę dla miasta."""
          async with httpx.AsyncClient() as client:
              r = await client.get(
                  f"https://wttr.in/{city}?format=3"
              )
              return r.text

      @mcp.tool()
      def convert_temp(celsius: float) -> dict:
          """Konwertuj temperaturę z Celsius na Fahrenheit i Kelvin."""
          return {
              "celsius": celsius,
              "fahrenheit": round(celsius * 9/5 + 32, 1),
              "kelvin": round(celsius + 273.15, 2)
          }

      if __name__ == "__main__":
          mcp.run()

  - name: Serwer z bazą danych SQLite
    desc: >
      Daj modelowi dostęp do bazy danych przez MCP.
      Kluczowe: waliduj że model wykonuje tylko SELECT — nie modyfikacje.
    code: |
      from mcp.server.fastmcp import FastMCP
      import sqlite3
      from typing import Any

      mcp = FastMCP("DatabaseServer")
      DB_PATH = "myapp.db"

      @mcp.tool()
      def query_db(sql: str) -> list[dict[str, Any]]:
          """Wykonaj SELECT na bazie danych. Tylko odczyt!"""
          if not sql.strip().upper().startswith("SELECT"):
              raise ValueError("Dozwolone tylko zapytania SELECT")

          conn = sqlite3.connect(DB_PATH)
          conn.row_factory = sqlite3.Row
          cursor = conn.execute(sql)
          rows = [dict(row) for row in cursor.fetchall()]
          conn.close()
          return rows

      @mcp.tool()
      def list_tables() -> list[str]:
          """Lista wszystkich tabel w bazie danych."""
          conn = sqlite3.connect(DB_PATH)
          cursor = conn.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          )
          tables = [row[0] for row in cursor.fetchall()]
          conn.close()
          return tables

      @mcp.tool()
      def describe_table(table_name: str) -> list[dict]:
          """Pokaż strukturę tabeli (kolumny i typy)."""
          conn = sqlite3.connect(DB_PATH)
          cursor = conn.execute(f"PRAGMA table_info({table_name})")
          columns = [dict(zip(
              ["id","name","type","notnull","default","pk"], row
          )) for row in cursor.fetchall()]
          conn.close()
          return columns

      if __name__ == "__main__":
          mcp.run()

  - name: Serwer z dostępem do plików
    desc: >
      Dostęp do systemu plików przez MCP — z ograniczeniem do bezpiecznego folderu.
      Zawsze waliduj ścieżki — path traversal attack to realne ryzyko.
    code: |
      from mcp.server.fastmcp import FastMCP
      from pathlib import Path

      mcp = FastMCP("FileServer")
      BASE_DIR = Path("/home/user/projects")  # Ogranicz dostęp

      def safe_path(relative: str) -> Path:
          """Sprawdź czy ścieżka jest w dozwolonym folderze."""
          path = (BASE_DIR / relative).resolve()
          if not str(path).startswith(str(BASE_DIR)):
              raise ValueError("Dostęp poza dozwolonym folderem!")
          return path

      @mcp.tool()
      def read_file(path: str) -> str:
          """Odczytaj zawartość pliku tekstowego."""
          return safe_path(path).read_text(encoding="utf-8")

      @mcp.tool()
      def write_file(path: str, content: str) -> str:
          """Zapisz zawartość do pliku."""
          p = safe_path(path)
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(content, encoding="utf-8")
          return f"Zapisano: {p}"

      @mcp.tool()
      def list_files(directory: str = ".") -> list[str]:
          """Lista plików w katalogu."""
          p = safe_path(directory)
          return [str(f.relative_to(BASE_DIR)) for f in p.iterdir()]

      if __name__ == "__main__":
          mcp.run()
