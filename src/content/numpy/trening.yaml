title: "Zaawansowane operacje"

items:
  - name: "einsum — Einstein summation"
    icon: "🧠"
    desc: "Uniwersalny zapis operacji tensorowych — mnożenia, sumy, transpozycje, trace w jednej notacji"
    code: |
      import numpy as np

      A = np.random.rand(3, 4)
      B = np.random.rand(4, 5)

      # Mnożenie macierzy
      C = np.einsum("ij,jk->ik", A, B)     # == A @ B

      # Transpozycja
      At = np.einsum("ij->ji", A)

      # Suma po osi
      row_sum = np.einsum("ij->i", A)       # suma wierszy

      # Trace (ślad)
      M = np.random.rand(4, 4)
      tr = np.einsum("ii->", M)

      # Batch matrix multiply
      X = np.random.rand(10, 3, 4)
      Y = np.random.rand(10, 4, 5)
      Z = np.einsum("bij,bjk->bik", X, Y)   # (10, 3, 5)

      # Iloczyn zewnętrzny
      outer = np.einsum("i,j->ij", np.arange(3), np.arange(4))

  - name: "Advanced indexing"
    icon: "🎯"
    desc: "Złożone wzorce wyboru — fancy indexing, boolean masking, kombinacje, ix_"
    code: |
      import numpy as np

      a = np.arange(20).reshape(4, 5)

      # Fancy indexing — wybór wierszy w dowolnej kolejności
      print(a[[3, 0, 2]])             # wiersze 3, 0, 2

      # Wybór konkretnych elementów (pary indeksów)
      print(a[[0, 1, 2], [1, 2, 3]])  # elementy (0,1),(1,2),(2,3)

      # Boolean masking
      print(a[a % 2 == 0])            # parzyste elementy

      # ix_ — iloczyn kartezjański indeksów (podmacierz)
      print(a[np.ix_([0, 2], [1, 3])])  # wiersze 0,2 × kolumny 1,3

      # Modyfikacja przez fancy indexing
      a[a > 15] = 0
      np.add.at(a, [0, 0, 1], 1)      # bezpieczna akumulacja przy powtórzeniach

  - name: "View vs Copy — zarządzanie pamięcią"
    icon: "🪞"
    desc: "Kluczowa różnica wpływająca na poprawność i wydajność — kiedy dane są współdzielone"
    code: |
      import numpy as np

      a = np.arange(10)

      # Slicing zwraca WIDOK (współdzieli pamięć!)
      view = a[2:5]
      view[0] = 999
      print(a)                # a[2] zmienione na 999!

      # Sprawdź czy to widok
      print(view.base is a)   # True — widok wskazuje na a

      # Fancy indexing zwraca KOPIĘ
      copy = a[[2, 3, 4]]
      copy[0] = -1
      print(a[2])             # niezmienione

      # Wymuś kopię gdy potrzebna
      safe = a[2:5].copy()

      # reshape zwykle widok, ravel widok, flatten kopia
      print(a.reshape(2, 5).base is a)  # True

  - name: "Memory layout — C vs Fortran order"
    icon: "🧬"
    desc: "Kolejność elementów w pamięci wpływa na wydajność — row-major (C) vs column-major (F)"
    code: |
      import numpy as np

      a = np.arange(12).reshape(3, 4)

      # C-order (domyślny, row-major) — wiersze ciągłe
      print(a.flags['C_CONTIGUOUS'])   # True

      # Fortran-order (column-major) — kolumny ciągłe
      f = np.asfortranarray(a)
      print(f.flags['F_CONTIGUOUS'])   # True

      # Transpozycja zmienia tylko strides (nie kopiuje)
      print(a.T.flags['F_CONTIGUOUS']) # True

      # ascontiguousarray — wymuś ciągłość (kopia jeśli trzeba)
      cont = np.ascontiguousarray(a.T)

      # Iteracja po ciągłej osi jest szybsza (cache-friendly)
      # Dla operacji per-kolumna rozważ Fortran order

  - name: "Wektoryzacja zamiast pętli"
    icon: "🚀"
    desc: "Zamień wolne pętle Pythona na operacje NumPy — 10-100x szybciej"
    code: |
      import numpy as np

      x = np.linspace(0, 10, 1_000_000)

      # WOLNO — pętla Pythona (NIE rób tak)
      # result = [v**2 + 2*v + 1 for v in x]

      # SZYBKO — wektoryzacja
      result = x**2 + 2*x + 1

      # Warunkowe bez pętli
      y = np.where(x > 5, x**2, -x)

      # Akumulacja warunkowa
      count = np.sum(x > 5)            # ile elementów > 5
      masked_mean = x[x > 5].mean()

      # np.vectorize dla funkcji nie-ufunc (wygoda, NIE szybkość)
      f = np.vectorize(lambda v: v if v > 0 else 0)
      # apply_along_axis dla operacji per wiersz/kolumna
      np.apply_along_axis(np.sum, axis=1, arr=x.reshape(1000, 1000))

  - name: "Broadcasting — zaawansowane wzorce"
    icon: "📡"
    desc: "Wykorzystanie broadcastingu do macierzy odległości, normalizacji, operacji batch"
    code: |
      import numpy as np

      # Macierz odległości euklidesowych (bez pętli)
      A = np.random.rand(100, 3)
      B = np.random.rand(50, 3)
      diff = A[:, None, :] - B[None, :, :]   # (100, 50, 3)
      dist = np.sqrt((diff**2).sum(axis=-1)) # (100, 50)

      # Normalizacja wierszy do długości 1
      X = np.random.rand(10, 5)
      norms = np.linalg.norm(X, axis=1, keepdims=True)
      X_unit = X / norms

      # Softmax wektorowy (stabilny numerycznie)
      def softmax(z):
          z = z - z.max(axis=-1, keepdims=True)
          e = np.exp(z)
          return e / e.sum(axis=-1, keepdims=True)

      print(softmax(np.random.rand(4, 3)).sum(axis=1))  # ~[1 1 1 1]
