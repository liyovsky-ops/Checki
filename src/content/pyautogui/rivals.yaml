title: PyAutoGUI vs alternatywy automatyzacji GUI

items:
  - name: Selenium
    icon: "🔬"
    color: "#43b02a"
    tagline: Automatyzacja przeglądarek przez WebDriver — stabilniejszy dla web
    pros:
      - Działa przez DOM — nie pikselami (bardziej stabilny)
      - XPath i CSS selectors — precyzyjne znajdowanie elementów
      - Headless mode — serwer i CI/CD bez okna
      - JavaScript execution bezpośrednio w przeglądarce
    cons:
      - Tylko przeglądarki — nie obsłuży aplikacji desktopowych
      - Wymaga WebDrivera (chromedriver, geckodriver)
      - Wolniejszy setup niż PyAutoGUI
      - Wykrywalny przez niektóre strony (bot detection)
    vs: Selenium dla stabilnej automatyzacji webowej. PyAutoGUI gdy potrzebujesz automatyzować desktopowe GUI lub strony blokujące WebDriver.

  - name: Playwright
    icon: "🎭"
    color: "#45ba4b"
    tagline: Nowoczesna ewolucja Selenium — szybszy, auto-wait, multi-browser
    pros:
      - Auto-wait — czeka automatycznie na elementy i animacje
      - Wbudowane screenshots i nagrywanie video
      - Network interception — modyfikuj requesty/response
      - Obsługuje Chromium, Firefox, WebKit
    cons:
      - Tylko przeglądarki — nie desktop apps
      - Wymaga pobrania przeglądarek (playwright install)
      - Cięższy niż PyAutoGUI
    vs: Playwright = lepszy Selenium dla web. PyAutoGUI = dowolne GUI (desktop, gry, native apps). Wybierz Playwright dla testów e2e webowych, PyAutoGUI gdy wychodzisz poza przeglądarkę.

  - name: pywinauto
    icon: "🪟"
    color: "#0078d7"
    tagline: Natywne Windows GUI — accessibility API, nie piksele
    pros:
      - Działa przez accessibility API (UIA/MSAA) — nie piksele
      - Stabilny nawet gdy okno minimalizowane lub za innymi
      - Nie zależy od rozdzielczości ekranu
      - Świetny dla natywnych Windows apps (.exe, WinForms, WPF)
    cons:
      - Tylko Windows — brak Mac i Linux
      - Aplikacje muszą eksponować accessibility API
      - Trudniejszy setup niż PyAutoGUI
      - Nie działa z grami i OpenGL/DirectX
    vs: pywinauto bardziej niezawodny dla natywnych Windows GUI. PyAutoGUI prostszy i cross-platform, ale zależy od obrazu ekranu. Wybierz pywinauto dla stabilnych automatyzacji na Windows.

  - name: pynput
    icon: "🎮"
    color: "#7b68ee"
    tagline: Monitoring i kontrola wejścia — globalne hotkeys i nasłuchiwanie
    pros:
      - Listeners — przechwytuj klawisze i kliknięcia asynchronicznie w tle
      - Globalne hotkeys — reaguj na Ctrl+F9 nawet gdy aplikacja w tle
      - Obsługa Unicode (polskie znaki!) — PyAutoGUI słabo sobie radzi
      - Precyzyjne typy przycisków klawiatury i myszy
    cons:
      - Brak screenshotów i locate — mniejsze możliwości niż PyAutoGUI
      - Bardziej niskopoziomowy API
      - Wymaga dodatkowej pracy dla złożonych automatyzacji
    vs: pynput dla nasłuchiwania/monitorowania wejścia i globalnych hotkeys. PyAutoGUI dla screenshotów, locate i klikania. Używaj razem — pynput do triggerów, PyAutoGUI do akcji.

  - name: AutoHotkey
    icon: "⌨️"
    color: "#58a607"
    tagline: Dedykowany język skryptowy do automatyzacji Windows
    pros:
      - Hotkeys na poziomie systemu — działają zawsze, w każdej aplikacji
      - Kompiluje skrypty do standalone .exe
      - Remap klawiszy systemowo (CapsLock → Ctrl)
      - Szybki i lekki
    cons:
      - Tylko Windows — brak cross-platform
      - Własny język skryptowy do nauczenia
      - Brak integracji z resztą kodu Python
      - Trudniejszy do wersjonowania i testowania
    vs: AutoHotkey dla zaawansowanych hotkeys i remappingu klawiszy Windows. PyAutoGUI gdy masz projekt w Pythonie i chcesz integracji z resztą kodu. PyAutoGUI = cross-platform, AHK = Windows-native.
