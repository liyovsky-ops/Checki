          from pydantic import BaseModel, ConfigDict

          class UserORM(BaseModel):
              model_config = ConfigDict(from_attributes=True)
              id: int
              name: str
              email: str

          # Symulacja SQLAlchemy ORM row
          class DBUser:
              id = 42
              name = "Łukasz"
              email = "l@example.com"
              _private = "ignored"

