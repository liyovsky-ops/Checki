      - code: |
          from pydantic import BaseModel
          from pydantic.functional_validators import AfterValidator
          from typing import Annotated

          def must_be_positive(v: float) -> float:
              if v <= 0:
                  raise ValueError(f"Wartość {v} musi być > 0")
              return v

          def strip_whitespace(v: str) -> str:
              return v.strip()

          def to_upper(v: str) -> str:
              return v.upper()

          # Reużywalne typy
          PositiveFloat = Annotated[float, AfterValidator(must_be_positive)]
          CleanStr = Annotated[str, AfterValidator(strip_whitespace)]
          UpperCode = Annotated[str, AfterValidator(strip_whitespace), AfterValidator(to_upper)]

          class Invoice(BaseModel):
              amount: PositiveFloat
              currency: UpperCode
              description: CleanStr

          inv = Invoice(amount=99.99, currency="  pln  ", description="  Kurs Python  ")
          print(inv.amount)      # 99.99
          print(inv.currency)    # PLN
          print(inv.description) # Kurs Python
        desc: "Annotated z AfterValidator — reużywalne typy z walidacją"
        detail:
          what: Annotated[typ, AfterValidator(fn)] tworzy typ z logiką uruchamianą po standardowej walidacji Pydantic.
          how: Komponowalny — wiele AfterValidator można łączyć. Uruchamiają się od lewej do prawej.
          tips:
            - 'Annotated[T, AfterValidator(fn)] — fn dostaje już skonwertowaną wartość (właściwego typu)'
            - 'Możesz komponować: Annotated[str, AfterValidator(strip), AfterValidator(upper)]'
            - 'Definiuj raz, używaj w wielu modelach — nie powtarzaj Field()'

      - code: |
          from pydantic import BaseModel
          from pydantic.functional_validators import BeforeValidator
          from typing import Annotated
          import json

          def parse_json_string(v):
              """Akceptuj string JSON lub gotowy dict."""
              if isinstance(v, str):
                  try:
                      return json.loads(v)
                  except json.JSONDecodeError:
                      raise ValueError(f"Nieprawidłowy JSON: {v!r}")
              return v

          def parse_comma_list(v):
              """Akceptuj string CSV lub listę."""
              if isinstance(v, str):
                  return [x.strip() for x in v.split(",") if x.strip()]
              return v

          JsonDict = Annotated[dict, BeforeValidator(parse_json_string)]
          CommaSeparated = Annotated[list[str], BeforeValidator(parse_comma_list)]

          class Config(BaseModel):
              metadata: JsonDict
              tags: CommaSeparated

          c = Config(
              metadata='{"env": "prod", "version": "2"}',
              tags="python, pydantic, fastapi",
          )
          print(c.metadata)  # {'env': 'prod', 'version': '2'}
          print(c.tags)      # ['python', 'pydantic', 'fastapi']
        desc: "Annotated z BeforeValidator — preprocessowanie przed typem"
        detail:
          what: BeforeValidator(fn) uruchamia się PRZED koercją Pydantic — dostaje surowy input.
          how: Przydatne gdy wejście może być string lub gotowy typ — normalizujesz przed walidacją.
          tips:
            - 'BeforeValidator → fn dostaje surowy input (str, dict, cokolwiek)'
            - 'Zwróć znormalizowaną wartość — Pydantic zrobi resztę walidacji'
            - 'Użyj do obsługi wielu formatów wejściowych (str, dict, lista)'

      - code: |
          from pydantic import BaseModel
          from pydantic.functional_validators import PlainValidator
          from typing import Annotated, Any
          import re

          def validate_polish_phone(v: Any) -> str:
              """Akceptuj int lub string — normalizuj do "+48XXXXXXXXX"."""
              s = str(v).strip().replace(" ", "").replace("-", "")
              if s.startswith("0048"):
                  s = "+" + s[2:]
              elif not s.startswith("+"):
                  s = "+48" + s
              if not re.match(r"^\+48\d{9}$", s):
                  raise ValueError(f"Nieprawidłowy numer PL: {v}")
              return s

          PolishPhone = Annotated[str, PlainValidator(validate_polish_phone)]

          class Contact(BaseModel):
              name: str
              phone: PolishPhone

          c1 = Contact(name="Łukasz", phone="123456789")
          c2 = Contact(name="Jan", phone="+48 123 456 789")
          c3 = Contact(name="Anna", phone=48123456789)

          print(c1.phone)  # +48123456789
          print(c2.phone)  # +48123456789
          print(c3.phone)  # +48123456789
        desc: "PlainValidator — całkowite przejęcie walidacji"
        detail:
          what: PlainValidator zastępuje CAŁĄ logikę walidacji Pydantic — tylko Twoja funkcja. Akceptuje dowolny typ wejściowy.
          how: W przeciwieństwie do AfterValidator/BeforeValidator — Pydantic nie robi żadnej koercji ani walidacji.
          tips:
            - 'PlainValidator: fn dostaje surowy input, zwraca ostateczną wartość'
            - 'Brak koercji Pydantic — Ty decydujesz co akceptujesz'
            - 'Przydatne dla typów zewnętrznych (numpy, pandas, custom classes)'

      - code: |
          from pydantic import BaseModel
          from pydantic.functional_validators import WrapValidator
          from typing import Annotated, Any, Callable

          def log_and_validate(v: Any, handler: Callable, info) -> int:
              """Loguj każdą walidację i wywołaj standardową."""
              print(f"Walidacja {info.field_name!r}: {v!r}")
              try:
                  result = handler(v)  # standardowa walidacja Pydantic
                  print(f"  OK → {result!r}")
                  return result
              except Exception as e:
                  print(f"  BŁĄD: {e}")
                  raise

          LoggedInt = Annotated[int, WrapValidator(log_and_validate)]

          class Form(BaseModel):
              age: LoggedInt
              score: LoggedInt

          f = Form(age="30", score=95)
          # Walidacja 'age': '30'
          #   OK → 30
          # Walidacja 'score': 95
          #   OK → 95
        desc: WrapValidator — otaczanie standardowej walidacji własną logiką
        detail:
          what: WrapValidator dostaje handler (standardowa walidacja Pydantic) — możesz wywołać ją i opakować swoją logiką.
          how: handler(v) = standardowa walidacja. Możesz przechwycić wyjątek i rzucić własny błąd.
          tips:
            - 'handler(v) wywołuje standardową walidację Pydantic — możesz try/except'
            - 'info.field_name — nazwa walidowanego pola (przydatne do logowania)'
            - 'WrapValidator do logowania, metryki, fallback values itp.'

      - code: |
          from pydantic import BaseModel
          from pydantic.functional_validators import AfterValidator
          from pydantic.functional_serializers import PlainSerializer
          from typing import Annotated
          import re

          class Color:
              """Własny typ — kolor hex."""
              def __init__(self, hex_code: str):
                  self.hex_code = hex_code.upper()

              def __repr__(self):
                  return f"Color({self.hex_code!r})"

          def parse_color(v) -> Color:
              if isinstance(v, Color):
                  return v
              if isinstance(v, str):
                  if not re.match(r"^#[0-9A-Fa-f]{6}$", v):
                      raise ValueError(f"Nieprawidłowy kolor hex: {v}")
                  return Color(v)
              raise ValueError("Oczekiwano string hex lub Color")

          # Annotated z walidatorem i serializerem
          HexColor = Annotated[
              Color,
              AfterValidator(parse_color),
              PlainSerializer(lambda c: c.hex_code, return_type=str),
          ]

          class Theme(BaseModel):
              primary: HexColor
              secondary: HexColor

          t = Theme(primary="#FF5733", secondary="#1A2B3C")
          print(t.primary.hex_code)       # FF5733 (bez #)
          print(t.model_dump())           # {'primary': '#FF5733', 'secondary': '#1A2B3C'}
          print(t.model_dump_json())      # {"primary":"#FF5733","secondary":"#1A2B3C"}
        desc: Custom typ z walidatorem i serializerem przez Annotated
        detail:
          what: Annotated łączy walidację i serializację w jednym miejscu. Własny typ klasy + Pydantic pipeline.
          how: AfterValidator konwertuje string → Color. PlainSerializer konwertuje Color → string przy serializacji.
          tips:
            - 'PlainSerializer(fn, return_type=str) — niestandardowa serializacja dla własnego typu'
            - 'Zdefiniuj raz jako HexColor = Annotated[...] — używaj w wielu modelach'
            - 'Ta sama technika dla numpy arrays, Decimal z formatowaniem, dat'

