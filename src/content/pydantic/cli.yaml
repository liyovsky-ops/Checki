          from pydantic import BaseModel, field_serializer
          from datetime import datetime

          class Event(BaseModel):
              name: str
              timestamp: datetime
              tags: list[str]

              # Niestandardowa serializacja timestamp
              @field_serializer("timestamp")
              def serialize_timestamp(self, v: datetime, _info) -> str:
                  return v.strftime("%d.%m.%Y %H:%M")

              # Serializuj tagi jako string (tylko w JSON mode)
              @field_serializer("tags", when_used="json")
              def serialize_tags(self, v: list[str], _info) -> str:
                  return ",".join(v)

          e = Event(name="Deploy", timestamp=datetime(2024, 1, 15, 10, 30), tags=["prod", "urgent"])
          print(e.model_dump())
          # {'name': 'Deploy', 'timestamp': '15.01.2024 10:30', 'tags': ['prod', 'urgent']}
          print(e.model_dump_json())
          # {"name":"Deploy","timestamp":"15.01.2024 10:30","tags":"prod,urgent"}
        desc: "@field_serializer — niestandardowa serializacja pola"
        detail:
          what: "@field_serializer kontroluje jak pole jest serializowane w model_dump() i model_dump_json()."
          how: when_used='json' — tylko przy JSON serializacji. when_used='python' — tylko przy model_dump(). Domyślnie zawsze.
          tips:
            - 'when_used="json" — niestandardowa serializacja tylko w model_dump_json()'
            - 'when_used="python" — tylko w model_dump() (nie JSON)'
            - '@model_serializer dla całego modelu (nie jednego pola)'

