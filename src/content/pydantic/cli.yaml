        detail:
          what: model_dump() zwraca dict z wartościami Pythona. exclude_none=True usuwa pola None. include/exclude filtrują.
          how: mode='json' w model_dump konwertuje typy do JSON-serializowalnych (datetime → str, UUID → str).
          tips:
            - 'exclude_none=True — usuwa pola z wartością None'
            - 'exclude_defaults=True — usuwa pola z wartością domyślną'
            - 'include={"pole1", "pole2"} lub exclude={"pole3"} — zestaw nazw'

