          from pydantic import BaseModel, ConfigDict

          class ImmutableConfig(BaseModel):
              model_config = ConfigDict(frozen=True)
              host: str
              port: int
              debug: bool = False

          cfg = ImmutableConfig(host="localhost", port=8000)

