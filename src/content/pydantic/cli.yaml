        detail:
          what: from_attributes=True pozwala model_validate() czytać atrybuty przez getattr(). Niezbędne dla SQLAlchemy/Django ORM.
          how: Pydantic wywołuje getattr(obj, "id") zamiast obj["id"]. Prywatne atrybuty (_private) są ignorowane jeśli nie ma pola.
          tips:
            - 'Bez from_attributes=True → TypeError: nie można walidować z obiektu'
            - 'FastAPI response_model automatycznie używa from_attributes gdy jest ustawione'
            - 'SQLModel ma from_attributes domyślnie — nie potrzebujesz ConfigDict'

      - code: |
          from pydantic import BaseModel, ConfigDict

          class StrictUser(BaseModel):
              model_config = ConfigDict(extra="forbid")
              id: int
              name: str

          # extra="forbid" — błąd przy nieznanych polach
          try:
              u = StrictUser(id=1, name="Łukasz", age=30, role="admin")
          except Exception as e:
              print(e)
              # 2 validation errors for StrictUser
              # age: Extra inputs are not permitted
              # role: Extra inputs are not permitted

          # extra="ignore" — domyślne — dodatkowe pola są ignorowane
          class FlexUser(BaseModel):
              model_config = ConfigDict(extra="ignore")
              id: int
              name: str

          u2 = FlexUser(id=1, name="Łukasz", age=30)  # age jest ignorowane
          print(u2.model_dump())  # {'id': 1, 'name': 'Łukasz'}
        desc: "ConfigDict(extra='forbid') — kontrola nieznanych pól"
        detail:
          what: extra='forbid' rzuca błąd przy nieznanych polach. extra='ignore' (domyślne) ignoruje. extra='allow' zachowuje.
          how: Używaj extra='forbid' w API response modelach do wykrywania zmian w API trzecich stron.
          tips:
            - "extra='forbid' — strict mode, dobry dla requestów API"
            - "extra='ignore' — domyślne, dodatkowe pola znikają"
            - "extra='allow' — nieznane pola zachowane w __pydantic_extra__"

