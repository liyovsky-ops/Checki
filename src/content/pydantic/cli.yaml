          from pydantic import BaseModel
          from typing import Optional
          from datetime import datetime

          class User(BaseModel):
              id: int
              name: str
              email: Optional[str] = None
              created_at: datetime = None

          u = User(id=1, name="Łukasz", created_at=datetime.now())

          # Podstawowe model_dump()
          print(u.model_dump())
          # {'id': 1, 'name': 'Łukasz', 'email': None, 'created_at': datetime(...)}

          # Wykluczanie None
          print(u.model_dump(exclude_none=True))
          # {'id': 1, 'name': 'Łukasz', 'created_at': datetime(...)}

          # Tylko wybrane pola
          print(u.model_dump(include={"id", "name"}))
          # {'id': 1, 'name': 'Łukasz'}

          # Pomiń wybrane pola
          print(u.model_dump(exclude={"email", "created_at"}))
          # {'id': 1, 'name': 'Łukasz'}
