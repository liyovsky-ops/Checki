title: Pydantic — wzorce i API

groups:
  - name: Podstawowe modele
    icon: "📋"
    commands:
      - code: |
          from pydantic import BaseModel
          from typing import Optional

          class User(BaseModel):
              id: int
              name: str
              email: str
              age: Optional[int] = None

          user = User(id=1, name="Łukasz", email="l@example.com")
          print(user.model_dump())
          # {'id': 1, 'name': 'Łukasz', 'email': 'l@example.com', 'age': None}
        desc: Podstawowy model Pydantic v2
        detail:
          what: BaseModel waliduje dane przy inicjalizacji używając type hints. Błędy = ValidationError.
          how: Pydantic v2 używa Rust core (pydantic-core) — 5-50x szybszy od v1. Koercja typów automatyczna.
          tips:
            - 'user.model_dump() — dict z walidowanymi danymi (v2, było .dict() w v1)'
            - 'User.model_validate({"id": 1, ...}) — waliduj dict (v2, było .parse_obj() w v1)'
            - 'Optional[int] = None — pole opcjonalne, domyślnie None'

      - code: |
          from pydantic import BaseModel

          class Product(BaseModel):
              price: float
              quantity: int
              name: str

          # Koercja — Pydantic konwertuje typy gdy to możliwe
          p = Product(price="99.99", quantity="5", name="Laptop")
          print(p.price)     # 99.99 (float, nie string)
          print(p.quantity)  # 5 (int, nie string)

          # Błąd koercji
          try:
              bad = Product(price="abc", quantity=1, name="X")
          except Exception as e:
              print(e)  # price: Input should be a valid number
        desc: Koercja typów — Pydantic konwertuje kompatybilne typy
        detail:
          what: Pydantic próbuje skonwertować wartość do żądanego typu przed walidacją. str → int → float.
          how: Surowa walidacja (bez koercji) wymaga model_config = ConfigDict(strict=True).
          tips:
            - '"42" → int 42 — string cyfr konwertuje się na int'
            - 'ConfigDict(strict=True) wyłącza koercję — tylko dokładne typy'
            - 'Koercja działa dla: str→int, str→float, int→float, ale NIE float→int'

      - code: |
          from pydantic import BaseModel, ValidationError

          class User(BaseModel):
              id: int
              name: str
              age: int

          try:
              bad = User(id="abc", name=None, age=-1)
          except ValidationError as e:
              print(e.error_count())  # 2 (id + name)
              for err in e.errors():
                  print(err["loc"], err["msg"], err["type"])
              # ('id',) 'Input should be a valid integer' 'int_parsing'
              # ('name',) 'Input should be a valid string' 'string_type'
        desc: ValidationError — obsługa błędów walidacji
        detail:
          what: ValidationError zawiera WSZYSTKIE błędy naraz (nie tylko pierwszy). Każdy błąd ma loc, msg, type, input.
          how: e.errors() zwraca listę dict. e.error_count() = liczba błędów. str(e) = czytelny opis.
          tips:
            - 'e.errors() — lista dict z polami: loc, msg, type, input, url'
            - 'err["loc"] to tuple — ("address", "city") dla zagnieżdżonych pól'
            - 'from pydantic import ValidationError — importuj osobno z pydantic'

      - code: |
          from pydantic import BaseModel
          from typing import Optional

          class Config(BaseModel):
              host: str
              port: int = 5432
              debug: bool = False
              password: Optional[str] = None

          # Domyślne wartości — nie musisz podawać wszystkich pól
          c = Config(host="localhost")
          print(c.port)     # 5432
          print(c.debug)    # False
          print(c.password) # None

          # model_fields — introspection pól
          for name, field in Config.model_fields.items():
              print(f"{name}: required={field.is_required()}")
        desc: Domyślne wartości i introspection model_fields
        detail:
          what: Pola z wartością domyślną są opcjonalne. model_fields zwraca słownik FieldInfo per pole.
          how: field.is_required() → True jeśli brak default. field.default → wartość domyślna lub PydanticUndefined.
          tips:
            - 'Model.model_fields — dict {nazwa: FieldInfo} dla wszystkich pól'
            - 'FieldInfo.is_required() — True jeśli pole nie ma default'
            - 'default_factory=list — dla mutowalnych defaultów (lista, dict)'

      - code: |
          from pydantic import BaseModel
          import json

          class Address(BaseModel):
              street: str
              city: str
              zip_code: str

          # JSON Schema automatycznie z modelu
          schema = Address.model_json_schema()
          print(json.dumps(schema, indent=2))
          # {
          #   "title": "Address",
          #   "type": "object",
          #   "properties": {
          #     "street": {"title": "Street", "type": "string"},
          #     ...
          #   },
          #   "required": ["street", "city", "zip_code"]
          # }
        desc: model_json_schema() — automatyczny JSON Schema
        detail:
          what: Pydantic generuje JSON Schema zgodny z draft-07/2020-12 z każdego modelu. FastAPI używa tego do /docs.
          how: Field(description="...", title="...") wzbogaca schema. Annotated z metadanymi też wchodzi do schema.
          tips:
            - 'Model.model_json_schema() — JSON Schema jako dict Pythona'
            - 'FastAPI automatycznie eksponuje schema w /openapi.json'
            - 'Field(description="...", examples=[...]) wzbogaca dokumentację'

      - code: |
          from pydantic import BaseModel, ConfigDict

          class ImmutablePoint(BaseModel):
              model_config = ConfigDict(frozen=True)
              x: float
              y: float

          p = ImmutablePoint(x=1.0, y=2.0)

          # model_copy — jedyna droga modyfikacji frozen modelu
          p2 = p.model_copy(update={"x": 10.0})
          print(p2.x)  # 10.0
          print(p.x)   # 1.0 (oryginał niezmieniony)

          # Deep copy dla zagnieżdżonych obiektów
          p3 = p.model_copy(deep=True)
        desc: model_copy() — kopiowanie z podmianą pól
        detail:
          what: model_copy(update={...}) tworzy nową instancję z podmienionymi polami. Konieczne dla frozen=True.
          how: Domyślnie shallow copy. model_copy(deep=True) robi deep copy zagnieżdżonych struktur.
          tips:
            - 'model_copy(update={"field": value}) — podmień wybrane pola'
            - 'model_copy(deep=True) — deep copy, zagnieżdżone obiekty są niezależne'
            - 'frozen=True + model_copy = immutable value objects (wzorzec DDD)'

      - code: |
          from pydantic import BaseModel

          class User(BaseModel):
              id: int
              name: str

          # Różne sposoby tworzenia instancji
          u1 = User(id=1, name="Łukasz")           # keyword args
          u2 = User.model_validate({"id": 2, "name": "Jan"})  # z dict
          u3 = User.model_validate_json('{"id": 3, "name": "Anna"}')  # z JSON string

          # Sprawdź czy dane są poprawne bez tworzenia instancji
          User.model_validate({"id": 1, "name": "OK"})  # rzuca ValidationError jeśli błąd

          # __repr__ i __eq__
          print(u1)          # id=1 name='Łukasz'
          print(u1 == User(id=1, name="Łukasz"))  # True
        desc: Różne sposoby tworzenia instancji modelu
        detail:
          what: Model(kwargs), model_validate(dict), model_validate_json(str) to trzy główne wejścia.
          how: Wszystkie przechodzą przez ten sam silnik walidacji. model_validate_json parsuje JSON i waliduje naraz.
          tips:
            - 'model_validate_json() — szybsze niż json.loads() + model_validate() bo Rust parsuje JSON'
            - 'BaseModel implementuje __eq__ — porównanie instancji po wartościach pól'
            - 'model_validate(obj, from_attributes=True) — konwersja z ORM obiektów'

  - name: "Field() i walidacja pól"
    icon: "🔧"
    commands:
      - code: |
          from pydantic import BaseModel, Field
          from typing import Optional

          class Product(BaseModel):
              name: str = Field(
                  description="Nazwa produktu",
                  title="Nazwa",
                  min_length=3,
                  max_length=100,
              )
              price: float = Field(gt=0, description="Cena w PLN")
              category: Optional[str] = Field(
                  default=None,
                  description="Kategoria produktu"
              )

          p = Product(name="Laptop", price=4999.99)
          print(p.model_json_schema()["properties"]["price"])
          # {'title': 'Price', 'description': 'Cena w PLN', 'exclusiveMinimum': 0, 'type': 'number'}
        desc: Field() — podstawowe użycie z metadanymi
        detail:
          what: Field() dodaje metadane (description, title) i ograniczenia do pola. Uwzględniane w JSON Schema.
          how: Field() jako wartość domyślna pola. Dla wymaganych pól bez default — Field(...) lub sam Field(constraints).
          tips:
            - 'Field(...) — wymagane pole z ograniczeniami (trzy kropki = brak default)'
            - 'Field(description="...", examples=[...]) wchodzi do /docs FastAPI'
            - 'Dla Optional z Field: Optional[str] = Field(default=None, ...)'

      - code: |
          from pydantic import BaseModel, Field

          class Score(BaseModel):
              # Ograniczenia liczbowe
              value: int = Field(ge=0, le=100)      # 0 <= value <= 100
              temperature: float = Field(gt=-273.15) # > zero absolutne
              rating: float = Field(ge=1.0, le=5.0, multiple_of=0.5)  # 1, 1.5, 2.0...
              rank: int = Field(ge=1)                # >= 1

          s = Score(value=85, temperature=20.0, rating=4.5, rank=3)
          # Score(value=101) → ValidationError: Input should be less than or equal to 100
        desc: Field() — ograniczenia liczbowe gt/ge/lt/le/multiple_of
        detail:
          what: gt (greater than, >), ge (>=), lt (<), le (<=), multiple_of — ograniczenia na liczbach.
          how: Generują odpowiednie słowa kluczowe JSON Schema (exclusiveMinimum, maximum, multipleOf).
          tips:
            - 'gt=0 → exclusiveMinimum: 0 (liczba musi być > 0, nie >= 0)'
            - 'ge=0 → minimum: 0 (liczba musi być >= 0)'
            - 'multiple_of=0.5 → akceptuje 1.0, 1.5, 2.0 ale nie 1.3'

      - code: |
          from pydantic import BaseModel, Field

          class UserInput(BaseModel):
              username: str = Field(min_length=3, max_length=30)
              password: str = Field(min_length=8)
              phone: str = Field(
                  pattern=r"^\+?[1-9]\d{8,14}$",
                  description="Numer telefonu z kodem kraju"
              )
              postal_code: str = Field(
                  pattern=r"^\d{2}-\d{3}$",
                  description="Format: 00-000"
              )

          u = UserInput(
              username="lukasz",
              password="haslo123",
              phone="+48123456789",
              postal_code="30-001",
          )
        desc: Field() — ograniczenia string min_length/max_length/pattern
        detail:
          what: min_length/max_length na string = liczba znaków (nie bajtów). pattern = regex.
          how: pattern używa re.search() pod spodem — upewnij się że regex jest zakotwiczony (^ i $).
          tips:
            - 'pattern=r"^...$" — zakotwicz regex żeby nie matchował fragmentu'
            - 'min_length/max_length działa też na list (minimalna/maksymalna długość listy)'
            - 'strip_whitespace — użyj BeforeValidator(str.strip) zamiast Field'

      - code: |
          from pydantic import BaseModel, Field

          class Item(BaseModel):
              # alias — inna nazwa w JSON/dict vs atrybut Python
              item_id: int = Field(alias="itemId")
              # serialization_alias — tylko przy serializacji
              internal_name: str = Field(serialization_alias="name")
              # validation_alias — tylko przy walidacji
              product_code: str = Field(validation_alias="productCode")

          # Tworzenie: użyj alias
          item = Item(itemId=1, name="ignored", productCode="PC-001")
          # Lub: model_validate z by_alias=False
          item2 = Item.model_validate({"itemId": 1, "internal_name": "X", "productCode": "Y"})

          # Serializacja: alias w output
          print(item.model_dump(by_alias=True))
          # {'itemId': 1, 'name': 'X', 'productCode': 'PC-001'}
        desc: Field() alias, validation_alias, serialization_alias
        detail:
          what: alias = inna nazwa pola w JSON (input i output). validation_alias = tylko przy input. serialization_alias = tylko output.
          how: model_dump(by_alias=True) używa alias lub serialization_alias w wyjściu.
          tips:
            - 'alias="camelCase" — przydatne przy konsumpcji API które zwraca camelCase'
            - 'populate_by_name=True w ConfigDict — akceptuj i alias i oryginalną nazwę'
            - 'serialization_alias — zmień nazwę w output bez zmiany walidacji input'

      - code: |
          from pydantic import BaseModel
          from typing import Union, Optional, Literal

          class Response(BaseModel):
              # Union — jedno z kilku typów
              value: Union[int, str, None]

              # Python 3.10+ składnia
              status: int | str

              # Literal — tylko konkretne wartości
              role: Literal["admin", "user", "guest"] = "user"

              # Optional[X] = Union[X, None] = X | None
              notes: Optional[str] = None

          r = Response(value=42, status="ok", role="admin")
          # role="manager" → ValidationError: Input should be 'admin', 'user' or 'guest'
        desc: Union, Optional, Literal — typy złożone
        detail:
          what: Union[A, B] akceptuje A lub B. Literal["x", "y"] = enum inline. Optional[X] = X | None.
          how: Union sprawdza od lewej — pierwsze pasujące wygrywa. Literal szybszy niż Union bo sprawdza równość.
          tips:
            - 'Literal["a", "b"] w JSON Schema → enum: ["a", "b"]'
            - 'Union[int, str] — Pydantic próbuje int pierwszy, jeśli nie — str'
            - 'str | None jest szybsze niż Optional[str] w v2 (Python 3.10+)'

      - code: |
          from pydantic import BaseModel, Field
          from pydantic import conint, constr, confloat

          class Order(BaseModel):
              quantity: conint(gt=0, le=1000) = 1
              reference: constr(pattern=r"^ORD-\d{6}$")
              discount: confloat(ge=0.0, le=1.0) = 0.0
              unit_price: float = Field(gt=0)

          o = Order(quantity=5, reference="ORD-123456", unit_price=49.99)
          print(o.quantity)    # 5
          print(o.discount)    # 0.0
        desc: conint, constr, confloat — typy z ograniczeniami
        detail:
          what: conint/constr/confloat to shortcut do Annotated[int/str/float, Field(...)]. Styl alternatywny do Field().
          how: W Pydantic v2 są to aliasy Annotated — identyczny efekt co Field() z tymi samymi parametrami.
          tips:
            - 'conint(gt=0) = Annotated[int, Field(gt=0)] — ten sam efekt'
            - 'constr(pattern=r"...") — string z wymaganym wzorcem regex'
            - 'Preferuj Annotated[int, Field(...)] w v2 — bardziej explicite'

      - code: |
          from pydantic import BaseModel, Field
          from pydantic import conlist

          class Cart(BaseModel):
              items: conlist(str, min_length=1, max_length=50)
              tags: list[str] = Field(default=[], max_length=10)
              # set — unikalne wartości
              categories: set[str] = set()

          c = Cart(items=["laptop", "myszka"], tags=["promo", "tech"])
          print(len(c.items))   # 2

          # Lista z zagnieżdżonym modelem
          class Item(BaseModel):
              name: str
              qty: int = Field(ge=1)

          class Order(BaseModel):
              lines: list[Item] = Field(min_length=1)

          o = Order(lines=[{"name": "Kurs", "qty": 2}])
          print(o.lines[0].name)  # Kurs
        desc: conlist, list z Field — ograniczone listy
        detail:
          what: conlist(Type, min_length=N, max_length=M) ogranicza rozmiar listy. list[SubModel] waliduje każdy element.
          how: Field(max_length=10) na list działa jak conlist — ta sama funkcjonalność w v2.
          tips:
            - 'list[SubModel] — każdy element walidowany jako SubModel'
            - 'conlist = Annotated[list[T], Field(min_length=..., max_length=...)]'
            - 'set[str] — automatycznie usuwa duplikaty, waliduje każdy element'

  - name: "@field_validator i @model_validator"
    icon: "✅"
    commands:
      - code: |
          from pydantic import BaseModel, field_validator

          class User(BaseModel):
              name: str
              email: str

              @field_validator("name")
              @classmethod
              def name_must_not_be_empty(cls, v: str) -> str:
                  v = v.strip()
                  if not v:
                      raise ValueError("Imię nie może być puste")
                  return v.title()

              @field_validator("email")
              @classmethod
              def email_lowercase(cls, v: str) -> str:
                  return v.lower().strip()

          u = User(name="  łukasz  ", email="L@EXAMPLE.COM")
          print(u.name)   # Łukasz
          print(u.email)  # l@example.com
        desc: "@field_validator — podstawy (mode='after', domyślny)"
        detail:
          what: '@field_validator uruchamia się po koercji Pydantic — wartość jest już właściwego typu.'
          how: Musi być classmethod. Zwraca (ewentualnie zmodyfikowaną) wartość. Rzuca ValueError przy błędzie.
          tips:
            - '@classmethod jest wymagany w v2 (w v1 nie było konieczne)'
            - 'Zwróć wartość — nawet jeśli jej nie zmieniasz (return v)'
            - 'raise ValueError("msg") → ValidationError z tą wiadomością'

      - code: |
          from pydantic import BaseModel, field_validator

          class Config(BaseModel):
              tags: list[str]
              timeout_ms: int

              # mode='before' — dostaje surowy input przed koercją Pydantic
              @field_validator("tags", mode="before")
              @classmethod
              def parse_tags(cls, v):
                  if isinstance(v, str):
                      # Przyjmij "python,pydantic" jako listę
                      return [t.strip() for t in v.split(",") if t.strip()]
                  return v

              @field_validator("timeout_ms", mode="before")
              @classmethod
              def parse_timeout(cls, v):
                  if isinstance(v, str) and v.endswith("s"):
                      return int(v[:-1]) * 1000   # "5s" → 5000
                  return v

          c = Config(tags="python, pydantic, fastapi", timeout_ms="3s")
          print(c.tags)        # ['python', 'pydantic', 'fastapi']
          print(c.timeout_ms)  # 3000
        desc: "@field_validator mode='before' — preprocessowanie surowego input"
        detail:
          what: "'before' uruchamia się PRZED koercją — dostaje raw input (string, dict, cokolwiek)."
          how: Przydatne gdy chcesz znormalizować format przed walidacją Pydantic.
          tips:
            - "mode='before' → v może być dowolnego typu — sprawdź isinstance()"
            - "mode='after' → v jest już skonwertowane do docelowego typu"
            - 'Można też użyć BeforeValidator(fn) w Annotated dla reużywalności'

      - code: |
          from pydantic import BaseModel, field_validator

          class Address(BaseModel):
              street: str
              city: str
              country: str

              # Jeden walidator dla wielu pól
              @field_validator("street", "city", "country")
              @classmethod
              def strip_and_capitalize(cls, v: str) -> str:
                  v = v.strip()
                  if not v:
                      raise ValueError("Pole nie może być puste")
                  return v.title()

          a = Address(street="  krakowska 1 ", city=" kraków", country="polska")
          print(a.street)   # Krakowska 1
          print(a.city)     # Kraków
          print(a.country)  # Polska
        desc: "@field_validator — jeden walidator dla wielu pól"
        detail:
          what: Podaj listę nazw pól — walidator wywołuje się osobno dla każdego. Upraszcza kod przy tej samej logice.
          how: Walidator nie widzi innych pól — tylko swoją wartość. Do porównania między polami użyj @model_validator.
          tips:
            - 'field_validator("a", "b", "c") wywołuje się 3 razy — raz na pole'
            - 'Do walidacji zależności między polami → @model_validator(mode="after")'
            - 'Kolejność pól w dekoratorze nie ma znaczenia'

      - code: |
          from pydantic import BaseModel, model_validator

          class DateRange(BaseModel):
              start: str
              end: str

              @model_validator(mode="after")
              def end_after_start(self) -> "DateRange":
                  if self.end < self.start:
                      raise ValueError(f"end ({self.end}) musi być >= start ({self.start})")
                  return self

          class PasswordForm(BaseModel):
              password: str
              confirm: str

              @model_validator(mode="after")
              def passwords_match(self) -> "PasswordForm":
                  if self.password != self.confirm:
                      raise ValueError("Hasła nie są identyczne")
                  return self

          pf = PasswordForm(password="secret123", confirm="secret123")  # OK
          # PasswordForm(password="a", confirm="b")  → ValueError
        desc: "@model_validator mode='after' — walidacja zależności między polami"
        detail:
          what: "'after' dostaje gotową instancję — możesz walidować relacje między polami przez self."
          how: Musi zwrócić self (lub zmodyfikowaną instancję). Rzuca ValueError przy błędzie.
          tips:
            - 'mode="after" → self jest gotową instancją modelu z wszystkimi polami'
            - 'Zwróć self po walidacji — return self'
            - 'Możesz też modyfikować pola w model_validator: self.field = value; return self'

      - code: |
          from pydantic import BaseModel, model_validator
          from typing import Any

          class UserCreate(BaseModel):
              first_name: str
              last_name: str
              email: str

              @model_validator(mode="before")
              @classmethod
              def handle_legacy_format(cls, data: Any) -> Any:
                  if isinstance(data, dict):
                      # Stary format: {"full_name": "Jan Kowalski"}
                      if "full_name" in data and "first_name" not in data:
                          parts = data.pop("full_name", "").split(" ", 1)
                          data["first_name"] = parts[0]
                          data["last_name"] = parts[1] if len(parts) > 1 else ""
                  return data

          u1 = UserCreate(first_name="Jan", last_name="Kowalski", email="j@ex.com")
          u2 = UserCreate(**{"full_name": "Jan Kowalski", "email": "j@ex.com"})
          print(u2.first_name)  # Jan
          print(u2.last_name)   # Kowalski
        desc: "@model_validator mode='before' — transformacja danych przed modelem"
        detail:
          what: "'before' dostaje surowy dict/obiekt przed tworzeniem instancji. Pozwala przepisać strukturę."
          how: Musi być classmethod. Zwraca zmodyfikowany dict który trafi do normalnej walidacji.
          tips:
            - 'Używaj do migracji formatu API — stary format → nowy'
            - 'mode="before" + @classmethod (wymagane w v2)'
            - 'Zwróć dict — nie instancję modelu'

      - code: |
          from pydantic import BaseModel, field_validator, model_validator

          class Registration(BaseModel):
              username: str
              email: str
              age: int
              referral_code: str = ""

              @field_validator("username")
              @classmethod
              def username_valid(cls, v: str) -> str:
                  v = v.strip().lower()
                  if len(v) < 3:
                      raise ValueError("Username min 3 znaki")
                  if not v.isalnum():
                      raise ValueError("Tylko litery i cyfry")
                  return v

              @field_validator("age")
              @classmethod
              def must_be_adult(cls, v: int) -> int:
                  if v < 18:
                      raise ValueError("Musisz mieć 18+ lat")
                  return v

              @model_validator(mode="after")
              def validate_business_rules(self) -> "Registration":
                  if self.age < 21 and self.referral_code == "VIP":
                      raise ValueError("Kod VIP tylko dla 21+")
                  return self
        desc: Łączenie @field_validator i @model_validator
        detail:
          what: field_validator uruchamia się przed model_validator. Kolejność wykonania — field validators → model_after.
          how: Błąd w field_validator przerywa przetwarzanie tego pola ale inne pola nadal są walidowane.
          tips:
            - 'field_validator → (walidacja Pydantic) → model_validator(after)'
            - 'Jeśli field_validator rzuci błąd — model_validator(after) może nie dostać pola'
            - 'Używaj field_validator do reguł per pole, model_validator do reguł między polami'

      - code: |
          from pydantic import BaseModel, field_validator, ValidationError

          class Score(BaseModel):
              value: int

              @field_validator("value")
              @classmethod
              def must_be_in_range(cls, v: int) -> int:
                  if not (0 <= v <= 100):
                      raise ValueError(f"Wartość {v} musi być w zakresie 0-100")
                  return v

          # ValueError wewnątrz field_validator → automatycznie ValidationError
          try:
              Score(value=150)
          except ValidationError as e:
              err = e.errors()[0]
              print(err["type"])    # "value_error"
              print(err["msg"])     # "Value error, Wartość 150 musi być w zakresie 0-100"
              print(err["loc"])     # ('value',)

          # Można też rzucić AssertionError (assert) → ValidationError
          class Positive(BaseModel):
              n: int

              @field_validator("n")
              @classmethod
              def check(cls, v: int) -> int:
                  assert v > 0, f"Musi być > 0, podano {v}"
                  return v
        desc: "ValueError vs AssertionError w walidatorach → ValidationError"
        detail:
          what: "ValueError i AssertionError rzucone w @field_validator są automatycznie konwertowane na ValidationError."
          how: "Preferuj ValueError — bardziej explicite. AssertionError działa ale jest mniej czytelny w logach."
          tips:
            - 'raise ValueError("msg") → err["type"] = "value_error"'
            - 'assert cond, "msg" → err["type"] = "assertion_error" — działa ale mniej czytelne'
            - 'NIE rzucaj ValidationError bezpośrednio w walidatorze — tylko ValueError lub AssertionError'

