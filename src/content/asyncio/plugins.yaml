title: Ekosystem asyncio
items:
  - name: httpx
    icon: "🌐"
    desc: |
      Async HTTP client — requests dla świata async.
      Instalacja: pip install httpx

      API identyczne jak requests, ale async.
      Obsługuje HTTP/2, timeouts, retry, connection pooling.
      Niezbędny do async scrapingu i testowania FastAPI.
    code: |
      import asyncio, httpx

      async def fetch_many(urls: list[str]) -> list[str]:
          async with httpx.AsyncClient(timeout=10.0) as client:
              tasks = [client.get(url) for url in urls]
              responses = await asyncio.gather(*tasks)
          return [r.text for r in responses]

  - name: aiofiles
    icon: "📁"
    desc: |
      Async operacje na plikach — nie blokuje event loop.
      Instalacja: pip install aiofiles

      Wbudowane open() blokuje event loop podczas czytania dużych plików.
      aiofiles.open() jest async — ważne gdy serwer obsługuje wiele requestów jednocześnie.
    code: |
      import asyncio, aiofiles

      async def czytaj_i_pisz():
          async with aiofiles.open("input.txt", "r") as f:
              zawartosc = await f.read()

          przetworzone = zawartosc.upper()

          async with aiofiles.open("output.txt", "w") as f:
              await f.write(przetworzone)

      asyncio.run(czytaj_i_pisz())

  - name: asyncpg
    icon: "🐘"
    desc: |
      Najszybszy async PostgreSQL driver — 3x szybszy niż psycopg2.
      Instalacja: pip install asyncpg

      Natywnie async, bez ORM — czyste SQL z parametrami $1, $2.
      Standard gdy używasz PostgreSQL z asyncio lub FastAPI.
    code: |
      import asyncio, asyncpg

      async def main():
          conn = await asyncpg.connect(
              "postgresql://user:pass@localhost/db")

          users = await conn.fetch(
              "SELECT * FROM users WHERE active=$1", True)

          await conn.executemany(
              "INSERT INTO logs(user_id, msg) VALUES($1, $2)",
              [(u["id"], "login") for u in users]
          )
          await conn.close()

      asyncio.run(main())

  - name: aioredis / redis[asyncio]
    icon: "🔴"
    desc: |
      Async Redis client — cachowanie, pub/sub, rate limiting.
      Instalacja: pip install redis[asyncio]

      Wbudowany w oficjalny redis-py przez redis[asyncio].
      Używany w FastAPI do cache i session store.
    code: |
      import asyncio
      from redis.asyncio import Redis

      async def main():
          r = Redis(host="localhost", decode_responses=True)

          await r.set("klucz", "wartość", ex=3600)  # TTL 1h
          val = await r.get("klucz")
          print(val)  # "wartość"

          await r.aclose()

      asyncio.run(main())

  - name: tenacity
    icon: "🔄"
    desc: |
      Retry z backoff — niezawodne async operacje.
      Instalacja: pip install tenacity

      Automatyczne ponawianie nieudanych operacji z exponential backoff.
      Gdy API zwraca 429 lub 503 — retry z odczekaniem. Działa z async/await.
    code: |
      from tenacity import (retry, stop_after_attempt,
                           wait_exponential, retry_if_exception_type)
      import httpx

      @retry(
          stop=stop_after_attempt(3),
          wait=wait_exponential(multiplier=1, min=1, max=10),
          retry=retry_if_exception_type(httpx.HTTPError),
      )
      async def fetch_with_retry(url: str) -> dict:
          async with httpx.AsyncClient() as client:
              r = await client.get(url)
              r.raise_for_status()
              return r.json()

  - name: pytest-asyncio
    icon: "🧪"
    desc: |
      Testowanie kodu async z pytest.
      Instalacja: pip install pytest-asyncio

      Pozwala pisać async def test_* funkcje w pytest.
      Konfiguracja asyncio_mode = "auto" w pyproject.toml eliminuje ręczne dekorowanie.
    code: |
      # pyproject.toml:
      # [tool.pytest.ini_options]
      # asyncio_mode = "auto"

      import asyncio
      import pytest

      async def fetch_data():
          await asyncio.sleep(0.1)
          return {"status": "ok"}

      async def test_fetch():
          result = await fetch_data()
          assert result["status"] == "ok"
