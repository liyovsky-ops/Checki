title: Sieć w Kubernetes

items:
  - name: ClusterIP — komunikacja wewnętrzna
    desc: >
      Domyślny typ Service. Tworzy wirtualny IP dostępny tylko wewnątrz klastra.
      Każdy Service dostaje DNS: nazwa-serwisu.namespace.svc.cluster.local.
      Używaj dla komunikacji między mikroserwisami — baza danych, cache, wewnętrzne API.
    code: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
        namespace: production
      spec:
        selector:
          app: postgres
        ports:
          - port: 5432
            targetPort: 5432
        type: ClusterIP

      # Dostęp z aplikacji w klastrze:
      # postgresql://postgres.production.svc.cluster.local:5432/db
      # Skrócona forma (w tym samym namespace):
      # postgresql://postgres:5432/db

  - name: NodePort — dostęp z zewnątrz przez port
    desc: >
      NodePort otwiera port (30000-32767) na każdym Node klastra i kieruje ruch do Service.
      Prosty dostęp z zewnątrz bez chmurowego LoadBalancera. Używany do testów,
      rzadko na produkcji — woli się LoadBalancer lub Ingress.
    code: |
      apiVersion: v1
      kind: Service
      metadata:
        name: api-nodeport
      spec:
        selector:
          app: api
        ports:
          - port: 80
            targetPort: 8000
            nodePort: 30080   # opcjonalnie, K8s przydzieli automatycznie
        type: NodePort

      # Dostęp: http://<IP-dowolnego-Node>:30080
      # kubectl get nodes -o wide  # znajdź IP Node

  - name: LoadBalancer — zewnętrzny load balancer chmury
    desc: >
      LoadBalancer tworzy zewnętrzny load balancer w chmurze (AWS ALB/NLB, GCP LB, Azure LB)
      z publicznym IP. Każdy Service LoadBalancer to osobny load balancer = koszt.
      Na produkcji lepiej używać jednego Ingress zamiast wielu LoadBalancerów.
    code: |
      apiVersion: v1
      kind: Service
      metadata:
        name: api-lb
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
      spec:
        selector:
          app: api
        ports:
          - port: 443
            targetPort: 8000
        type: LoadBalancer

      # Po chwili K8s przypisze EXTERNAL-IP:
      kubectl get service api-lb
      # NAME     TYPE           CLUSTER-IP    EXTERNAL-IP        PORT(S)
      # api-lb   LoadBalancer   10.0.0.100    52.12.34.56        443:30443/TCP

  - name: Ingress — routing HTTP/HTTPS
    desc: >
      Ingress to reverse proxy na poziomie klastra — jeden LoadBalancer, wiele Services.
      Routing po domenie lub ścieżce. Obsługa TLS. Wymaga Ingress Controllera
      (nginx-ingress, Traefik, AWS ALB). Znacznie tańszy niż osobny LoadBalancer per Service.
    code: |
      # Instalacja nginx Ingress Controller (Helm):
      helm upgrade --install ingress-nginx ingress-nginx \
        --repo https://kubernetes.github.io/ingress-nginx \
        --namespace ingress-nginx --create-namespace

      # Ingress manifest:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: api-ingress
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /
      spec:
        ingressClassName: nginx
        rules:
          - host: api.firma.pl
            http:
              paths:
                - path: /v1
                  pathType: Prefix
                  backend:
                    service:
                      name: api-v1
                      port:
                        number: 80
                - path: /v2
                  pathType: Prefix
                  backend:
                    service:
                      name: api-v2
                      port:
                        number: 80

  - name: DNS wewnętrzny klastra
    desc: >
      K8s uruchamia CoreDNS który obsługuje rozwiązywanie nazw Services i Podów.
      Pełna nazwa Service to: {serwis}.{namespace}.svc.{cluster-domain}.
      Cluster domain domyślnie cluster.local. Pody też mają DNS ale używa się ich rzadko.
    code: |
      # Schemat DNS dla Service:
      # nazwa-serwisu                          (ten sam namespace)
      # nazwa-serwisu.namespace                (inny namespace)
      # nazwa-serwisu.namespace.svc            (pełna ścieżka)
      # nazwa-serwisu.namespace.svc.cluster.local  (FQDN)

      # Przykłady z aplikacji w namespace "production":
      # Redis:     redis://redis:6379
      # PostgreSQL: postgresql://postgres:5432/db
      # API:       http://api-service/endpoint

      # Debug DNS z Poda:
      kubectl run -it --rm debug --image=busybox --restart=Never -- nslookup api-service

  - name: NetworkPolicy — segmentacja sieci
    desc: >
      Domyślnie wszystkie Pody mogą się ze sobą komunikować. NetworkPolicy to firewall
      na poziomie Podów — definiujesz które Pody mogą rozmawiać z którymi.
      Wymaga obsługi ze strony CNI plugin (Calico, Cilium — nie wbudowany K8s networking).
    code: |
      # "Default deny" — blokuj cały ruch przychodzący do namespace
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
        namespace: production
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
      ---
      # Zezwól na ruch do bazy tylko z api
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-api-to-db
        namespace: production
      spec:
        podSelector:
          matchLabels:
            app: postgres
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app: api
            ports:
              - port: 5432
