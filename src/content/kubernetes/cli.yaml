title: Komendy kubectl

groups:
  - name: Kontekst i klaster
    icon: "🏗️"
    commands:
      - cmd: kubectl config get-contexts
        desc: Lista dostępnych klastrów i kontekstów
        detail:
          what: Wyświetla wszystkie skonfigurowane konteksty kubectl — klastry, użytkowników, namespaces.
          how: 'Kontekst = kombinacja klastra + użytkownika + namespace. Gwiazdka (*) oznacza aktywny kontekst.'
          tips:
            - 'kubectl config current-context — tylko aktywny kontekst'
            - 'kubectl config use-context staging — przełącz na inny klaster'
      - cmd: kubectl config use-context <nazwa>
        desc: Przełącz aktywny klaster/kontekst
        detail:
          what: Zmienia aktywny kontekst kubectl — od teraz wszystkie komendy trafiają do tego klastra.
          how: Modyfikuje pole current-context w ~/.kube/config.
          tips:
            - 'kubectx — narzędzie do szybszego przełączania kontekstów'
            - 'kubectl config set-context --current --namespace=production — zmień domyślny namespace'
      - cmd: kubectl cluster-info
        desc: Informacje o klastrze i Control Plane
        detail:
          what: Pokazuje adresy API Servera i CoreDNS aktywnego klastra.
          how: Potwierdza że kubectl jest podłączony do właściwego klastra.
          tips:
            - 'kubectl cluster-info dump — pełny dump diagnostyczny klastra'
            - 'kubectl get nodes — lista wszystkich Nodes z statusem'
      - cmd: kubectl get nodes -o wide
        desc: Lista Nodes z IP i rolami
        detail:
          what: Wyświetla wszystkie maszyny w klastrze — ich status, role, wersję K8s i adresy IP.
          how: '-o wide dodaje kolumny IP, OS, kernel, container runtime.'
          flags:
            - flag: '-o wide'
              desc: Dodatkowe kolumny z IP i runtime
            - flag: --watch
              desc: Obserwuj zmiany na żywo
          tips:
            - 'kubectl describe node <nazwa> — szczegóły Node z zasobami i Podami'
            - 'kubectl top nodes — zużycie CPU i RAM per Node'

  - name: Pody
    icon: "📦"
    commands:
      - cmd: kubectl get pods -n <namespace>
        desc: Lista Podów w namespace
        detail:
          what: Wyświetla wszystkie Pody w namespace z ich statusem, liczbą restartów i wiekiem.
          how: 'STATUS: Running=działa, Pending=czeka na scheduling, CrashLoopBackOff=crashuje, Terminating=usuwa się.'
          flags:
            - flag: '-n <namespace>'
              desc: Filtruj po namespace
            - flag: -A
              desc: Wszystkie namespace naraz
            - flag: '--watch / -w'
              desc: Obserwuj zmiany na żywo
          tips:
            - 'kubectl get pods -A — wszystkie Pody w klastrze'
            - 'kubectl get pods -l app=api — filtruj po labelu'
      - cmd: kubectl describe pod <nazwa> -n <namespace>
        desc: Szczegóły Poda — eventy i konfiguracja
        detail:
          what: 'Szczegółowy widok Poda: kontenery, logi eventów, resource limits, probe status, node affinity.'
          how: 'Sekcja Events na dole to najważniejsza część do debugowania — pokazuje co się działo.'
          tips:
            - 'Szukaj "Failed", "Error", "OOMKilled" w sekcji Events'
            - 'kubectl describe pod <nazwa> | grep -A 20 Events'
      - cmd: kubectl logs <pod> -n <namespace>
        desc: Logi z Poda
        detail:
          what: Wyświetla stdout/stderr z kontenera w Podzie.
          how: Domyślnie logi z aktualnie działającego kontenera. Dla crashujących Podów użyj --previous.
          flags:
            - flag: -f
              desc: Follow — śledź nowe logi na żywo
            - flag: --previous
              desc: Logi z poprzedniej instancji (po crashu)
            - flag: '--tail 100'
              desc: Ostatnie 100 linii
            - flag: '-c <kontener>'
              desc: Wybierz kontener w multi-container Pod
          tips:
            - 'kubectl logs -f deployment/api -n production — logi całego Deployment'
            - 'kubectl logs --since=1h <pod> — logi z ostatniej godziny'
      - cmd: kubectl exec -it <pod> -- bash
        desc: Wejdź do działającego Poda
        detail:
          what: Otwiera interaktywną sesję bash wewnątrz kontenera w Podzie.
          how: '-it = interactive + tty. Działa tylko gdy Pod działa. --container/-c dla multi-container Podów.'
          flags:
            - flag: -it
              desc: Interaktywny tryb z pseudoterminałem
            - flag: '-c <kontener>'
              desc: Wybierz konkretny kontener
          tips:
            - 'kubectl exec -it <pod> -- sh — dla obrazów bez bash (Alpine)'
            - 'kubectl exec <pod> -- env — jednorazowe sprawdzenie zmiennych środowiskowych'
      - cmd: kubectl delete pod <nazwa> -n <namespace>
        desc: Usuń Pod (Deployment stworzy nowy)
        detail:
          what: 'Usuwa Pod. Jeśli zarządzany przez Deployment — K8s automatycznie stworzy nowy zastępczy.'
          how: Używany do wymuszenia restartu Poda bez zmiany Deployment.
          flags:
            - flag: --force
              desc: Natychmiastowe usunięcie bez graceful shutdown
          tips:
            - 'kubectl rollout restart deployment/api — bezpieczniejszy sposób na restart wszystkich Podów'
            - 'kubectl delete pod <nazwa> --grace-period=0 --force — natychmiastowe usunięcie stuck Poda'

  - name: Deploymenty
    icon: "🚀"
    commands:
      - cmd: kubectl get deployments -n <namespace>
        desc: Lista Deploymentów i status replik
        detail:
          what: 'Wyświetla Deploymenty z: pożądaną i aktualną liczbą replik, dostępnymi replikami.'
          how: 'READY=2/3 oznacza 2 z 3 replik działają. UP-TO-DATE = ile Podów ma aktualną wersję.'
          tips:
            - 'kubectl get deploy -n production -w — obserwuj rollout na żywo'
            - 'kubectl get all -n production — wszystkie zasoby w namespace naraz'
      - cmd: kubectl apply -f manifest.yaml
        desc: Aplikuj manifest YAML do klastra
        detail:
          what: Tworzy lub aktualizuje zasoby K8s zdefiniowane w pliku YAML. Idempotentny — bezpieczny do wielokrotnego uruchamiania.
          how: K8s porównuje obecny stan z pożądanym i wprowadza minimalne zmiany.
          flags:
            - flag: -f
              desc: Plik lub katalog z manifestami
            - flag: --dry-run=client
              desc: Symulacja bez faktycznej zmiany
            - flag: -R
              desc: Rekurencyjnie przez katalog
          tips:
            - 'kubectl apply -f ./manifests/ -R — aplikuj cały katalog rekurencyjnie'
            - 'kubectl diff -f manifest.yaml — pokaż co się zmieni przed apply'
      - cmd: kubectl rollout status deployment/<nazwa>
        desc: Obserwuj postęp rolling update
        detail:
          what: Czeka na zakończenie rolling update i pokazuje postęp w czasie rzeczywistym.
          how: Blokuje terminal do zakończenia. Exitcode 0 = sukces, 1 = błąd lub timeout.
          tips:
            - 'kubectl rollout history deployment/api — historia wszystkich deploymentów'
            - 'kubectl rollout undo deployment/api — rollback do poprzedniej wersji'
      - cmd: kubectl set image deployment/<nazwa> <kontener>=<image>:<tag>
        desc: Zaktualizuj image w Deployment
        detail:
          what: Zmienia wersję image w Deployment co wyzwala rolling update.
          how: 'Format: kubectl set image deployment/api api=registry.pl/api:1.3.0'
          tips:
            - 'kubectl rollout status deployment/api — śledź postęp po update'
            - 'Lepiej używać kubectl apply -f z zaktualizowanym YAML — łatwiejszy GitOps'
      - cmd: kubectl scale deployment/<nazwa> --replicas=5
        desc: Ręczna zmiana liczby replik
        detail:
          what: Natychmiastowo zmienia liczbę replik Deployment.
          how: Ręczne skalowanie — jeśli masz HPA może być przywrócone do wartości HPA.
          tips:
            - 'kubectl scale deployment --all --replicas=0 -n staging — wyłącz wszystko w staging'
            - 'kubectl autoscale deployment/api --min=2 --max=10 --cpu-percent=70 — szybkie HPA'

  - name: Serwisy i Ingress
    icon: "🔌"
    commands:
      - cmd: kubectl get services -n <namespace>
        desc: Lista Services z typami i IP
        detail:
          what: 'Wyświetla Services z typem (ClusterIP/NodePort/LoadBalancer), Cluster IP i zewnętrznym IP.'
          how: EXTERNAL-IP = zewnętrzny adres LoadBalancera. Pending = chmura jeszcze tworzy LB.
          tips:
            - 'kubectl get svc -n production -o wide — dodatkowe kolumny z selectorami'
            - 'kubectl get ingress -n production — lista Ingress rules'
      - cmd: kubectl port-forward svc/<nazwa> 8080:80
        desc: Lokalny tunel do Service w klastrze
        detail:
          what: Przekierowuje lokalny port do Service lub Poda w klastrze. Działa bez publicznego IP.
          how: 'Blokuje terminal (Ctrl+C aby zakończyć). Port-forward przez kubectl API — nie przez sieć.'
          flags:
            - flag: 'svc/<nazwa>'
              desc: Przekieruj do Service
            - flag: 'pod/<nazwa>'
              desc: Przekieruj bezpośrednio do Poda
          tips:
            - 'kubectl port-forward svc/grafana 3000:80 -n monitoring — dostęp do Grafany'
            - 'kubectl port-forward pod/postgres-0 5432:5432 -n production — dostęp do bazy'

  - name: Debugging
    icon: "🔍"
    commands:
      - cmd: kubectl describe <zasób> <nazwa> -n <namespace>
        desc: Szczegóły zasobu z eventami
        detail:
          what: Pełne informacje o zasobie K8s — konfiguracja, stan, eventy diagnostyczne.
          how: Działa dla pod, deployment, service, node, ingress i każdego innego zasobu K8s.
          tips:
            - 'kubectl describe pod <nazwa> — najczęściej używane do debugowania'
            - 'Sekcja Events na dole jest najważniejsza — pokazuje co K8s próbował zrobić'
      - cmd: kubectl get events -n <namespace> --sort-by=.lastTimestamp
        desc: Eventy klastra posortowane czasowo
        detail:
          what: Wyświetla ostatnie eventy w namespace — co się działo, błędy schedulingu, OOMKill.
          how: Eventy są kluczowe gdy Pod nie startuje (Pending, CrashLoopBackOff).
          tips:
            - 'kubectl get events -n production --field-selector type=Warning — tylko ostrzeżenia'
            - 'kubectl get events -A --sort-by=.lastTimestamp — eventy ze wszystkich namespace'
      - cmd: kubectl top pods -n <namespace>
        desc: Zużycie CPU i RAM przez Pody
        detail:
          what: Pokazuje aktualne zużycie zasobów przez Pody. Wymaga zainstalowanego metrics-server.
          how: 'Dane z metrics-server (nie Prometheus) — próbkowane co 15s.'
          tips:
            - 'kubectl top nodes — zużycie zasobów per Node'
            - 'kubectl top pods -A --sort-by=memory — wszystkie Pody posortowane po RAM'
      - cmd: kubectl run debug --image=busybox -it --rm -- sh
        desc: Uruchom tymczasowy Pod do debugowania sieci
        detail:
          what: Startuje jednorazowy Pod z narzędziami sieciowymi (busybox/nslookup/wget/curl) wewnątrz klastra.
          how: '--rm usuwa Pod automatycznie po wyjściu. Działa jak tymczasowa maszyna w klastrze.'
          tips:
            - 'kubectl run debug --image=nicolaka/netshoot -it --rm -- bash — bardziej kompletny toolset sieciowy'
            - 'Wewnątrz: nslookup api-service, wget http://api-service, curl http://postgres:5432'

  - name: Namespace i zasoby
    icon: "📁"
    commands:
      - cmd: kubectl get all -n <namespace>
        desc: Wszystkie zasoby w namespace
        detail:
          what: 'Wyświetla Pods, Deployments, ReplicaSets, Services, StatefulSets w jednym widoku.'
          how: Szybki overview całego namespace — wszystko co "działa" w jednym miejscu.
          tips:
            - 'kubectl get all -A — wszystkie namespace naraz (może być długie)'
            - 'kubectl api-resources — pełna lista typów zasobów K8s'
      - cmd: kubectl delete -f manifest.yaml
        desc: Usuń zasoby zdefiniowane w YAML
        detail:
          what: Usuwa zasoby K8s których definicja jest w pliku YAML.
          how: Idempotentny — bezpieczny nawet gdy zasoby już nie istnieją.
          tips:
            - 'kubectl delete namespace staging — usuń cały namespace ze wszystkimi zasobami (OSTROŻNIE!)'
            - 'kubectl delete pod --all -n production — usuń wszystkie Pody (Deployment stworzy nowe)'
      - cmd: kubectl config set-context --current --namespace=<namespace>
        desc: Ustaw domyślny namespace dla kubectl
        detail:
          what: Zmienia domyślny namespace tak że nie trzeba podawać -n przy każdej komendzie.
          how: Modyfikuje aktualny kontekst w ~/.kube/config.
          tips:
            - 'kubectl ns production — skrót jeśli masz plugin kubens'
            - 'kubens — narzędzie do przełączania namespace (część kubectx)'
      - cmd: kubectl apply -k ./kustomize/
        desc: Aplikuj przez Kustomize
        detail:
          what: Kustomize to wbudowane narzędzie do parametryzacji manifestów K8s bez Helma.
          how: 'kustomization.yaml definiuje baze + overlays (dev/staging/prod). kubectl apply -k aplikuje overlay.'
          tips:
            - 'kubectl diff -k ./kustomize/overlays/production — podgląd zmian przed apply'
            - 'kustomize build ./kustomize/ | kubectl apply -f - — pipe przez kustomize binary'

  - name: Patche — kubectl patch i Kustomize
    icon: "🩹"
    commands:
      - cmd: 'kubectl patch deployment api -p ''{"spec":{"replicas":5}}'''
        desc: Strategic Merge Patch (domyślny typ patcha)
        detail:
          what: Domyślny typ patcha kubectl — scala podany JSON/YAML ze istniejącym zasobem, rozumiejąc semantykę pól K8s (np. listy z merge key).
          how: 'Bez --type kubectl używa strategic merge — bezpieczny dla większości pól, ale wymaga znajomości semantyki danego zasobu.'
          tips:
            - 'Najlepszy wybór dla pól prostych (replicas, image) i większości codziennych zmian'
            - 'Dla list (np. containers[]) strategic merge scala po merge key (name), nie zastępuje całej listy'
      - cmd: 'kubectl patch deployment api --type=json -p ''[{"op":"replace","path":"/spec/replicas","value":5}]'''
        desc: JSON Patch — RFC 6902 (precyzyjne operacje)
        detail:
          what: JSON Patch operuje na dokładnej ścieżce JSON (path) z operacjami add/remove/replace/move/copy/test — zero "magii" scalania.
          how: '--type=json wymaga listy operacji, nie obiektu. path="/spec/replicas" wskazuje dokładne pole do zmiany.'
          tips:
            - 'Jedyny typ patcha który pozwala usunąć element z listy po indeksie: {"op":"remove","path":"/spec/template/spec/containers/0/env/2"}'
            - 'Senior tip: JSON Patch jest deterministyczny — używaj go w automatyzacji/CI gdzie potrzebujesz przewidywalności, nie heurystyk merge'
      - cmd: 'kubectl patch deployment api --type=merge -p ''{"spec":{"replicas":5}}'''
        desc: JSON Merge Patch — RFC 7386 (prostszy, ale zastępuje listy)
        detail:
          what: Merge Patch (RFC 7386) jest prostszy niż strategic merge, ale NIE rozumie semantyki K8s — listy są całkowicie zastępowane, nie scalane.
          how: Różnica od strategic merge jest krytyczna dla pól typu containers[] — merge patch wyczyści i zastąpi całą listę, nie tylko zmieni jeden element.
          tips:
            - 'Uważaj: kubectl patch --type=merge na liście containers usunie wszystkie kontenery których nie podałeś w patchu!'
            - 'Strategic merge istnieje właśnie po to żeby uniknąć tego problemu — używaj merge tylko gdy rozumiesz konsekwencje'
      - cmd: kubectl patch deployment api --patch-file patch.yaml
        desc: Patch z pliku (czytelniejszy niż inline JSON)
        detail:
          what: Wczytuje treść patcha z pliku YAML/JSON zamiast wklejać go inline w terminalu — czytelniejsze dla złożonych zmian.
          how: 'Domyślnie strategic merge — dodaj --type=json lub --type=merge jeśli potrzebujesz innego typu.'
          tips:
            - 'Trzymaj patch.yaml w repo jako część dokumentacji zmiany (audyt, code review)'
            - 'Dobre do jednorazowych hotfixów na produkcji bez edycji całego manifestu'
      - cmd: 'kubectl patch node worker-1 -p ''{"spec":{"unschedulable":true}}'''
        desc: Patch zasobu klastrowego (cordon przez patch)
        detail:
          what: Patche działają na każdym typie zasobu, nie tylko Deployment — tu oznaczamy Node jako unschedulable.
          how: 'To dokładnie to co robi kubectl cordon worker-1 pod spodem — patch jest niższym poziomem abstrakcji.'
          tips:
            - 'kubectl cordon/drain to wygodne skrypty nad kubectl patch — warto znać oba poziomy'
            - 'Przydatne gdy potrzebujesz patcha którego nie ma jako gotowej komendy kubectl'
      - cmd: kustomize edit add patch --path patch-replicas.yaml --kind Deployment
        desc: Dodaj patch do kustomization.yaml (CLI, nie ręczna edycja)
        detail:
          what: kustomize edit modyfikuje kustomization.yaml programowo — dodaje wpis do sekcji patches bez ręcznej edycji YAML.
          how: 'Generuje wpis: patches: [{path: patch-replicas.yaml, target: {kind: Deployment}}].'
          tips:
            - 'Przydatne w skryptach CI generujących overlay automatycznie'
            - 'Ręczna edycja kustomization.yaml jest równie częsta — kustomize edit to tylko wygoda dla automatyzacji'
      - cmd: kustomize edit set image api=registry.firma.pl/api:v2.3.1
        desc: Zmień tag obrazu przez Kustomize (typowy krok w CD)
        detail:
          what: Aktualizuje sekcję images w kustomization.yaml — nadpisuje tag obrazu bez modyfikowania bazowego manifestu Deployment.
          how: 'To jeden z najczęstszych kroków w pipeline CD: checkout overlay, kustomize edit set image, git commit, ArgoCD/Flux synchronizuje.'
          tips:
            - 'Wzorzec GitOps: CI ustawia obraz przez kustomize edit, commituje do repo manifestów, CD synchronizuje klaster'
            - 'kustomize edit set image api=api:v2.3.1 — bez registry jeśli używasz domyślnego'
      - cmd: kustomize build overlays/production --output rendered.yaml
        desc: Wyrenderuj finalne manifesty z bazy + patchy (bez apply)
        detail:
          what: Łączy base/ z patchami z overlays/production/ i zapisuje finalny, w pełni rozwinięty YAML do pliku — bez wysyłania do klastra.
          how: Senior workflow — zawsze renderuj i przeglądnij output przed apply na produkcji, szczególnie po zmianach w patchach.
          tips:
            - 'diff <(kustomize build overlays/staging) <(kustomize build overlays/production) — porównaj środowiska'
            - 'Commituj rendered.yaml do osobnego repo "manifesty po renderowaniu" dla pełnego audytu w niektórych setupach GitOps'
