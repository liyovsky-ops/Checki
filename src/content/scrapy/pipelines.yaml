items:
  - name: Podstawowy pipeline — process_item
    desc: >
      Każdy pipeline to klasa z metodą process_item(item, spider). Metoda musi zwrócić item
      (przepuszcza dalej) lub rzucić DropItem (usuwa z przetwarzania). Rejestruj pipeline
      w settings.py z priorytetem od 1 (pierwszy) do 1000 (ostatni).
    code: |
      # myproject/pipelines.py

      from itemadapter import ItemAdapter

      class ValidationPipeline:
          """Walidacja — sprawdź czy wymagane pola są wypełnione"""

          def process_item(self, item, spider):
              adapter = ItemAdapter(item)

              if not adapter.get("name"):
                  raise DropItem(f"Brak nazwy: {item}")

              if not adapter.get("price"):
                  raise DropItem(f"Brak ceny: {item}")

              return item  # Przekaż do następnego pipeline

      # settings.py — rejestracja z priorytetami
      ITEM_PIPELINES = {
          "myproject.pipelines.ValidationPipeline": 100,   # pierwszy
          "myproject.pipelines.DuplicatesPipeline": 200,
          "myproject.pipelines.MongoPipeline": 300,
          "myproject.pipelines.ExportPipeline": 900,        # ostatni
      }

  - name: Pipeline deduplication — DropItem
    desc: >
      Deduplication pipeline usuwa duplikaty przez śledzenie już widzianych wartości w secie.
      DropItem to specjalny wyjątek który mówi Scrapy: pomiń ten item, nie przekazuj dalej.
      Set w pamięci działa dla małych projektów; dla dużych użyj Redis lub bazy danych.
    code: |
      from scrapy.exceptions import DropItem
      from itemadapter import ItemAdapter

      class DuplicatesPipeline:
          """Odfiltruj duplikaty po URL"""

          def __init__(self):
              self.seen_urls = set()

          def process_item(self, item, spider):
              adapter = ItemAdapter(item)
              url = adapter.get("url")

              if url in self.seen_urls:
                  raise DropItem(f"Duplikat URL: {url}")

              self.seen_urls.add(url)
              return item

