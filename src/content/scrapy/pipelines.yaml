  - name: Pipeline MongoDB — zapis do bazy
    desc: >
      open_spider() i close_spider() to metody cyklu życia pipeline — wywołane raz
      przy starcie i zatrzymaniu spidera. Użyj ich do otwarcia/zamknięcia połączenia
      z bazą danych. Unikaj łączenia w process_item — to by się działo dla każdego item.
    code: |
      import pymongo
      from itemadapter import ItemAdapter

      class MongoPipeline:
          """Zapisuj items do MongoDB"""

          def __init__(self, mongo_uri, mongo_db):
              self.mongo_uri = mongo_uri
              self.mongo_db = mongo_db

          @classmethod
          def from_crawler(cls, crawler):
              # Pobierz konfigurację z settings.py
              return cls(
                  mongo_uri=crawler.settings.get("MONGO_URI"),
                  mongo_db=crawler.settings.get("MONGO_DATABASE", "scrapy_db"),
              )

          def open_spider(self, spider):
              self.client = pymongo.MongoClient(self.mongo_uri)
              self.db = self.client[self.mongo_db]

          def close_spider(self, spider):
              self.client.close()

          def process_item(self, item, spider):
              col = self.db[spider.name]  # kolekcja = nazwa spidera
              col.insert_one(ItemAdapter(item).asdict())
              return item

  - name: Pipeline SQLite — zapis do relacyjnej bazy
    desc: >
      Wzorzec dla pipeline zapisującego do SQLite lub innej relacyjnej bazy. open_spider()
      tworzy połączenie i tabelę (CREATE TABLE IF NOT EXISTS). Używaj parametryzowanych
      zapytań (?, :name) — nigdy f-stringów w SQL.
    code: |
      import sqlite3
      from itemadapter import ItemAdapter

      class SQLitePipeline:
          """Zapisuj items do SQLite"""

          def open_spider(self, spider):
              self.conn = sqlite3.connect("scraped_data.db")
              self.cursor = self.conn.cursor()
              self.cursor.execute("""
                  CREATE TABLE IF NOT EXISTS products (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      name TEXT NOT NULL,
                      price REAL,
                      url TEXT UNIQUE
                  )
              """)
              self.conn.commit()

          def close_spider(self, spider):
              self.conn.commit()
              self.conn.close()

          def process_item(self, item, spider):
              adapter = ItemAdapter(item)
              try:
                  self.cursor.execute(
                      "INSERT OR IGNORE INTO products (name, price, url) VALUES (?, ?, ?)",
                      (adapter.get("name"), adapter.get("price"), adapter.get("url"))
                  )
              except sqlite3.Error as e:
                  spider.logger.error(f"SQLite error: {e}")
              return item
