  - name: Helpers i utilities
    icon: "🛠️"
    commands:
      - code: |
          import { Hono } from 'hono'

          type Variables = {
            user: { id: string; name: string; role: 'admin' | 'user' }
            requestId: string
            startTime: number
          }

          const app = new Hono<{ Variables: Variables }>()

          // Middleware ustawia dane w kontekście
          app.use('*', async (c, next) => {
            c.set('requestId', crypto.randomUUID())
            c.set('startTime', Date.now())
            await next()
          })

          app.use('/api/*', async (c, next) => {
            // Symulacja auth — w realu: weryfikuj JWT
            c.set('user', { id: '1', name: 'Jan', role: 'user' })
            await next()
          })

          app.get('/api/profile', (c) => {
            const user = c.get('user')         // { id, name, role } — typowany!
            const reqId = c.get('requestId')   // string
            const ms = Date.now() - c.get('startTime')

            return c.json({ user, requestId: reqId, responseMs: ms })
          })

          export default app
        desc: c.set() / c.get() — typowany shared state
        detail:
          what: 'Variables generic w Hono<{Variables}> = type safety dla c.set/c.get. Middleware ustawia dane, handler czyta. TypeScript wie jaki typ per klucz.'
          how: c.set() w middleware. c.get() w handlerze lub kolejnym middleware. Dane żyją tylko przez request — nie są persistent.
          tips:
            - 'Definiuj Variables type w jednym miejscu — importuj przez cały projekt'
            - 'c.get() zwraca undefined jeśli klucz nie ustawiony — handle to'

