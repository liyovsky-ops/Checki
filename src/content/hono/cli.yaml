        desc: testClient() — testy bez serwera
        detail:
          what: testClient() z hono/testing tworzy klienta RPC działającego bezpośrednio na app.fetch — bez HTTP server, bez portu, bez sieci. Idealne dla unit testów.
          how: Taki sam API jak hc() klient — $get, $post, $put. Działa z Vitest, Bun test, Jest. Typy inferowane z AppType automatycznie.
          tips:
            - 'Łącz z testClient — testy są izolowane, szybkie i nie wymagają wolnego portu'
