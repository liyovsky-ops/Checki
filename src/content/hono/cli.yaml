      - code: |
          import { Hono } from 'hono'
          import { createFactory, createMiddleware } from 'hono/factory'

          // Factory pattern — współdzielony typ przez cały projekt
          type AppEnv = {
            Bindings: { DB_URL: string }
            Variables: { userId: string; role: string }
          }

          const factory = createFactory<AppEnv>()

          // Twórz middleware z typowanym kontekstem
          const authMiddleware = createMiddleware<AppEnv>(async (c, next) => {
            const token = c.req.header('Authorization')?.split(' ')[1]
            if (!token) {
              return c.json({ error: 'Unauthorized' }, 401)
            }
            c.set('userId', 'user-from-token')
            c.set('role', 'user')
            await next()
          })

          // Handler z factory — typowany kontekst
          const getUsersHandler = factory.createHandlers(
            authMiddleware,
            (c) => {
              const userId = c.get('userId')  // string — typowany
              return c.json({ requestedBy: userId, users: [] })
            }
          )

          const app = new Hono<AppEnv>()
          app.get('/api/users', ...getUsersHandler)

          export default app
        desc: createFactory() — shared typed middleware
        detail:
          what: createFactory<AppEnv>() tworzy factory z przypiętym typem środowiska. createMiddleware() tworzy middleware z type safety bez powtarzania generics w każdym middleware.
          how: Jeden AppEnv type dla całego projektu. factory.createHandlers() = tablica [middleware, handler] gotowa do spread w route definicji.
          tips:
            - 'Eliminuje powtarzanie Hono<AppEnv> w każdym pliku middleware'
            - 'createMiddleware() eksportuj z osobnego pliku — importuj w routach'
