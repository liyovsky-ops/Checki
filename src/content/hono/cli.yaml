          how: 'tsconfig.json: jsx: "react-jsx", jsxImportSource: "hono/jsx". Pliki .tsx. c.html() ustawia Content-Type: text/html.'
          tips:
            - 'hono/jsx renderuje synchronicznie — dla async komponentów używaj streamSSE'
            - 'class= zamiast className= (jak HTML, nie React)'

      - code: |
          import { Hono } from 'hono'

          const app = new Hono()

          // Custom 404
          app.notFound((c) => {
            return c.json({
              error: 'Not Found',
              path: c.req.path,
              method: c.req.method,
            }, 404)
          })

          // Globalny error handler
          app.onError((err, c) => {
            console.error(`Error: ${err.message}`, {
              path: c.req.path,
              stack: err.stack,
            })

            // Zwróć user-friendly error
            if (err.message.includes('Unauthorized')) {
              return c.json({ error: 'Unauthorized' }, 401)
            }

            return c.json({
              error: 'Internal Server Error',
              message: err.message,
            }, 500)
          })

          app.get('/crash', () => {
            throw new Error('Intentional crash!')
          })

          export default app
        desc: app.notFound() + app.onError()
        detail:
          what: app.notFound() = handler dla tras które nie pasują do żadnego route. app.onError() = globalny handler nieobsłużonych błędów (throw w handlerze).
          how: Bez onError Hono zwraca 500 z domyślnym formatem. Zdefiniuj oba w każdej aplikacji — dla konsistentnego formatu błędów.
          tips:
            - 'onError łapie wszystkie throw — nie potrzebujesz try/catch w handlerach'
            - 'Loguj err.stack do monitoring (Sentry, Grafana) — nie wysyłaj do klienta'

      - code: |
          import { Hono } from 'hono'
          import { HTTPException } from 'hono/http-exception'

          const app = new Hono()

          // Throw HTTPException — typed błąd z kodem HTTP
          app.get('/users/:id', async (c) => {
            const id = c.req.param('id')
            const user = await getUserFromDB(id)

            if (!user) {
              throw new HTTPException(404, {
                message: `User ${id} not found`,
              })
            }

            if (!user.isActive) {
              throw new HTTPException(403, {
                message: 'Account deactivated',
                cause: new Error('User account deactivated'),
              })
            }

            return c.json({ user })
          })

          // onError łapie HTTPException
          app.onError((err, c) => {
            if (err instanceof HTTPException) {
              return err.getResponse()  // automatyczna odpowiedź z kodem
            }
            return c.json({ error: 'Server Error' }, 500)
          })

          export default app
        desc: HTTPException — typowane błędy HTTP
        detail:
          what: HTTPException to klasa błędu Hono z kodem HTTP. throw HTTPException(404, ...) zamiast return c.json(error, 404). Łapany przez onError. Czytelniejszy kod.
          how: err.getResponse() = gotowa Response z kodem i wiadomością. err.status = status code. err.message = wiadomość.
          tips:
            - 'throw HTTPException zamiast return w handlerze — łatwiejszy early exit'
            - 'Zdefiniuj własne klasy błędów extends HTTPException — np. ValidationError(422)'

