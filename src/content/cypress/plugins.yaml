title: Ekosystem Cypress

items:
  - name: "@testing-library/cypress"
    desc: "Selektory oparte o dostępność w Cypress: getByRole(), getByLabel(), getByText(). Filozofia RTL w E2E — selektory odporne na zmiany implementacji."
    icon: "🐙"
  - name: "@cypress/vue"
    desc: "Component Testing dla Vue 3 i Vue 2. Montuje komponenty Vue bezpośrednio w przeglądarce Cypress. cy.mount(MyComponent, { props: {} })."
    icon: "💚"
  - name: "@cypress/react"
    desc: "Component Testing dla React 18+. Montuje komponenty React z pełnym kontekstem (Provider, Router). Wbudowany od Cypress 10 w paczce cypress."
    icon: "⚛️"
  - name: cypress-axe
    desc: "Testy dostępności (a11y) w Cypress z axe-core. cy.injectAxe() + cy.checkA11y() — skanuje stronę i raportuje naruszenia WCAG 2.1."
    icon: "♿"
  - name: mochawesome-reporter
    desc: "Piękne HTML raporty z wynikami testów, screenshotami i statystykami. Działa z wbudowanym Mocha runner Cypress. cypress-mochawesome-reporter."
    icon: "📊"
  - name: cypress-image-snapshot
    desc: "Visual regression testing — porównuje screenshoty z baseline. cy.matchImageSnapshot() wykrywa wizualne zmiany w UI na poziomie pikseli."
    icon: "📸"
  - name: "@percy/cypress"
    desc: "Percy visual testing — cloud-based visual regression. cy.percySnapshot() uploaduje screenshot do Percy, który porównuje cross-browser."
    icon: "👁️"
  - name: cypress-real-events
    desc: "Prawdziwe zdarzenia przeglądarki (nie symulowane) — cy.realClick(), cy.realHover(), cy.realPress(). Potrzebne dla natywnych drag&drop i hover."
    icon: "🖱️"
  - name: cypress-wait-until
    desc: "cy.waitUntil() — czeka aż callback zwróci truthy. Warunkowe czekanie na stany niemożliwe do wyrażenia przez should()."
    icon: "⏳"
  - name: "@cypress/code-coverage"
    desc: "Zbiera code coverage z testów E2E — integracja z Istanbul/nyc. Pokazuje które linie kodu są pokryte przez testy E2E, nie tylko unit testy."
    icon: "📈"
