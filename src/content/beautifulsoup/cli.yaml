title: Komendy BeautifulSoup
groups:
  - name: Instalacja
    icon: "📦"
    commands:
      - cmd: pip install beautifulsoup4
        desc: Zainstaluj BeautifulSoup4
        detail:
          what: Instaluje BeautifulSoup4 — bibliotekę do parsowania HTML i XML w Pythonie.
          how: Sama BS4 wymaga parsera — domyślnie html.parser (z biblioteki standardowej), lxml jest szybszy.
          tips:
            - 'pip install beautifulsoup4 lxml — zainstaluj z szybszym parserem'
            - 'from bs4 import BeautifulSoup — importuj jako BeautifulSoup (nie bs4)'
      - cmd: pip install beautifulsoup4 requests lxml html5lib
        desc: Pełny zestaw scrapingowy
        detail:
          what: Instaluje BS4 ze wszystkimi parserami (lxml, html5lib) i requests do pobierania stron.
          how: "lxml — najszybszy, nie toleruje błędów HTML. html5lib — wolny ale obsługuje każdy HTML."
          tips:
            - 'html.parser (stdlib) — wystarczy dla czystego HTML, bez dodatkowych instalacji'
            - "lxml — wybierz dla szybkości. html5lib — dla źle napisanych stron."
      - cmd: pip install beautifulsoup4 requests lxml pandas openpyxl
        desc: Z pandas do tabel HTML
        detail:
          what: Dodaje pandas i openpyxl — pozwala parsować tabele HTML do DataFrame i eksportować do Excel.
          how: "pd.read_html(url) — automatycznie parsuje wszystkie tabele na stronie bez BS4."
          tips:
            - 'pd.read_html("https://...") — najszybszy sposób na tabele HTML, bez pisania BS4 kodu'
            - 'df.to_excel("tabela.xlsx") — wymaga openpyxl'
      - cmd: python -c "import bs4; print(bs4.__version__)"
        desc: Sprawdź wersję
        detail:
          what: Wypisuje zainstalowaną wersję BeautifulSoup4.
          how: Aktualna stabilna wersja to 4.12.x — sprawdź przed projektem.
          tips:
            - 'pip show beautifulsoup4 — więcej info: lokalizacja, zależności'
            - 'pip install --upgrade beautifulsoup4 — aktualizuj do najnowszej'

  - name: Szybkie parsowanie
    icon: "⚡"
    commands:
      - desc: Parsuj stronę online i wydrukuj tytuł
        code: |
          python -c "
          import requests
          from bs4 import BeautifulSoup
          r = requests.get('https://example.com', headers={'User-Agent':'demo/1.0'})
          s = BeautifulSoup(r.text, 'html.parser')
          print(s.title.text)
          "
      - desc: Wyciągnij wszystkie linki z URL
        code: |
          python -c "
          import requests
          from bs4 import BeautifulSoup
          r = requests.get('https://example.com')
          s = BeautifulSoup(r.text, 'html.parser')
          links = [a['href'] for a in s.find_all('a', href=True)]
          print('\n'.join(links[:20]))
          "
      - desc: Parsuj lokalny plik HTML
        code: |
          python -c "
          from bs4 import BeautifulSoup
          with open('strona.html', encoding='utf-8') as f:
              soup = BeautifulSoup(f, 'html.parser')
          print(soup.title.text)
          "
      - desc: Wyciągnij tekst ze strony (bez tagów)
        code: |
          python -c "
          import requests
          from bs4 import BeautifulSoup
          r = requests.get('https://example.com')
          s = BeautifulSoup(r.text, 'html.parser')
          print(s.get_text(separator='\n', strip=True)[:500])
          "

  - name: Scraping one-linery
    icon: "🎯"
    commands:
      - desc: Znajdź elementy po klasie CSS
        code: |
          python -c "
          import requests; from bs4 import BeautifulSoup
          s = BeautifulSoup(requests.get('https://books.toscrape.com').text, 'html.parser')
          books = s.find_all('article', class_='product_pod')
          [print(b.h3.a['title'], b.find('p', class_='price_color').text) for b in books[:5]]
          "
      - desc: Parsuj tabele HTML do CSV
        code: |
          python -c "
          import pandas as pd
          tables = pd.read_html('https://pl.wikipedia.org/wiki/Polska')
          tables[0].to_csv('tabela.csv', index=False)
          print('Zapisano tabela.csv')
          "
      - desc: Pobierz wszystkie obrazki z strony
        code: |
          python -c "
          import requests; from bs4 import BeautifulSoup
          s = BeautifulSoup(requests.get('https://example.com').text, 'html.parser')
          imgs = [img.get('src', '') for img in s.find_all('img') if img.get('src')]
          print('\n'.join(imgs[:10]))
          "

  - name: Testowanie i debugowanie
    icon: "🔍"
    commands:
      - desc: Sprawdź dostępne parsery
        code: |
          python -c "
          for p in ['html.parser','lxml','html5lib']:
              try:
                  from bs4 import BeautifulSoup
                  BeautifulSoup('<p>test</p>', p)
                  print(f'{p}: OK')
              except:
                  print(f'{p}: brak (pip install {p})')
          "
      - desc: Interaktywne testowanie BS4 (Python REPL)
        code: |
          python -c "
          import requests; from bs4 import BeautifulSoup
          html = requests.get('https://example.com').text
          soup = BeautifulSoup(html, 'html.parser')
          import code; code.interact(local=locals())
          "
      - desc: Prettify HTML (sformatuj czytelnie)
        code: |
          python -c "
          from bs4 import BeautifulSoup
          html = open('strona.html').read()
          print(BeautifulSoup(html, 'html.parser').prettify()[:1000])
          "
