title: BeautifulSoup vs alternatywy scrapingu

items:
  - name: lxml
    icon: "⚡"
    color: "#ff6600"
    tagline: Szybki parser XML/HTML w C — 10-50x szybszy niż html.parser
    pros:
      - 10-50x szybszy niż html.parser (BS4 backend)
      - Pełne XPath 1.0 — bardziej precyzyjne niż CSS selectors
      - Walidacja XML Schema (XSD) i XSLT transformacje
      - Mniejsze użycie pamięci przy dużych plikach
    cons:
      - Surowy na niepoprawny HTML (rzuca błędy tam gdzie BS4 toleruje)
      - Inne API niż BeautifulSoup — trzeba się nauczyć
      - Instalacja wymaga kompilatora C (na niektórych systemach)
    vs: lxml szybszy i bardziej precyzyjny. BS4 prostszy i bardziej tolerancyjny na "brudny" HTML. Możesz łączyć — BS4 z lxml jako parser (BeautifulSoup(html, "lxml")).

  - name: Scrapy
    icon: "🕷️"
    color: "#60a839"
    tagline: Pełny framework do scrapingu — spider, pipeline, export
    pros:
      - Asynchroniczne pobieranie wielu stron jednocześnie
      - Middleware (proxy, retry, rate limiting, cookies) out of the box
      - Pipelines do walidacji i zapisu do DB/CSV/JSON
      - Scrapy Shell do interaktywnego testowania selektorów
    cons:
      - Overkill dla prostych, jednorazowych skryptów
      - Stroma krzywa uczenia — własna architektura spider/item/pipeline
      - Trudna integracja z asyncio (używa Twisted)
      - Wymaga strukturyzacji kodu
    vs: BS4+requests dla prostego scrapingu (< kilkaset stron, jednorazowe zadania). Scrapy gdy potrzebujesz pipeline, retry, throttling i scraping wielu stron jednocześnie.

  - name: Playwright / Selenium
    icon: "🎭"
    color: "#45ba4b"
    tagline: Browser automation — jedyne wyjście dla stron z JavaScriptem
    pros:
      - Renderuje JavaScript — działa na SPA (React, Vue, Next.js)
      - Playwright: auto-wait, screenshots, video, tracing wbudowane
      - Obsługa infinite scroll i dynamicznie ładowanych treści
      - Prawdziwa przeglądarka — omija wiele zabezpieczeń anti-bot
    cons:
      - 100x wolniejszy niż requests+BS4
      - Duże zasoby (RAM, CPU)
      - Wymaga zainstalowanej przeglądarki
      - Trudniejszy do skalowania
    vs: BS4+requests gdy strona zwraca statyczny HTML. Playwright/Selenium gdy strona wymaga JS do wyrenderowania danych. Workflow hybrydowy — Playwright pobiera HTML, BS4 parsuje.

  - name: httpx (async scraping)
    icon: "🌐"
    color: "#009688"
    tagline: Nowoczesny async HTTP client — BS4 parsuje niezależnie co pobierze
    pros:
      - Async/await — pobieranie wielu stron jednocześnie
      - HTTP/2 support
      - Identyczne API jak requests — łatwa migracja
      - Connection pooling domyślnie
    cons:
      - Nie zastępuje BS4 — BS4 nadal parsuje HTML
      - Async wymaga przepisania kodu sync na async
      - Nie renderuje JavaScript (jak requests)
    vs: httpx + BS4 = async wersja requests + BS4. Pobierz wiele stron jednocześnie z httpx, parsuj HTML z BS4. Dobre przyspieszenie bez Scrapy.
