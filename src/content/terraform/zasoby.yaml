title: Zasoby Terraform

items:
  - name: Resource — podstawowa składnia
    icon: "🧱"
    desc: >
      Blok resource to podstawowy budulec. Meta-argumenty count, for_each, depends_on, lifecycle
      są dostępne we wszystkich resource'ach — nie są specyficzne dla providera.
    code: |
      # Podstawowy blok resource
      resource "aws_instance" "web" {
        ami           = "ami-0905a3c97561e0b69"
        instance_type = "t3.micro"

        tags = {
          Name = "web-server"
        }
      }

      # count — wiele kopii tego samego zasobu
      resource "aws_instance" "workers" {
        count         = 3
        ami           = "ami-0905a3c97561e0b69"
        instance_type = "t3.micro"

        tags = {
          Name = "worker-${count.index}"
        }
      }

      # for_each — tworzenie z mapy lub setu (lepsze od count)
      resource "aws_iam_user" "developers" {
        for_each = toset(["alice", "bob", "charlie"])
        name     = each.value
      }

      # Referencja do zasobu tworzonego przez for_each
      resource "aws_iam_user_policy_attachment" "dev_attach" {
        for_each   = aws_iam_user.developers
        user       = each.value.name
        policy_arn = "arn:aws:iam::aws:policy/ReadOnlyAccess"
      }

      # depends_on — jawna zależność (gdy Terraform jej nie wykryje sam)
      resource "aws_instance" "app" {
        ami           = "ami-0905a3c97561e0b69"
        instance_type = "t3.micro"
        depends_on    = [aws_vpc.main, aws_internet_gateway.main]
      }

      # lifecycle — zachowanie przy zmianach
      resource "aws_instance" "prod" {
        ami           = "ami-0905a3c97561e0b69"
        instance_type = "t3.large"

        lifecycle {
          create_before_destroy = true   # najpierw utwórz nowy, potem usuń stary
          prevent_destroy       = true   # nie pozwól zniszczyć (ochrona prod)
          ignore_changes        = [ami]  # ignoruj zmiany AMI (manual updates)
        }
      }

  - name: Data Source
    icon: "🔍"
    desc: >
      Data source pozwala pobierać dane o istniejących zasobach bez zarządzania nimi.
      Prefix data. — Terraform tylko czyta, nic nie tworzy ani nie niszczy.
    code: |
      # Pobierz najnowszy Amazon Linux 2023 AMI
      data "aws_ami" "amazon_linux" {
        most_recent = true
        owners      = ["amazon"]

        filter {
          name   = "name"
          values = ["al2023-ami-*-x86_64"]
        }

        filter {
          name   = "virtualization-type"
          values = ["hvm"]
        }
      }

      # Użyj AMI z data source
      resource "aws_instance" "web" {
        ami           = data.aws_ami.amazon_linux.id
        instance_type = "t3.micro"
      }

      # Pobierz istniejące VPC po tagu
      data "aws_vpc" "existing" {
        filter {
          name   = "tag:Name"
          values = ["production-vpc"]
        }
      }

      # Pobierz wszystkie subnety w VPC
      data "aws_subnets" "private" {
        filter {
          name   = "vpc-id"
          values = [data.aws_vpc.existing.id]
        }

        tags = {
          Tier = "private"
        }
      }

      # Pobierz aktualny AWS account ID
      data "aws_caller_identity" "current" {}

      output "account_id" {
        value = data.aws_caller_identity.current.account_id
      }

      # Pobierz region
      data "aws_region" "current" {}

      output "region" {
        value = data.aws_region.current.name
      }

  - name: "AWS — EC2 i Security Group"
    icon: "💻"
    desc: >
      EC2 to fundament AWS. Security Group to wirtualny firewall — kontroluje ruch
      do i z instancji. Zawsze definiuj SG przed EC2 — Terraform sam wykryje kolejność.
    code: |
      # Security Group — zezwól na HTTP, HTTPS i SSH
      resource "aws_security_group" "web" {
        name        = "web-sg"
        description = "Security group dla serwera web"
        vpc_id      = aws_vpc.main.id

        # Ruch przychodzący — HTTP
        ingress {
          from_port   = 80
          to_port     = 80
          protocol    = "tcp"
          cidr_blocks = ["0.0.0.0/0"]
          description = "HTTP z internetu"
        }

        # Ruch przychodzący — HTTPS
        ingress {
          from_port   = 443
          to_port     = 443
          protocol    = "tcp"
          cidr_blocks = ["0.0.0.0/0"]
          description = "HTTPS z internetu"
        }

        # Ruch przychodzący — SSH tylko z biura
        ingress {
          from_port   = 22
          to_port     = 22
          protocol    = "tcp"
          cidr_blocks = ["10.0.0.0/8"]
          description = "SSH z sieci wewnetrznej"
        }

        # Ruch wychodzący — wszystko dozwolone
        egress {
          from_port   = 0
          to_port     = 0
          protocol    = "-1"
          cidr_blocks = ["0.0.0.0/0"]
        }

        tags = {
          Name = "web-sg"
        }
      }

      # Klucz SSH
      resource "aws_key_pair" "deployer" {
        key_name   = "deployer-key"
        public_key = file("~/.ssh/id_rsa.pub")
      }

      # Instancja EC2
      resource "aws_instance" "web" {
        ami                    = data.aws_ami.amazon_linux.id
        instance_type          = "t3.micro"
        subnet_id              = aws_subnet.public.id
        vpc_security_group_ids = [aws_security_group.web.id]
        key_name               = aws_key_pair.deployer.key_name

        # User data — skrypt startowy
        user_data = <<-EOF
          #!/bin/bash
          yum update -y
          yum install -y nginx
          systemctl start nginx
          systemctl enable nginx
        EOF

        root_block_device {
          volume_type = "gp3"
          volume_size = 20
          encrypted   = true
        }

        tags = {
          Name        = "web-server"
          Environment = "production"
        }
      }

      # Elastic IP
      resource "aws_eip" "web" {
        instance = aws_instance.web.id
        domain   = "vpc"
      }

  - name: "AWS — S3 Bucket"
    icon: "🪣"
    desc: >
      S3 to obiektowy storage AWS. Domyślnie prywatny — wymaga jawnego zezwolenia na publiczny dostęp.
      Wersjonowanie, szyfrowanie i lifecycle rules jako best practices.
    code: |
      # Bucket S3 z pełną konfiguracją
      resource "aws_s3_bucket" "assets" {
        bucket = "moja-firma-assets-${random_id.suffix.hex}"

        tags = {
          Name        = "assets"
          Environment = "production"
        }
      }

      # Blokuj publiczny dostęp (domyślnie prywatny)
      resource "aws_s3_bucket_public_access_block" "assets" {
        bucket = aws_s3_bucket.assets.id

        block_public_acls       = true
        block_public_policy     = true
        ignore_public_acls      = true
        restrict_public_buckets = true
      }

      # Wersjonowanie
      resource "aws_s3_bucket_versioning" "assets" {
        bucket = aws_s3_bucket.assets.id

        versioning_configuration {
          status = "Enabled"
        }
      }

      # Szyfrowanie SSE-S3
      resource "aws_s3_bucket_server_side_encryption_configuration" "assets" {
        bucket = aws_s3_bucket.assets.id

        rule {
          apply_server_side_encryption_by_default {
            sse_algorithm = "AES256"
          }
        }
      }

      # Lifecycle rules — archiwizacja starych wersji
      resource "aws_s3_bucket_lifecycle_configuration" "assets" {
        bucket = aws_s3_bucket.assets.id

        rule {
          id     = "archive-old-versions"
          status = "Enabled"

          noncurrent_version_transition {
            noncurrent_days = 30
            storage_class   = "STANDARD_IA"
          }

          noncurrent_version_expiration {
            noncurrent_days = 90
          }
        }

        rule {
          id     = "delete-incomplete-uploads"
          status = "Enabled"

          abort_incomplete_multipart_upload {
            days_after_initiation = 7
          }
        }
      }

      # Policy — dostęp tylko z konkretnego konta
      resource "aws_s3_bucket_policy" "assets" {
        bucket = aws_s3_bucket.assets.id

        policy = jsonencode({
          Version = "2012-10-17"
          Statement = [
            {
              Effect    = "Allow"
              Principal = { AWS = "arn:aws:iam::${data.aws_caller_identity.current.account_id}:root" }
              Action    = ["s3:GetObject", "s3:PutObject"]
              Resource  = "${aws_s3_bucket.assets.arn}/*"
            }
          ]
        })
      }

      resource "random_id" "suffix" {
        byte_length = 4
      }

  - name: "AWS — VPC i networking"
    icon: "🌐"
    desc: >
      VPC to izolowana sieć w AWS. Standardowa architektura to publiczne subnety (load balancer),
      prywatne (aplikacje) i database (bazy danych) w każdej strefie dostępności.
    code: |
      # VPC główne
      resource "aws_vpc" "main" {
        cidr_block           = "10.0.0.0/16"
        enable_dns_hostnames = true
        enable_dns_support   = true

        tags = {
          Name = "main-vpc"
        }
      }

      # Internet Gateway — dostęp z internetu
      resource "aws_internet_gateway" "main" {
        vpc_id = aws_vpc.main.id

        tags = {
          Name = "main-igw"
        }
      }

      # Publiczne subnety (2 AZ dla HA)
      resource "aws_subnet" "public" {
        count             = 2
        vpc_id            = aws_vpc.main.id
        cidr_block        = "10.0.${count.index}.0/24"
        availability_zone = data.aws_availability_zones.available.names[count.index]
        map_public_ip_on_launch = true

        tags = {
          Name = "public-subnet-${count.index + 1}"
          Tier = "public"
        }
      }

      # Prywatne subnety (aplikacje)
      resource "aws_subnet" "private" {
        count             = 2
        vpc_id            = aws_vpc.main.id
        cidr_block        = "10.0.${count.index + 10}.0/24"
        availability_zone = data.aws_availability_zones.available.names[count.index]

        tags = {
          Name = "private-subnet-${count.index + 1}"
          Tier = "private"
        }
      }

      # Route table dla publicznych subnetów
      resource "aws_route_table" "public" {
        vpc_id = aws_vpc.main.id

        route {
          cidr_block = "0.0.0.0/0"
          gateway_id = aws_internet_gateway.main.id
        }

        tags = {
          Name = "public-rt"
        }
      }

      # Podłącz publiczne subnety do route table
      resource "aws_route_table_association" "public" {
        count          = 2
        subnet_id      = aws_subnet.public[count.index].id
        route_table_id = aws_route_table.public.id
      }

      # NAT Gateway dla prywatnych subnetów
      resource "aws_eip" "nat" {
        domain     = "vpc"
        depends_on = [aws_internet_gateway.main]
      }

      resource "aws_nat_gateway" "main" {
        allocation_id = aws_eip.nat.id
        subnet_id     = aws_subnet.public[0].id

        tags = {
          Name = "main-nat"
        }
      }

      # Dostępne AZ
      data "aws_availability_zones" "available" {
        state = "available"
      }

  - name: "AWS — RDS"
    icon: "🗄️"
    desc: >
      RDS to managed relational database. DB Subnet Group wymagany — RDS musi być w przynajmniej 2 AZ.
      Security Group oddzielna od aplikacji — dostęp tylko z warstwy aplikacji.
    code: |
      # Hasło do bazy w AWS Secrets Manager (nie w kodzie)
      resource "random_password" "db" {
        length  = 32
        special = false
      }

      resource "aws_secretsmanager_secret" "db_password" {
        name = "rds/postgres/master-password"
      }

      resource "aws_secretsmanager_secret_version" "db_password" {
        secret_id     = aws_secretsmanager_secret.db_password.id
        secret_string = random_password.db.result
      }

      # DB Subnet Group — wymagane przez RDS
      resource "aws_db_subnet_group" "main" {
        name       = "main-db-subnet"
        subnet_ids = aws_subnet.private[*].id

        tags = {
          Name = "main-db-subnet-group"
        }
      }

      # Security Group dla RDS
      resource "aws_security_group" "rds" {
        name   = "rds-sg"
        vpc_id = aws_vpc.main.id

        ingress {
          from_port       = 5432
          to_port         = 5432
          protocol        = "tcp"
          security_groups = [aws_security_group.app.id]
          description     = "PostgreSQL z warstwy aplikacji"
        }
      }

      # Parameter Group — konfiguracja PostgreSQL
      resource "aws_db_parameter_group" "postgres" {
        family = "postgres15"
        name   = "custom-postgres15"

        parameter {
          name  = "log_connections"
          value = "1"
        }

        parameter {
          name  = "log_min_duration_statement"
          value = "1000"
        }
      }

      # Instancja RDS PostgreSQL
      resource "aws_db_instance" "main" {
        identifier        = "main-postgres"
        engine            = "postgres"
        engine_version    = "15.4"
        instance_class    = "db.t3.micro"
        allocated_storage = 20
        storage_type      = "gp3"
        storage_encrypted = true

        db_name  = "appdb"
        username = "postgres"
        password = random_password.db.result

        db_subnet_group_name   = aws_db_subnet_group.main.name
        vpc_security_group_ids = [aws_security_group.rds.id]
        parameter_group_name   = aws_db_parameter_group.postgres.name

        backup_retention_period = 7
        backup_window           = "03:00-04:00"
        maintenance_window      = "Mon:04:00-Mon:05:00"

        multi_az               = true   # HA — automatyczny failover
        deletion_protection    = true   # nie pozwól skasować przez pomyłkę
        skip_final_snapshot    = false
        final_snapshot_identifier = "main-postgres-final"

        tags = {
          Name = "main-postgres"
        }
      }

  - name: "AWS — IAM"
    icon: "🔐"
    desc: >
      IAM zarządza dostępem do zasobów AWS. Zasada najmniejszych uprawnień — dawaj
      tylko to co potrzebne. Role dla EC2/Lambda, Users dla ludzi/CI.
    code: |
      # Rola IAM dla EC2 (Instance Profile)
      resource "aws_iam_role" "ec2_role" {
        name = "ec2-app-role"

        # Trust policy — kto może assume tę rolę
        assume_role_policy = jsonencode({
          Version = "2012-10-17"
          Statement = [
            {
              Effect    = "Allow"
              Principal = { Service = "ec2.amazonaws.com" }
              Action    = "sts:AssumeRole"
            }
          ]
        })

        tags = {
          Name = "ec2-app-role"
        }
      }

      # Policy — dostęp tylko do S3 assets
      resource "aws_iam_policy" "s3_read" {
        name        = "s3-assets-read"
        description = "Odczyt z bucketa assets"

        policy = jsonencode({
          Version = "2012-10-17"
          Statement = [
            {
              Effect   = "Allow"
              Action   = ["s3:GetObject", "s3:ListBucket"]
              Resource = [
                aws_s3_bucket.assets.arn,
                "${aws_s3_bucket.assets.arn}/*"
              ]
            }
          ]
        })
      }

      # Dołącz policy do roli
      resource "aws_iam_role_policy_attachment" "ec2_s3" {
        role       = aws_iam_role.ec2_role.name
        policy_arn = aws_iam_policy.s3_read.arn
      }

      # Dołącz managed policy (SSM Session Manager — brak SSH)
      resource "aws_iam_role_policy_attachment" "ec2_ssm" {
        role       = aws_iam_role.ec2_role.name
        policy_arn = "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
      }

      # Instance Profile — potrzebny żeby przypiąć rolę do EC2
      resource "aws_iam_instance_profile" "ec2" {
        name = "ec2-app-profile"
        role = aws_iam_role.ec2_role.name
      }

      # Użytkownik CI/CD z kluczami API
      resource "aws_iam_user" "ci_cd" {
        name = "ci-cd-deploy"
        path = "/system/"
      }

      resource "aws_iam_access_key" "ci_cd" {
        user = aws_iam_user.ci_cd.name
      }

      output "ci_cd_access_key" {
        value     = aws_iam_access_key.ci_cd.id
        sensitive = false
      }

      output "ci_cd_secret_key" {
        value     = aws_iam_access_key.ci_cd.secret
        sensitive = true  # nie pokazuj w logach
      }

  - name: Kubernetes Provider
    icon: "☸️"
    desc: >
      Terraform zarządza zasobami Kubernetes tak samo jak chmurą. Provider wymaga połączenia
      z klastrem — przez kubeconfig lub bezpośrednie dane z EKS/GKE.
    code: |
      # Provider Kubernetes — połączenie z EKS
      provider "kubernetes" {
        host                   = aws_eks_cluster.main.endpoint
        cluster_ca_certificate = base64decode(aws_eks_cluster.main.certificate_authority[0].data)

        exec {
          api_version = "client.authentication.k8s.io/v1beta1"
          args        = ["eks", "get-token", "--cluster-name", aws_eks_cluster.main.name]
          command     = "aws"
        }
      }

      # Namespace
      resource "kubernetes_namespace" "app" {
        metadata {
          name = "my-app"
          labels = {
            "app.kubernetes.io/managed-by" = "terraform"
          }
        }
      }

      # Deployment
      resource "kubernetes_deployment" "app" {
        metadata {
          name      = "my-app"
          namespace = kubernetes_namespace.app.metadata[0].name
        }

        spec {
          replicas = 3

          selector {
            match_labels = {
              app = "my-app"
            }
          }

          template {
            metadata {
              labels = {
                app = "my-app"
              }
            }

            spec {
              container {
                name  = "app"
                image = "nginx:1.25"

                port {
                  container_port = 80
                }

                resources {
                  limits = {
                    cpu    = "500m"
                    memory = "256Mi"
                  }
                  requests = {
                    cpu    = "100m"
                    memory = "128Mi"
                  }
                }
              }
            }
          }
        }
      }

      # Service LoadBalancer
      resource "kubernetes_service" "app" {
        metadata {
          name      = "my-app"
          namespace = kubernetes_namespace.app.metadata[0].name
        }

        spec {
          selector = {
            app = "my-app"
          }

          port {
            port        = 80
            target_port = 80
          }

          type = "LoadBalancer"
        }
      }

  - name: Locals i expressions
    icon: "🧮"
    desc: >
      Locals to lokalne zmienne obliczane jeden raz i wielokrotnie używane. Funkcje wbudowane
      pozwalają na transformacje danych — string, lista, mapa, CIDR, JSON.
    code: |
      # Locals — obliczenia lokalne
      locals {
        # Prosta wartość
        env     = var.environment
        region  = var.aws_region
        prefix  = "${var.project}-${var.environment}"

        # Tagi wspólne dla wszystkich zasobów
        common_tags = {
          Project     = var.project
          Environment = var.environment
          ManagedBy   = "terraform"
          Owner       = var.owner
        }

        # Obliczenia na listach
        azs_count = length(data.aws_availability_zones.available.names)

        # Merge tagów
        instance_tags = merge(local.common_tags, {
          Name = "${local.prefix}-web"
          Tier = "application"
        })

        # CIDR subneting
        public_cidrs  = [for i in range(3) : cidrsubnet(var.vpc_cidr, 8, i)]
        private_cidrs = [for i in range(3) : cidrsubnet(var.vpc_cidr, 8, i + 10)]
      }

      # Funkcje wbudowane — przykłady
      locals {
        # join — lista do stringa
        sg_name = join("-", [var.project, var.env, "sg"])

        # upper / lower
        env_upper = upper(var.environment)

        # lookup — wartość z mapy z defaultem
        instance_type = lookup(var.instance_types, var.environment, "t3.micro")

        # toset — konwertuj listę na set (unikalne wartości)
        unique_regions = toset(var.regions)

        # coalesce — pierwsza niepusta wartość
        bucket_name = coalesce(var.custom_bucket_name, "${var.project}-${var.env}-bucket")

        # format — formatowanie stringa
        db_identifier = format("%s-%s-postgres", var.project, var.environment)

        # jsonencode — mapa do JSON stringa
        policy_json = jsonencode({
          Version   = "2012-10-17"
          Statement = []
        })
      }

      # Użycie locals
      resource "aws_instance" "web" {
        ami           = data.aws_ami.amazon_linux.id
        instance_type = local.instance_type

        tags = local.instance_tags
      }

  - name: Dynamic blocks
    icon: "🔄"
    desc: >
      Dynamic block generuje powtarzające się bloki konfiguracji z listy lub mapy.
      Zastępuje duplikację kodu — jeden wzorzec dla wielu reguł.
    code: |
      # Dynamiczny Security Group z listą reguł
      variable "sg_ingress_rules" {
        type = list(object({
          port        = number
          protocol    = string
          cidr        = string
          description = string
        }))
        default = [
          { port = 80,  protocol = "tcp", cidr = "0.0.0.0/0", description = "HTTP" },
          { port = 443, protocol = "tcp", cidr = "0.0.0.0/0", description = "HTTPS" },
          { port = 22,  protocol = "tcp", cidr = "10.0.0.0/8", description = "SSH wewnetrzny" }
        ]
      }

      resource "aws_security_group" "dynamic" {
        name   = "dynamic-sg"
        vpc_id = aws_vpc.main.id

        # Dynamic block — generuje ingress dla każdej reguły
        dynamic "ingress" {
          for_each = var.sg_ingress_rules
          content {
            from_port   = ingress.value.port
            to_port     = ingress.value.port
            protocol    = ingress.value.protocol
            cidr_blocks = [ingress.value.cidr]
            description = ingress.value.description
          }
        }

        egress {
          from_port   = 0
          to_port     = 0
          protocol    = "-1"
          cidr_blocks = ["0.0.0.0/0"]
        }
      }

      # Dynamic tags (jeśli provider wymaga osobnych bloków)
      resource "aws_autoscaling_group" "web" {
        name               = "web-asg"
        desired_capacity   = 2
        max_size           = 5
        min_size           = 1
        vpc_zone_identifier = aws_subnet.private[*].id

        launch_template {
          id      = aws_launch_template.web.id
          version = "$Latest"
        }

        # Dynamic tag bloki dla ASG
        dynamic "tag" {
          for_each = local.common_tags
          content {
            key                 = tag.key
            value               = tag.value
            propagate_at_launch = true
          }
        }
      }
