labels:
  main: Współbieżność w Go
  mainLang: go

intro:
  title: Goroutines i channels
  desc: >
    Współbieżność to pierwszoklasowy obywatel Go — wbudowana w język, nie w bibliotekę.
    Goroutine to lekki wątek zarządzany przez Go runtime. Koszt: ~2KB stack (vs MB dla OS thread).
    Motto Go: "Do not communicate by sharing memory; instead, share memory by communicating."
    Channels to pipes łączące goroutines — bezpieczna komunikacja bez locków.

items:
  - title: Goroutines — uruchamianie
    desc: >
      Słowo kluczowe go przed wywołaniem funkcji uruchamia goroutine.
      Goroutines są współbieżne, nie koniecznie równoległe — runtime Go decyduje.
      Program kończy się gdy main() wraca — goroutines są zatrzymywane.
    code: |
      package main

      import (
          "fmt"
          "time"
      )

      func printNumbers(id int) {
          for i := 1; i <= 3; i++ {
              fmt.Printf("goroutine %d: %d\n", id, i)
              time.Sleep(100 * time.Millisecond)
          }
      }

      func main() {
          // Uruchom 3 goroutines jednocześnie
          go printNumbers(1)
          go printNumbers(2)
          go printNumbers(3)

          // Funkcja anonimowa jako goroutine
          go func(msg string) {
              fmt.Println("Anonimowa goroutine:", msg)
          }("hello")

          // Czekaj żeby goroutines zdążyły się wykonać
          // (w praktyce użyj WaitGroup lub channel)
          time.Sleep(500 * time.Millisecond)
          fmt.Println("Koniec main")
      }
    lang: go

  - title: Channels — komunikacja między goroutines
    desc: >
      Channel to kolejka FIFO łącząca goroutines.
      ch := make(chan int) — unbuffered: wysyłający blokuje do momentu odebrania.
      ch := make(chan int, 10) — buffered: wysyłający blokuje dopiero gdy bufor pełny.
      close(ch) sygnalizuje że nie będzie więcej danych.
    code: |
      package main

      import (
          "fmt"
          "time"
      )

      func generator(nums ...int) <-chan int {
          out := make(chan int)
          go func() {
              for _, n := range nums {
                  out <- n          // wyślij do channel
                  time.Sleep(50 * time.Millisecond)
              }
              close(out)            // zamknij — brak nowych danych
          }()
          return out
      }

      func square(in <-chan int) <-chan int {
          out := make(chan int)
          go func() {
              for n := range in {   // range po channel — kończy się na close()
                  out <- n * n
              }
              close(out)
          }()
          return out
      }

      func main() {
          // Pipeline: generator -> square -> wydruk
          nums := generator(2, 3, 4, 5)
          squares := square(nums)

          for result := range squares {
              fmt.Println(result) // 4, 9, 16, 25
          }

          // Buffered channel
          ch := make(chan string, 3)
          ch <- "pierwszy"   // nie blokuje (bufor wolny)
          ch <- "drugi"
          ch <- "trzeci"
          // ch <- "czwarty"  // BLOKUJE — bufor pełny!

          fmt.Println(<-ch) // pierwszy
          fmt.Println(<-ch) // drugi
      }
    lang: go

  - title: sync.WaitGroup — czekanie na goroutines
    desc: >
      WaitGroup pozwala czekać na zakończenie grupy goroutines.
      Add(n) — dodaj n do licznika; Done() — odejmij 1; Wait() — blokuj do 0.
      Defer wg.Done() gwarantuje wywołanie nawet przy panice.
    code: |
      package main

      import (
          "fmt"
          "sync"
          "time"
      )

      func worker(id int, wg *sync.WaitGroup) {
          defer wg.Done() // wykona się na końcu funkcji

          fmt.Printf("Worker %d: start\n", id)
          time.Sleep(time.Duration(id) * 100 * time.Millisecond)
          fmt.Printf("Worker %d: koniec\n", id)
      }

      func fetchURLs(urls []string) []string {
          var (
              wg      sync.WaitGroup
              mu      sync.Mutex
              results []string
          )

          for _, url := range urls {
              wg.Add(1)
              go func(u string) {
                  defer wg.Done()
                  // symulacja pobierania
                  result := "OK: " + u
                  mu.Lock()         // chroni slice przed race condition
                  results = append(results, result)
                  mu.Unlock()
              }(url)
          }

          wg.Wait() // poczekaj na wszystkie goroutines
          return results
      }

      func main() {
          var wg sync.WaitGroup

          for i := 1; i <= 5; i++ {
              wg.Add(1)
              go worker(i, &wg)
          }

          wg.Wait() // blokuj do zakończenia wszystkich
          fmt.Println("Wszyscy workers zakończyli")

          urls := []string{"api.com/1", "api.com/2", "api.com/3"}
          results := fetchURLs(urls)
          fmt.Println(results)
      }
    lang: go

  - title: select — multipleksowanie channels
    desc: >
      select czeka na pierwszą gotową operację z wielu channels — jak switch dla channels.
      default case sprawia że select nie blokuje — polling bez blokowania.
      Timeout przez time.After — elegancki wzorzec bez zewnętrznych timererów.
    code: |
      package main

      import (
          "fmt"
          "time"
      )

      func main() {
          ch1 := make(chan string)
          ch2 := make(chan string)

          go func() {
              time.Sleep(100 * time.Millisecond)
              ch1 <- "jeden"
          }()
          go func() {
              time.Sleep(200 * time.Millisecond)
              ch2 <- "dwa"
          }()

          // select czeka na pierwszą gotową operację
          for i := 0; i < 2; i++ {
              select {
              case msg1 := <-ch1:
                  fmt.Println("Z ch1:", msg1)
              case msg2 := <-ch2:
                  fmt.Println("Z ch2:", msg2)
              }
          }

          // Timeout pattern
          ch := make(chan int)
          go func() {
              time.Sleep(2 * time.Second) // wolna operacja
              ch <- 42
          }()

          select {
          case result := <-ch:
              fmt.Println("Wynik:", result)
          case <-time.After(1 * time.Second):
              fmt.Println("Timeout! Operacja trwała za długo.")
          }

          // Non-blocking receive z default
          select {
          case msg := <-ch:
              fmt.Println("Wiadomość:", msg)
          default:
              fmt.Println("Brak wiadomości — nie blokuję")
          }
      }
    lang: go

  - title: Worker pool — pula workerów
    desc: >
      Worker pool ogranicza liczbę równolegle działających goroutines — kontrola zasobów.
      N workerów czyta zadania z jednego channelu, wyniki piszą do drugiego.
      Klasyczny wzorzec do przetwarzania wsadowego bez zalewania systemu (np. limit połączeń DB/HTTP).
    code: |
      package main

      import (
          "fmt"
          "sync"
      )

      // Worker czyta zadania aż do zamknięcia channelu jobs
      func worker(id int, jobs <-chan int, results chan<- int, wg *sync.WaitGroup) {
          defer wg.Done()
          for j := range jobs {
              results <- j * j // przetwórz zadanie i wyślij wynik
          }
      }

      func main() {
          const numJobs = 9
          jobs := make(chan int, numJobs)
          results := make(chan int, numJobs)

          var wg sync.WaitGroup

          // Uruchom 3 workerów — max 3 zadania naraz
          for w := 1; w <= 3; w++ {
              wg.Add(1)
              go worker(w, jobs, results, &wg)
          }

          // Wyślij zadania, potem zamknij — sygnał "koniec"
          for j := 1; j <= numJobs; j++ {
              jobs <- j
          }
          close(jobs)

          // Zamknij results dopiero gdy wszyscy workerzy skończą
          go func() {
              wg.Wait()
              close(results)
          }()

          sum := 0
          for r := range results { // range kończy się na close(results)
              sum += r
          }
          fmt.Println("Suma kwadratów 1..9:", sum) // 285
      }
    lang: go

  - title: sync.Mutex i sync.RWMutex
    desc: >
      Mutex (mutual exclusion) chroni shared data przed równoczesnym dostępem.
      Lock() blokuje dostęp; Unlock() zwalnia. Zawsze defer Unlock().
      RWMutex pozwala na wielu czytelników jednocześnie, ale tylko jednego pisarza.
    code: |
      package main

      import (
          "fmt"
          "sync"
      )

      // Thread-safe cache z RWMutex
      type Cache struct {
          mu    sync.RWMutex
          items map[string]string
      }

      func NewCache() *Cache {
          return &Cache{items: make(map[string]string)}
      }

      // Zapis — wyłączny lock
      func (c *Cache) Set(key, value string) {
          c.mu.Lock()
          defer c.mu.Unlock()
          c.items[key] = value
      }

      // Odczyt — wiele goroutines może czytać jednocześnie
      func (c *Cache) Get(key string) (string, bool) {
          c.mu.RLock()
          defer c.mu.RUnlock()
          v, ok := c.items[key]
          return v, ok
      }

      func main() {
          cache := NewCache()
          var wg sync.WaitGroup

          // Równoczesne zapisy i odczyty
          for i := 0; i < 10; i++ {
              wg.Add(2)
              go func(n int) {
                  defer wg.Done()
                  cache.Set(fmt.Sprintf("key-%d", n), fmt.Sprintf("val-%d", n))
              }(i)
              go func(n int) {
                  defer wg.Done()
                  if v, ok := cache.Get(fmt.Sprintf("key-%d", n)); ok {
                      fmt.Printf("key-%d = %s\n", n, v)
                  }
              }(i)
          }
          wg.Wait()
      }
    lang: go

  - title: context.Context — anulowanie i timeout
    desc: >
      Context przenosi deadline, anulowanie i wartości przez drzewo wywołań.
      Przekazuj context jako pierwszy argument każdej funkcji (konwencja Go).
      WithCancel, WithTimeout, WithDeadline — trzy sposoby kontroli czasu życia.
    code: |
      package main

      import (
          "context"
          "fmt"
          "time"
      )

      // Symulacja wolnego zapytania do bazy danych
      func queryDB(ctx context.Context, query string) (string, error) {
          // Sprawdź czy context już anulowany
          select {
          case <-ctx.Done():
              return "", ctx.Err()
          default:
          }

          // Symulacja operacji
          done := make(chan string, 1)
          go func() {
              time.Sleep(500 * time.Millisecond) // wolne zapytanie
              done <- "wynik: " + query
          }()

          select {
          case result := <-done:
              return result, nil
          case <-ctx.Done():
              return "", fmt.Errorf("zapytanie anulowane: %w", ctx.Err())
          }
      }

      func main() {
          // WithTimeout — automatyczne anulowanie po czasie
          ctx, cancel := context.WithTimeout(context.Background(), 1*time.Second)
          defer cancel() // zawsze wywołaj cancel!

          result, err := queryDB(ctx, "SELECT * FROM users")
          if err != nil {
              fmt.Println("Błąd:", err)
          } else {
              fmt.Println(result)
          }

          // WithCancel — ręczne anulowanie
          ctx2, cancel2 := context.WithCancel(context.Background())

          go func() {
              time.Sleep(200 * time.Millisecond)
              cancel2() // anuluj po 200ms
          }()

          _, err = queryDB(ctx2, "SELECT * FROM orders")
          if err != nil {
              fmt.Println("Anulowane:", err)
          }
      }
    lang: go
