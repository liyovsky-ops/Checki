labels:
  main: HTTP serwer i REST API
  mainLang: go

intro:
  title: HTTP w Go
  desc: >
    Standardowa biblioteka net/http jest wyjątkowo bogata — można zbudować produkcyjne API bez żadnych frameworków.
    Handler to funkcja przyjmująca ResponseWriter i *Request — prosta konwencja.
    Mux (multiplexer) routuje requesty do odpowiednich handlerów na podstawie ścieżki.
    Frameworki jak Gin, Echo, chi dodają routing z parametrami, middleware i convenience — nie są konieczne.

items:
  - title: Podstawowy HTTP serwer
    desc: >
      net/http zawiera wszystko co potrzeba do HTTP serwera.
      http.HandleFunc rejestruje handler dla ścieżki.
      http.ListenAndServe startuje serwer — blokuje do błędu.
      Graceful shutdown przez context i os.Signal.
    code: |
      package main

      import (
          "context"
          "fmt"
          "log"
          "net/http"
          "os"
          "os/signal"
          "syscall"
          "time"
      )

      func helloHandler(w http.ResponseWriter, r *http.Request) {
          fmt.Fprintf(w, "Hello, World!")
      }

      func echoHandler(w http.ResponseWriter, r *http.Request) {
          // Odczytaj query params
          name := r.URL.Query().Get("name")
          if name == "" {
              name = "anonymous"
          }
          w.Header().Set("Content-Type", "text/plain")
          fmt.Fprintf(w, "Echo: %s\n", name)
      }

      func main() {
          mux := http.NewServeMux()
          mux.HandleFunc("GET /", helloHandler)
          mux.HandleFunc("GET /echo", echoHandler)

          srv := &http.Server{
              Addr:         ":8080",
              Handler:      mux,
              ReadTimeout:  5 * time.Second,
              WriteTimeout: 10 * time.Second,
              IdleTimeout:  60 * time.Second,
          }

          // Graceful shutdown
          go func() {
              quit := make(chan os.Signal, 1)
              signal.Notify(quit, syscall.SIGINT, syscall.SIGTERM)
              <-quit

              ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
              defer cancel()
              srv.Shutdown(ctx)
          }()

          log.Printf("Serwer na :8080")
          if err := srv.ListenAndServe(); err != http.ErrServerClosed {
              log.Fatal(err)
          }
      }
    lang: go

  - title: JSON API — encode/decode
    desc: >
      encoding/json obsługuje serializację (Marshal) i deserializację (Unmarshal).
      json.NewDecoder(r.Body) — wydajniejsze dla dużych payloadów niż ReadAll + Unmarshal.
      Struct tags json:"name" kontrolują nazwy pól w JSON.
    code: |
      package main

      import (
          "encoding/json"
          "log"
          "net/http"
          "strconv"
          "sync"
      )

      type User struct {
          ID    int    `json:"id"`
          Name  string `json:"name"`
          Email string `json:"email"`
      }

      var (
          users  = make(map[int]User)
          mu     sync.RWMutex
          nextID = 1
      )

      func writeJSON(w http.ResponseWriter, status int, v any) {
          w.Header().Set("Content-Type", "application/json")
          w.WriteHeader(status)
          json.NewEncoder(w).Encode(v)
      }

      func getUsers(w http.ResponseWriter, r *http.Request) {
          mu.RLock()
          defer mu.RUnlock()
          list := make([]User, 0, len(users))
          for _, u := range users {
              list = append(list, u)
          }
          writeJSON(w, http.StatusOK, list)
      }

      func createUser(w http.ResponseWriter, r *http.Request) {
          var u User
          if err := json.NewDecoder(r.Body).Decode(&u); err != nil {
              http.Error(w, "Nieprawidłowy JSON", http.StatusBadRequest)
              return
          }
          mu.Lock()
          u.ID = nextID
          nextID++
          users[u.ID] = u
          mu.Unlock()
          writeJSON(w, http.StatusCreated, u)
      }

      func getUser(w http.ResponseWriter, r *http.Request) {
          id, err := strconv.Atoi(r.PathValue("id")) // Go 1.22+
          if err != nil {
              http.Error(w, "Nieprawidłowe ID", http.StatusBadRequest)
              return
          }
          mu.RLock()
          u, ok := users[id]
          mu.RUnlock()
          if !ok {
              http.Error(w, "Nie znaleziono", http.StatusNotFound)
              return
          }
          writeJSON(w, http.StatusOK, u)
      }

      func main() {
          mux := http.NewServeMux()
          mux.HandleFunc("GET /users", getUsers)
          mux.HandleFunc("POST /users", createUser)
          mux.HandleFunc("GET /users/{id}", getUser) // Go 1.22+ pattern

          log.Println("API na :8080")
          log.Fatal(http.ListenAndServe(":8080", mux))
      }
    lang: go

  - title: Middleware pattern
    desc: >
      Middleware to funkcja owijająca handler — dodaje zachowanie przed/po obsłudze requestu.
      Wzorzec: func(http.Handler) http.Handler. Układa się w łańcuch.
      Typowe middleware: logowanie, auth, CORS, rate limiting, recovery po panice.
    code: |
      package main

      import (
          "log"
          "net/http"
          "time"
      )

      // Logger middleware
      func Logger(next http.Handler) http.Handler {
          return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
              start := time.Now()
              next.ServeHTTP(w, r)
              log.Printf("%s %s %v", r.Method, r.URL.Path, time.Since(start))
          })
      }

      // Auth middleware — sprawdź Bearer token
      func Auth(next http.Handler) http.Handler {
          return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
              token := r.Header.Get("Authorization")
              if token != "Bearer secret-token" {
                  http.Error(w, "Unauthorized", http.StatusUnauthorized)
                  return
              }
              next.ServeHTTP(w, r)
          })
      }

      // Recovery middleware — łapie panikę
      func Recovery(next http.Handler) http.Handler {
          return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
              defer func() {
                  if err := recover(); err != nil {
                      log.Printf("PANIKA: %v", err)
                      http.Error(w, "Internal Server Error", http.StatusInternalServerError)
                  }
              }()
              next.ServeHTTP(w, r)
          })
      }

      // Łączenie middleware (chain)
      func Chain(h http.Handler, middlewares ...func(http.Handler) http.Handler) http.Handler {
          for i := len(middlewares) - 1; i >= 0; i-- {
              h = middlewares[i](h)
          }
          return h
      }

      func main() {
          mux := http.NewServeMux()

          // Publiczne endpointy
          mux.HandleFunc("GET /health", func(w http.ResponseWriter, r *http.Request) {
              w.Write([]byte("OK"))
          })

          // Chronione endpointy — z auth
          protected := http.NewServeMux()
          protected.HandleFunc("GET /api/data", func(w http.ResponseWriter, r *http.Request) {
              w.Write([]byte(`{"data": "sekret"}`))
          })

          mux.Handle("/api/", Chain(protected, Auth, Logger))

          // Cały serwer z Recovery i Logger
          handler := Chain(mux, Recovery, Logger)
          log.Fatal(http.ListenAndServe(":8080", handler))
      }
    lang: go

  - title: Frameworki HTTP — Gin, Echo, chi
    desc: >
      Stdlib net/http wystarczy do 80% przypadków.
      Frameworki dodają: routing z parametrami URL, automatyczne bindowanie JSON, middleware stack, walidację.
      chi — lekki, 100% kompatybilny ze stdlib. Gin/Echo — szybsze, bogatsze API, ale własny ekosystem.
    code: |
      // === GIN ===
      // go get github.com/gin-gonic/gin
      package main

      import (
          "net/http"
          "github.com/gin-gonic/gin"
      )

      type CreateUserRequest struct {
          Name  string `json:"name" binding:"required"`
          Email string `json:"email" binding:"required,email"`
      }

      func main() {
          r := gin.Default() // Logger + Recovery middleware

          // Grupowanie routów
          api := r.Group("/api/v1")
          {
              api.GET("/users", func(c *gin.Context) {
                  c.JSON(http.StatusOK, gin.H{"users": []string{}})
              })

              api.POST("/users", func(c *gin.Context) {
                  var req CreateUserRequest
                  if err := c.ShouldBindJSON(&req); err != nil {
                      c.JSON(http.StatusBadRequest, gin.H{"error": err.Error()})
                      return
                  }
                  c.JSON(http.StatusCreated, gin.H{"name": req.Name})
              })

              // Parametry URL
              api.GET("/users/:id", func(c *gin.Context) {
                  id := c.Param("id")
                  c.JSON(http.StatusOK, gin.H{"id": id})
              })
          }

          r.Run(":8080")
      }

      // === CHI — stdlib-kompatybilny ===
      // go get github.com/go-chi/chi/v5
      /*
      r := chi.NewRouter()
      r.Use(middleware.Logger)
      r.Use(middleware.Recoverer)

      r.Get("/users/{id}", func(w http.ResponseWriter, r *http.Request) {
          id := chi.URLParam(r, "id")
          json.NewEncoder(w).Encode(map[string]string{"id": id})
      })
      http.ListenAndServe(":8080", r)
      */
    lang: go
