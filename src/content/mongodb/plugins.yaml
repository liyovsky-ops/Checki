title: Ekosystem MongoDB

items:
  - name: MongoDB Atlas
    desc: Managed MongoDB w chmurze — auto-scaling, backup, monitoring, serverless tier. Zero ops. AWS, GCP, Azure. Free tier (512MB) na start.
    icon: "☁️"
  - name: Mongoose (Node.js ODM)
    desc: Object Data Modeling dla Node.js — schema definition, validation, middleware, population (join-like). Standard ODM dla MongoDB + Node.
    icon: "🍃"
  - name: Motor (Python async driver)
    desc: Asynchroniczny driver MongoDB dla Python (asyncio/Tornado). Non-blocking I/O. Idealne z FastAPI/Starlette. API kompatybilne z PyMongo.
    icon: "⚡"
  - name: MongoDB Compass
    desc: GUI do MongoDB — przeglądaj kolekcje, buduj queries wizualnie, analizuj indeksy, explain plans. Darmowy desktop app.
    icon: "🧭"
  - name: Mongosh
    desc: Nowoczesny MongoDB Shell — JavaScript REPL do interakcji z bazą. Snippets, autocompletion, syntax highlighting. Zastąpił legacy mongo shell.
    icon: "💻"
  - name: MongoDB Charts
    desc: Wizualizacja danych bezpośrednio z MongoDB — dashboardy, wykresy, mapy bez ETL. Wbudowany w Atlas.
    icon: "📊"
  - name: Change Streams
    desc: Nasłuchuj na zmiany w kolekcji w real-time — INSERT, UPDATE, DELETE jako eventy. Idealne do CDC, notyfikacji, sync. Wymaga Replica Set.
    icon: "📡"
  - name: Realm / Device Sync
    desc: Synchronizacja danych między mobile/edge a Atlas. Offline-first — app działa bez internetu, sync gdy jest połączenie.
    icon: "📱"
