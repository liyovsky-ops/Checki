title: Ekosystem Next.js

items:
  - name: Vercel
    desc: Platforma deploymentu od twórców Next.js. Zero-config deploy, preview deploys na każdy PR, edge functions, analytics, speed insights. git push = deploy.
    icon: "▲"
  - name: next-auth (Auth.js)
    desc: Autentykacja dla Next.js — OAuth (Google, GitHub, Discord), JWT, session, credentials. Jedno API route, dziesiątki providerów. Nowy Auth.js (v5) = framework-agnostic.
    icon: "🔐"
  - name: Prisma
    desc: Type-safe ORM dla TypeScript. Schema-first (schema.prisma), auto-generated client, migracje. Idealny do Next.js API Routes i Server Components.
    icon: "◈"
  - name: tRPC
    desc: End-to-end type-safe API bez code generation. Definiujesz procedures na serwerze, wywołujesz z klienta z pełnym autocomplete. Zero REST, zero GraphQL.
    icon: "🔷"
  - name: Tailwind CSS
    desc: Utility-first CSS framework. Wbudowany w create-next-app. className="flex items-center gap-4" zamiast custom CSS. JIT compiler, responsive, dark mode.
    icon: "🌊"
  - name: shadcn/ui
    desc: Komponenty UI do kopiowania (nie install). Radix UI + Tailwind. Button, Dialog, Dropdown, Toast — piękne, dostępne, customizowalne. Nie jest biblioteką — kopiujesz kod.
    icon: "🎨"
  - name: next-intl
    desc: Internacjonalizacja (i18n) dla Next.js App Router. Tłumaczenia, formatowanie dat/liczb, routing per locale. Server Components friendly.
    icon: "🌍"
  - name: next-mdx-remote
    desc: Renderowanie MDX (Markdown + JSX) w Next.js. Idealne do blogów, dokumentacji. Fetch MDX z CMS, renderuj jako React components.
    icon: "📝"
