title: App Router — routing oparty na plikach

items:
  - name: Struktura app/ directory
    desc: >
      App Router (Next.js 13+) zastąpił pages/. Każdy folder w app/ = segment URL.
      page.tsx = strona, layout.tsx = wrapper, loading.tsx = suspense fallback,
      error.tsx = error boundary, not-found.tsx = 404.
    code: |
      app/
        layout.tsx          ← root layout (html, body, navbar)
        page.tsx            ← strona główna (/)
        loading.tsx         ← skeleton podczas ładowania
        error.tsx           ← error boundary
        not-found.tsx       ← custom 404

        about/
          page.tsx          ← /about

        blog/
          page.tsx          ← /blog
          [slug]/
            page.tsx        ← /blog/my-post (dynamiczny)

        dashboard/
          layout.tsx        ← layout tylko dla dashboard
          page.tsx          ← /dashboard
          settings/
            page.tsx        ← /dashboard/settings

        (marketing)/        ← route group (nie wpływa na URL)
          pricing/
            page.tsx        ← /pricing (nie /marketing/pricing)

  - name: Layouts — współdzielony UI
    desc: >
      layout.tsx owija stronę i zachowuje state między nawigacjami.
      Root layout jest wymagany (html + body). Nested layouts komponują się automatycznie.
    code: |
      // app/layout.tsx — root layout
      import type { Metadata } from 'next'

      export const metadata: Metadata = {
        title: 'My App',
        description: 'Built with Next.js',
      }

      export default function RootLayout({
        children,
      }: {
        children: React.ReactNode
      }) {
        return (
          <html lang="pl">
            <body>
              <nav>Navbar (widoczny na każdej stronie)</nav>
              {children}
            </body>
          </html>
        )
      }

      // app/dashboard/layout.tsx — nested layout
      export default function DashboardLayout({
        children,
      }: {
        children: React.ReactNode
      }) {
        return (
          <div className="flex">
            <aside>Sidebar (tylko dashboard)</aside>
            <main>{children}</main>
          </div>
        )
      }

  - name: Dynamiczne segmenty [param]
    desc: >
      Folder [nazwa] to dynamiczny segment — wartość dostępna jako param.
      [...slug] to catch-all (dowolna liczba segmentów).
      [[...slug]] to optional catch-all (matchuje też root).
    code: |
      // app/blog/[slug]/page.tsx
      export default async function BlogPost({
        params,
      }: {
        params: Promise<{ slug: string }>
      }) {
        const { slug } = await params
        return <h1>Post: {slug}</h1>
      }

      // app/shop/[...categories]/page.tsx
      // matchuje: /shop/electronics, /shop/electronics/phones, itd.
      export default async function Shop({
        params,
      }: {
        params: Promise<{ categories: string[] }>
      }) {
        const { categories } = await params
        return <h1>Kategorie: {categories.join(' > ')}</h1>
      }

  - name: Route Groups (groupowanie bez wpływu na URL)
    desc: >
      Folder (nazwa) w nawiasach grupuje pliki bez dodawania segmentu do URL.
      Przydatne do organizacji — (marketing)/pricing = /pricing, nie /marketing/pricing.
    code: |
      app/
        (marketing)/
          layout.tsx       ← layout tylko dla marketing stron
          pricing/
            page.tsx       ← /pricing
          about/
            page.tsx       ← /about

        (app)/
          layout.tsx       ← layout dla app (z sidebar)
          dashboard/
            page.tsx       ← /dashboard
          settings/
            page.tsx       ← /settings

  - name: Loading i Error states
    desc: >
      loading.tsx automatycznie wraps page w React Suspense — pokazuje skeleton
      podczas ładowania. error.tsx to error boundary — łapie błędy bez crashowania
      całej aplikacji.
    code: |
      // app/dashboard/loading.tsx
      export default function Loading() {
        return (
          <div className="animate-pulse">
            <div className="h-8 bg-gray-200 rounded w-1/3 mb-4" />
            <div className="h-4 bg-gray-200 rounded w-full mb-2" />
            <div className="h-4 bg-gray-200 rounded w-2/3" />
          </div>
        )
      }

      // app/dashboard/error.tsx
      'use client'  // error.tsx MUSI być client component

      export default function Error({
        error,
        reset,
      }: {
        error: Error
        reset: () => void
      }) {
        return (
          <div>
            <h2>Coś poszło nie tak!</h2>
            <p>{error.message}</p>
            <button onClick={reset}>Spróbuj ponownie</button>
          </div>
        )
      }
