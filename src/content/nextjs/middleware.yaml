title: Middleware, API Routes & Route Handlers

items:
  - name: Middleware — przechwytywanie requestów
    desc: >
      middleware.ts w root projektu uruchamia się PRZED każdym requestem.
      Redirect, rewrite, dodaj headers, sprawdź auth. Działa na edge (V8 isolates) —
      ultra-szybki, sub-ms. Jeden plik, matcher pattern do filtrowania ścieżek.
    code: |
      // middleware.ts
      import { NextResponse } from 'next/server'
      import type { NextRequest } from 'next/server'

      export function middleware(request: NextRequest) {
        // Auth check — redirect niezalogowanych
        const token = request.cookies.get('session')?.value
        if (!token && request.nextUrl.pathname.startsWith('/dashboard')) {
          return NextResponse.redirect(new URL('/login', request.url))
        }

        // Dodaj custom header
        const response = NextResponse.next()
        response.headers.set('x-custom-header', 'hello')
        return response
      }

      // Uruchom middleware TYLKO na tych ścieżkach
      export const config = {
        matcher: ['/dashboard/:path*', '/api/:path*'],
      }

  - name: Route Handlers — API endpoints
    desc: >
      app/api/*/route.ts to REST endpoint. Export named functions: GET, POST, PUT, DELETE.
      Pełny backend bez Express. Request i Response to Web API standards (Request, Response).
    code: |
      // app/api/users/route.ts
      import { NextResponse } from 'next/server'
      import { db } from '@/lib/db'

      export async function GET(request: Request) {
        const { searchParams } = new URL(request.url)
        const page = parseInt(searchParams.get('page') ?? '1')
        const users = await db.query('SELECT * FROM users LIMIT 20 OFFSET $1', [(page - 1) * 20])
        return NextResponse.json({ users, page })
      }

      export async function POST(request: Request) {
        const body = await request.json()
        const user = await db.insert('users', body)
        return NextResponse.json(user, { status: 201 })
      }

      // app/api/users/[id]/route.ts — dynamiczny endpoint
      export async function GET(
        request: Request,
        { params }: { params: Promise<{ id: string }> }
      ) {
        const { id } = await params
        const user = await db.findById('users', id)
        if (!user) return NextResponse.json({ error: 'Not found' }, { status: 404 })
        return NextResponse.json(user)
      }

      export async function DELETE(
        request: Request,
        { params }: { params: Promise<{ id: string }> }
      ) {
        const { id } = await params
        await db.delete('users', id)
        return new Response(null, { status: 204 })
      }

  - name: Revalidation — odświeżanie cache
    desc: >
      revalidatePath odświeża cache konkretnej strony. revalidateTag odświeża
      wszystkie fetche z danym tagiem. On-demand revalidation przez webhook.
    code: |
      // app/actions.ts
      'use server'
      import { revalidatePath, revalidateTag } from 'next/cache'

      export async function publishPost() {
        await db.insert('posts', { ... })
        revalidatePath('/blog')           // odśwież stronę /blog
        revalidateTag('posts')            // odśwież wszystkie fetche z tag 'posts'
      }

      // Fetch z tagiem
      const posts = await fetch('https://api.example.com/posts', {
        next: { tags: ['posts'] },
      })

      // Webhook: app/api/revalidate/route.ts
      export async function POST(request: Request) {
        const { secret, path } = await request.json()
        if (secret !== process.env.REVALIDATION_SECRET) {
          return NextResponse.json({ error: 'Unauthorized' }, { status: 401 })
        }
        revalidatePath(path)
        return NextResponse.json({ revalidated: true })
      }

  - name: Metadata & SEO
    desc: >
      Export metadata object lub generateMetadata function z page/layout.
      Next.js automatycznie generuje tagi meta, Open Graph, Twitter Cards, robots.txt, sitemap.
    code: |
      // Static metadata
      import type { Metadata } from 'next'

      export const metadata: Metadata = {
        title: 'Blog | My App',
        description: 'Najnowsze artykuły o technologii',
        openGraph: {
          title: 'Blog | My App',
          description: 'Najnowsze artykuły',
          images: ['/og-blog.png'],
        },
      }

      // Dynamic metadata (per strona)
      export async function generateMetadata({
        params,
      }: {
        params: Promise<{ slug: string }>
      }): Promise<Metadata> {
        const { slug } = await params
        const post = await getPost(slug)
        return {
          title: post.title,
          description: post.excerpt,
          openGraph: { images: [post.coverImage] },
        }
      }

  - name: Environment Variables
    desc: >
      Zmienne env w .env.local (gitignored). NEXT_PUBLIC_ prefix = dostępne w client.
      Bez prefixu = tylko server (Server Components, Route Handlers, middleware).
    code: |
      # .env.local
      DATABASE_URL=postgresql://...         # tylko server
      API_SECRET=sk_live_...               # tylko server
      NEXT_PUBLIC_APP_URL=https://myapp.com # client + server

      // Server Component — pełny dostęp
      const db = new Pool({ connectionString: process.env.DATABASE_URL })

      // Client Component — tylko NEXT_PUBLIC_
      const appUrl = process.env.NEXT_PUBLIC_APP_URL
      // process.env.DATABASE_URL → undefined (bezpiecznie!)
