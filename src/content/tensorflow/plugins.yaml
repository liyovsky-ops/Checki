title: Ekosystem TensorFlow

items:
  - name: TensorBoard
    desc: Wizualizacja treningu — loss curves, histogramy wag, graf modelu, profiling GPU, embedding projector. tensorboard --logdir=logs i otwierasz w przeglądarce.
    icon: "📊"
  - name: TensorFlow Hub
    desc: Repozytorium pretrenowanych modeli i warstw. Załaduj model jedną linią — hub.KerasLayer('url'). Modele do text embedding, image classification, object detection.
    icon: "🏪"
  - name: TF Serving
    desc: Produkcyjny serwer inference. REST/gRPC API, auto-batching, model versioning (wiele wersji naraz), A/B testing, warm-up. Docker-based.
    icon: "🚀"
  - name: TF Lite
    desc: Modele na mobile i edge. Konwersja + quantization (4× mniejszy model). Android, iOS, Raspberry Pi, mikrokontrolery. Delegates dla GPU/NPU.
    icon: "📱"
  - name: TF.js
    desc: ML w przeglądarce i Node.js. Zero serwera, zero latency. WebGL/WebGPU backend. Transfer learning w przeglądarce. Konwersja z Python SavedModel.
    icon: "🌐"
  - name: Keras Tuner
    desc: Automatyczny hyperparameter tuning. Random search, Bayesian optimization, Hyperband. Szuka najlepszego learning rate, liczby warstw, dropout rate.
    icon: "🎛️"
  - name: TF Extended (TFX)
    desc: End-to-end ML pipeline. ExampleGen → Transform → Trainer → Evaluator → Pusher. Produkcyjne pipeline'y z walidacją danych i modeli. Kubeflow integration.
    icon: "🔄"
  - name: TF Probability
    desc: Probabilistic programming na TensorFlow. Bayesian neural networks, VAE, normalizing flows. Uncertainty quantification — model mówi "nie wiem" zamiast zgadywać.
    icon: "🎲"
