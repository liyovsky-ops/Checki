title: Ekosystem React Native

items:
  - name: Expo SDK
    desc: >
      Oficjalny zestaw narzędzi i bibliotek native dla React Native. Expo Camera,
      Location, Notifications, FileSystem, ImagePicker, SecureStore i 50+ innych modułów.
      EAS Build buduje w chmurze bez Maca. EAS Submit wysyła do sklepów.
    icon: "⬡"

  - name: React Navigation
    desc: >
      Standardowa biblioteka nawigacji — Stack, Tab (Bottom/Top), Drawer i Material Top Tabs.
      TypeScript-first, obsługuje deep linking, nested navigators i animacje natywne.
      v6+ używa natywnego stack z react-native-screens dla optymalnej wydajności.
    icon: "🧭"

  - name: react-native-reanimated
    desc: >
      Zaawansowane animacje działające na UI thread (nie JS thread) — brak jank nawet
      przy ciężkiej logice JS. API deklaratywne z useSharedValue, useAnimatedStyle,
      withSpring, withTiming. Podstawa dla Gesture Handler i Skia.
    icon: "✨"

  - name: react-native-gesture-handler
    desc: >
      Zastępuje wbudowany system gestów RN — gesty obsługiwane na natywnym thread.
      GestureDetector, Gesture.Pan(), Gesture.Pinch(), Gesture.Tap() i composable
      gestures. Wymagany przez React Navigation i wiele bibliotek UI.
    icon: "👆"

  - name: react-native-mmkv
    desc: >
      Ultraszybki key-value storage (30× szybszy od AsyncStorage) — synchroniczny API.
      Używa MMKV od WeChat (C++). Obsługuje szyfrowanie AES-256. Idealne zastępstwo
      AsyncStorage dla tokenu auth, preferencji i stanu aplikacji.
    icon: "⚡"

  - name: react-native-svg
    desc: >
      Renderuje SVG w React Native — natywne komponenty Svg, Path, Rect, Circle, Text.
      Obsługuje gradient, clip-path i animacje przez reanimated. Niezbędny dla
      ikon wektorowych, wykresów i custom UI shapes.
    icon: "🎨"

  - name: react-native-paper
    desc: >
      Komplety zestaw komponentów Material Design 3 — Button, Card, Dialog, FAB,
      TextInput, DataTable i 40+ innych. Dark mode, custom themes, Accessible.
      Dobra baza UI dla aplikacji Android-first lub cross-platform.
    icon: "📋"

  - name: NativeWind
    desc: >
      Tailwind CSS dla React Native — używasz klas Tailwind (className) zamiast
      StyleSheet. Kompiluje klasy do StyleSheet w build time. Pełna kompatybilność
      z Expo. NativeWind v4 (2024) oparty na CSS interop.
    icon: "💨"

  - name: TanStack Query
    desc: >
      Zarządzanie stanem serwera — fetching, caching, synchronizacja i background
      updates. useQuery + useMutation obsługują loading/error/success states automatycznie.
      Działa identycznie jak na web — ten sam kod dla RN i React web.
    icon: "🔄"

  - name: Zustand
    desc: >
      Minimalistyczny global state — 1KB, bez boilerplate, bez reducerów. create() tworzy
      store, hook useStore() czyta wartości. Idealne do stanu auth, preferencji i UI.
      Persist middleware synchronizuje store z AsyncStorage lub MMKV automatycznie.
    icon: "🐻"
