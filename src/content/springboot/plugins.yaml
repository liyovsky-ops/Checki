title: Ekosystem Spring Boot

items:
  - name: Spring Security
    desc: "Kompletny framework autoryzacji i autentykacji. JWT, OAuth2, LDAP, SAML, MFA — wszystko gotowe. Integruje się natywnie z Spring MVC i Spring WebFlux."
    icon: "🔒"

  - name: Spring Data JPA
    desc: "Warstwa dostępu do danych — repozytoria bez implementacji, derived queries, paginacja, Specifications. Pod spodem Hibernate ORM z obsługą PostgreSQL, MySQL, Oracle."
    icon: "🗄️"

  - name: Spring Data Redis
    desc: "Integracja z Redis — cache, pub/sub, sesje, rate limiting. RedisTemplate i wysokopoziomowe Repository abstraction. Obsługa klastra i Sentinel."
    icon: "🔴"

  - name: "Spring Cloud Config"
    desc: "Centralne repozytorium konfiguracji dla mikroserwisów — Git backend, szyfrowanie secrets, hot-reload. Klienty pobierają config przy starcie z serwera."
    icon: "☁️"

  - name: "Spring Cloud Gateway"
    desc: "API Gateway dla mikroserwisów oparty na Reactor Netty. Routing, load balancing, rate limiting, circuit breaker, autentykacja — konfigurowalne przez YAML lub kod."
    icon: "🚪"

  - name: "Spring Cloud Eureka"
    desc: "Service discovery — mikroserwisy rejestrują się i odkrywają siebie wzajemnie. Klient Ribbon/LoadBalancer dla client-side load balancing. Część Netflix OSS."
    icon: "🔍"

  - name: Spring Actuator
    desc: "Endpointy produkcyjne — /health, /metrics, /info, /env, /beans, /mappings. Integracja z Prometheus i Micrometer. Monitoring i diagnostyka bez dodatkowego kodu."
    icon: "📊"

  - name: Spring Batch
    desc: "Framework do przetwarzania wsadowego — Jobs, Steps, ItemReader/Writer/Processor. Restart po błędzie, partycjonowanie, monitoring. Idealny dla ETL i raportów."
    icon: "⚙️"

  - name: Spring Integration
    desc: "Enterprise Integration Patterns w Javie — Message Channels, adaptery (FTP, JMS, Kafka, HTTP), transformacje. Łączy systemy bez pisania integracyjnego kodu od zera."
    icon: "🔗"

  - name: Flyway
    desc: "Migracje schematu bazy danych — wersjonowane SQL/Java skrypty wykonywane przy starcie. Śledzenie historii w tabeli flyway_schema_history. Obsługa rollback."
    icon: "🦋"

  - name: Lombok
    desc: "Eliminacja boilerplate Java — @Data, @Builder, @Slf4j, @RequiredArgsConstructor generowane przez procesor adnotacji. Zmniejsza klasy encji/DTO o 60-80%."
    icon: "🌶️"

  - name: MapStruct
    desc: "Mapowanie między obiektami (Entity↔DTO) przez procesor adnotacji. Zero reflection w runtime — generuje czysty Java kod. Szybsze i bezpieczniejsze niż ModelMapper."
    icon: "🗺️"

  - name: "Springdoc OpenAPI (Swagger)"
    desc: "Auto-generowanie dokumentacji OpenAPI 3 z kodu. Swagger UI pod /swagger-ui.html, JSON spec pod /v3/api-docs. Adnotacje @Operation, @Schema do wzbogacenia dokumentacji."
    icon: "📝"

  - name: Spring WebFlux
    desc: "Reaktywny web framework — Project Reactor, non-blocking I/O, WebClient zamiast RestTemplate. Mono<T> i Flux<T> jako typy zwracane. Dla high-throughput aplikacji."
    icon: "⚡"

  - name: Spring Kafka
    desc: "Integracja z Apache Kafka — @KafkaListener do konsumowania wiadomości, KafkaTemplate do wysyłania. Auto-konfiguracja konsumera, producenta i AdminClient."
    icon: "📨"
