labels:
  main: Testing & Bundler
  mainLang: typescript

intro:
  title: bun test + bun build — testy i bundlowanie wbudowane
  desc: >
    Bun zawiera wbudowany test runner kompatybilny z Jest — bun test nie wymaga żadnych
    zewnętrznych paczek ani konfiguracji. bun build zastępuje esbuild i Rollup do bundlowania
    bibliotek i aplikacji serwerowych. Oba narzędzia są napisane w Zig — szybsze od Node odpowiedników.

items:
  - title: bun test — podstawy
    desc: >
      bun test szuka plików *.test.ts, *.spec.ts, __tests__/*.ts i uruchamia je.
      API jest kompatybilne z Jest — describe, it, test, expect, beforeEach, afterAll.
      Zero konfiguracji, TypeScript natywnie.
    code: |
      // src/math.ts
      export function dodaj(a: number, b: number) { return a + b; }
      export function podziel(a: number, b: number) {
        if (b === 0) throw new Error("Dzielenie przez zero!");
        return a / b;
      }

      // src/math.test.ts
      import { describe, it, expect } from "bun:test";
      import { dodaj, podziel } from "./math";

      describe("dodaj()", () => {
        it("sumuje dwie liczby", () => {
          expect(dodaj(2, 3)).toBe(5);
        });

        it("działa z liczbami ujemnymi", () => {
          expect(dodaj(-1, 1)).toBe(0);
        });
      });

      describe("podziel()", () => {
        it("dzieli dwie liczby", () => {
          expect(podziel(10, 2)).toBe(5);
        });

        it("rzuca błąd przy dzieleniu przez zero", () => {
          expect(() => podziel(10, 0)).toThrow("Dzielenie przez zero!");
        });
      });

      # Uruchomienie:
      # bun test
      # bun test src/math.test.ts  (konkretny plik)
    lang: typescript

  - title: expect — asercje (kompatybilne z Jest)
    desc: >
      Bun implementuje pełne API expect() z Jest — toBe, toEqual, toThrow,
      toHaveBeenCalled, toMatchSnapshot, toContain i wiele innych.
    code: |
      import { expect, test } from "bun:test";

      test("asercje podstawowe", () => {
        // Porównanie prymitywów
        expect(1 + 1).toBe(2);
        expect("bun").toBe("bun");
        expect(true).toBeTruthy();
        expect(null).toBeNull();
        expect(undefined).toBeUndefined();

        // Porównanie obiektów (głębokie)
        expect({ a: 1, b: 2 }).toEqual({ a: 1, b: 2 });

        // Tablice
        expect([1, 2, 3]).toContain(2);
        expect([1, 2, 3]).toHaveLength(3);
        expect([1, 2, 3]).toEqual(expect.arrayContaining([1, 3]));

        // Stringi
        expect("Witaj Bun!").toContain("Bun");
        expect("hello@example.com").toMatch(/^\w+@\w+\.\w+$/);

        // Liczby
        expect(3.14159).toBeCloseTo(3.14, 2);
        expect(5).toBeGreaterThan(4);
        expect(3).toBeLessThanOrEqual(3);
      });

      test("async i Promise", async () => {
        await expect(Promise.resolve(42)).resolves.toBe(42);
        await expect(Promise.reject(new Error("ups"))).rejects.toThrow("ups");
      });
    lang: typescript

  - title: describe / beforeEach / afterAll
    desc: >
      Grupowanie testów i lifecycle hooks — identyczne z Jest.
      beforeEach/afterEach wywołane przed/po każdym teście,
      beforeAll/afterAll — raz przed/po całej grupie.
    code: |
      import { describe, it, expect, beforeEach, afterAll } from "bun:test";
      import { Database } from "bun:sqlite";

      describe("UserRepository", () => {
        let db: Database;

        // Przed każdym testem — świeża baza w pamięci
        beforeEach(() => {
          db = new Database(":memory:");
          db.run(`CREATE TABLE users (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            email TEXT UNIQUE NOT NULL
          )`);
        });

        // Po wszystkich testach — sprzątanie
        afterAll(() => {
          db.close();
        });

        it("dodaje użytkownika", () => {
          db.run("INSERT INTO users (email) VALUES (?)", ["test@example.com"]);
          const user = db.query("SELECT * FROM users").get();
          expect(user).toEqual({ id: 1, email: "test@example.com" });
        });

        it("nie dodaje duplikatów", () => {
          db.run("INSERT INTO users (email) VALUES (?)", ["dup@example.com"]);
          expect(() => {
            db.run("INSERT INTO users (email) VALUES (?)", ["dup@example.com"]);
          }).toThrow();
        });
      });
    lang: typescript

  - title: bun test --watch i coverage
    desc: >
      Tryb watch restartuje testy przy każdej zmianie pliku.
      Coverage raportuje pokrycie kodu bez dodatkowych narzędzi.
    code: |
      # Tryb watch — restartuj przy zmianie pliku
      bun test --watch

      # Pokrycie kodu (coverage)
      bun test --coverage

      # Próg minimalny ustawiasz w bunfig.toml (fail jeśli poniżej):
      #   [test]
      #   coverageThreshold = 0.8   # 80% (ułamek 0–1)

      # Uruchom konkretne testy (filtr nazwy)
      bun test --test-name-pattern "UserRepository"

      # Timeout per test (domyślnie 5000ms)
      bun test --timeout 10000

      # Równoległe uruchomienie (domyślnie sekwencyjne)
      # (Bun 1.1+) testy w tym samym pliku są sekwencyjne

      # Wynik coverage wygląda tak:
      # src/math.ts              | 100% | 100% | 100%
      # src/user.ts              |  85% |  90% |  80%
    lang: bash

  - title: bun build — bundler
    desc: >
      bun build kompiluje TypeScript/JavaScript do gotowych plików dist.
      Zastępuje esbuild i Rollup dla bibliotek i aplikacji serwerowych.
      Nie zastępuje Vite dla aplikacji frontend (brak HMR i dev server).
    code: |
      # Bundlowanie aplikacji serwerowej
      bun build ./src/index.ts \
        --outdir ./dist \
        --target bun \
        --minify

      # Bundlowanie biblioteki (ESM + CommonJS)
      bun build ./src/index.ts \
        --outdir ./dist \
        --format esm \
        --splitting            # code splitting (wiele entry points)

      # Standalone executable — plik binarny bez Node/Bun!
      bun build ./src/cli.ts \
        --outfile ./moje-narzedzie \
        --compile               # embeds Bun runtime into executable

      # Uruchomienie:
      # ./moje-narzedzie  (działa bez zainstalowanego Bun!)

      # Wiele entry points
      bun build ./src/index.ts ./src/worker.ts \
        --outdir ./dist \
        --splitting
    lang: bash

  - title: bun build — konfiguracja w kodzie
    desc: >
      bun build można wywołać z poziomu TypeScript — pełna kontrola nad procesem budowania,
      plugins API, transformacje i custom loaders.
    code: |
      // build.ts — skrypt budowania
      const wynik = await Bun.build({
        entrypoints: ["./src/index.ts"],
        outdir: "./dist",
        target: "bun",        // "bun" | "node" | "browser"
        format: "esm",        // "esm" | "cjs" | "iife"
        minify: {
          whitespace: true,
          identifiers: true,
          syntax: true,
        },
        splitting: false,
        sourcemap: "external", // "none" | "inline" | "external"
        define: {
          "process.env.NODE_ENV": JSON.stringify("production"),
          "__VERSION__": JSON.stringify("1.0.0"),
        },
        external: ["elysia", "bun:sqlite"], // nie bundluj tych paczek
      });

      if (!wynik.success) {
        console.error("Błędy budowania:");
        for (const log of wynik.logs) {
          console.error(log);
        }
        process.exit(1);
      }

      console.log(`Zbudowano ${wynik.outputs.length} plik(ów)`);
      for (const output of wynik.outputs) {
        console.log(`  ${output.path} (${output.size} bajtów)`);
      }

      # Uruchomienie:
      # bun run build.ts
    lang: typescript
