title: Ansible — Role & Szablony Jinja2

labels:
  section: Wzorzec
  example: Przykład

intro: >
  Role to mechanizm organizacji i re-używania kodu Ansible. Rola enkapsuluje tasks,
  handlers, templates, files, vars i defaults w standardowej strukturze katalogów.
  Jinja2 to silnik szablonów wbudowany w Ansible — pozwala generować dynamiczne
  konfiguracje z {{ zmiennych }}, {% if %} warunków i {% for %} pętli.
  Ansible Galaxy to centralne repozytorium ról community — tysiące gotowych ról
  do pobrania i użycia w projektach.

items:
  - name: Struktura roli
    desc: >
      Rola to katalog z określoną strukturą podkatalogów. Ansible automatycznie wczytuje
      pliki z tasks/main.yml, handlers/main.yml, defaults/main.yml, vars/main.yml, meta/main.yml.
      Pliki i szablony umieszcza się w files/ i templates/. Nie wszystkie katalogi muszą istnieć.
    code: |
      # Struktura roli nginx/
      roles/
      └── nginx/
          ├── tasks/
          │   ├── main.yml        # główna lista tasków (wymagana)
          │   ├── install.yml     # możesz importować pliki
          │   └── configure.yml
          ├── handlers/
          │   └── main.yml        # handlery (notify)
          ├── templates/
          │   └── nginx.conf.j2   # szablony Jinja2
          ├── files/
          │   └── ssl_cert.pem    # pliki statyczne
          ├── vars/
          │   └── main.yml        # zmienne (wyższy priorytet)
          ├── defaults/
          │   └── main.yml        # domyślne zmienne (najniższy priorytet)
          ├── meta/
          │   └── main.yml        # metadane, zależności
          └── README.md

      # tasks/main.yml
      ---
      - name: Install nginx
        ansible.builtin.package:
          name: nginx
          state: present

      - name: Configure nginx
        ansible.builtin.template:
          src: nginx.conf.j2
          dest: /etc/nginx/nginx.conf
        notify: Restart nginx

      # Importuj dodatkowe task files
      - name: Import SSL tasks
        ansible.builtin.import_tasks: ssl.yml
        when: nginx_ssl_enabled | bool

  - name: ansible-galaxy init — tworzenie roli
    desc: >
      ansible-galaxy init tworzy pełną strukturę katalogów roli z szablonowymi plikami.
      To szybszy sposób niż ręczne tworzenie katalogów. Galaxy to też centrum dystrybucji
      ról community — instaluj gotowe role zamiast pisać od zera.
    code: |
      # Utwórz szkielet roli
      ansible-galaxy init roles/nginx

      # Z prefiksem organizacji (Galaxy standard)
      ansible-galaxy role init mycompany.nginx

      # Zainstaluj rolę z Galaxy
      ansible-galaxy install geerlingguy.nginx

      # Zainstaluj konkretną wersję
      ansible-galaxy install geerlingguy.nginx,3.2.0

      # Zainstaluj z pliku requirements.yml
      ansible-galaxy install -r requirements.yml

      # requirements.yml — zarządzanie zależnościami
      # ---
      # roles:
      #   - name: geerlingguy.nginx
      #     version: "3.2.0"
      #   - name: geerlingguy.mysql
      #     version: "4.3.2"
      #
      # collections:
      #   - name: community.docker
      #     version: "3.4.0"
      #   - name: amazon.aws
      #     version: "7.0.0"

      # Lista zainstalowanych ról
      ansible-galaxy list

      # Usuń rolę
      ansible-galaxy remove geerlingguy.nginx

  - name: Jinja2 templates — podstawy
    desc: >
      Jinja2 to silnik szablonów w Ansible. Możesz używać zmiennych ({{ var }}),
      wyrażeń warunkowych ({%  if %}), pętli ({% for %}) i filtrów ({{ var | upper }}).
      Szablony .j2 są przetwarzane po stronie kontrolera i wysyłane jako gotowe pliki.
    code: |
      # templates/nginx.conf.j2 — przykładowy szablon
      # {{ zmienne }} — interpolacja wartości
      # {% if/for %} — logika (bloki sterujące)
      # {# komentarze #}

      {# Nginx configuration generated by Ansible #}
      {# Do not edit manually! #}

      user {{ nginx_user | default('www-data') }};
      worker_processes {{ nginx_worker_processes | default('auto') }};

      error_log /var/log/nginx/error.log {{ nginx_error_log_level | default('warn') }};
      pid       /run/nginx.pid;

      events {
          worker_connections {{ nginx_worker_connections | default(1024) }};
      }

      http {
          server_tokens off;
          sendfile      on;

          {% if nginx_compression_enabled | default(true) %}
          gzip on;
          gzip_types text/plain text/css application/json application/javascript;
          gzip_min_length 1000;
          {% endif %}

          {% for vhost in nginx_vhosts %}
          server {
              listen {{ vhost.port | default(80) }};
              server_name {{ vhost.server_name }};
              root {{ vhost.root }};

              {% if vhost.ssl is defined and vhost.ssl %}
              listen 443 ssl;
              ssl_certificate     {{ vhost.ssl_cert }};
              ssl_certificate_key {{ vhost.ssl_key }};
              {% endif %}
          }
          {% endfor %}
      }

  - name: Filtry Jinja2
    desc: >
      Filtry transformują wartości zmiennych w szablonach i playbootach.
      Ansible dodaje własne filtry do standardowych filtrów Jinja2.
      Filtry aplikuje się przez pipe | do zmiennej lub wyrażenia.
    code: |
      # Filtry stringów
      - name: Show filters
        ansible.builtin.debug:
          msg: "{{ my_var | upper }}"         # UPPERCASE
          # | lower                            # lowercase
          # | capitalize                       # Capitalize
          # | trim                             # usuń whitespace
          # | replace('old', 'new')            # zamień
          # | regex_replace('^foo', 'bar')     # regex replace
          # | truncate(50)                     # skróć do 50 znaków

      # Filtry list/dict
      - name: List filters
        ansible.builtin.debug:
          msg: "{{ my_list | length }}"       # długość listy
          # | sort                             # sortuj
          # | unique                           # usuń duplikaty
          # | join(', ')                       # łącz w string
          # | first                            # pierwszy element
          # | last                             # ostatni element
          # | min                              # minimum
          # | max                              # maksimum
          # | flatten                          # spłaszcz zagnieżdżoną listę

      # Filtry wartości domyślnych i walidacji
      - name: Default filters
        ansible.builtin.debug:
          msg: "{{ my_var | default('fallback') }}"    # wartość domyślna
          # | default(omit)       # pomiń klucz jeśli undefined
          # | mandatory           # fail jeśli undefined
          # | bool                # konwertuj na bool
          # | int                 # konwertuj na int
          # | string              # konwertuj na string

      # Filtry ścieżek i plików
      - name: Path filters
        ansible.builtin.debug:
          msg: "{{ '/etc/nginx/nginx.conf' | basename }}"  # nginx.conf
          # | dirname              # /etc/nginx
          # | realpath             # absolutna ścieżka

      # Filtry kryptograficzne
      - name: Crypto filters
        ansible.builtin.debug:
          msg: "{{ my_password | password_hash('sha512') }}"
          # | b64encode            # base64 encode
          # | b64decode            # base64 decode
          # | sha1                 # SHA1 hash
          # | md5                  # MD5 hash

  - name: Moduł template vs copy
    desc: >
      template przetwarza pliki Jinja2 przed skopiowaniem — używaj gdy plik zawiera
      zmienne lub logikę. copy kopiuje plik bez zmian — używaj dla plików binarnych,
      certyfikatów, plików konfiguracyjnych bez dynamiki.
    code: |
      # template — przetwarza Jinja2 (dynamiczne pliki)
      - name: Deploy nginx config (with variables)
        ansible.builtin.template:
          src: templates/nginx.conf.j2    # plik .j2 z Jinja2
          dest: /etc/nginx/nginx.conf
          owner: root
          group: root
          mode: '0644'
          validate: /usr/sbin/nginx -t -c %s   # waliduj przed zapisem
          backup: true                          # backup starego pliku
        notify: Reload nginx

      # copy — bez przetwarzania (statyczne pliki)
      - name: Copy SSL certificate (binary)
        ansible.builtin.copy:
          src: files/ssl_cert.pem         # plik statyczny
          dest: /etc/ssl/certs/myapp.pem
          owner: root
          group: root
          mode: '0644'

      # copy z treścią inline (bez pliku)
      - name: Create simple config
        ansible.builtin.copy:
          content: |
            [database]
            host=localhost
            port=5432
          dest: /etc/myapp/db.ini

      # Kiedy używać template vs copy:
      # template: konfiguracje z nazwami hostów, portami, ścieżkami
      # copy: certyfikaty SSL, pliki binarne, szablony bez zmiennych

  - name: defaults vs vars — priorytety zmiennych
    desc: >
      defaults/main.yml to zmienne z najniższym priorytetem — mogą być nadpisane przez
      wszystko. vars/main.yml ma wyższy priorytet — nadpisuje inventory vars i host_vars.
      Używaj defaults dla opcji konfigurowalnych, vars dla wewnętrznych stałych roli.
    code: |
      # defaults/main.yml — konfigurowane przez użytkownika roli
      # Najniższy priorytet — można nadpisać z inventory, playbooka, CLI
      ---
      nginx_port: 80
      nginx_ssl_enabled: false
      nginx_worker_processes: auto
      nginx_worker_connections: 1024
      nginx_user: www-data
      nginx_vhosts: []

      # vars/main.yml — wewnętrzne zmienne roli
      # Wyższy priorytet — trudniej nadpisać (tylko extra_vars z CLI)
      ---
      nginx_config_dir: /etc/nginx
      nginx_log_dir: /var/log/nginx
      nginx_pid_file: /run/nginx.pid
      # Zmienne wewnętrzne roli — nie ma sensu żeby użytkownik je nadpisywał

      # Priorytety zmiennych (od najniższego do najwyższego):
      # 1. role defaults (defaults/main.yml)
      # 2. inventory group_vars/all
      # 3. inventory host_vars
      # 4. inventory group_vars/<group>
      # 5. play vars
      # 6. play vars_files
      # 7. role vars (vars/main.yml)
      # 8. set_fact / registered vars
      # 9. extra vars (-e z CLI)  ← najwyższy priorytet

  - name: include_role vs import_role
    desc: >
      import_role wczytuje rolę statycznie przy parsowaniu playbooka — tags i when
      z playboooka stosują się do wszystkich tasków roli. include_role wczytuje dynamicznie
      podczas wykonania — pozwala na warunkowe włączenie roli i pętle.
    code: |
      # import_role — statyczne (parseowane przed wykonaniem)
      - name: Install and configure nginx
        hosts: webservers
        tasks:
          - name: Import nginx role
            ansible.builtin.import_role:
              name: nginx               # zawsze wczytuje wszystkie taski

          # import_role: tags z play stosują się do wszystkich tasków roli
          - name: Import security role
            ansible.builtin.import_role:
              name: security
            tags: security              # tag stosuje się do wszystkich tasków roli

      # include_role — dynamiczne (wykonywane podczas play)
      - name: Configure based on OS
        hosts: all
        tasks:
          - name: Include role based on OS
            ansible.builtin.include_role:
              name: "{{ ansible_os_family | lower }}_config"  # nazwa z zmiennej!
            when: configure_system | bool

          # include_role: można używać w pętli
          - name: Configure multiple apps
            ansible.builtin.include_role:
              name: deploy_app
              vars_from_files:
                - "{{ app.name }}_vars.yml"
            loop: "{{ apps_to_deploy }}"
            loop_control:
              loop_var: app

      # Kiedy używać:
      # import_role: gdy chcesz Tags z playbooka, lint/static analysis, przewidywalne zachowanie
      # include_role: gdy potrzebujesz dynamicznej nazwy roli, pętli, warunkowego włączenia

  - name: galaxy.yml — metadane roli
    desc: >
      meta/main.yml zawiera metadane roli — autora, licencję, obsługiwane platformy,
      zależności od innych ról. Zależności są automatycznie pobierane i uruchamiane
      przed rolą. Wymagane dla publikacji roli na Ansible Galaxy.
    code: |
      # meta/main.yml — metadane roli dla Galaxy
      ---
      galaxy_info:
        role_name: nginx
        author: mycompany
        description: Install and configure Nginx web server
        license: MIT
        min_ansible_version: "2.14"

        platforms:
          - name: Ubuntu
            versions:
              - focal     # 20.04
              - jammy     # 22.04
              - noble     # 24.04
          - name: Debian
            versions:
              - bullseye  # 11
              - bookworm  # 12
          - name: EL       # Enterprise Linux
            versions:
              - "8"
              - "9"

        galaxy_tags:
          - nginx
          - web
          - http

      # Zależności — uruchamiane automatycznie przed rolą
      dependencies:
        - role: geerlingguy.repo-epel
          when: ansible_os_family == "RedHat"
        - role: security_hardening
          vars:
            hardening_level: high
        - role: certbot
          when: nginx_ssl_enabled | bool
