title: Integracja z Next.js App Router

items:
  - name: Setup w Next.js App Router
    desc: tRPC w Next.js App Router — fetch handler z onError, TRPCProvider z links (loggerLink + httpBatchLink). W tRPC v11 transformer ustawiasz NA LINKU, nie na kliencie.
    code: |
      // app/api/trpc/[trpc]/route.ts
      import { fetchRequestHandler } from '@trpc/server/adapters/fetch'
      import { appRouter } from '@/server/router'
      import { createContext } from '@/server/context'

      const handler = (req: Request) =>
        fetchRequestHandler({
          endpoint: '/api/trpc',
          req,
          router: appRouter,
          // fetchRequestHandler przekazuje { req, resHeaders, info }
          createContext: (opts) => createContext(opts),
          onError({ error, path }) {
            if (error.code === 'INTERNAL_SERVER_ERROR') {
              console.error(`tRPC failed on ${path}:`, error)
            }
          },
        })

      export { handler as GET, handler as POST }

      // app/providers.tsx — TRPCProvider wrapper
      'use client'
      import { QueryClient, QueryClientProvider } from '@tanstack/react-query'
      import { trpc } from '@/utils/trpc'
      import { httpBatchLink, loggerLink } from '@trpc/client'
      import superjson from 'superjson'
      import { useState } from 'react'

      export function TRPCProvider({ children }: { children: React.ReactNode }) {
        const [queryClient] = useState(() => new QueryClient())
        const [trpcClient] = useState(() =>
          trpc.createClient({
            links: [
              // loggerLink — log requestów w dev
              loggerLink({
                enabled: (op) => process.env.NODE_ENV === 'development',
              }),
              httpBatchLink({
                url: '/api/trpc',
                transformer: superjson,  // v11: transformer NA LINKU
              }),
            ],
          })
        )
        return (
          <trpc.Provider client={trpcClient} queryClient={queryClient}>
            <QueryClientProvider client={queryClient}>
              {children}
            </QueryClientProvider>
          </trpc.Provider>
        )
      }

  - name: Server Components — wywołanie bez HTTP
    desc: W React Server Components wywołujesz procedury tRPC bezpośrednio — bez HTTP. UWAGA Next.js 15 — headers()/cookies() są ASYNC, trzeba await. createCaller() dla RSC, createServerSideHelpers() + HydrationBoundary do prefetchu Client Components.
    code: |
      // app/posts/page.tsx — Server Component
      import { appRouter } from '@/server/router'
      import { createContext } from '@/server/context'
      import { headers } from 'next/headers'

      export default async function PostsPage() {
        // Next.js 15: headers() zwraca Promise — await!
        const ctx = await createContext({ headers: await headers() })
        const caller = appRouter.createCaller(ctx)

        // Wywołanie bezpośrednie — bez round-trip HTTP
        const posts = await caller.posts.list({ limit: 10 })

        return (
          <ul>
            {posts.items.map(post => (
              <li key={post.id}>{post.title}</li>
            ))}
          </ul>
        )
      }

      // === app/feed/page.tsx — Prefetch + hydration dla Client Components ===
      // Prefetch w RSC, potem <HydrationBoundary> przekazuje cache do klienta
      import { createServerSideHelpers } from '@trpc/react-query/server'
      import { HydrationBoundary } from '@tanstack/react-query'
      import superjson from 'superjson'

      export default async function FeedPage() {
        const helpers = createServerSideHelpers({
          router: appRouter,
          ctx: await createContext({ headers: await headers() }),
          transformer: superjson,
        })

        await helpers.posts.list.prefetch({ limit: 10 })

        return (
          <HydrationBoundary state={helpers.dehydrate()}>
            <ClientFeed />   {/* useQuery wystartuje już z danymi */}
          </HydrationBoundary>
        )
      }
