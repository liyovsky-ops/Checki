title: Klient React — useQuery i useMutation

items:
  - name: useQuery i useMutation
    desc: trpc.procedure.useQuery() i useMutation() to opakowania React Query. Full DX — autocomplete nazw procedur, typowane data, isLoading, error, refetch.
    code: |
      import { trpc } from '@/utils/trpc'

      function PostsPage() {
        // useUtils() to HOOK — wywołaj na górze komponentu, NIE w callbacku
        const utils = trpc.useUtils()

        // Query — GET
        const { data, isLoading, error, refetch } = trpc.posts.list.useQuery(
          { limit: 10 },           // Input — typowany!
          {
            staleTime: 30_000,     // Cache 30 sekund
            enabled: true,         // Warunek uruchomienia
            refetchOnWindowFocus: false,
          }
        )

        // Mutation — POST/PUT/DELETE
        const createPost = trpc.posts.create.useMutation({
          onSuccess: (data) => {
            console.log('Utworzono post:', data)
            // Invalidate cache list — użyj utils z góry komponentu
            utils.posts.list.invalidate()
          },
          onError: (error) => {
            console.error('Błąd:', error.message)
          },
        })

        const handleCreate = () => {
          createPost.mutate({
            title:   "Nowy post",
            content: "Treść posta...",
          })
        }

        if (isLoading) return <div>Ładowanie...</div>
        if (error)     return <div>Błąd: {error.message}</div>

        return (
          <div>
            {data?.items.map(post => (
              <div key={post.id}>{post.title}</div>
            ))}
            <button onClick={handleCreate} disabled={createPost.isPending}>
              {createPost.isPending ? "Tworzę..." : "Dodaj post"}
            </button>
          </div>
        )
      }

  - name: Optimistic Updates i Invalidation
    desc: React Query pod tRPC — optimistic updates zmieniają UI przed odpowiedzią serwera. useUtils() do invalidacji cache i ręcznego ustawiania danych.
    code: |
      import { trpc } from '@/utils/trpc'

      function LikeButton({ postId }: { postId: number }) {
        const utils = trpc.useUtils()

        const likePost = trpc.posts.like.useMutation({
          // Optimistic update — zmień UI natychmiast
          onMutate: async ({ postId }) => {
            await utils.posts.byId.cancel({ id: postId })
            const prev = utils.posts.byId.getData({ id: postId })

            utils.posts.byId.setData(
              { id: postId },
              old => old ? { ...old, likes: old.likes + 1 } : old
            )

            return { prev }  // Rollback data
          },
          onError: (err, vars, ctx) => {
            // Rollback jeśli błąd
            if (ctx?.prev) {
              utils.posts.byId.setData({ id: vars.postId }, ctx.prev)
            }
          },
          onSettled: () => {
            utils.posts.byId.invalidate({ id: postId })
          },
        })

        return (
          <button onClick={() => likePost.mutate({ postId })}>
            ❤️ Like
          </button>
        )
      }

  - name: Subscriptions — real-time (SSE / WebSockets)
    desc: tRPC v11 ma natywne subscriptions. Server zwraca async generator (yield), klient używa useSubscription. httpSubscriptionLink = transport przez SSE (działa na serverless), wsLink = WebSockets. splitLink kieruje subskrypcje na inny transport niż query/mutation.
    code: |
      // === SERVER: procedura subscription (async generator, v11) ===
      import { initTRPC } from '@trpc/server'
      import { z } from 'zod'
      import { on } from 'node:events'

      const t = initTRPC.create()

      export const chatRouter = t.router({
        onMessage: t.procedure
          .input(z.object({ roomId: z.string() }))
          .subscription(async function* ({ input, ctx, signal }) {
            // Iteruj po zdarzeniach z EventEmittera aż klient się rozłączy
            for await (const [msg] of on(ee, `room:${input.roomId}`, { signal })) {
              yield msg as { id: string; text: string }
            }
          }),
      })

      // === CLIENT: konfiguracja linku (SSE) ===
      import { createTRPCReact } from '@trpc/react-query'
      import { httpSubscriptionLink, httpBatchLink, splitLink } from '@trpc/client'

      const trpcClient = trpc.createClient({
        links: [
          splitLink({
            condition: (op) => op.type === 'subscription',
            true:  httpSubscriptionLink({ url: '/api/trpc' }), // SSE — serverless OK
            false: httpBatchLink({ url: '/api/trpc' }),
          }),
        ],
      })

      // === CLIENT: hook useSubscription ===
      function ChatRoom({ roomId }: { roomId: string }) {
        const [messages, setMessages] = useState<Msg[]>([])

        trpc.chat.onMessage.useSubscription(
          { roomId },
          {
            onData: (msg) => setMessages((prev) => [...prev, msg]),
            onError: (err) => console.error(err),
          }
        )

        return <ul>{messages.map(m => <li key={m.id}>{m.text}</li>)}</ul>
      }
