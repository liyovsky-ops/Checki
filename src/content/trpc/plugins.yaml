title: Ekosystem tRPC

items:
  - name: create-t3-app
    desc: Oficjalny starter do T3 Stack — Next.js + tRPC + Prisma + NextAuth + Tailwind. npx create-t3-app@latest — pełny setup w minutę. Standard dla fullstack TypeScript.
    icon: "🚀"
  - name: superjson
    desc: Transformer do serializacji danych przez tRPC. Obsługuje Date, BigInt, Map, Set, undefined — automatycznie serializowane i deserializowane. Konieczny dla większości aplikacji.
    icon: "📦"
  - name: "@tanstack/react-query"
    desc: React Query jako silnik cache pod tRPC. useQuery, useMutation, useInfiniteQuery — wszystkie dostępne przez trpc.procedure.*. Konfiguracja QueryClient globalnie.
    icon: "⚡"
  - name: trpc-openapi
    desc: Generuje OpenAPI spec z tRPC routerów. Pozwala dokumentować tRPC jako REST API — Swagger UI, Postman collection, klienty w innych językach.
    icon: "📖"
  - name: Zod (walidacja)
    desc: Standardowa biblioteka walidacji dla tRPC. .input(z.object({...})) definiuje i waliduje dane wejściowe. TypeScript typ wejścia = z.infer<typeof schema>.
    icon: "🛡️"
  - name: Prisma + tRPC
    desc: Naturalna para — Prisma jako ORM, tRPC jako API layer. Context zawiera Prisma client, procedury używają ctx.db.model.findMany(). Zero dodatkowego boilerplate.
    icon: "🗄️"
  - name: tRPC Panel
    desc: Automatyczny playground dla tRPC API — jak Swagger UI ale dla tRPC. Eksploruj procedury, testuj queries i mutations z UI. Dodaj do development environment.
    icon: "🖥️"
  - name: tRPC v11
    desc: Aktualna wersja (stabilna marzec 2025) — subscriptions przez SSE (httpSubscriptionLink, działa na serverless), transformer na linku, FormData/non-JSON input, lepszy DX z TanStack Query v5. Rekomendowana do nowych projektów.
    icon: "🆕"
  - name: "@trpc/tanstack-react-query"
    desc: Nowa integracja z React Query w v11 (queryOptions / useQuery z TanStack) obok klasycznego createTRPCReact. Mniej magii, bliżej natywnego TanStack Query — zalecana dla nowych projektów App Router.
    icon: "🔌"
