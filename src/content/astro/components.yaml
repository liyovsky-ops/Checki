title: Komponenty Astro

items:
  - name: Struktura komponentu .astro
    desc: >
      Każdy plik .astro składa się z dwóch części: frontmatter (między ---) — kod
      JavaScript/TypeScript uruchamiany tylko na serwerze, oraz template HTML poniżej.
      Żaden kod z frontmatter nie trafia do przeglądarki.
    code: |
      ---
      // src/components/Card.astro
      // Ten kod działa TYLKO podczas budowania — serwer/build time

      const { title, description, href } = Astro.props;
      const date = new Date().toLocaleDateString('pl-PL');
      ---

      <article class="card">
        <h2><a href={href}>{title}</a></h2>
        <p>{description}</p>
        <time>{date}</time>
      </article>

      <style>
        /* CSS jest scoped — nie wycieknie do innych komponentów */
        .card {
          border: 1px solid #e2e8f0;
          border-radius: 8px;
          padding: 1.5rem;
        }
        a { color: #FF5D01; text-decoration: none; }
      </style>

  - name: Props z TypeScript
    desc: >
      Astro.props dostarcza props do komponentu. Możesz zdefiniować interfejs Props
      dla pełnego type-safety. Wartości domyślne przez destructuring.
    code: |
      ---
      // src/components/Button.astro
      interface Props {
        label: string;
        href?: string;
        variant?: 'primary' | 'secondary' | 'ghost';
        disabled?: boolean;
      }

      const {
        label,
        href,
        variant = 'primary',
        disabled = false,
      } = Astro.props;
      ---

      {href ? (
        <a href={href} class={`btn btn-${variant}`}>
          {label}
        </a>
      ) : (
        <button class={`btn btn-${variant}`} disabled={disabled}>
          {label}
        </button>
      )}

  - name: Slots — kompozycja komponentów
    desc: >
      Slots pozwalają przekazywać HTML content do komponentu. Named slots
      umożliwiają wiele miejsc wstrzykiwania treści.
    code: |
      ---
      // src/components/Layout.astro
      interface Props {
        title: string;
      }
      const { title } = Astro.props;
      ---
      <html>
        <head>
          <title>{title}</title>
          <slot name="head" />
        </head>
        <body>
          <header>
            <slot name="header">
              <nav>Domyślna nawigacja</nav>
            </slot>
          </header>
          <main>
            <slot />
          </main>
          <footer>
            <slot name="footer" />
          </footer>
        </body>
      </html>

      <!-- Użycie w stronie: -->
      ---
      import Layout from '../components/Layout.astro';
      ---
      <Layout title="Strona główna">
        <link slot="head" rel="stylesheet" href="/custom.css" />
        <nav slot="header">Moja nawigacja</nav>
        <h1>Treść strony</h1>
      </Layout>

  - name: "client:load — hydratacja od razu"
    desc: >
      Dyrektywa client:load hydruje komponent React/Vue/Svelte natychmiast po
      załadowaniu strony. Używaj dla widocznych od razu interaktywnych elementów.
    code: |
      ---
      // src/pages/index.astro
      import Counter from '../components/Counter.jsx';  // React komponent
      import SearchBar from '../components/SearchBar.vue';  // Vue komponent
      ---

      <!-- Hydruj natychmiast — widoczne od razu -->
      <Counter client:load initialCount={0} />

      <!-- Vue komponent z client:load -->
      <SearchBar client:load placeholder="Szukaj..." />

      <!-- Bez dyrektywy = tylko HTML, zero JS -->
      <Counter />

  - name: "client:idle — hydratacja po załadowaniu"
    desc: >
      client:idle czeka na window requestIdleCallback (lub load event jeśli
      nie wspierany). Idealne dla komponentów poniżej fold, które nie są krytyczne.
    code: |
      ---
      import Newsletter from '../components/Newsletter.jsx';
      import Comments from '../components/Comments.svelte';
      ---

      <!-- Hydruj gdy przeglądarka jest idle — niekrytyczne komponenty -->
      <Newsletter client:idle />

      <!-- Świetne dla komponentów poniżej fold -->
      <Comments client:idle postId={post.id} />

      <!-- Porównanie priorytetów:
        client:load    → od razu (krytyczne)
        client:idle    → gdy idle (ważne ale nie krytyczne)
        client:visible → gdy w viewport (leniwe)
        client:media   → gdy media query spełnione
        client:only    → tylko klient, bez SSR -->

  - name: "client:visible — hydratacja w viewport"
    desc: >
      client:visible używa IntersectionObserver — komponent hydruje się dopiero
      gdy pojawi się w widoku użytkownika. Idealne dla długich stron i lazy loading.
    code: |
      ---
      import Chart from '../components/Chart.jsx';
      import VideoPlayer from '../components/VideoPlayer.vue';
      import HeavyWidget from '../components/HeavyWidget.svelte';
      ---

      <h1>Nagłówek strony</h1>
      <p>Dużo treści...</p>

      <!-- Poniżej fold — hydruj dopiero gdy użytkownik doscrolluje -->
      <Chart client:visible data={chartData} />

      <!-- Zaoszczędź bandwidth dla komponentów których user może nie zobaczyć -->
      <VideoPlayer client:visible src="/demo.mp4" />
      <HeavyWidget client:visible />

  - name: "client:only — wyłącznie klient (bez SSR)"
    desc: >
      client:only pomija renderowanie serwera — komponent nie istnieje w HTML.
      Wymagane dla komponentów używających browser-only APIs (window, localStorage).
      Musisz podać nazwę frameworka.
    code: |
      ---
      import Map from '../components/Map.jsx';       // Używa window.L (Leaflet)
      import ThemeToggle from '../components/ThemeToggle.jsx';  // Używa localStorage
      ---

      <!-- client:only="react" — pomija SSR, renderuje tylko w przeglądarce -->
      <Map client:only="react" center={[52.23, 21.01]} zoom={12} />

      <!-- localStorage i window są dostępne tylko w przeglądarce -->
      <ThemeToggle client:only="react" />

      <!-- Inne frameworki: -->
      <!-- client:only="vue" -->
      <!-- client:only="svelte" -->
      <!-- client:only="solid" -->

  - name: Wyrażenia i logika w template
    desc: >
      W template Astro możesz używać wyrażeń JavaScript w nawiasach klamrowych.
      Obsługa warunków, list i dynamicznych atrybutów.
    code: |
      ---
      const items = ['React', 'Vue', 'Svelte', 'Solid'];
      const isLoggedIn = true;
      const count = 42;
      ---

      <!-- Wyrażenie -->
      <p>Liczba elementów: {count}</p>

      <!-- Warunek -->
      {isLoggedIn ? <p>Zalogowany</p> : <p>Niezalogowany</p>}

      <!-- Lista -->
      <ul>
        {items.map((item) => (
          <li>{item}</li>
        ))}
      </ul>

      <!-- Dynamiczny atrybut -->
      <a href={`/tags/${item.slug}`} class={isLoggedIn ? 'active' : ''}>
        {item.name}
      </a>

      <!-- Fragment — wiele elementów bez wrappera -->
      <>
        <h1>Tytuł</h1>
        <p>Opis</p>
      </>

  - name: Importowanie zasobów i stylów
    desc: >
      Astro automatycznie przetwarza importowane CSS, obrazy i inne zasoby.
      Możesz importować pliki CSS globalnie lub per-komponent.
    code: |
      ---
      // Import CSS — tylko dla tego komponentu
      import styles from './Card.module.css';

      // Import obrazu — Astro go zoptymalizuje
      import heroImage from '../assets/hero.jpg';

      // Import z node_modules
      import { Image } from 'astro:assets';
      ---

      <!-- Zoptymalizowany obraz z astro:assets -->
      <Image src={heroImage} alt="Hero" width={800} height={400} />

      <!-- CSS Module -->
      <div class={styles.card}>...</div>

      <!-- Globalny CSS (w Layout) -->
      <link rel="stylesheet" href="/global.css" />

      <!-- Scoped style tag (w tym pliku) -->
      <style>
        h1 { color: #FF5D01; }
      </style>

      <!-- Globalny style tag -->
      <style is:global>
        body { margin: 0; }
      </style>

  - name: Przekazywanie danych spread i rest props
    desc: >
      Możesz przekazywać wszystkie nieznane props dalej za pomocą spread operatora.
      Astro.props zawiera wszystkie przekazane atrybuty.
    code: |
      ---
      // src/components/Input.astro
      interface Props extends HTMLInputElement {
        label: string;
      }

      const { label, ...rest } = Astro.props;
      ---

      <div class="field">
        <label>{label}</label>
        <!-- Przekaż wszystkie pozostałe atrybuty do input -->
        <input {...rest} />
      </div>

      <!-- Użycie — wszystkie standardowe atrybuty input działają -->
      <Input
        label="Email"
        type="email"
        name="email"
        required
        placeholder="jan@example.com"
      />
