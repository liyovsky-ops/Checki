  - name: "Astro DB i SSR"
    icon: "🗄️"
    commands:
      - cmd: npx astro db push
        desc: Wypchnij schema bazy danych do produkcji (Turso/LibSQL)
        detail:
          what: Synchronizuje schema zdefiniowaną w db/config.ts z produkcyjną bazą danych Turso.
          how: Wymaga zmiennych środowiskowych ASTRO_DB_REMOTE_URL i ASTRO_DB_APP_TOKEN.
          tips:
            - 'npx astro db verify — weryfikuj schema przed pushowaniem'
            - 'Turso: turso db create my-db && turso db tokens create my-db'

      - code: |
          // db/config.ts — definicja tabel
          import { defineDb, defineTable, column, NOW } from 'astro:db';

          const Comment = defineTable({
            columns: {
              id: column.number({ primaryKey: true }),
              postSlug: column.text(),
              author: column.text(),
              body: column.text(),
              createdAt: column.date({ default: NOW }),
              approved: column.boolean({ default: false }),
            },
            indexes: [
              { on: ['postSlug'] },
            ],
          });

          const User = defineTable({
            columns: {
              id: column.number({ primaryKey: true }),
              email: column.text({ unique: true }),
              name: column.text(),
            },
          });

          export default defineDb({ tables: { Comment, User } });
        desc: Definicja tabel Astro DB z typami i indeksami

      - code: |
          // src/pages/api/comments.ts — CRUD z Astro DB
          import type { APIRoute } from 'astro';
          import { db, Comment, eq, desc } from 'astro:db';

          export const GET: APIRoute = async ({ url }) => {
            const slug = url.searchParams.get('slug');
            const comments = await db
              .select()
              .from(Comment)
              .where(eq(Comment.postSlug, slug!))
              .orderBy(desc(Comment.createdAt))
              .all();
            return new Response(JSON.stringify(comments));
          };

          export const POST: APIRoute = async ({ request }) => {
            const { postSlug, author, body } = await request.json();
            const result = await db.insert(Comment).values({
              postSlug, author, body
            }).returning();
            return new Response(JSON.stringify(result[0]), { status: 201 });
          };
        desc: "CRUD z Astro DB — select, insert, where, orderBy"

      - code: |
          // astro.config.mjs — tryb SSR
          import { defineConfig } from 'astro/config';
          import node from '@astrojs/node';

          export default defineConfig({
            output: 'server',     // 'static' | 'hybrid' | 'server'
            adapter: node({ mode: 'standalone' }),
          });

          // W trybie 'hybrid' możesz prerender wybrane strony:
          // src/pages/about.astro
          // export const prerender = true;  ← ta strona = statyczna

          // W trybie 'server' możesz wyłączyć prerender per-strona:
          // export const prerender = false;  ← domyślnie false w 'server'
        desc: "Konfiguracja SSR — output: server / hybrid"

      - code: |
          ---
          // src/pages/dashboard.astro — SSR ze zmiennymi i cookies
          // Tylko w trybie output: 'server' lub 'hybrid' + prerender: false

          const { cookies, redirect, locals } = Astro;

          // Odczytaj cookie
          const sessionId = cookies.get('session')?.value;
          if (!sessionId) return redirect('/login');

          // Pobierz dane per-request (nie są cache'owane)
          const user = await fetch(`/api/users/${sessionId}`).then(r => r.json());
          const dashboardData = await fetchDashboard(user.id);
          ---
          <h1>Witaj, {user.name}!</h1>
          <p>Zalogowany jako: {user.email}</p>
          <!-- dashboardData to AKTUALNE dane — nie cache z buildtime -->
        desc: SSR — dane per-request, cookies, redirect

      - code: |
          // astro.config.mjs — zmienne środowiskowe z typowaniem
          import { defineConfig, envField } from 'astro/config';

          export default defineConfig({
            env: {
              schema: {
                // Publiczne (dostępne w przeglądarce)
                PUBLIC_API_URL: envField.string({
                  context: 'client',
                  access: 'public',
                }),
                // Prywatne (tylko serwer)
                DATABASE_URL: envField.string({
                  context: 'server',
                  access: 'secret',
                }),
                // Opcjonalne z wartością domyślną
                MAX_ITEMS: envField.number({
                  context: 'server',
                  access: 'public',
                  default: 10,
                }),
              },
            },
          });

          // Użycie z typowaniem:
          // import { PUBLIC_API_URL, DATABASE_URL } from 'astro:env/client';
        desc: "Zmienne środowiskowe z typowaniem (astro:env)"

  - name: Deploy i optymalizacja
    icon: "🚢"
    commands:
      - cmd: npx astro add cloudflare
        desc: Deploy na Cloudflare Pages (edge runtime)
        detail:
          what: Adapter Cloudflare Pages z edge functions. Globalna CDN, zero cold start, Workers AI dostępne.
          how: Po instalacji wygeneruj projekt na pages.cloudflare.com lub przez Wrangler CLI.
          tips:
            - 'wrangler pages deploy dist/ — deploy przez CLI'
            - 'Cloudflare D1 (SQLite) dostępne przez platform.env w trybie edge'

      - cmd: npx astro add netlify
        desc: Deploy na Netlify (SSR + edge functions)
        detail:
          what: Adapter Netlify z SSR i edge functions. Auto-deploy po git push.
          how: Połącz repozytorium na netlify.com lub użyj netlify deploy --build.
          tips:
            - 'netlify deploy --build --prod — deploy przez Netlify CLI'
            - 'Netlify auto-detects Astro — build command: npm run build, publish: dist'

      - code: |
          // astro.config.mjs — optymalizacja obrazów + kompresja
          import { defineConfig } from 'astro/config';

          export default defineConfig({
            image: {
              // Domyślny format wyjściowy
              defaultFormat: 'webp',
              // Jakość domyślna (1-100)
              quality: 80,
              // Dozwolone domeny dla zdalnych obrazów
              domains: ['images.unsplash.com', 'avatars.githubusercontent.com'],
              remotePatterns: [{
                protocol: 'https',
                hostname: '**.cloudinary.com',
              }],
            },
            compressHTML: true,  // Minifikuj HTML w production
            build: {
              inlineStylesheets: 'auto',  // Inline małe CSS pliki
            },
            vite: {
              build: {
                cssMinify: true,
                rollupOptions: {
                  output: { manualChunks: { 'vendor': ['react', 'react-dom'] } },
                },
              },
            },
          });
        desc: Konfiguracja optymalizacji obrazów i build

      - cmd: npx pagefind --site dist
        desc: Wygeneruj indeks wyszukiwarki Pagefind
        detail:
          what: Pagefind to wyszukiwarka statycznych stron działająca w przeglądarce bez backendu. Idealny dla blogów i dokumentacji.
          how: Uruchom po npm run build. Generuje indeks w dist/pagefind/. Dodaj skrypt i komponent wyszukiwarki.
          tips:
            - 'Starlight ma Pagefind wbudowany out-of-the-box — zero konfiguracji'
            - 'npx pagefind --site dist --output-subdir search — custom output directory'

      - code: |
          <!-- View Transitions — płynne przejścia między stronami -->
