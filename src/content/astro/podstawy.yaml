  concepts: Kluczowe koncepcje
  whenToUse: Kiedy używać Astro?
  firstComponent: Twój pierwszy komponent Astro
  firstComponentLang: astro

intro:
  title: Czym jest Astro?
  desc: >
    Astro to content-first web framework który wysyła zero JavaScript domyślnie.
    Używa architektury Islands — tylko interaktywne komponenty dostają JS, reszta to statyczny HTML.
    Obsługuje React, Vue, Svelte, Solid i inne jednocześnie w jednym projekcie.
    Idealny do blogów, dokumentacji, landing pages i każdej strony gdzie liczy się wydajność.

concepts:
  - title: Islands Architecture
    desc: >
      Strona to morze statycznego HTML z wyspami interaktywności. Każda "wyspa"
      (komponent React, Vue, Svelte) jest hydratowana niezależnie i tylko wtedy gdy potrzeba.
      Domyślnie zero JavaScript — czysty HTML + CSS trafia do przeglądarki.
    icon: "🏝️"
  - title: Zero JS by default
    desc: >
      W przeciwieństwie do React/Next.js, Astro nie wysyła żadnego runtime JavaScript.
      Komponenty .astro kompilują się do czystego HTML. JS dodajesz tylko tam gdzie
      jest naprawdę potrzebny — za pomocą dyrektyw client:load, client:idle, client:visible.
    icon: "⚡"
  - title: Komponenty .astro
    desc: >
      Pliki .astro to HTML-first templates z frontmatter (między ---). Frontmatter
      to JavaScript/TypeScript który działa TYLKO na serwerze podczas budowania.
      Możesz fetch(), czytać pliki, używać DB — żaden z tych danych nie trafia do przeglądarki jako kod.
    icon: "📄"
  - title: Content Collections
    desc: >
      Wbudowany system do zarządzania treścią (Markdown, MDX, YAML, JSON).
      Definiujesz schema przez Zod — walidacja typów dla każdego posta.
      getCollection() i getEntry() to type-safe API do pobierania treści z pełnym TypeScript.
    icon: "📚"
  - title: Framework agnostic
    desc: >
      Użyj React, Vue, Svelte, Solid, Lit i innych w jednym projekcie jednocześnie.
      Każda integracja to osobna wyspa. Możesz migrować stopniowo lub używać
      najlepszego narzędzia do konkretnego zadania bez konfliktu między frameworkami.
    icon: "🔌"
  - title: View Transitions
    desc: >
      Wbudowane płynne przejścia między stronami bez SPA overhead.
      Dodaj komponent ViewTransitions i atrybut transition:name aby uzyskać
      animowane page transitions z natywnym browser API. Działa w trybie MPA.
    icon: "✨"

whenToUse:
  - Blogi, dokumentacja, strony marketingowe — content-heavy sites
  - Kiedy chcesz React/Vue/Svelte bez ciężkiego SPA bundle
  - Portfolio, landing pages — maksymalna wydajność i Core Web Vitals
  - E-commerce z prerendered pages i dynamicznymi wyspami (koszyk, wyszukiwarka)
  - Projekty gdzie SEO i czas ładowania mają kluczowe znaczenie
  - Strony z mieszanym contentem — statyczne artykuły i interaktywne widgety

firstComponent: |
  ---
  // Ten kod działa TYLKO na serwerze — nie trafia do przeglądarki
  const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=3');
  const posts = await response.json();

  interface Post {
    id: number;
    title: string;
    body: string;
  }
  ---
  <html lang="pl">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width" />
      <title>Mój Blog Astro</title>
    </head>
    <body>
      <h1>Najnowsze posty</h1>

      {posts.map((post: Post) => (
        <article>
          <h2><a href={`/posts/${post.id}`}>{post.title}</a></h2>
          <p>{post.body}</p>
        </article>
      ))}
    </body>
  </html>

  <style>
    body {
      font-family: system-ui;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    article {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #eee;
    }
  </style>
