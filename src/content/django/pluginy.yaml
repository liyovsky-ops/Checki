title: Ekosystem Django

items:
  - name: Django REST Framework (DRF)
    icon: "🌐"
    desc: |
      De-facto standard dla REST API w Pythonie — zbudowany na Django, dodaje serializery,
      ViewSets, Routers, Permissions, Throttling, Pagination, Browsable API.
      Instalacja: pip install djangorestframework

      Najbardziej dojrzałe rozwiązanie dla REST API w Pythonie.
      Serializery działają jak Django forms dla JSON. Browsable API w przeglądarce.
    code: |
      # settings.py
      INSTALLED_APPS = [..., 'rest_framework']
      REST_FRAMEWORK = {
          'DEFAULT_AUTHENTICATION_CLASSES': [
              'rest_framework.authentication.SessionAuthentication',
              'rest_framework_simplejwt.authentication.JWTAuthentication',
          ],
          'DEFAULT_PERMISSION_CLASSES': ['rest_framework.permissions.IsAuthenticated'],
          'DEFAULT_PAGINATION_CLASS': 'rest_framework.pagination.PageNumberPagination',
          'PAGE_SIZE': 20,
          'DEFAULT_THROTTLE_RATES': {'anon': '100/day', 'user': '1000/day'},
      }

      # serializers.py
      from rest_framework import serializers
      from .models import Article

      class ArticleSerializer(serializers.ModelSerializer):
          author_name = serializers.SerializerMethodField()

          class Meta:
              model  = Article
              fields = ['id', 'title', 'content', 'status', 'created', 'author_name']
              read_only_fields = ['id', 'created']

          def get_author_name(self, obj):
              return obj.author.get_full_name()

      # views.py
      from rest_framework import viewsets, permissions, filters
      from rest_framework.decorators import action
      from rest_framework.response import Response

      class ArticleViewSet(viewsets.ModelViewSet):
          queryset         = Article.objects.select_related('author').all()
          serializer_class = ArticleSerializer
          permission_classes = [permissions.IsAuthenticatedOrReadOnly]
          filter_backends  = [filters.SearchFilter, filters.OrderingFilter]
          search_fields    = ['title', 'content']
          ordering_fields  = ['created', 'title']

          def perform_create(self, serializer):
              serializer.save(author=self.request.user)

          @action(detail=True, methods=['post'])
          def publish(self, request, pk=None):
              article = self.get_object()
              article.status = 'published'
              article.save()
              return Response({'status': 'published'})

      # urls.py — Router automatycznie tworzy wszystkie URL
      from rest_framework.routers import DefaultRouter
      router = DefaultRouter()
      router.register(r'articles', ArticleViewSet)
      urlpatterns = [path('api/', include(router.urls))]

  - name: Celery + django-celery-beat
    icon: "⏰"
    desc: |
      Celery to asynchroniczna kolejka zadań — wysyłaj email, generuj PDF, importuj CSV
      w tle bez blokowania requestu. django-celery-beat dodaje harmonogram zadań (cron)
      zarządzany przez admin Django.
      Instalacja: pip install celery django-celery-beat redis

      Wymaga brokera: Redis (najpopularniejszy) lub RabbitMQ.
    code: |
      # myproject/celery.py
      import os
      from celery import Celery

      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'myproject.settings')
      app = Celery('myproject')
      app.config_from_object('django.conf:settings', namespace='CELERY')
      app.autodiscover_tasks()

      # myproject/__init__.py
      from .celery import app as celery_app
      __all__ = ['celery_app']

      # settings.py
      CELERY_BROKER_URL    = 'redis://localhost:6379/0'
      CELERY_RESULT_BACKEND = 'redis://localhost:6379/0'
      INSTALLED_APPS = [..., 'django_celery_beat']

      # blog/tasks.py
      from celery import shared_task
      from django.core.mail import send_mail

      @shared_task(bind=True, max_retries=3, default_retry_delay=60)
      def send_welcome_email(self, user_id):
          try:
              from django.contrib.auth import get_user_model
              User = get_user_model()
              user = User.objects.get(pk=user_id)
              send_mail(
                  subject='Witamy w serwisie!',
                  message=f'Cześć {user.first_name}!',
                  from_email='noreply@firma.pl',
                  recipient_list=[user.email],
              )
          except Exception as exc:
              raise self.retry(exc=exc)

      # Wywołanie z view
      send_welcome_email.delay(user.pk)           # async
      send_welcome_email.apply_async(
          args=[user.pk], countdown=60            # za 60 sekund
      )

      # Uruchomienie workera
      # celery -A myproject worker --loglevel=info
      # celery -A myproject beat --scheduler django_celery_beat.schedulers:DatabaseScheduler

  - name: django-allauth
    icon: "🔑"
    desc: |
      Kompletny system autentykacji — logowanie przez Google, GitHub, Facebook, Twitter,
      email potwierdzenie, 2FA, social accounts łączenie.
      Instalacja: pip install django-allauth

      Gotowe templates, email flow, rate limiting. Zero pisania OAuth flow od zera.
      Najlepszy wybór dla projektów wymagających social login.
    code: |
      # settings.py
      INSTALLED_APPS = [
          ...
          'django.contrib.sites',
          'allauth',
          'allauth.account',
          'allauth.socialaccount',
          'allauth.socialaccount.providers.google',
          'allauth.socialaccount.providers.github',
      ]

      SITE_ID = 1
      AUTHENTICATION_BACKENDS = [
          'django.contrib.auth.backends.ModelBackend',
          'allauth.account.auth_backends.AuthenticationBackend',
      ]

      # Konfiguracja allauth
      ACCOUNT_AUTHENTICATION_METHOD = 'email'  # login przez email zamiast username
      ACCOUNT_EMAIL_REQUIRED         = True
      ACCOUNT_EMAIL_VERIFICATION     = 'mandatory'
      ACCOUNT_USERNAME_REQUIRED      = False
      ACCOUNT_SIGNUP_PASSWORD_ENTER_TWICE = True

      SOCIALACCOUNT_PROVIDERS = {
          'google': {
              'SCOPE': ['profile', 'email'],
              'AUTH_PARAMS': {'access_type': 'online'},
          },
          'github': {
              'SCOPE': ['user:email'],
          },
      }

      # urls.py
      urlpatterns = [
          path('accounts/', include('allauth.urls')),
          # Dostarcza: /accounts/login/, /accounts/signup/, /accounts/social/...
      ]

  - name: django-debug-toolbar
    icon: "🔍"
    desc: |
      Niezbędne narzędzie developerskie — pokazuje w przeglądarce SQL queries, czas requestu,
      użyte szablony, cache hits, sygnały, nagłówki i więcej. Wykrywa N+1 problems.
      Instalacja: pip install django-debug-toolbar

      Tylko dla development (DEBUG=True). Nigdy na produkcji.
    code: |
      # Instalacja tylko dla dev
      # pip install django-debug-toolbar

      # settings.py (tylko dev — base na development!)
      INSTALLED_APPS = [..., 'debug_toolbar']
      MIDDLEWARE = [
          'debug_toolbar.middleware.DebugToolbarMiddleware',
          # ... reszta middleware
      ]
      INTERNAL_IPS = ['127.0.0.1']  # pokaż toolbar tylko dla localhost

      # urls.py
      from django.conf import settings

      if settings.DEBUG:
          import debug_toolbar
          urlpatterns = [
              path('__debug__/', include(debug_toolbar.urls)),
          ] + urlpatterns

      # Typowy workflow:
      # 1. Otwórz stronę w przeglądarce
      # 2. Kliknij pasek Django Debug Toolbar po prawej
      # 3. SQL panel — sprawdź N+1 queries (wiele identycznych SELECT)
      # 4. Time panel — które bloki szablonu są wolne
      # 5. Templates — które szablony załadowane, z jakimi zmiennymi
      # 6. Signals — jakie sygnały wyemitowane podczas requestu

  - name: django-environ
    icon: "🔧"
    desc: |
      Zarządzanie zmiennymi środowiskowymi i settings — 12-factor app po Django.
      Parsuje DATABASE_URL, CACHE_URL, EMAIL_URL do słownika Django settings.
      Instalacja: pip install django-environ

      Eliminuje hardkodowane credentiale w settings.py.
      Standard w projektach Django na produkcji.
    code: |
      # .env
      # SECRET_KEY=django-insecure-twoj-klucz
      # DEBUG=False
      # DATABASE_URL=postgres://user:pass@localhost:5432/mydb
      # REDIS_URL=redis://localhost:6379/0
      # EMAIL_URL=smtp+tls://user:pass@smtp.gmail.com:587
      # ALLOWED_HOSTS=mysite.pl,www.mysite.pl

      # settings.py
      import environ

      env = environ.Env(
          DEBUG=(bool, False),
      )
      environ.Env.read_env('.env')  # wczytaj plik .env

      SECRET_KEY    = env('SECRET_KEY')
      DEBUG         = env('DEBUG')
      ALLOWED_HOSTS = env.list('ALLOWED_HOSTS', default=['localhost'])

      DATABASES = {
          'default': env.db('DATABASE_URL', default='sqlite:///db.sqlite3')
      }
      CACHES = {
          'default': env.cache('REDIS_URL', default='locmemcache://')
      }
      EMAIL_CONFIG = env.email('EMAIL_URL', default='consolemail://')
      vars().update(EMAIL_CONFIG)

      MEDIA_ROOT = env.path('MEDIA_ROOT', default=BASE_DIR / 'media')()

  - name: WhiteNoise — serwowanie plików statycznych
    icon: "📦"
    desc: |
      WhiteNoise pozwala Django samo serwować pliki statyczne bez Nginx/Apache.
      Kompresja gzip/brotli i cache headers automatycznie. Idealne dla Heroku, Railway, Docker.
      Instalacja: pip install whitenoise

      Eliminuje potrzebę osobnego serwera statycznych plików w wielu deploymentach.
    code: |
      # settings.py
      MIDDLEWARE = [
          'django.middleware.security.SecurityMiddleware',
          'whitenoise.middleware.WhiteNoiseMiddleware',  # ← zaraz po SecurityMiddleware
          # ... reszta
      ]

      STATIC_URL  = '/static/'
      STATIC_ROOT = BASE_DIR / 'staticfiles'

      # Kompresja i cache
      STORAGES = {
          'staticfiles': {
              'BACKEND': 'whitenoise.storage.CompressedManifestStaticFilesStorage',
          },
      }

      # Deployment workflow
      # 1. python manage.py collectstatic  — zbierz pliki do STATIC_ROOT
      # 2. Uruchom aplikację — WhiteNoise serwuje z STATIC_ROOT automatycznie
      # 3. Cache-Control: max-age=315360000 na plikach z hash w nazwie

  - name: Gunicorn — serwer WSGI
    icon: "🦄"
    desc: |
      Gunicorn to produkcyjny serwer WSGI dla Django — stabilny, wieloprocesowy, powszechnie używany.
      Wbudowany serwer Django (runserver) tylko do developmentu.
      Instalacja: pip install gunicorn

      Za Gunicornem zazwyczaj stoi Nginx jako reverse proxy (SSL, load balancing).
    code: |
      # Instalacja
      # pip install gunicorn

      # Uruchomienie
      gunicorn myproject.wsgi:application --bind 0.0.0.0:8000

      # Produkcja — konfiguracja
      gunicorn myproject.wsgi:application \
          --workers 4 \
          --worker-class gthread \
          --threads 2 \
          --bind 0.0.0.0:8000 \
          --timeout 120 \
          --access-logfile - \
          --error-logfile - \
          --log-level info

      # gunicorn.conf.py — plik konfiguracji
      # bind     = '0.0.0.0:8000'
      # workers  = 4          # 2*CPU + 1
      # threads  = 2
      # timeout  = 120
      # loglevel = 'info'
      # accesslog = '-'       # stdout
      # errorlog  = '-'       # stderr

      # Procfile (Heroku/Railway)
      # web: gunicorn myproject.wsgi --workers 4

      # Docker CMD
      # CMD ["gunicorn", "myproject.wsgi:application", "--config", "gunicorn.conf.py"]

  - name: django-storages + boto3 (S3)
    icon: "☁️"
    desc: |
      django-storages to biblioteka do przechowywania plików statycznych i mediów w zewnętrznych
      storage backends — Amazon S3, Google Cloud Storage, Azure Blob, Backblaze B2.
      Instalacja: pip install django-storages boto3

      Niezbędne dla horizontal scalingu — wiele instancji serwera z jednym storage.
    code: |
      # pip install django-storages boto3

      # settings.py
      INSTALLED_APPS = [..., 'storages']

      # S3 konfiguracja
      AWS_ACCESS_KEY_ID     = env('AWS_ACCESS_KEY_ID')
      AWS_SECRET_ACCESS_KEY = env('AWS_SECRET_ACCESS_KEY')
      AWS_STORAGE_BUCKET_NAME = env('AWS_BUCKET_NAME')
      AWS_S3_REGION_NAME    = 'eu-central-1'
      AWS_S3_CUSTOM_DOMAIN  = f'{AWS_STORAGE_BUCKET_NAME}.s3.amazonaws.com'
      AWS_DEFAULT_ACL       = 'public-read'
      AWS_S3_OBJECT_PARAMETERS = {'CacheControl': 'max-age=86400'}

      # Django 4.2+ storages konfiguracja
      STORAGES = {
          'default': {
              'BACKEND': 'storages.backends.s3boto3.S3Boto3Storage',
          },
          'staticfiles': {
              'BACKEND': 'storages.backends.s3boto3.S3StaticStorage',
          },
      }

      MEDIA_URL  = f'https://{AWS_S3_CUSTOM_DOMAIN}/media/'
      STATIC_URL = f'https://{AWS_S3_CUSTOM_DOMAIN}/static/'
