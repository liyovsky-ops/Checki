title: Admin & Auth

items:
  - name: Rejestracja modeli w adminie
    desc: >
      Django admin automatycznie generuje pełny interfejs CRUD dla zarejestrowanych modeli.
      admin.site.register(Model) to najprostszy sposób. Dekorator @admin.register(Model)
      jest bardziej elegancki. ModelAdmin klasa pozwala customizować każdy aspekt admina.
    icon: "⚙️"
    code: |
      # blog/admin.py
      from django.contrib import admin
      from .models import Article, Category, Tag, Comment

      # Prosta rejestracja
      admin.site.register(Category)
      admin.site.register(Tag)

      # Z dekoratorem — elegancki styl
      @admin.register(Article)
      class ArticleAdmin(admin.ModelAdmin):
          # Kolumny w liście
          list_display   = ['title', 'author', 'status', 'created', 'is_featured']
          list_display_links = ['title']

          # Filtry po prawej stronie
          list_filter    = ['status', 'created', 'category', 'author']

          # Wyszukiwarka
          search_fields  = ['title', 'content', 'author__username', 'author__email']

          # Edytowalne pola bezpośrednio w liście
          list_editable  = ['status']

          # Sortowanie domyślne
          ordering       = ['-created']

          # Paginacja
          list_per_page  = 25

          # Pola formularza edycji
          fields         = ['title', 'content', 'author', 'status', 'category', 'tags']
          # lub fieldsets — zgrupowane pola
          fieldsets = (
              ('Treść', {
                  'fields': ('title', 'content'),
              }),
              ('Metadane', {
                  'fields': ('author', 'status', 'category', 'tags'),
                  'classes': ('collapse',),  # zwinięte domyślnie
              }),
              ('SEO', {
                  'fields': ('slug', 'meta_description'),
                  'description': 'Pola SEO — wypełnij dla lepszego indeksowania.',
              }),
          )

          # Automatyczne slug
          prepopulated_fields = {'slug': ('title',)}

          # M2M z wyszukiwaniem
          filter_horizontal = ['tags']
          # lub: filter_vertical = ['tags']

          # Raw ID zamiast dropdown dla dużych zbiorów
          raw_id_fields = ['author']

          # Pole wyliczone w list_display
          @admin.display(description='Wyróżniony', boolean=True)
          def is_featured(self, obj):
              return obj.status == 'published' and obj.category.slug == 'featured'

  - name: Inline Models
    desc: >
      Inline models pozwalają edytować powiązane obiekty bezpośrednio w formularzu parent.
      TabularInline renderuje powiązane jako tabelę (kompaktowo).
      StackedInline renderuje każdy obiekt jako blok z pełnymi polami.
      Inline ma własne uprawnienia, limit wyświetlanych obiektów i dodatkowych formularzy.
    icon: "🔗"
    code: |
      from django.contrib import admin
      from .models import Article, Comment, ArticleImage

      class CommentInline(admin.TabularInline):
          model       = Comment
          fields      = ['author', 'content', 'is_approved']
          readonly_fields = ['author', 'created']
          extra       = 0          # nie pokazuj pustych formularzy
          max_num     = 50
          can_delete  = True
          show_change_link = True  # link do osobnego formularza edycji

      class ArticleImageInline(admin.StackedInline):
          model  = ArticleImage
          fields = ['image', 'caption', 'order']
          extra  = 1
          ordering = ['order']

      @admin.register(Article)
      class ArticleAdmin(admin.ModelAdmin):
          inlines = [ArticleImageInline, CommentInline]
          # ... pozostała konfiguracja

  - name: Custom Actions
    desc: >
      Actions to operacje które można wykonać na zaznaczonych obiektach w liście.
      Domyślna akcja to "Delete selected". Custom actions to funkcje zarejestrowane
      w actions listie ModelAdmin. Mogą zmieniać dane, wysyłać emaile, generować raporty.
    icon: "⚡"
    code: |
      from django.contrib import admin, messages
      from django.http import HttpResponse
      import csv

      @admin.register(Article)
      class ArticleAdmin(admin.ModelAdmin):
          actions = ['publish_articles', 'export_as_csv', 'send_newsletter']

          @admin.action(description='Opublikuj zaznaczone artykuły')
          def publish_articles(self, request, queryset):
              updated = queryset.filter(status='draft').update(status='published')
              self.message_user(
                  request,
                  f'{updated} artykułów zostało opublikowanych.',
                  messages.SUCCESS
              )

          @admin.action(description='Eksportuj do CSV')
          def export_as_csv(self, request, queryset):
              response = HttpResponse(content_type='text/csv')
              response['Content-Disposition'] = 'attachment; filename="articles.csv"'
              writer = csv.writer(response)
              writer.writerow(['ID', 'Tytuł', 'Status', 'Autor', 'Data'])
              for obj in queryset:
                  writer.writerow([
                      obj.pk, obj.title, obj.status,
                      obj.author.username, obj.created.strftime('%Y-%m-%d')
                  ])
              return response  # actions mogą zwracać response!

          @admin.action(description='Wyślij newsletter')
          def send_newsletter(self, request, queryset):
              published = queryset.filter(status='published')
              if not published.exists():
                  self.message_user(request, 'Brak opublikowanych artykułów.', messages.WARNING)
                  return
              # send_newsletter_task.delay([a.pk for a in published])
              self.message_user(request, f'Newsletter wysłany dla {published.count()} artykułów.')

  - name: System autoryzacji Django
    desc: >
      Django ma wbudowany system autoryzacji z User, Group, Permission.
      Uprawnienia tworzone automatycznie per model (add, change, delete, view).
      is_staff daje dostęp do admina. is_superuser pomija wszystkie sprawdzenia uprawnień.
      Groups pozwalają zarządzać uprawnieniami dla ról zamiast per użytkownik.
    icon: "🔐"
    code: |
      from django.contrib.auth.models import User, Group, Permission
      from django.contrib.contenttypes.models import ContentType
      from django.contrib.auth.decorators import login_required, permission_required

      # Tworzenie użytkownika
      user = User.objects.create_user(
          username='jan',
          email='jan@example.com',
          password='bezpieczne_haslo_123',
          first_name='Jan',
          last_name='Kowalski',
      )
      superuser = User.objects.create_superuser('admin', 'admin@example.com', 'admin123')

      # Sprawdzenie uprawnień
      user.has_perm('blog.add_article')     # bool
      user.has_perm('blog.change_article')
      user.has_perms(['blog.add_article', 'blog.change_article'])  # oba naraz

      # Uprawnienia per obiekt (object-level) — wymaga custom backend
      user.has_perm('blog.change_article', article_obj)

      # Przypisanie uprawnień
      from django.contrib.auth.models import Permission
      perm = Permission.objects.get(codename='publish_article')
      user.user_permissions.add(perm)

      # Grupy
      editors_group, _ = Group.objects.get_or_create(name='Editors')
      editors_group.permissions.add(perm)
      user.groups.add(editors_group)

      # W view
      @login_required
      @permission_required('blog.add_article', raise_exception=True)
      def create_article(request):
          pass

      # W szablonie
      # {% if request.user.is_authenticated %}
      # {% if perms.blog.add_article %}

  - name: Custom User Model
    desc: >
      Domyślny User Django może być za mały — brak pola bio, avatar, telefon.
      Najlepszy wzorzec: AbstractUser (rozszerza istniejący User) lub AbstractBaseUser
      (od zera). Ustaw AUTH_USER_MODEL w settings.py PRZED pierwszą migracją.
      AbstractBaseUser daje pełną kontrolę — dobry gdy login przez email zamiast username.
    icon: "👤"
    code: |
      # accounts/models.py
      from django.contrib.auth.models import AbstractUser
      from django.db import models

      class User(AbstractUser):
          """Rozszerzony User — dodaj pola do istniejącego."""
          bio       = models.TextField(blank=True)
          avatar    = models.ImageField(upload_to='avatars/', null=True, blank=True)
          phone     = models.CharField(max_length=20, blank=True)
          website   = models.URLField(blank=True)
          birth_date = models.DateField(null=True, blank=True)

          class Meta:
              verbose_name = 'Użytkownik'
              verbose_name_plural = 'Użytkownicy'

          def get_full_name(self):
              return f'{self.first_name} {self.last_name}'.strip() or self.username

      # settings.py — PRZED pierwszą migracją!
      AUTH_USER_MODEL = 'accounts.User'

      # accounts/admin.py — rejestracja custom User
      from django.contrib import admin
      from django.contrib.auth.admin import UserAdmin
      from .models import User

      @admin.register(User)
      class CustomUserAdmin(UserAdmin):
          fieldsets = UserAdmin.fieldsets + (
              ('Profil', {'fields': ('bio', 'avatar', 'phone', 'website', 'birth_date')}),
          )
          list_display = ['username', 'email', 'first_name', 'last_name', 'is_staff', 'date_joined']

  - name: Signals — reakcja na zdarzenia
    desc: >
      Signals pozwalają reagować na zdarzenia w modelu bez modyfikacji kodu modelu.
      post_save, pre_save, post_delete, m2m_changed to wbudowane sygnały.
      Użyj receiver() dekoratora lub disconnect/connect manualnie.
      Dobre do tworzenia powiązanych obiektów (profil przy tworzeniu usera) i logowania.
    icon: "📡"
    code: |
      # accounts/signals.py
      from django.db.models.signals import post_save, pre_delete
      from django.dispatch import receiver
      from django.contrib.auth import get_user_model
      from .models import Profile

      User = get_user_model()

      @receiver(post_save, sender=User)
      def create_user_profile(sender, instance, created, **kwargs):
          """Tworzy profil automatycznie po stworzeniu usera."""
          if created:
              Profile.objects.create(user=instance)

      @receiver(post_save, sender=User)
      def save_user_profile(sender, instance, **kwargs):
          """Zapisuje profil przy zapisie usera."""
          if hasattr(instance, 'profile'):
              instance.profile.save()

      @receiver(pre_delete, sender=User)
      def cleanup_user_files(sender, instance, **kwargs):
          """Usuwa pliki przy usunięciu usera."""
          if instance.profile.avatar:
              instance.profile.avatar.delete(save=False)

      # accounts/apps.py — zarejestruj signals
      from django.apps import AppConfig

      class AccountsConfig(AppConfig):
          default_auto_field = 'django.db.models.BigAutoField'
          name = 'accounts'

          def ready(self):
              import accounts.signals  # noqa — wymagany import by signals zadziałały

  - name: Django Authentication Views
    desc: >
      Django zawiera gotowe view dla logowania, wylogowania, zmiany i resetowania hasła.
      Wbudowane URLpatterns przez include('django.contrib.auth.urls').
      Tylko szablony trzeba dostarczyć w registration/ katalogu.
      Dekorator @login_required i LoginRequiredMixin w CBV chronią widoki.
    icon: "🚪"
    code: |
      # urls.py — wbudowane auth URLs
      from django.urls import path, include

      urlpatterns = [
          path('accounts/', include('django.contrib.auth.urls')),
          # Dostarczane URLe:
          # accounts/login/          — LoginView
          # accounts/logout/         — LogoutView
          # accounts/password_change/ — PasswordChangeView
          # accounts/password_reset/  — PasswordResetView
          # accounts/password_reset/done/
          # accounts/reset/<uid>/<token>/ — PasswordResetConfirmView
      ]

      # settings.py
      LOGIN_URL          = '/accounts/login/'
      LOGIN_REDIRECT_URL = '/dashboard/'
      LOGOUT_REDIRECT_URL = '/'

      # Własne view logowania (opcjonalnie)
      from django.contrib.auth import authenticate, login, logout
      from django.contrib.auth.forms import AuthenticationForm

      def login_view(request):
          if request.method == 'POST':
              form = AuthenticationForm(request, data=request.POST)
              if form.is_valid():
                  user = form.get_user()
                  login(request, user)
                  next_url = request.GET.get('next', '/dashboard/')
                  return redirect(next_url)
          else:
              form = AuthenticationForm()
          return render(request, 'registration/login.html', {'form': form})

      def logout_view(request):
          logout(request)
          return redirect('/')
