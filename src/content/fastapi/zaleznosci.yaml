title: Zależności i Middleware

items:
  - name: Depends() — dependency injection
    desc: Depends() wstrzykuje zależność do endpointu. FastAPI wywołuje funkcję zależności automatycznie i przekazuje wynik.
    icon: "💉"
    code: |
      from fastapi import Depends, FastAPI, HTTPException

      app = FastAPI()

      def get_token(token: str):
          if token != "secret123":
              raise HTTPException(status_code=401, detail="Nieprawidłowy token")
          return token

      @app.get("/secure/")
      def secure_endpoint(token: str = Depends(get_token)):
          return {"message": "Dostęp przyznany", "token": token}

  - name: Połączenie z bazą danych
    desc: Klasyczny wzorzec — zależność tworzy sesję DB, yield ją do endpointu, potem zamyka po zakończeniu requestu.
    icon: "🗄️"
    code: |
      from sqlalchemy.orm import Session
      from database import SessionLocal

      def get_db():
          db = SessionLocal()
          try:
              yield db
          finally:
              db.close()

      @app.get("/users/{user_id}")
      def get_user(user_id: int, db: Session = Depends(get_db)):
          user = db.query(User).filter(User.id == user_id).first()
          if not user:
              raise HTTPException(404, "Nie znaleziono")
          return user

  - name: Lifespan — startup i shutdown
    desc: "lifespan zastępuje przestarzałe @app.on_event. Inicjalizuj zasoby (pool DB, cache) przy starcie, zwalniaj przy zamknięciu."
    icon: "🔄"
    code: |
      from contextlib import asynccontextmanager
      from fastapi import FastAPI

      @asynccontextmanager
      async def lifespan(app: FastAPI):
          # startup — raz przy starcie
          print("Łączę z bazą danych...")
          yield
          # shutdown — raz przy zamknięciu
          print("Zamykam połączenia...")

      app = FastAPI(lifespan=lifespan)

  - name: Middleware
    desc: Middleware przechwytuje KAŻDY request i response. Idealne do logowania, CORS, mierzenia czasu.
    icon: "🔀"
    code: |
      import time
      from fastapi import Request

      @app.middleware("http")
      async def add_process_time(request: Request, call_next):
          start = time.time()
          response = await call_next(request)
          duration = time.time() - start
          response.headers["X-Process-Time"] = str(duration)
          return response

  - name: OAuth2 — autoryzacja Bearer
    desc: Gotowy schemat OAuth2PasswordBearer do ochrony endpointów tokenem Bearer.
    icon: "🔐"
    code: |
      from fastapi.security import OAuth2PasswordBearer

      oauth2_scheme = OAuth2PasswordBearer(tokenUrl="token")

      @app.get("/users/me")
      def get_me(token: str = Depends(oauth2_scheme)):
          # tu zdekoduj JWT i znajdź usera
          return {"token": token}

      @app.post("/token")
      def login(form: OAuth2PasswordRequestForm = Depends()):
          # zwaliduj user/pass, zwróć JWT
          return {"access_token": "...", "token_type": "bearer"}

  - name: APIRouter — modularność
    desc: APIRouter pozwala podzielić aplikację na moduły. Każdy router ma własny prefix i tagi w dokumentacji.
    icon: "🗂️"
    code: |
      from fastapi import APIRouter

      # router w osobnym pliku, np. routers/items.py
      router = APIRouter(prefix="/items", tags=["items"])

      @router.get("/")
      def list_items():
          return []

      @router.get("/{id}")
      def get_item(id: int):
          return {"id": id}

      # w main.py:
      # app.include_router(router)
