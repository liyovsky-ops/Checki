title: Materiały

items:
  - name: MeshBasicMaterial — bez oświetlenia
    desc: Najprostszy materiał — wyświetla kolor lub teksturę bez żadnego oświetlenia. Zawsze tak samo jasny niezależnie od lamp. Używany do debugowania, UI 3D, linii pomocniczych.
    icon: "⬜"
    code: |
      const material = new THREE.MeshBasicMaterial({
        color: 0x049ef4,      // hex, CSS string lub THREE.Color
        wireframe: true,      // tylko krawędzie (debug)
        side: THREE.DoubleSide, // renderuj obie strony (domyślnie FrontSide)
        transparent: true,
        opacity: 0.7,
        map: texture,         // tekstura zamiast koloru
      });

      // Zmiana po stworzeniu
      material.color.set(0xff0000);
      material.needsUpdate = true; // wymagane przy niektórych zmianach

  - name: MeshLambertMaterial — wydajny diffuse
    desc: Materiał z oświetleniem dyfuzyjnym (matte, bez połysku). Wydajniejszy niż MeshStandardMaterial — mniej obliczeń per-pixel. Dobry do dużej liczby obiektów (drzewa, budynki tła).
    icon: "🟫"
    code: |
      const material = new THREE.MeshLambertMaterial({
        color: 0x8b4513,
        emissive: 0x1a0800,  // własna emisja światła (bez lampy)
        map: diffuseTexture,
      });

      // Wymaga światła (Ambient + Directional/Point/Spot)
      scene.add(new THREE.AmbientLight(0x404040, 0.4));
      scene.add(new THREE.DirectionalLight(0xffffff, 1));

  - name: MeshStandardMaterial — PBR (standard)
    desc: Physically Based Rendering — metalness/roughness model. Standard dla realistycznej grafiki. Obsługuje wszystkie typy lamp, environment map, AO map. Wolniejszy niż Lambert.
    icon: "🔵"
    code: |
      const material = new THREE.MeshStandardMaterial({
        color: 0xcccccc,
        metalness: 0.8,   // 0 = plastik, 1 = metal
        roughness: 0.2,   // 0 = lustro, 1 = całkowicie matowy

        // Tekstury
        map: albedoTexture,           // kolor bazowy
        normalMap: normalTexture,     // fałszywe nierówności bez dodatkowych poly
        roughnessMap: roughTexture,   // mapa chropowatości
        metalnessMap: metalTexture,   // mapa metaliczności
        aoMap: aoTexture,             // ambient occlusion — cienie w załamaniach
        emissiveMap: emitTexture,     // mapa emisji (świecące fragmenty)
        emissive: new THREE.Color(0x00ff88),
        emissiveIntensity: 0.5,

        envMap: envMapTexture,        // refleksje otoczenia
        envMapIntensity: 1.0,
      });

  - name: MeshPhysicalMaterial — zaawansowany PBR
    desc: "Rozszerzenie MeshStandardMaterial o efekty fizyczne: clearcoat (lakier), transmission (szkło), sheen (jedwab), iridescence (efekt tęczy na bańkach mydlanych). Najwolniejszy z wbudowanych."
    icon: "💎"
    code: |
      // Szkło / kryształ
      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0,
        roughness: 0,
        transmission: 1.0,    // 1 = w pełni przezroczysty jak szkło
        thickness: 0.5,       // grubość dla refrakcji
        ior: 1.5,             // Index of Refraction (szkło = 1.5)
        transparent: true,
      });

      // Lakierowany metal (clearcoat)
      const carPaintMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xff0000,
        metalness: 0.5,
        roughness: 0.3,
        clearcoat: 1.0,           // warstwa lakieru na górze
        clearcoatRoughness: 0.05, // jak gładki lakier
      });

      // Jedwab / velvet
      const fabricMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x8b008b,
        sheen: 1.0,
        sheenColor: new THREE.Color(0xcc88ff),
        sheenRoughness: 0.5,
      });

  - name: ShaderMaterial — własny GLSL
    desc: Pełna kontrola nad renderowaniem przez własne shadery GLSL. Vertex shader + fragment shader. Potężne ale wymagające znajomości GLSL. Uniforms to zmienne przekazywane do GPU.
    icon: "⚡"
    code: |
      const shaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime:  { value: 0.0 },
          uColor: { value: new THREE.Color(0x049ef4) },
        },
        vertexShader: `
          uniform float uTime;
          varying vec2 vUv;

          void main() {
            vUv = uv;
            vec3 pos = position;
            pos.y += sin(pos.x * 3.0 + uTime) * 0.2;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          varying vec2 vUv;

          void main() {
            gl_FragColor = vec4(uColor * vUv.x, 1.0);
          }
        `,
      });

      // Aktualizacja uniformów w pętli
      function animate() {
        shaderMaterial.uniforms.uTime.value += 0.01;
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

  - name: TextureLoader — ładowanie tekstur
    desc: TextureLoader ładuje obrazy (PNG, JPG, WebP) jako tekstury GPU. Wynik przypisuje się do parametrów materiału (map, normalMap itd.). Pamiętaj o dispose() żeby zwolnić VRAM.
    icon: "🖼️"
    code: |
      const textureLoader = new THREE.TextureLoader();

      // Proste ładowanie
      const texture = textureLoader.load('/textures/wood.jpg');

      // Z callbackiem
      textureLoader.load(
        '/textures/brick.jpg',
        (texture) => {
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(4, 4); // 4x powtórzenie
          material.map = texture;
          material.needsUpdate = true;
        },
        undefined,         // onProgress
        (err) => console.error('Błąd ładowania', err)
      );

      // Async/await z Promise
      const tex = await new Promise((resolve, reject) => {
        textureLoader.load(url, resolve, undefined, reject);
      });

  - name: MeshToonMaterial — styl cartoon
    desc: Cel-shading — renderowanie w stylu kreskówki z wyraźnymi skokami tonów zamiast gładkich przejść. Wymaga ToonShading gradient mapy lub działa domyślnie z 3-tonowym przejściem.
    icon: "🎨"
    code: |
      // Prosty cartoon
      const toonMaterial = new THREE.MeshToonMaterial({
        color: 0x049ef4,
      });

      // Własna gradientowa mapa (więcej kroków = bardziej gładki)
      const gradientTexture = new THREE.DataTexture(
        new Uint8Array([0, 64, 128, 192, 255]),  // 5 poziomów jasności
        5, 1,
        THREE.RedFormat
      );
      gradientTexture.magFilter = THREE.NearestFilter; // WAŻNE — ostre krawędzie
      gradientTexture.needsUpdate = true;

      const toonMaterialCustom = new THREE.MeshToonMaterial({
        color: 0xff6600,
        gradientMap: gradientTexture,
      });

  - name: Transparency — przeźroczystość
    desc: Three.js domyślnie renderuje obiekty bez przeźroczystości. transparent:true + opacity < 1 włącza alpha blending. alphaTest odcina piksele poniżej progu — wydajniejsze niż pełna przeźroczystość.
    icon: "👻"
    code: |
      // Opacity — gładka przeźroczystość
      const material = new THREE.MeshStandardMaterial({
        color: 0x049ef4,
        transparent: true,  // MUSISZ ustawić true
        opacity: 0.5,       // 0 = niewidoczny, 1 = pełny
      });

      // alphaTest — odcinanie (wydajniejsze, zero sortowania)
      const leafMaterial = new THREE.MeshBasicMaterial({
        map: leafTexture,
        alphaTest: 0.5,   // piksele < 0.5 alpha są odcinane
        side: THREE.DoubleSide,
      });

      // Kolejność renderowania (ważna dla wielu przeźroczystych obiektów)
      material.depthWrite = false; // nie pisz do depth buffer
      mesh.renderOrder = 1;        // wyższy = renderowany później (na wierzchu)
