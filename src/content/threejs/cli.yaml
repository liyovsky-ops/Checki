title: Three.js — wzorce i API

groups:
  - name: Setup sceny
    icon: "🎬"
    commands:
      - code: |
          import * as THREE from 'three';

          const scene    = new THREE.Scene();
          const camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ antialias: true });

          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          document.body.appendChild(renderer.domElement);

          camera.position.z = 5;
        desc: Podstawowa scena Three.js
        detail:
          what: Trzy fundamenty — Scene (kontener obiektów), Camera (punkt widzenia), Renderer (WebGL output do canvas).
          how: PerspectiveCamera(fov, aspect, near, far). FOV 75° daje naturalny widok. setPixelRatio(min(dpr,2)) zapobiega rozmyciu na Retina bez overkill na 4K.
          tips:
            - 'scene.background = new THREE.Color(0x111111) — kolor tła'
            - 'document.body.style.margin = "0" — usuń margines przeglądarki'

      - code: |
          const renderer = new THREE.WebGLRenderer({
            antialias: true,         // wygładzanie krawędzi (MSAA)
            alpha: true,             // przeźroczyste tło (tło HTML widoczne)
            powerPreference: 'high-performance',
            logarithmicDepthBuffer: true, // eliminuje Z-fighting
          });

          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.outputColorSpace = THREE.SRGBColorSpace; // poprawne kolory
          renderer.toneMapping       = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.0;
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
        desc: Renderer — pełna konfiguracja produkcyjna
        detail:
          what: WebGLRenderer to serce Three.js — tłumaczy scenę na piksele przez WebGL. Każda opcja ma wpływ na jakość lub wydajność.
          how: antialias=true daje MSAA 4x. outputColorSpace=SRGB konieczne od r152+. ACESFilmicToneMapping daje filmowy wygląd kolorów z HDR env map.
          tips:
            - 'alpha:true wymagane gdy chcesz przeźroczyste tło (canvas nakładka na HTML)'
            - 'PCFSoftShadowMap = miękkie cienie; BasicShadowMap = wydajny ale ostry'

      - code: |
          // Render loop — uruchamiaj KAŻDĄ klatkę
          const clock = new THREE.Clock();

          function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta(); // czas od ostatniej klatki (sekundy)

            // Aktualizuj fizykę i animacje przez delta (frame-rate independent!)
            mesh.rotation.y += 1.0 * delta; // 1 radian/sekunda — zawsze

            renderer.render(scene, camera);
          }

          animate(); // uruchom pętlę
        desc: Pętla animacji z delta time
        detail:
          what: requestAnimationFrame wywołuje callback przed każdym malowaniem ekranu (~60fps). delta time gwarantuje tę samą prędkość animacji niezależnie od FPS.
          how: "Bez delta time: rotation.y += 0.01 da inne prędkości na 30fps vs 144fps. Z delta: rotation.y += speed * delta zawsze taka sama prędkość."
          tips:
            - 'clock.getElapsedTime() — całkowity czas od startu (do efektów sinusoidalnych)'
            - 'cancelAnimationFrame(animId) — zatrzymaj pętlę (cleanup React component)'

      - code: |
          // Responsywny canvas — reaguje na zmianę rozmiaru okna
          function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); // WYMAGANE po zmianie parametrów

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          }

          window.addEventListener('resize', onResize);

          // W React — cleanup
          // useEffect(() => {
          //   window.addEventListener('resize', onResize);
          //   return () => window.removeEventListener('resize', onResize);
          // }, []);
        desc: Resize handler — responsywny canvas
        detail:
          what: Three.js nie reaguje automatycznie na zmianę rozmiaru okna. Musisz ręcznie zaktualizować aspect kamery i rozmiar renderera.
          how: camera.updateProjectionMatrix() musi być wywołane po każdej zmianie FOV, near, far lub aspect — inaczej obraz będzie zniekształcony.
          tips:
            - 'Użyj ResizeObserver zamiast window resize dla canvas w kontenerze (nie fullscreen)'
            - 'renderer.setPixelRatio przy resize — użytkownik może przeciągnąć okno między monitorami'

      - code: |
          // canvas w konkretnym kontenerze (nie fullscreen)
          const container = document.getElementById('canvas-container');

          const renderer = new THREE.WebGLRenderer({ antialias: true });
          container.appendChild(renderer.domElement);

          function updateSize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          }

          const resizeObserver = new ResizeObserver(updateSize);
          resizeObserver.observe(container);
          updateSize(); // inicjalny rozmiar
        desc: Canvas w kontenerze (nie fullscreen)
        detail:
          what: Gdy Three.js renderuje w div-ie zamiast fullscreen, musisz obserwować rozmiar kontenera, nie okna.
          how: ResizeObserver jest dokładniejszy od window.resize — reaguje gdy kontener zmienia rozmiar niezależnie od okna.
          tips:
            - 'resizeObserver.disconnect() — cleanup gdy komponent unmontowany'
            - 'renderer.domElement.style.display = "block" — usuwa dolny margines canvas'

  - name: Geometria i Mesh
    icon: "📐"
    commands:
      - code: |
          // Podstawowe geometrie wbudowane
          const box      = new THREE.BoxGeometry(1, 1, 1);           // (w, h, d)
          const sphere   = new THREE.SphereGeometry(0.5, 32, 16);   // (r, widthSeg, heightSeg)
          const plane    = new THREE.PlaneGeometry(2, 2, 10, 10);   // (w, h, wSeg, hSeg)
          const cylinder = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); // (rTop, rBot, h, seg)
          const torus    = new THREE.TorusGeometry(0.5, 0.2, 16, 32);   // (r, tube, radSeg, tubSeg)
          const cone     = new THREE.ConeGeometry(0.5, 1, 32);          // (r, h, seg)

          const material = new THREE.MeshStandardMaterial({ color: 0x049ef4 });
          const mesh     = new THREE.Mesh(box, material);
          scene.add(mesh);
        desc: Wbudowane geometrie — BoxGeometry, SphereGeometry i inne
        detail:
          what: Three.js dostarcza ~20 gotowych geometrii. Segmenty (32, 16) określają gładkość — więcej = ładniej ale wolniej. Geometrie są automatycznie buforowane przez GPU.
          how: Pierwszy argument SphereGeometry to promień, potem segmenty szerokości i wysokości. Minimum 8-16 segmentów dla gładkiej kuli.
          tips:
            - 'Małe obiekty tła — używaj mniej segmentów (8-16) dla wydajności'
            - 'geometry.dispose() — zwolnij VRAM gdy mesh usunięty ze sceny'

      - code: |
          // TorusKnot — skomplikowany węzeł toroidalny
          const knotGeo = new THREE.TorusKnotGeometry(0.5, 0.15, 200, 20, 2, 3);

          // Icosahedron — wielościan regularny (bardziej równomierny od sfery)
          const icoGeo = new THREE.IcosahedronGeometry(0.5, 3); // (r, detail)

          // Lathe — bryła obrotowa z krzywej 2D
          const points = [];
          for (let i = 0; i < 10; i++) {
            points.push(new THREE.Vector2(Math.sin(i * 0.2) * 0.3 + 0.2, i * 0.1));
          }
          const latheGeo = new THREE.LatheGeometry(points, 32);

          // Extrude Shape — wytłaczanie kształtu 2D do 3D
          const shape = new THREE.Shape();
          shape.moveTo(0, 0);
          shape.lineTo(1, 0);
          shape.lineTo(1, 1);
          shape.lineTo(0, 1);
          shape.closePath();

          const extrudeSettings = { depth: 0.5, bevelEnabled: true, bevelSize: 0.1 };
          const extrudeGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        desc: Zaawansowane geometrie — TorusKnot, Lathe, Extrude
        detail:
          what: Three.js oferuje geometrie proceduralne — LatheGeometry tworzy bryły obrotowe (wazy, butelki), ExtrudeGeometry wytłacza 2D shapes do 3D (napisy, loga).
          how: LatheGeometry przyjmuje tablicę punktów Vector2 definiujących profil i obraca je 360°. Extrude wymaga THREE.Shape — działa jak svg path.
          tips:
            - 'THREE.Font + TextGeometry — renderowanie tekstu 3D z pliku .typeface.json'
            - 'THREE.ShapeGeometry(shape) — płaski kształt 2D bez wytłaczania'

      - code: |
          // BufferGeometry — własna geometria z wierzchołków
          const geometry = new THREE.BufferGeometry();

          // Trójkąt
          const vertices = new Float32Array([
            -0.5, -0.5, 0,  // wierzchołek 0
             0.5, -0.5, 0,  // wierzchołek 1
             0,   0.5,  0,  // wierzchołek 2
          ]);

          geometry.setAttribute(
            'position',
            new THREE.BufferAttribute(vertices, 3) // 3 floaty na wierzchołek
          );

          // UV coordinates (opcjonalne — dla tekstur)
          const uvs = new Float32Array([0, 0, 1, 0, 0.5, 1]);
          geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

          // Normalne (wymagane dla MeshStandardMaterial)
          geometry.computeVertexNormals();

          const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
          scene.add(mesh);
        desc: BufferGeometry — własna geometria z Float32Array
        detail:
          what: BufferGeometry to fundament wszystkich geometrii Three.js. Dane wierzchołków (position, normal, uv, color) przechowujesz w Float32Array i wysyłasz bezpośrednio do GPU.
          how: setAttribute('position', new BufferAttribute(array, 3)) — 3 = liczba komponentów na wierzchołek (x,y,z). computeVertexNormals() automatycznie oblicza normalne z pozycji.
          tips:
            - 'geometry.setIndex(indices) — indeksowane wierzchołki (oszczędza pamięć GPU)'
            - 'attribute.needsUpdate = true — gdy modyfikujesz dane po stworzeniu'

      - code: |
          // Proceduralna siatka terenu
          const width = 10, height = 10;
          const widthSeg = 50, heightSeg = 50;

          const geometry = new THREE.PlaneGeometry(width, height, widthSeg, heightSeg);
          geometry.rotateX(-Math.PI / 2); // płasko jak podłoga

          const posAttr = geometry.attributes.position;

          for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            const z = posAttr.getZ(i);
            // Simplex/Perlin noise dla naturalnego terenu
            const y = Math.sin(x * 0.5) * Math.cos(z * 0.5) * 1.5;
            posAttr.setY(i, y);
          }

          geometry.computeVertexNormals(); // przelicz normalne po modyfikacji
          posAttr.needsUpdate = true;
        desc: Modyfikacja wierzchołków — proceduralny teren
        detail:
          what: Możesz modyfikować pozycje wierzchołków istniejącej geometrii po jej stworzeniu — proceduralne animacje, symulacje wody, morphing.
          how: geometry.attributes.position zwraca BufferAttribute. getX/getY/getZ/setY umożliwiają odczyt i zapis per-wierzchołek. computeVertexNormals() musi być wywołane po modyfikacji.
          tips:
            - 'npm install simplex-noise — Simplex Noise do naturalnie wyglądającego terenu'
            - 'Animuj teren w pętli: setY(i, noise(x + time)) + needsUpdate = true każdą klatkę'

      - code: |
          // Points — cząstki / gwiazdy / efekty
          const count = 5000;
          const positions = new Float32Array(count * 3);

          for (let i = 0; i < count; i++) {
            positions[i * 3]     = (Math.random() - 0.5) * 20; // x
            positions[i * 3 + 1] = (Math.random() - 0.5) * 20; // y
            positions[i * 3 + 2] = (Math.random() - 0.5) * 20; // z
          }

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

          const material = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xffffff,
            sizeAttenuation: true, // mniejsze punkty dalej od kamery
            map: starTexture,
            alphaTest: 0.5,
          });

          const particles = new THREE.Points(geometry, material);
          scene.add(particles);
        desc: Points — system cząsteczek / pole gwiazd
        detail:
          what: THREE.Points renderuje każdy wierzchołek geometrii jako punkt (punkt na ekranie). Wydajny sposób na tysiące cząstek — 50k punktów to jeden draw call.
          how: PointsMaterial.size to rozmiar punktu w jednostkach świata (lub pikselach jeśli sizeAttenuation=false). alphaTest=0.5 odcina przeźroczysty obszar tekstury.
          tips:
            - 'sizeAttenuation: false — stały rozmiar niezależnie od odległości (2D UI overlay)'
            - 'Aktualizuj pozycje każdą klatkę: posAttr.needsUpdate = true dla animacji'

      - code: |
          import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

          // Połącz wiele geometrii w jedną — ogromna optymalizacja
          const geometries = [];

          for (let i = 0; i < 1000; i++) {
            const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            // Przesuń każdą geometrię (wierzchołki w world space)
            geo.translate(
              (Math.random() - 0.5) * 10,
              (Math.random() - 0.5) * 10,
              (Math.random() - 0.5) * 10
            );
            geometries.push(geo);
          }

          const merged = mergeGeometries(geometries);
          const mesh   = new THREE.Mesh(merged, material);
          scene.add(mesh);

          // Zwolnij oryginały
          geometries.forEach(g => g.dispose());
        desc: mergeGeometries — łączenie geometrii (optymalizacja draw calls)
        detail:
          what: Każdy Mesh = 1 draw call. 1000 meshy = 1000 draw calls = wolno. mergeGeometries łączy wiele geometrii w jedną = 1 draw call. Ogromna różnica wydajności.
          how: geo.translate() przesuwa wierzchołki w przestrzeni lokalnej przed scaleniem — inaczej wszystkie lądują w centrum (0,0,0).
          tips:
            - 'Sprawdź: renderer.info.render.calls — liczba draw calls w ostatniej klatce'
            - 'Merge działa tylko gdy wszystkie obiekty mają ten sam material'

  - name: Materiały
    icon: "🎨"
    commands:
      - code: |
          // MeshStandardMaterial — PBR metalness/roughness (standard 2024)
          const material = new THREE.MeshStandardMaterial({
            color: new THREE.Color('#049ef4'),
            metalness: 0.0,   // 0=plastik, 1=metal (nie używaj pomiędzy!)
            roughness: 0.5,   // 0=lustro, 1=całkowicie matowy
            envMapIntensity: 1.0, // siła refleksji env map
          });

          // Zmiana parametrów w runtime
          material.color.set(0xff0000);
          material.metalness  = 1.0;
          material.roughness  = 0.1;
          // material.needsUpdate = true — NIE potrzebne dla tych właściwości
        desc: MeshStandardMaterial — PBR podstawy
        detail:
          what: Physically Based Rendering — materiał który zachowuje się jak prawdziwe materiały fizyczne. Metalness/roughness to najpopularniejszy model PBR (vs specular/glossiness).
          how: "Zasada: metale mają metalness=1 i dowolny roughness. Niemetale mają metalness=0. Wartości pomiędzy są dla \"zardzewiałego metalu\" itd."
          tips:
            - 'Bez envMap metalMaterial wygląda płasko — dodaj Environment map dla refleksji'
            - 'color: 0x000000 dla czarnego metalu (lśniący) + metalness:1 + roughness:0'

      - code: |
          // Ładowanie tekstur PBR
          const loader = new THREE.TextureLoader();

          const albedo    = loader.load('/textures/metal/albedo.jpg');
          const normal    = loader.load('/textures/metal/normal.jpg');
          const roughness = loader.load('/textures/metal/roughness.jpg');
          const metalness = loader.load('/textures/metal/metalness.jpg');
          const ao        = loader.load('/textures/metal/ao.jpg');

          // Ustawienia powtarzania
          [albedo, normal, roughness, metalness, ao].forEach(t => {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(2, 2);
          });

          const material = new THREE.MeshStandardMaterial({
            map:          albedo,
            normalMap:    normal,
            roughnessMap: roughness,
            metalnessMap: metalness,
            aoMap:        ao,
            aoMapIntensity: 1.0,
          });

          // Mesh musi mieć UV2 dla aoMap
          mesh.geometry.setAttribute('uv2', mesh.geometry.attributes.uv);
        desc: Zestaw tekstur PBR — albedo, normal, roughness, metalness, AO
        detail:
          what: Realistyczne materiały wymagają zestawu map tekstur. Normal map symuluje drobne nierówności bez dodatkowych polygonów. AO map dodaje cienie w szczelинach.
          how: RepeatWrapping pozwala powtarzać teksturę na dużych powierzchniach. UV2 to drugi zestaw koordynatów UV wymagany przez aoMap.
          tips:
            - 'Darmowe tekstury PBR: ambientcg.com, polyhaven.com — wszystkie CC0'
            - 'normalMap.encoding = THREE.LinearEncoding — normalne NIE są w sRGB!'

      - code: |
          // Environment Map — HDRI refleksje ze wszystkich stron
          import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
          import { PMREMGenerator } from 'three';

          const pmremGenerator = new THREE.PMREMGenerator(renderer);
          pmremGenerator.compileEquirectangularShader();

          new RGBELoader()
            .setPath('/hdri/')
            .load('studio.hdr', (hdrTexture) => {
              const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;

              scene.background = envMap;    // tło
              scene.environment = envMap;   // refleksje na WSZYSTKICH materialach

              hdrTexture.dispose();
              pmremGenerator.dispose();
            });
        desc: Environment Map (HDRI) — refleksje i tło
        detail:
          what: HDRI (High Dynamic Range Image) to panoramiczne zdjęcie otoczenia używane jako źródło refleksji. scene.environment automatycznie aplikuje refleksje na wszystkich materialach z envMapIntensity > 0.
          how: PMREMGenerator konwertuje equirectangular HDRI do cube map którą GPU może próbkować. .hdr to format 32-bit float (HDR) — lepsze refleksje niż .jpg.
          tips:
            - 'Darmowe HDRI: polyhaven.com/hdris — pełna kolekcja CC0'
            - 'scene.backgroundBlurriness = 0.5 — rozmyj tło nie wpływając na refleksje'

      - code: |
          // ShaderMaterial — fale sinusoidalne na siatce
          const waterMaterial = new THREE.ShaderMaterial({
            uniforms: {
              uTime:      { value: 0 },
              uBigWavesElevation:  { value: 0.2 },
              uBigWavesFrequency: { value: new THREE.Vector2(4, 1.5) },
              uBigWavesSpeed:     { value: 0.75 },
              uDepthColor:        { value: new THREE.Color('#186691') },
              uSurfaceColor:      { value: new THREE.Color('#9bd8ff') },
            },
            vertexShader: `
              uniform float uTime;
              uniform float uBigWavesElevation;
              uniform vec2  uBigWavesFrequency;
              uniform float uBigWavesSpeed;
              varying float vElevation;

              void main() {
                vec4 modelPosition = modelMatrix * vec4(position, 1.0);
                float elevation = sin(modelPosition.x * uBigWavesFrequency.x + uTime * uBigWavesSpeed)
                                * sin(modelPosition.z * uBigWavesFrequency.y + uTime * uBigWavesSpeed)
                                * uBigWavesElevation;
                modelPosition.y += elevation;
                vElevation = elevation;
                gl_Position = projectionMatrix * viewMatrix * modelPosition;
              }
            `,
            fragmentShader: `
              uniform vec3  uDepthColor;
              uniform vec3  uSurfaceColor;
              varying float vElevation;

              void main() {
                float mixStrength = (vElevation + 0.2) * 3.0;
                vec3  color = mix(uDepthColor, uSurfaceColor, mixStrength);
                gl_FragColor = vec4(color, 1.0);
              }
            `,
          });

          // W pętli:
          waterMaterial.uniforms.uTime.value = clock.getElapsedTime();
        desc: ShaderMaterial — animowane fale (GLSL vertex shader)
        detail:
          what: Vertex shader może przesuwać wierzchołki na GPU w czasie rzeczywistym — bez żadnego kosztu CPU. Tutaj symulacja wody przez funkcje sinus na osi Y.
          how: varying vElevation przekazuje wysokość z vertex do fragment shadera — używamy jej do miksowania koloru głębokiej i płytkiej wody.
          tips:
            - 'modelMatrix * vec4(position, 1.0) — position w world space (po transformacjach mesha)'
            - 'Three.js automatycznie injectuje: projectionMatrix, viewMatrix, modelMatrix, position, uv, normal'

      - code: |
          // MeshPhysicalMaterial — szkło / refrakcja
          const glassMaterial = new THREE.MeshPhysicalMaterial({
            color:        0xffffff,
            metalness:    0,
            roughness:    0,
            transmission: 1.0,   // 1 = przezroczyste jak szkło
            thickness:    0.5,   // grubość dla efektu refrakcji
            ior:          1.5,   // index of refraction (szkło=1.5, woda=1.33, diament=2.42)
            transparent:  true,
            envMapIntensity: 1.5,
          });

          // Konieczne dla transmission:
          renderer.capabilities.isWebGL2; // WebGL2 wymagane
          // Dodaj do renderera:
          // new THREE.WebGLRenderer({ ... }) — WebGL2 domyślnie w nowoczesnych przegl.
        desc: MeshPhysicalMaterial — szkło z refrakcją
        detail:
          what: transmission symuluje przepuszczanie światła przez materiał (szkło, kryształ, woda). ior (Index of Refraction) określa jak bardzo światło ugina się przechodząc przez materiał.
          how: Transmission wymaga WebGL2 i osobnego render pass — Three.js obsługuje to automatycznie gdy transmission > 0. Wymaga envMap dla realistycznych wyników.
          tips:
            - 'ior: 1.0 = brak refrakcji, 1.5 = szkło, 2.42 = diament'
            - 'thickness: 0 = flat glass, > 0 = gruba bryła z silniejszą refrakcją'

      - code: |
          // Animowany gradient — DataTexture jako kolor dynamiczny
          const size = 256;
          const data = new Uint8Array(size * size * 4); // RGBA

          for (let i = 0; i < size * size; i++) {
            const x = (i % size) / size;
            const y = Math.floor(i / size) / size;
            data[i * 4]     = x * 255;         // R
            data[i * 4 + 1] = y * 255;         // G
            data[i * 4 + 2] = (1 - x) * 255;  // B
            data[i * 4 + 3] = 255;             // A (opacity)
          }

          const gradientTexture = new THREE.DataTexture(data, size, size);
          gradientTexture.needsUpdate = true;

          const material = new THREE.MeshBasicMaterial({
            map: gradientTexture,
          });
        desc: DataTexture — programowy gradient / proceduralna tekstura
        detail:
          what: DataTexture pozwala tworzyć tekstury bezpośrednio z Uint8Array bez ładowania pliku. Idealne do proceduralnych wzorców, map gradientów, noise textures.
          how: Uint8Array o rozmiarze width * height * 4 (RGBA). Każde 4 bajty = jeden piksel (R,G,B,A od 0 do 255).
          tips:
            - 'THREE.FloatType + Float32Array — 32-bit precision dla HDR lub obliczeń naukowych'
            - 'texture.needsUpdate = true — wymagane po ręcznej modyfikacji danych'

  - name: Oświetlenie
    icon: "💡"
    commands:
      - code: |
          // AmbientLight — równomierne globalne oświetlenie (brak cieni)
