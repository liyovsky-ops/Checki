  - name: Pętla animacji
    icon: "🔄"
    commands:
      - code: |
          // requestAnimationFrame — standardowa pętla
          let animationId;

          function animate() {
            animationId = requestAnimationFrame(animate);

            // Aktualizacje sceny
            cube.rotation.y += 0.01;

            renderer.render(scene, camera);
          }

          animate();

          // Zatrzymanie (np. cleanup React useEffect)
          // cancelAnimationFrame(animationId);
        desc: requestAnimationFrame — podstawowa pętla renderowania
        detail:
          what: requestAnimationFrame synchronizuje rendering z odświeżaniem ekranu (60fps, 120fps, 144fps). Przeglądarka automatycznie pauzuje gdy zakładka nieaktywna — oszczędza CPU/GPU.
          how: Zapisz ID z requestAnimationFrame — możesz go anulować przez cancelAnimationFrame(id). Kluczowe przy React/Vue gdzie komponenty się odmontowują.
          tips:
            - 'requestAnimationFrame wywołuje callback z timestamp (milliseconds) — możesz go użyć do delta'
            - 'Nigdy nie używaj setInterval do renderowania 3D — nie synchronizuje się z ekranem'

      - code: |
          // Clock — precyzyjny czas dla animacji
          const clock = new THREE.Clock();

          function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime(); // od startu (sekundy)
            const delta       = clock.getDelta();        // od ostatniego wywołania

            // Frame-rate independent movement (zawsze ta sama prędkość)
            mesh.position.x = Math.sin(elapsedTime) * 2; // oscylacja

            // Ruch z prędkością 2 jednostki/sekunda — niezależny od FPS
            mesh.position.z += 2.0 * delta;

            renderer.render(scene, camera);
          }

          // UWAGA: clock.getDelta() zwraca 0 jeśli wywołasz dwa razy w tej samej klatce!
          // Wywołuj getDelta() TYLKO raz na klatkę na początku animate()
        desc: THREE.Clock — delta time i elapsed time
        detail:
          what: THREE.Clock to wrapper na Date.now(). getDelta() zwraca czas od ostatniego wywołania (sekundy). getElapsedTime() to całkowity czas od stworzenia clocka.
          how: "Zasada: używaj delta dla ruchu (speed × delta), elapsedTime dla oscylacji (sin/cos — nie dryftuje z czasem jak += delta accumulator)."
          tips:
            - 'Zatrzymaj clock: clock.stop() / wznów: clock.start()'
            - 'Dla multiplayer/fizyki — synchronizuj czas z serwerem, nie używaj lokalnego Clock'

      - code: |
          // AnimationMixer — skeletal animation z GLTF
          import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

          const loader  = new GLTFLoader();
          let   mixer;

          loader.load('/models/character.glb', (gltf) => {
            scene.add(gltf.scene);

            mixer = new THREE.AnimationMixer(gltf.scene);

            // Odtwarzaj animację "Walk"
            const walkClip   = THREE.AnimationClip.findByName(gltf.animations, 'Walk');
            const walkAction = mixer.clipAction(walkClip);
            walkAction.play();

            // Inny clip
            const idleAction = mixer.clipAction(gltf.animations[0]);
            idleAction.play();
          });

          function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta); // WYMAGANE każdą klatkę

            renderer.render(scene, camera);
          }
        desc: AnimationMixer — odtwarzanie animacji szkieletowych z GLTF
        detail:
          what: AnimationMixer zarządza klipami animacji z pliku .glb. Animuje kości (skeleton), morphs i wartości dowolnych właściwości. Wymaga mixer.update(delta) każdą klatkę.
          how: clipAction(clip) zwraca AnimationAction — kontrolujesz play/pause/stop/setLoop. Jeden mixer obsługuje wszystkie animacje jednego obiektu (i jego dzieci).
          tips:
            - 'action.setLoop(THREE.LoopOnce) + action.clampWhenFinished = true — zagraj raz i zostań na końcu'
            - 'action.crossFadeTo(otherAction, 0.3) — płynne przejście między animacjami w 0.3s'

      - code: |
          // GSAP z Three.js — tweening właściwości obiektów 3D
          import gsap from 'gsap';

          // Animuj pozycję w 1 sekundę
          gsap.to(mesh.position, {
            x: 3,
            duration: 1,
            ease: 'power2.out',
          });

          // Animuj obrót
          gsap.to(mesh.rotation, {
            y: Math.PI * 2, // pełny obrót 360°
            duration: 2,
            repeat: -1,     // nieskończone powtarzanie
            ease: 'none',
          });

          // Timeline — sekwencja animacji
          const tl = gsap.timeline();
          tl.to(mesh.position, { y: 2, duration: 0.5 })
            .to(mesh.rotation, { y: Math.PI, duration: 0.3 })
            .to(mesh.position, { y: 0, duration: 0.5, ease: 'bounce.out' });
        desc: GSAP — tweening i timeline animacji
        detail:
          what: GSAP (GreenSock Animation Platform) to profesjonalna biblioteka do tweeningu. Doskonale współpracuje z Three.js — animuje dowolne właściwości numeryczne obiektów 3D.
          how: gsap.to(object, props) interpoluje właściwości od obecnej wartości do docelowej. ease określa krzywą interpolacji (power2.out, bounce.out, elastic itd.).
          tips:
            - 'npm install gsap — darmowy dla większości zastosowań'
            - 'gsap.ticker.add(() => renderer.render(scene, camera)) — GSAP może zastąpić requestAnimationFrame'

      - code: |
          // Morphing między kształtami (morph targets)
          // Geometria musi mieć morphAttributes.position

          const geometry = new THREE.SphereGeometry(1, 32, 32);

          // Stwórz morph target (np. rozciągnięta kula = jajko)
          const posAttr = geometry.attributes.position;
          const morphPositions = new Float32Array(posAttr.array.length);

          for (let i = 0; i < posAttr.count; i++) {
            morphPositions[i * 3]     = posAttr.getX(i) * 1.5; // rozciągnij X
            morphPositions[i * 3 + 1] = posAttr.getY(i) * 0.5; // ściśnij Y
            morphPositions[i * 3 + 2] = posAttr.getZ(i) * 1.5;
          }

          geometry.morphAttributes.position = [
            new THREE.BufferAttribute(morphPositions, 3),
          ];

          const mesh = new THREE.Mesh(geometry, material);
          mesh.morphTargetInfluences[0] = 0; // 0 = oryginał, 1 = morph target
          scene.add(mesh);

          // Animuj morph
          gsap.to(mesh.morphTargetInfluences, { '0': 1, duration: 2, yoyo: true, repeat: -1 });
        desc: Morph Targets — interpolacja między kształtami geometrii
        detail:
          what: Morph targets (blend shapes) pozwalają na interpolację między różnymi kształtami tej samej topologii. Używane do animacji mimiki twarzy, deformacji organicznych.
          how: geometry.morphAttributes.position = tablica alternatywnych pozycji wierzchołków. mesh.morphTargetInfluences[i] kontroluje wagi mieszania (0-1).
          tips:
            - 'GLTF modele z Blendera mogą zawierać morph targets — THREE.js obsługuje je automatycznie'
            - 'mesh.updateMorphTargets() — wymagane po ręcznym stworzeniu morph targets'

