  - name: Interakcja
    icon: "🖱️"
    commands:
      - code: |
          // Raycaster — wykrywanie kliknięć na obiektach 3D
          const raycaster = new THREE.Raycaster();
          const mouse     = new THREE.Vector2();

          window.addEventListener('mousemove', (event) => {
            // Normalizuj pozycję myszy do [-1, 1]
            mouse.x = (event.clientX / window.innerWidth)  * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1; // Y odwrócone
          });

          function animate() {
            requestAnimationFrame(animate);

            // Aktualizuj ray z pozycji myszy i kamery
            raycaster.setFromCamera(mouse, camera);

            // Sprawdź przecięcia (true = sprawdzaj dzieci)
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
              const hit = intersects[0]; // najbliższy obiekt
              console.log('Trafiono:', hit.object.name);
              console.log('Punkt trafienia:', hit.point);   // Vector3
              console.log('Odległość:', hit.distance);
              hit.object.material.color.set(0xff0000); // podświetl
            }

            renderer.render(scene, camera);
          }
        desc: Raycaster — mouse picking, klikanie obiektów 3D
        detail:
          what: Raycaster emituje promień z pozycji myszy przez scenę i zwraca listę obiektów które przecina. Standardowy sposób obsługi kliknięć i hover w scenach 3D.
          how: mouse.x/y muszą być w zakresie [-1,1] (NDC). Uwaga na Y — w DOM Y rośnie w dół, w NDC rośnie w górę — stąd negacja.
          tips:
            - 'intersects[0] = najbliższy obiekt (najmniejsza distance). Tablica posortowana'
            - 'raycaster.intersectObject(specificMesh) — sprawdź tylko konkretny obiekt (szybciej)'

      - code: |
          import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

          const controls = new OrbitControls(camera, renderer.domElement);

          // Konfiguracja
          controls.enableDamping  = true;  // płynna inercja (WYMAGANE: controls.update() w animate)
          controls.dampingFactor  = 0.05;
          controls.enablePan      = true;  // pan myszą (środkowy przycisk)
          controls.enableZoom     = true;
          controls.autoRotate     = false; // automatyczna rotacja
          controls.autoRotateSpeed = 2.0;

          // Ograniczenia
          controls.minDistance = 2;           // minimalny zoom
          controls.maxDistance = 20;          // maksymalny zoom
          controls.maxPolarAngle = Math.PI / 2; // nie można patrzeć pod podłogę

          // Zapis i odtwarzanie stanu kamery
          controls.saveState();   // zapisz
          controls.reset();       // przywróć zapisany stan

          function animate() {
            requestAnimationFrame(animate);
            controls.update(); // WYMAGANE gdy enableDamping = true
            renderer.render(scene, camera);
          }
        desc: OrbitControls — obracanie kamery myszą
        detail:
          what: OrbitControls umożliwia orbitowanie kamery wokół punktu docelowego (target). Lewy przycisk = obrót, środkowy = pan, scroll = zoom.
          how: controls.update() MUSI być wywoływane każdą klatkę gdy enableDamping=true. Bez update() inercja nie działa.
          tips:
            - 'controls.target.set(0, 1, 0) — zmień punkt orbity (domyślnie 0,0,0)'
            - 'controls.addEventListener("change", render) — render on-demand bez pętli (oszczędność CPU)'

      - code: |
          import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

          const controls = new PointerLockControls(camera, document.body);

          // Zablokuj kursor na kliknięcie
          document.addEventListener('click', () => controls.lock());

          controls.addEventListener('lock',   () => console.log('FPS mode ON'));
          controls.addEventListener('unlock', () => console.log('FPS mode OFF'));

          // Ruch WASD
          const keys = {};
          document.addEventListener('keydown', (e) => { keys[e.code] = true; });
          document.addEventListener('keyup',   (e) => { keys[e.code] = false; });

          function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
              const speed = 0.1;
              if (keys['KeyW']) controls.moveForward(speed);
              if (keys['KeyS']) controls.moveForward(-speed);
              if (keys['KeyA']) controls.moveRight(-speed);
              if (keys['KeyD']) controls.moveRight(speed);
            }
            renderer.render(scene, camera);
          }
        desc: PointerLockControls — kamera FPS (first person)
        detail:
          what: PointerLockControls blokuje kursor myszy na canvas i używa jej ruchu do obracania kamery jak w grze FPS. Wymaga kliknięcia użytkownika (polityka przeglądarek).
          how: controls.lock() prosi przeglądarkę o zablokowanie kursora. Escape odblokowuje. isLocked sprawdza czy kursor jest zablokowany przed ruchem.
          tips:
            - 'delta = clock.getDelta() → controls.moveForward(speed * delta) — frame-rate independent'
            - 'FlyControls to alternatywa bez grawitacji (loty, eksploracja kosmosu)'

      - code: |
          import { DragControls } from 'three/addons/controls/DragControls.js';

          const draggableObjects = [cube, sphere, torus];

          const dragControls = new DragControls(
            draggableObjects,
            camera,
            renderer.domElement
          );

          dragControls.addEventListener('dragstart', (event) => {
            orbitControls.enabled = false; // wyłącz OrbitControls podczas drag
            event.object.material.emissive.set(0x44aa88);
          });

          dragControls.addEventListener('drag', (event) => {
            // event.object.position — aktualizowana automatycznie
            console.log('Przesuwam:', event.object.position);
          });

          dragControls.addEventListener('dragend', (event) => {
            orbitControls.enabled = true; // przywróć OrbitControls
            event.object.material.emissive.set(0x000000);
          });
        desc: DragControls — przeciąganie obiektów 3D myszą
        detail:
          what: DragControls pozwala użytkownikowi przeciągać wybrane obiekty 3D myszą. Automatycznie obsługuje raycasting i aktualizację pozycji.
          how: Przekaż tablicę obiektów które można przeciągać. Przy DragControls + OrbitControls wyłącz orbit podczas drag żeby nie wchodziły w konflikt.
          tips:
            - 'Drag ograniczony do płaszczyzny XZ: dragControls.transformGroup = false'
            - 'Ograniczanie ruchu: w evencie drag — snapowanie do siatki, boundingBox'

      - code: |
          // Klikanie z tooltipem i highlight
          const highlightMaterial = new THREE.MeshStandardMaterial({
            color: 0xffff00, emissive: 0x444400
          });
          const originalMaterials = new Map();
          let   hoveredObject = null;

          window.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactiveObjects);

            if (hits.length > 0) {
              const obj = hits[0].object;
              console.log(`Kliknięto: ${obj.name}`);
              // Dispatch custom event
              obj.dispatchEvent({ type: 'click', object: obj });
            }
          });

          window.addEventListener('mousemove', () => {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactiveObjects);

            if (hits.length > 0) {
              const obj = hits[0].object;
              if (obj !== hoveredObject) {
                if (hoveredObject) hoveredObject.material = originalMaterials.get(hoveredObject);
                originalMaterials.set(obj, obj.material);
                obj.material  = highlightMaterial;
                hoveredObject = obj;
                document.body.style.cursor = 'pointer';
              }
            } else {
              if (hoveredObject) hoveredObject.material = originalMaterials.get(hoveredObject);
              hoveredObject = null;
              document.body.style.cursor = 'default';
            }
          });
        desc: Hover highlight i klikanie — interaktywne obiekty
        detail:
          what: Kombinacja Raycaster + material swap tworzy efekt podświetlenia przy najechaniu — standard dla interaktywnych konfiguratorów 3D i gier.
          how: Przechowuj oryginalne materiały w Map żeby móc je przywrócić. Porównuj z hoveredObject żeby nie zmieniać materiału wielokrotnie na tym samym obiekcie.
          tips:
            - 'document.body.style.cursor = "pointer" — sygnalizuje klikalność użytkownikowi'
            - 'Grupuj interaktywne obiekty w osobną tablicę — raycaster sprawdza tylko je (wydajność)'

  - name: Postprocessing i efekty
    icon: "✨"
    commands:
      - code: |
          import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
          import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
          import { ShaderPass }      from 'three/addons/postprocessing/ShaderPass.js';

          // Setup EffectComposer
          const composer = new EffectComposer(renderer);

          // Pierwszy pass: renderuj scenę normalnie
          const renderPass = new RenderPass(scene, camera);
          composer.addPass(renderPass);

          // W pętli animacji — compositor zamiast renderer
          function animate() {
            requestAnimationFrame(animate);
            // ZAMIAST: renderer.render(scene, camera);
            composer.render();
          }
        desc: EffectComposer — setup pipeline postprocessingu
        detail:
          what: EffectComposer zastępuje bezpośrednie renderer.render(). Renderuje scenę do FBO (framebuffer object), a potem przepuszcza przez łańcuch ShaderPass-ów.
          how: RenderPass musi być PIERWSZYM passem — renderuje scenę Three.js. Następne passy (BloomPass, FXAA itd.) przetwarzają wynik jak filtry fotograficzne.
          tips:
            - 'composer.setSize(w, h) — nie zapomnij przy resize (tak samo jak renderer)'
            - 'Porównanie wydajności: każdy pass = dodatkowy fullscreen quad render'

      - code: |
          import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

          const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,  // strength — siła blooma
            0.4,  // radius — rozmycie
            0.85  // threshold — próg jasności (0-1)
          );

          composer.addPass(bloomPass);

          // Tweak w runtime
          bloomPass.strength   = 2.0;
          bloomPass.radius     = 0.5;
          bloomPass.threshold  = 0.7;

          // Selective bloom — tylko emissive obiekty świecą
          // Ustaw mesh.layers.enable(1) i bloomPass tylko na layerze 1
          // (zaawansowane — wymaga dwóch composerów)
        desc: UnrealBloomPass — efekt świecenia (bloom / glow)
        detail:
          what: Bloom symuluje rozpraszanie się światła w obiektywie aparatu — jasne obiekty "przelewają" się na sąsiednie piksele. Efekt z gier Unreal Engine.
          how: threshold określa minimalną jasność piksela żeby zaczął "świecić". strength i radius kontrolują intensywność i zasięg. Emmisive materials + bloom = świecące obiekty.
          tips:
            - 'threshold = 0 = wszytko świeci (psychodeliczny efekt). threshold > 0.9 = tylko najjaśniejsze'
            - 'Bloom + ACESFilmicToneMapping = filmowy wygląd. Ustaw renderer.toneMappingExposure'

      - code: |
          import { ShaderPass  }   from 'three/addons/postprocessing/ShaderPass.js';
          import { FXAAShader  }   from 'three/addons/shaders/FXAAShader.js';
          import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';

          // FXAA — Fast Approximate Anti-Aliasing (gdy WebGLRenderer antialias nie działa z composer)
          const fxaaPass = new ShaderPass(FXAAShader);
          fxaaPass.material.uniforms['resolution'].value.x = 1 / window.innerWidth;
          fxaaPass.material.uniforms['resolution'].value.y = 1 / window.innerHeight;
          composer.addPass(fxaaPass);

          // Gamma correction (gdy renderer.outputColorSpace = LinearSRGBColorSpace)
          const gammaCorrectionPass = new ShaderPass(GammaCorrectionShader);
          composer.addPass(gammaCorrectionPass);

          // Przy resize — zaktualizuj FXAA resolution
          function onResize() {
            fxaaPass.material.uniforms['resolution'].value.set(
              1 / window.innerWidth,
              1 / window.innerHeight
            );
          }
        desc: FXAA i GammaCorrection — antyaliasing w composerze
        detail:
          what: EffectComposer renderuje do FBO które nie obsługuje MSAA (hardware antialiasing). FXAA to post-process antyaliasing — mniej ostry ale działa z composerów.
          how: FXAA wymaga rozdzielczości jako uniform. GammaCorrectionShader konieczny jeśli renderer używa LinearSRGBColorSpace zamiast SRGBColorSpace.
          tips:
            - 'SMAAPass (Subpixel Morphological AA) — lepszy od FXAA, 3 passy zamiast 1'
            - 'Ostatni pass: pass.renderToScreen = true — domyślnie ostatni i tak renderuje na ekran'

      - code: |
          import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';

          const outlinePass = new OutlinePass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            scene,
            camera
          );

          outlinePass.edgeStrength  = 3.0;
          outlinePass.edgeGlow      = 0.5;
          outlinePass.edgeThickness = 1.0;
          outlinePass.pulsePeriod   = 0;    // 0 = brak pulsowania, > 0 = pulsuje (sekundy)
          outlinePass.visibleEdgeColor.set(0x00ff88);   // kolor widocznych krawędzi
          outlinePass.hiddenEdgeColor.set(0x888888);    // kolor ukrytych krawędzi

          composer.addPass(outlinePass);

          // Ustaw obiekty do podświetlenia
          outlinePass.selectedObjects = [selectedMesh];

          // Dynamicznie — przy hover
          window.addEventListener('mousemove', () => {
            const hits = raycaster.intersectObjects(scene.children, true);
            outlinePass.selectedObjects = hits.length > 0 ? [hits[0].object] : [];
          });
        desc: OutlinePass — podświetlenie krawędzi zaznaczonych obiektów
        detail:
          what: OutlinePass rysuje kolorowy kontur wokół wybranych obiektów. Standard w grach strategicznych (zaznaczenie jednostki), edytorach 3D, konfiguratorach produktów.
          how: outlinePass.selectedObjects = [mesh1, mesh2] — wystarczy przypisać tablicę obiektów. Outline pojawia się automatycznie wokół wszystkich na liście.
          tips:
            - 'pulsePeriod = 1.5 — pulsujące podświetlenie dla "questy" / "do zebrania"'
            - 'Zagnieżdżone meshe: przekaż grupę (Group) lub ustaw selectedObjects na wszystkich childach'

      - code: |
          import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';

          // SSAO — Screen Space Ambient Occlusion (cienie w załamaniach)
          const ssaoPass = new SSAOPass(
            scene,
            camera,
            window.innerWidth,
            window.innerHeight
          );

          ssaoPass.kernelRadius = 16;   // promień próbkowania
          ssaoPass.minDistance  = 0.005;
          ssaoPass.maxDistance  = 0.1;

          composer.addPass(ssaoPass);

          // Tryby debugowania
          ssaoPass.output = SSAOPass.OUTPUT.Default;  // normalny render
          // ssaoPass.output = SSAOPass.OUTPUT.SSAO;  // tylko mapa AO
          // ssaoPass.output = SSAOPass.OUTPUT.Blur;  // rozmyta AO
        desc: SSAOPass — Screen Space Ambient Occlusion
        detail:
          what: SSAO dodaje realistyczne cienie kontaktowe w zagłębieniach powierzchni — tam gdzie obiekty są blisko siebie lub mają wklęsłą geometrię. Znacząco poprawia realność sceny.
          how: SSAO próbkuje głębokość w okolicy każdego piksela i szacuje ile otaczającej geometrii go zasłania. kernelRadius to zasięg próbkowania w pikselach.
          tips:
            - 'SSAO jest kosztowny wydajnościowo — sprawdź FPS przed i po'
            - 'Dla R3F: @react-three/postprocessing oferuje <SSAO> z lepszym API'

  - name: Instancing i optymalizacja
    icon: "⚡"
    commands:
      - code: |
          // InstancedMesh — 1 draw call dla tysięcy identycznych obiektów
          const count    = 10000;
          const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
          const material = new THREE.MeshStandardMaterial({ color: 0x049ef4 });

          const instancedMesh = new THREE.InstancedMesh(geometry, material, count);
          instancedMesh.castShadow    = true;
          instancedMesh.receiveShadow = true;
          scene.add(instancedMesh);

          // Ustaw transformacje dla każdej instancji
          const dummy = new THREE.Object3D();

          for (let i = 0; i < count; i++) {
            dummy.position.set(
              (Math.random() - 0.5) * 20,
              (Math.random() - 0.5) * 20,
              (Math.random() - 0.5) * 20
            );
            dummy.rotation.set(
              Math.random() * Math.PI,
              Math.random() * Math.PI,
              0
            );
            dummy.scale.setScalar(Math.random() * 2 + 0.5);
            dummy.updateMatrix(); // WYMAGANE przed setMatrixAt
            instancedMesh.setMatrixAt(i, dummy.matrix);
          }

          instancedMesh.instanceMatrix.needsUpdate = true; // WYMAGANE po ustawieniu

          // Kolor per instancja
          const color = new THREE.Color();
          instancedMesh.setColorAt(0, color.set(0xff0000));
          instancedMesh.instanceColor.needsUpdate = true;
        desc: InstancedMesh — tysiące obiektów w 1 draw call
        detail:
          what: InstancedMesh renderuje N kopii tej samej geometrii/materiału w jednym draw call na GPU. 10000 sześcianów = 1 draw call zamiast 10000. Kluczowa optymalizacja dla cząstek, traw, lasów.
          how: dummy (Object3D) służy jako tymczasowy kontener do obliczenia matrix. updateMatrix() konwertuje position/rotation/scale do 4x4 matrix. setMatrixAt(index, matrix) przekazuje ją do GPU.
          tips:
            - 'instanceMatrix.needsUpdate = true — ZAWSZE po modyfikacji transform którejkolwiek instancji'
            - 'instancedMesh.count = activeCount — zmień ile instancji jest renderowane (bez tworzenia nowego)'

      - code: |
          import { LOD } from 'three';

          // LOD — Level of Detail (różne modele zależnie od odległości)
          const lod = new THREE.LOD();

          // Wysoka szczegółowość (blisko)
          const highGeo  = new THREE.SphereGeometry(1, 64, 32);
          const highMesh = new THREE.Mesh(highGeo, material);
          lod.addLevel(highMesh, 0);   // widoczny od 0 jednostek

          // Średnia szczegółowość
          const midGeo  = new THREE.SphereGeometry(1, 16, 8);
          const midMesh = new THREE.Mesh(midGeo, material);
          lod.addLevel(midMesh, 10);   // widoczny od 10 jednostek

          // Niska szczegółowość (daleko)
          const lowGeo  = new THREE.SphereGeometry(1, 6, 4);
          const lowMesh = new THREE.Mesh(lowGeo, material);
          lod.addLevel(lowMesh, 30);   // widoczny od 30 jednostek

          scene.add(lod);

          // WYMAGANE w pętli:
          function animate() {
            lod.update(camera); // automatycznie przełącza LOD
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
          }
        desc: LOD — Level of Detail (różna szczegółowość zależnie od odległości)
        detail:
          what: LOD automatycznie przełącza między wersjami modelu o różnej liczbie polygonów zależnie od odległości od kamery. Blisko = wysoka jakość, daleko = prosty model.
          how: addLevel(mesh, minDistance). Gdy kamera jest dalej niż minDistance od LOD, przełącza na ten level. lod.update(camera) musi być wywoływany każdą klatkę.
          tips:
            - 'Trzeci argument addLevel: hysteresis — zapobiega przeskakiwaniu na granicy odległości'
            - 'Dla dużych scen (gry) LOD jest konieczny — bez niego odległe drzewa/budynki zabijają GPU'

      - code: |
          // Monitorowanie wydajności renderer.info
          function logRendererInfo() {
            const info = renderer.info;
            console.log(`Draw calls: ${info.render.calls}`);
            console.log(`Triangles:  ${info.render.triangles}`);
            console.log(`Geometries: ${info.memory.geometries}`);
            console.log(`Textures:   ${info.memory.textures}`);
          }

          // Frustum culling — wyklucz obiekty poza polem widzenia
          // Domyślnie true — three.js robi to automatycznie
          mesh.frustumCulled = true;

          // Wyłącz dla obiektów które NIE mają bounding box (niektóre niestandardowe)
          mesh.frustumCulled = false;

          // Ręczna aktualizacja bounding sphere (gdy modyfikujesz wierzchołki)
          mesh.geometry.computeBoundingSphere();
          mesh.geometry.computeBoundingBox();

          // Dispose — WYMAGANE żeby zwolnić VRAM
          function removeMesh(mesh) {
            scene.remove(mesh);
            mesh.geometry.dispose();       // VRAM geometrii
            mesh.material.dispose();       // VRAM materiału
            if (mesh.material.map) mesh.material.map.dispose(); // VRAM tekstury
          }
        desc: Profilowanie i optymalizacja — renderer.info, dispose, culling
        detail:
          what: renderer.info pokazuje liczbę draw calls, triangles i zasobów GPU w pamięci. Dispose zwalnia VRAM — bez dispose() następują wycieki pamięci GPU przy dynamicznym tworzeniu/usuwaniu obiektów.
          how: Każda geometria, materiał i tekstura zajmuje VRAM. dispose() wysyła sygnał GPU żeby zwolnił pamięć. Brak dispose() = wyciek VRAM przy długim użytkowaniu.
          tips:
            - 'renderer.info.reset() — zresetuj liczniki (by stats były per-frame)'
            - 'Cel: draw calls < 100 dla 60fps na średnim GPU. Użyj instancing/merge gdy więcej'

      - code: |
          // Texture Atlas — wiele tekstur w jednym obrazie
          // Zamiast 100 tekstur 256x256 → 1 tekstura 4096x4096 z 256 kaflami
          // = 1 załadowanie GPU, 100× mniej texture bind calls

          // Shared geometries — jedna geometria dla wielu meshy
          const sharedGeometry = new THREE.BoxGeometry(1, 1, 1);

          for (let i = 0; i < 1000; i++) {
            // Różne materiały, TA SAMA geometria (współdzielona)
            const mesh = new THREE.Mesh(
              sharedGeometry, // referencja — nie kopia!
              new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff })
            );
            mesh.position.set(Math.random() * 20, Math.random() * 20, 0);
            scene.add(mesh);
          }
          // sharedGeometry to 1 upload do GPU, nie 1000

          // Dispose shared geometry — usuń TYLKO gdy wszystkie meshe usunięte
          // (Three.js zlicza referencje od r152)

          // WebWorker dla heavy computations (nie blokuj main thread)
          // const worker = new Worker('/workers/terrain-generator.js');
          // worker.postMessage({ seed: 12345, size: 256 });
          // worker.onmessage = (e) => { geometry.setAttribute('position', ...) };
        desc: Texture Atlas i współdzielone geometrie — optymalizacja pamięci GPU
        detail:
          what: GPU ma koszt przełączania tekstur i geometrii. Współdzielenie geometrii między meshami oznacza jeden upload do VRAM zamiast N kopii. Texture atlas redukuje liczbę bind calls.
          how: W Three.js geometria jest obiektem JavaScript — możesz przypisać tę samą referencję do wielu Mesh. GPU widzi jedną geometrię, ale różne transformacje przez matrix.
          tips:
            - 'Użyj r3f "instanced-mesh" + drei — automates all this for you'
            - 'Three.js BufferGeometry.clone() tworzy kopię (nowy VRAM). Unikaj gdy niepotrzebne'
