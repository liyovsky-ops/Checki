        detail:
          what: GLTF (GL Transmission Format) to standard formatu 3D dla sieci — jak JPEG dla grafiki 3D. .glb = binary (jeden plik), .gltf = JSON (z oddzielnymi .bin i teksturami).
          how: GLTFLoader to add-on — importuj z 'three/addons/'. gltf.scene to root Object3D z całą hierarchią. Animacje, kamery, light dostępne jako tablice.
          tips:
            - 'Użyj Draco compression w Blenderze przed eksportem — pliki 5-10× mniejsze'
            - 'gltf.scene.scale.set(0.01, 0.01, 0.01) — często modele z Blendera mają złą skalę'

      - code: |
