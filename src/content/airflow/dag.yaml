title: DAG i Task — budowanie pipeline'ów

items:
  - name: Tradycyjny styl z operatorami
    desc: Klasyczny styl Airflow 1.x — DAG obiekt, Operator instancje, zależności przez >> lub set_upstream/downstream.
    code: |
      from datetime import datetime
      from airflow import DAG
      from airflow.operators.python import PythonOperator
      from airflow.operators.bash import BashOperator

      with DAG(
          dag_id='classic_style',
          start_date=datetime(2024, 1, 1),
          schedule='0 6 * * *',    # Codziennie o 6:00
          catchup=False,
      ) as dag:

          def process_data(**context):
              # context['ds'] = data execution date (YYYY-MM-DD)
              execution_date = context['ds']
              print(f"Przetwarzam dane za: {execution_date}")
              return "OK"

          task_extract = BashOperator(
              task_id='extract',
              bash_command='python /scripts/extract.py --date {{ ds }}'
          )

          task_process = PythonOperator(
              task_id='process',
              python_callable=process_data,
          )

          task_notify = BashOperator(
              task_id='notify',
              bash_command='echo "Pipeline zakończony"'
          )

          # Zależności: extract → process → notify
          task_extract >> task_process >> task_notify

  - name: Branching — @task.branch
    desc: Warunkowe rozgałęzienie pipeline'u. Nowoczesny styl używa dekoratora @task.branch (zastępuje BranchPythonOperator) — funkcja zwraca task_id gałęzi do wykonania, reszta jest skipowana.
    code: |
      from airflow.decorators import dag, task
      from datetime import datetime

      @dag(start_date=datetime(2024, 1, 1), schedule='@weekly', catchup=False)
      def branch_pipeline():

          @task()
          def check_data_size() -> int:
              return 1500  # Liczba rekordów

          # @task.branch zwraca task_id gałęzi do uruchomienia
          @task.branch()
          def choose_branch(size: int) -> str:
              return 'big_batch' if size > 1000 else 'small_batch'

          @task()
          def big_batch():
              print("Przetwarzam duży batch — równolegle")

          @task()
          def small_batch():
              print("Mały batch — sekwencyjnie")

          size = check_data_size()
          decision = choose_branch(size)
          decision >> [big_batch(), small_batch()]

      dag_instance = branch_pipeline()

  - name: Dynamic Task Mapping (.expand)
    desc: Airflow 2.3+ generuje taski dynamicznie w runtime z listy/słownika przez .expand() — odpowiednik map(). Liczba instancji zależy od danych zwróconych przez upstream task (nie jest znana przy parsowaniu DAGa).
    code: |
      from airflow.decorators import dag, task
      from datetime import datetime

      @dag(start_date=datetime(2024, 1, 1), schedule='@daily', catchup=False)
      def mapping_pipeline():

          @task()
          def get_files() -> list[str]:
              # Lista znana dopiero w runtime
              return ['a.csv', 'b.csv', 'c.csv']

          @task()
          def process_file(filename: str) -> int:
              print(f"Przetwarzam {filename}")
              return len(filename)

          @task()
          def summarize(counts: list[int]) -> None:
              print(f"Łącznie {sum(counts)} z {len(counts)} plików")

          # .expand() tworzy osobną instancję process_file na każdy element
          counts = process_file.expand(filename=get_files())
          # reduce — zebranie wszystkich wyników mapowania
          summarize(counts)

          # .partial() ustala stałe argumenty, .expand() mapowane:
          # process_file.partial(retries=3).expand(filename=get_files())

      dag_instance = mapping_pipeline()
