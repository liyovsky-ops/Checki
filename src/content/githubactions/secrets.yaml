title: "Secrets & Env"

items:
  - name: "secrets.* — zaszyfrowane sekrety"
    desc: >
      Secrets to zaszyfrowane wartości przechowywane w GitHub Settings.
      Dostępne przez ${{ secrets.NAZWA }}. Nigdy nie pojawiają się w logach
      (GitHub automatycznie maskuje). Trzy poziomy: repo, environment, organizacja.
    code: |
      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4

            - name: Deploy z sekretami
              run: |
                echo "Token zaczyna się od: ${API_TOKEN:0:4}..."
              env:
                API_TOKEN: ${{ secrets.API_TOKEN }}
                DATABASE_URL: ${{ secrets.DATABASE_URL }}

            # Sekrety w actions (with:)
            - name: Configure AWS
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: eu-west-1

  - name: "vars.* — zmienne konfiguracyjne (nie sekrety)"
    desc: >
      vars.* to zwykłe (nie zaszyfrowane) zmienne konfiguracyjne.
      Widoczne w logach — używaj dla wartości niesensitywnych jak nazwy środowisk,
      wersje, URL-e. Dostępne na poziomie repo, env i organizacji.
    code: |
      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - name: Deploy
              run: |
                echo "Środowisko: ${{ vars.ENVIRONMENT }}"
                echo "Region: ${{ vars.AWS_REGION }}"
                echo "Image: ${{ vars.ECR_REPO }}:${{ github.sha }}"

            # Kombinacja vars i secrets
            - name: Build Docker image
              run: |
                docker build \
                  --build-arg NODE_ENV=${{ vars.NODE_ENV }} \
                  -t ${{ vars.ECR_REPO }}:${{ github.sha }} .

  - name: "env: — zmienne na poziomie workflow/job/step"
    desc: >
      env: możesz zdefiniować na 3 poziomach: workflow (globalne), job (dla joba)
      i step (tylko dla kroku). Niższy poziom nadpisuje wyższy.
      Zmienne env są dostępne w shell przez $NAZWA lub ${{ env.NAZWA }} w wyrażeniach.
    code: |
      env:
        NODE_ENV: production
        APP_VERSION: "2.1.0"

      jobs:
        build:
          runs-on: ubuntu-latest
          env:
            BUILD_DIR: dist  # nadpisuje tylko w tym jobie

          steps:
            - uses: actions/checkout@v4

            - name: Build
              env:
                SENTRY_DSN: ${{ secrets.SENTRY_DSN }}  # tylko w tym stepie
              run: |
                echo "Node env: $NODE_ENV"
                echo "Build dir: $BUILD_DIR"
                npm run build

  - name: "GITHUB_TOKEN — automatyczny token"
    desc: >
      GITHUB_TOKEN jest generowany automatycznie dla każdego workflow run.
      Możesz używać go do interakcji z GitHub API (tworzenie PR, komentarze, release).
      Domyślne uprawnienia zależą od ustawień repo — zawsze deklaruj permissions.
    code: |
      permissions:
        contents: write
        pull-requests: write
        issues: write

      jobs:
        auto-pr:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4

            - name: Utwórz Pull Request
              run: |
                gh pr create \
                  --title "Automated update" \
                  --body "Auto-generated PR" \
                  --base main \
                  --head ${{ github.ref_name }}
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Lub bezpośrednio przez API
            - name: Dodaj komentarz do PR
              uses: actions/github-script@v7
              with:
                script: |
                  github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: 'Testy przeszły!'
                  })

  - name: "environments — ochrona produkcji"
    desc: >
      Environment to nazwane środowisko z opcjonalnymi regułami ochrony:
      required reviewers (ktoś musi zatwierdzić deploy), wait timer,
      branch restrictions. Sekrety env nadpisują sekrety repo.
    code: |
      jobs:
        deploy-staging:
          runs-on: ubuntu-latest
          environment: staging  # bez ochrony
          steps:
            - run: ./deploy.sh staging

        deploy-production:
          needs: deploy-staging
          runs-on: ubuntu-latest
          environment:
            name: production  # wymaga zatwierdzenia przez reviewera
            url: https://myapp.com  # URL widoczny w GitHub UI
          steps:
            - run: ./deploy.sh production
              env:
                API_KEY: ${{ secrets.PROD_API_KEY }}  # sekret env, nie repo

  - name: "OIDC — bezkluczetowe uwierzytelnienie do chmury"
    desc: >
      OpenID Connect (OIDC) umożliwia uwierzytelnienie w AWS/Azure/GCP bez długoterminowych
      kluczy. GitHub generuje short-lived token JWT który chmura weryfikuje.
      Bezpieczniejsze niż przechowywanie ACCESS_KEY w secrets.
    code: |
      permissions:
        id-token: write  # wymagane dla OIDC
        contents: read

      jobs:
        deploy-aws:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4

            # Bez kluczy AWS — OIDC federacja
            - name: Configure AWS via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::123456789:role/GitHubActionsRole
                aws-region: eu-west-1

            - name: Deploy do S3
              run: aws s3 sync dist/ s3://my-bucket/

      # AWS Trust Policy musi zawierać:
      # Principal: {"Federated": "arn:aws:iam::123456789:oidc-provider/token.actions.githubusercontent.com"}
      # Condition: {"StringEquals": {"token.actions.githubusercontent.com:sub": "repo:org/repo:ref:refs/heads/main"}}

  - name: "secrets: inherit — dziedziczenie sekretów"
    desc: >
      Gdy wywołujesz reusable workflow (workflow_call), domyślnie nie ma
      dostępu do sekretów wywołującego. secrets: inherit przekazuje wszystkie
      sekrety automatycznie — bez enumerowania każdego z osobna.
    code: |
      # Wywołanie z inherit
      jobs:
        run-tests:
          uses: ./.github/workflows/reusable-test.yml
          secrets: inherit  # przekaż wszystkie sekrety z bieżącego kontekstu

      # Alternatywnie — jawne przekazanie wybranych
      jobs:
        run-deploy:
          uses: org/shared-workflows/.github/workflows/deploy.yml@main
          secrets:
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
            AWS_ROLE: ${{ secrets.AWS_ROLE_ARN }}
