title: Ekosystem Nuxt

items:
  - name: "@nuxt/ui"
    desc: Oficjalna biblioteka komponentów UI od Nuxt team. 50+ komponentów (Button, Modal, Table, Form), Tailwind CSS, dark mode wbudowany, w pełni customizowalne przez config. Wersja 3.x z Tailwind v4.
    icon: "🎨"

  - name: "@nuxt/image"
    desc: Optymalizacja obrazów — automatyczna zmiana rozmiaru, konwersja WebP/AVIF, lazy loading, srcset, responsive. Obsługuje lokalne pliki i zewnętrzne źródła (Cloudinary, Imgix, Unsplash). Komponent <NuxtImg> i <NuxtPicture>.
    icon: "🖼️"

  - name: "@nuxtjs/tailwindcss"
    desc: Integracja Tailwind CSS z Nuxt. Zero konfiguracji — Tailwind automatycznie skanuje pliki Vue. JIT mode, custom config przez tailwind.config, class merging z tailwind-merge.
    icon: "💨"

  - name: "@pinia/nuxt"
    desc: Oficjalna integracja Pinia (state management) z Nuxt. Auto-import store'ów, SSR support, DevTools integration, plugins (persistencja przez pinia-plugin-persistedstate).
    icon: "🍍"

  - name: "nuxt-auth-utils"
    desc: Prosty auth dla Nuxt — session-based przez encrypted cookies, OAuth providers (GitHub, Google, Discord), server utils (getUserSession, setUserSession, requireUserSession). Zero konfiguracji backendu.
    icon: "🔐"

  - name: "@nuxtjs/i18n"
    desc: Internacjonalizacja dla Nuxt — routing per-locale (/pl/o-nas, /en/about), lazy loading tłumaczeń, useLang(), useLocalePath(), SEO meta automatycznie. Obsługuje Vue I18n.
    icon: "🌍"

  - name: "@nuxt/content"
    desc: System CMS na plikach Markdown/MDX/YAML/JSON. Komponenty Prose*, queryContent() do filtrowania, code highlighting, full-text search. Idealny dla blogów i dokumentacji — treść jako kod.
    icon: "📝"

  - name: "nuxt-security"
    desc: Zestaw middleware bezpieczeństwa — CSRF ochrona, CSP headers, XSS protection, rate limiting, HSTS, Permissions-Policy. Zero konfiguracji dla rozsądnych domyślnych wartości.
    icon: "🛡️"

  - name: "@vueuse/nuxt"
    desc: Integracja VueUse (200+ composables) z Nuxt. Auto-import wszystkich useScroll, useDark, useStorage, useClipboard, useFetch (VueUse), debounce, throttle i wiele więcej.
    icon: "⚡"

  - name: "@nuxt/icon"
    desc: "100,000+ ikon przez Iconify — dostępne jako komponenty <Icon name=\"uil:github\" />. Zero konfiguracji — ikony pobierane on-demand lub bundlowane. Kolekcje: Material Design, Heroicons, Tabler, Lucide."
    icon: "✨"
