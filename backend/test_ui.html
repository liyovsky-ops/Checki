<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Checki — test translatora</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #1e1e1e; color: #d4d4d4; }
    h2 { color: #fff; }
    textarea { width: 100%; height: 200px; background: #2d2d2d; color: #d4d4d4; border: 1px solid #444; padding: 12px; font-family: monospace; font-size: 14px; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 24px; background: #0078d4; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #005fa3; }
    #wynik { margin-top: 24px; background: #2d2d2d; border-left: 3px solid #0078d4; padding: 16px; border-radius: 6px; line-height: 1.6; min-height: 60px; }
    #status { margin-top: 8px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h2>Translator kodu</h2>
  <textarea id="kod" placeholder="Wklej tutaj kod..."></textarea>
  <br>
  <button onclick="tlumacz()">Wytłumacz</button>
  <div id="status"></div>
  <div id="wynik"></div>

  <script>
    async function tlumacz() {
      const kod = document.getElementById('kod').value.trim()
      if (!kod) return

      document.getElementById('status').textContent = 'Tłumaczę...'
      document.getElementById('wynik').textContent = ''

      const res = await fetch('http://localhost:8000/translator/explain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: kod })
      })

      const data = await res.json()
      document.getElementById('wynik').textContent = data.response
      document.getElementById('status').textContent = ''
    }
  </script>
</body>
</html>
